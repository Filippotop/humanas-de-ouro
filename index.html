 não é só algo que o Estado possui e usa para reprimir. Ele circula em <strong>redes<\/strong>, está em todas as relações (<strong>microfísica do poder<\/strong>) e <strong>produz<\/strong> comportamentos, saberes e identidades.<\/li><li><strong>Sociedade disciplinar<\/strong> (<em>Vigiar e punir<\/em>, 1975):<ul><li>Do <strong>suplício<\/strong> (punição como espetáculo público sobre o corpo, até o século XVIII) à <strong>prisão<\/strong> e à <strong>disciplina<\/strong> (séculos XVIII–XIX).<\/li><li>A disciplina usa técnicas minuciosas (horários, filas, exames, registros, vigilância, normas) para produzir <strong>corpos dóceis<\/strong>: úteis e obedientes.<\/li><li>Essas técnicas não surgiram de uma vez; espalharam-se por <strong>escolas, quartéis, hospitais, fábricas e prisões<\/strong> (a \"capilarização\" do controle, cobrada em 2025).<\/li><li><strong>Panóptico:<\/strong> projeto de prisão de Bentham, com uma torre central de onde se pode ver todas as celas sem ser visto. O preso, sem saber se está sendo observado, <strong>internaliza a vigilância<\/strong> e passa a se vigiar sozinho.<\/li><\/ul><\/li><li><strong>Biopoder<\/strong> e <strong>biopolítica:<\/strong> a partir do século XVIII, o poder passa a gerir a <strong>vida das populações<\/strong> (natalidade, saúde, higiene, longevidade).<\/li><li><strong>Saber e poder<\/strong> caminham juntos: discursos científicos (medicina, psiquiatria, criminologia) definem o \"normal\" e o \"anormal\".<\/li><\/ul>\n<h4>3. Outros nomes que podem aparecer<\/h4>\n<ul><li><strong>Byung-Chul Han<\/strong> (<em>Sociedade do cansaço<\/em>): a sociedade disciplinar deu lugar a uma <strong>sociedade do desempenho<\/strong>, em que o indivíduo se <strong>autoexplora<\/strong> acreditando ser livre, com esgotamento e depressão como sintomas.<\/li><li><strong>Derrida:<\/strong> desconstrução de oposições tradicionais (fala × escrita, razão × emoção) e a distinção entre direito e justiça (F5).<\/li><\/ul>", "resumo": [["Razão instrumental", "Calcular meios para dominar, sem pensar nos fins"], ["Indústria cultural", "Cultura-mercadoria padronizada, público passivo (Adorno e Horkheimer)"], ["Benjamin", "Reprodutibilidade técnica; perda da aura; democratização"], ["Marcuse", "Sociedade unidimensional; falsas necessidades; crítica absorvida"], ["Habermas", "Razão comunicativa; esfera pública"], ["Foucault", "Disciplina, corpos dóceis, panóptico, biopoder, poder em rede"], ["Byung-Chul Han", "Sociedade do desempenho e autoexploração"]], "qs": ["FS-19", "FS-20", "FS-21", "F7.4", "F7.5"]}, {"id": "S1", "vol": "FS", "line": "S", "title": "Os clássicos: Durkheim, Weber e Marx", "habs": "H11, H14, H16, H23", "faixa": "A", "note": "Os três aparecem direta ou indiretamente em quase toda prova, e o resto da Sociologia se apoia neles.", "html": "<h4>1. O nascimento da Sociologia<\/h4>\n<p>A Sociologia surge no século XIX para entender as transformações trazidas pela <strong>Revolução Industrial<\/strong> e pela <strong>Revolução Francesa<\/strong>: urbanização acelerada, miséria operária, novas classes, crise das tradições. <strong>Auguste Comte<\/strong> criou o nome \"sociologia\" e defendia estudar a sociedade com os métodos das ciências naturais (<strong>positivismo<\/strong>).<\/p>\n<h4>2. Émile Durkheim (1858–1917)<\/h4>\n<ul><li><strong>Fato social:<\/strong> maneira de agir, pensar e sentir que é <strong>exterior<\/strong> ao indivíduo (existia antes dele), <strong>coercitiva<\/strong> (impõe-se a ele, com sanções para quem a desrespeita) e <strong>geral<\/strong> (comum ao grupo). Exemplos: a língua, as leis, a moda, as regras de etiqueta, a moeda. Os fatos sociais devem ser estudados \"<strong>como coisas<\/strong>\", de forma objetiva.<\/li><li><strong>Consciência coletiva:<\/strong> crenças e sentimentos comuns aos membros de uma sociedade.<\/li><li><strong>Solidariedade:<\/strong><\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>Mecânica<\/th><th>Orgânica<\/th><\/tr><\/thead><tbody><tr><td>Sociedades simples e tradicionais<\/td><td>Sociedades modernas e complexas<\/td><\/tr><tr><td>Coesão pela <strong>semelhança<\/strong> entre as pessoas<\/td><td>Coesão pela <strong>diferença<\/strong> e <strong>interdependência<\/strong> (divisão do trabalho)<\/td><\/tr><tr><td>Consciência coletiva forte<\/td><td>Mais espaço para a individualidade<\/td><\/tr><tr><td>Direito <strong>repressivo<\/strong> (punir quem ofende o grupo)<\/td><td>Direito <strong>restitutivo<\/strong> (reparar, restabelecer)<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>Anomia:<\/strong> enfraquecimento ou ausência de normas que orientem as condutas, comum em crises e mudanças rápidas.<\/li><li><em>O suicídio<\/em> (1897): mesmo o ato mais individual tem <strong>causas sociais<\/strong>; as taxas variam conforme o grau de <strong>integração<\/strong> e de <strong>regulação<\/strong> da sociedade (tipos egoísta, altruísta e anômico).<\/li><li><strong>Educação<\/strong> é socialização: transmite às novas gerações as regras do grupo. <strong>Religião<\/strong> (sagrado × profano) reforça a coesão.<\/li><\/ul>\n<h4>3. Max Weber (1864–1920)<\/h4>\n<ul><li><strong>Sociologia compreensiva:<\/strong> entender a sociedade a partir do <strong>sentido<\/strong> que os indivíduos dão às suas ações.<\/li><li><strong>Ação social:<\/strong> ação orientada pelo comportamento de outras pessoas. Quatro tipos ideais:<\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>Tipo de ação<\/th><th>Orientada por<\/th><th>Exemplo<\/th><\/tr><\/thead><tbody><tr><td>Racional com relação a <strong>fins<\/strong><\/td><td>Cálculo de meios para atingir um objetivo<\/td><td>Investir para lucrar<\/td><\/tr><tr><td>Racional com relação a <strong>valores<\/strong><\/td><td>Convicção (religiosa, ética), independentemente do resultado<\/td><td>Recusar suborno por honestidade<\/td><\/tr><tr><td><strong>Afetiva<\/strong><\/td><td>Emoções<\/td><td>Abraçar alguém por saudade<\/td><\/tr><tr><td><strong>Tradicional<\/strong><\/td><td>Costume arraigado<\/td><td>Seguir um ritual de família<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>Tipo ideal:<\/strong> modelo construído pelo pesquisador para comparar com a realidade (não é \"ideal\" no sentido de perfeito).<\/li><li><strong>Dominação legítima<\/strong> (por que as pessoas obedecem): <strong>tradicional<\/strong> (costume, como num reino), <strong>carismática<\/strong> (qualidades extraordinárias do líder) e <strong>racional-legal<\/strong> (regras impessoais, <strong>burocracia<\/strong>).<\/li><li><strong>Estado:<\/strong> a comunidade que reivindica, com sucesso, o <strong>monopólio do uso legítimo da força física<\/strong> em um território.<\/li><li><em>A ética protestante e o espírito do capitalismo<\/em> (1904–1905): valores <strong>religiosos<\/strong> do calvinismo (predestinação, trabalho como vocação, vida metódica, poupança, recusa ao luxo) favoreceram uma conduta <strong>racional e disciplinada<\/strong> que ajudou a formar o espírito do capitalismo moderno. É a prova de que, para Weber, ideias e valores também movem a economia.<\/li><li><strong>Racionalização<\/strong> e <strong>desencantamento do mundo:<\/strong> a explicação mágica e religiosa recua diante do cálculo, da ciência e da burocracia. O risco é a \"<strong>jaula de ferro<\/strong>\" de uma vida totalmente racionalizada.<\/li><\/ul>\n<h4>4. Karl Marx (1818–1883)<\/h4>\n<ul><li><strong>Materialismo histórico:<\/strong> a forma como uma sociedade <strong>produz<\/strong> a vida material (o <strong>modo de produção<\/strong>) condiciona, em última instância, sua política, seu direito e suas ideias. <strong>Infraestrutura<\/strong> (economia: forças produtivas e relações de produção) × <strong>superestrutura<\/strong> (Estado, leis, religião, ideologia).<\/li><li><strong>Luta de classes:<\/strong> \"a história de todas as sociedades até hoje é a história da luta de classes\" (<em>Manifesto Comunista<\/em>, 1848). No capitalismo: <strong>burguesia<\/strong> (dona dos meios de produção) × <strong>proletariado<\/strong> (que vende a força de trabalho).<\/li><li><strong>Mais-valia:<\/strong> o trabalhador produz um valor maior do que recebe como salário; a diferença é apropriada pelo capitalista (base do lucro e da <strong>exploração<\/strong>).<\/li><li><strong>Alienação:<\/strong> no trabalho capitalista, o trabalhador não controla o processo nem o produto; o trabalho deixa de ser expressão da sua humanidade e se torna <strong>estranho<\/strong> a ele, mero meio de sobrevivência.<\/li><li><strong>Fetichismo da mercadoria:<\/strong> as relações entre pessoas aparecem como relações entre coisas (preços, mercadorias), escondendo o trabalho que as produziu.<\/li><li><strong>Ideologia:<\/strong> as ideias da classe dominante tornam-se as ideias dominantes da sociedade e fazem a desigualdade parecer <strong>natural<\/strong>.<\/li><li><strong>Estado:<\/strong> instrumento da classe dominante. Marx defendia a revolução proletária e o <strong>socialismo<\/strong>.<\/li><\/ul>", "resumo": [["Durkheim", "Fato social (exterior, coercitivo, geral); solidariedade mecânica × orgânica; anomia"], ["Weber", "Ação social (4 tipos); dominação (tradicional, carismática, legal); ética protestante; desencantamento"], ["Marx", "Luta de classes; mais-valia; alienação; ideologia; infraestrutura × superestrutura"]], "qs": ["FS-22", "FS-23", "FS-24", "S1.4", "S1.5"]}, {"id": "S2", "vol": "FS", "line": "S", "title": "Mundo do trabalho", "habs": "H16, H17, H18, H19, H20", "faixa": "A", "note": "É o tema número 1 de Sociologia no levantamento histórico, com quase um quarto das questões.", "html": "<h4>1. Os modelos de organização da produção<\/h4>\n<div class=\"tw\"><table><thead><tr><th><\/th><th><strong>Taylorismo<\/strong><\/th><th><strong>Fordismo<\/strong><\/th><th><strong>Toyotismo<\/strong> (acumulação flexível)<\/th><\/tr><\/thead><tbody><tr><td>Época<\/td><td>Início do século XX<\/td><td>A partir de 1913–1914; auge no pós-guerra (até os anos 1970)<\/td><td>Japão, pós-guerra; difunde-se no mundo a partir dos anos 1970–1980<\/td><\/tr><tr><td>Ideia central<\/td><td><strong>Administração científica<\/strong>: cronometrar e simplificar tarefas; separar quem <strong>pensa<\/strong> (gerência) de quem <strong>executa<\/strong><\/td><td><strong>Linha de montagem<\/strong> móvel; produção <strong>em massa<\/strong> de produtos padronizados para consumo em massa<\/td><td>Produzir <strong>conforme a demanda<\/strong>, com estoque mínimo (<strong><em>just in time<\/strong><\/em>)<\/td><\/tr><tr><td>Trabalhador<\/td><td>Executa tarefas simples, controlado pelo tempo; prêmio por produtividade<\/td><td>Especializado em uma tarefa <strong>parcelada e repetitiva<\/strong>; salário relativamente alto para consumir<\/td><td><strong>Polivalente<\/strong>, em equipes; opera várias máquinas; participa do controle de qualidade<\/td><\/tr><tr><td>Marcas<\/td><td>Cronômetro, \"um melhor jeito\" de fazer cada tarefa<\/td><td>Grandes fábricas, grandes estoques, sindicatos fortes<\/td><td>Kanban (cartões de reposição), kaizen (melhoria contínua), <strong>terceirização<\/strong>, empresa enxuta<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>O filme <em>Tempos modernos<\/em> (Chaplin, 1936) é a imagem clássica da crítica à linha de montagem fordista.<\/li><li><strong>Crise dos anos 1970<\/strong> (petróleo, inflação, queda dos lucros) → reestruturação produtiva, <strong>neoliberalismo<\/strong> e globalização.<\/li><\/ul>\n<h4>2. Transformações recentes<\/h4>\n<ul><li><strong>Desemprego estrutural:<\/strong> postos eliminados pela automação e pela tecnologia, que não voltam com o crescimento econômico.<\/li><li><strong>Precarização:<\/strong> contratos temporários, terceirização, jornadas instáveis, perda de direitos, <strong>informalidade<\/strong> (no Brasil, uma parcela grande dos trabalhadores ocupados não tem carteira assinada).<\/li><li><strong>Reforma trabalhista de 2017<\/strong> (Lei 13.467): ampliou a prevalência do <strong>negociado sobre o legislado<\/strong>, criou o <strong>trabalho intermitente<\/strong> e flexibilizou regras. Debate: modernização × perda de proteção.<\/li><li><strong>Uberização (trabalho por plataformas):<\/strong> o trabalhador é apresentado como \"parceiro\" ou \"empreendedor de si mesmo\", sem vínculo de emprego; arca com os custos (veículo, combustível, celular) e os riscos (acidente, doença); é controlado por <strong>algoritmos<\/strong> (notas, bloqueios); jornadas longas para atingir uma renda mínima. O sociólogo brasileiro Ricardo Antunes é referência nessa crítica.<\/li><li><strong>Trabalho análogo à escravidão<\/strong> (Código Penal, art. 149): trabalho forçado, <strong>jornada exaustiva<\/strong>, <strong>condições degradantes<\/strong> ou servidão por dívida. Ainda é flagrado no Brasil, em lavouras, carvoarias, oficinas de costura e obras.<\/li><li><strong>Divisão sexual do trabalho:<\/strong> mulheres concentradas em ocupações de cuidado e mais mal pagas, com <strong>dupla jornada<\/strong> (trabalho remunerado + trabalho doméstico não pago). A Emenda Constitucional 72/2013 ampliou os direitos das <strong>trabalhadoras domésticas<\/strong>.<\/li><\/ul>", "resumo": [["Taylorismo", "Cronômetro; separar concepção e execução"], ["Fordismo", "Linha de montagem; massa; repetição"], ["Toyotismo", "Just in time; polivalência; terceirização; flexibilidade"], ["Precarização", "Menos direitos, mais instabilidade"], ["Uberização", "\"Parceiro\" sem vínculo; custos e riscos com o trabalhador; algoritmo como chefe"], ["Trabalho escravo contemporâneo", "Jornada exaustiva, condições degradantes, dívida"], ["Divisão sexual do trabalho", "Dupla jornada; trabalho de cuidado desvalorizado"]], "qs": ["FS-25", "FS-26", "FS-27", "S2.4", "S2.5"]}, {"id": "S3", "vol": "FS", "line": "S", "title": "Cultura, identidade e meios de comunicação", "habs": "H1, H3, H4, H5, H21", "faixa": "B", "note": "Cultura e mídia somam mais de 22% de Sociologia no levantamento, e religiões afro-brasileiras e saberes tradicionais caíram em 2025.", "html": "<h4>1. Cultura e diversidade<\/h4>\n<ul><li><strong>Cultura<\/strong> (sentido antropológico): tudo o que é <strong>aprendido<\/strong> e transmitido socialmente: língua, crenças, técnicas, costumes, valores, artes. Não existe povo \"sem cultura\" nem cultura \"superior\".<\/li><li><strong>Etnocentrismo:<\/strong> julgar outras culturas pelos valores da própria, considerada o padrão \"correto\" ou \"civilizado\". Esteve na base do colonialismo e do <strong>evolucionismo cultural<\/strong> do século XIX (que ordenava os povos de \"selvagens\" a \"civilizados\").<\/li><li><strong>Relativismo cultural:<\/strong> compreender cada cultura <strong>nos seus próprios termos<\/strong>, sem hierarquizá-las (Franz Boas). Não significa aceitar violações de direitos humanos; significa não julgar a partir de um padrão único.<\/li><li><strong>Alteridade:<\/strong> reconhecer o <strong>outro<\/strong> como diferente e legítimo.<\/li><li><strong>Montaigne<\/strong> (<em>Dos canibais<\/em>, 1580), já no século XVI, ironizou os europeus que chamavam os indígenas do Brasil de bárbaros. <strong>Lévi-Strauss<\/strong> retomou a ideia no século XX: bárbaro é, antes de tudo, quem acredita na barbárie do outro.<\/li><li><strong>Diversidade no Brasil:<\/strong> povos indígenas, quilombolas, ribeirinhos e outras comunidades tradicionais; <strong>saberes tradicionais<\/strong> (medicina, agricultura, manejo da floresta) reconhecidos pela ONU (Declaração sobre os Direitos dos Povos Indígenas, 2007). As <strong>Leis 10.639/2003 e 11.645/2008<\/strong> tornaram obrigatório o ensino de história e cultura <strong>afro-brasileira e indígena<\/strong> nas escolas.<\/li><\/ul>\n<h4>2. Religião, diversidade e intolerância<\/h4>\n<ul><li><strong>Sincretismo:<\/strong> fusão de elementos de religiões diferentes (santos católicos associados a orixás).<\/li><li><strong>Religiões de matriz africana<\/strong> (candomblé, umbanda e outras) sofrem <strong>intolerância religiosa<\/strong>, frequentemente chamada de <strong>racismo religioso<\/strong>, porque o preconceito contra a religião se mistura ao preconceito contra a população negra e sua cultura. Ataques a terreiros são crimes.<\/li><li><strong>Estado laico:<\/strong> a Constituição garante a <strong>liberdade de crença<\/strong> e proíbe o Estado de adotar ou favorecer uma religião.<\/li><\/ul>\n<h4>3. Identidade<\/h4>\n<ul><li><strong>Stuart Hall:<\/strong> na modernidade tardia, o sujeito não tem mais uma identidade fixa e única; tem <strong>identidades múltiplas, fragmentadas e móveis<\/strong> (nacional, de gênero, étnica, de consumo), que mudam com a <strong>globalização<\/strong> e os contatos culturais.<\/li><li><strong>Zygmunt Bauman:<\/strong> a <strong>modernidade líquida<\/strong> é marcada pela fluidez e pela insegurança: relações frágeis e descartáveis, identidades em constante reconstrução, centralidade do <strong>consumo<\/strong>.<\/li><li><strong>Hibridismo cultural:<\/strong> mistura de elementos de diferentes origens (o funk, o rap brasileiro, a culinária).<\/li><\/ul>\n<h4>4. Meios de comunicação e cultura de massa<\/h4>\n<ul><li><strong>Cultura de massa<\/strong> e <strong>indústria cultural<\/strong> (ver F7): produção padronizada para grande público.<\/li><li><strong>Marshall McLuhan:<\/strong> \"o meio é a mensagem\" (o próprio meio transforma a sociedade, para além do conteúdo); \"<strong>aldeia global<\/strong>\".<\/li><li><strong>Internet e redes sociais:<\/strong> ampliação do acesso e da participação (ciberativismo), mas também:<ul><li><strong>Algoritmos<\/strong> que mostram ao usuário o que confirma suas preferências: <strong>bolhas<\/strong> e <strong>câmaras de eco<\/strong>, polarização;<\/li><li><strong>Desinformação<\/strong> (<em>fake news<\/em>) e <strong>pós-verdade<\/strong> (apelos emocionais pesam mais que os fatos);<\/li><li>Concentração de poder em poucas plataformas e uso comercial dos <strong>dados pessoais<\/strong>.<\/li><\/ul><\/li><\/ul>", "resumo": [["Etnocentrismo", "Minha cultura é a medida (selvagem × civilizado)"], ["Relativismo", "Cada cultura em seus próprios termos"], ["Alteridade", "Reconhecer o outro"], ["Racismo religioso", "Intolerância contra religiões de matriz africana"], ["Stuart Hall", "Identidades múltiplas e móveis"], ["Bauman", "Modernidade líquida"], ["Bolhas algorítmicas", "Reforço de opiniões, polarização"]], "qs": ["FS-28", "FS-29", "FS-30", "S3.4", "S3.5"]}, {"id": "S4", "vol": "FS", "line": "S", "title": "Desigualdade, cidadania e movimentos sociais", "habs": "H10, H13, H22, H24, H25", "faixa": "A", "note": "Desigualdade e movimentos sociais somam cerca de 21% de Sociologia no levantamento, e o seu erro na questão 81 (Saffioti) está aqui.", "html": "<h4>1. Estratificação e desigualdade<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Sistema<\/th><th>Critério<\/th><th>Mobilidade<\/th><\/tr><\/thead><tbody><tr><td><strong>Castas<\/strong> (Índia tradicional)<\/td><td>Nascimento, religião<\/td><td>Praticamente nenhuma<\/td><\/tr><tr><td><strong>Estamentos<\/strong> (sociedade feudal)<\/td><td>Nascimento, tradição, lei (clero, nobreza, servos)<\/td><td>Muito pequena<\/td><\/tr><tr><td><strong>Classes<\/strong> (capitalismo)<\/td><td>Posição econômica<\/td><td>Possível, mas limitada pela desigualdade de oportunidades<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>Mobilidade social:<\/strong> mudança de posição na hierarquia social, entre gerações ou ao longo da vida.<\/li><li>O Brasil é um dos países mais desiguais do mundo em renda, e a desigualdade se entrelaça com <strong>raça, gênero e região<\/strong>.<\/li><\/ul>\n<h4>2. Cidadania<\/h4>\n<ul><li><strong>T. H. Marshall<\/strong> (sobre a Inglaterra): os direitos surgiram em sequência: <strong>civis<\/strong> (século XVIII), <strong>políticos<\/strong> (século XIX) e <strong>sociais<\/strong> (século XX).<\/li><li><strong>José Murilo de Carvalho<\/strong> (<em>Cidadania no Brasil<\/em>): no Brasil, a ordem foi <strong>invertida<\/strong>. Os direitos <strong>sociais<\/strong> vieram primeiro, com Vargas, num período de restrição dos direitos políticos; os <strong>políticos<\/strong> se expandiram depois; e os <strong>civis<\/strong> (igualdade perante a lei, segurança, acesso à justiça) seguem frágeis para muitos. Daí uma cidadania vista como concessão do Estado (a \"estadania\").<\/li><li><strong>Igualdade formal<\/strong> (todos iguais perante a lei) × <strong>igualdade material<\/strong> (condições reais de vida e de oportunidades).<\/li><\/ul>\n<h4>3. Raça e racismo<\/h4>\n<ul><li><strong>Raça<\/strong> não é categoria biológica entre seres humanos; é uma <strong>construção social<\/strong> usada para hierarquizar grupos.<\/li><li><strong>Mito da democracia racial:<\/strong> a ideia de que no Brasil haveria convivência harmoniosa entre as raças, associada à leitura da obra de Gilberto Freyre; foi criticada por <strong>Florestan Fernandes<\/strong> e outros, que mostraram a exclusão da população negra após a abolição.<\/li><li><strong>Racismo estrutural:<\/strong> o racismo não está só em atos individuais de preconceito; está no <strong>funcionamento normal<\/strong> das instituições (mercado de trabalho, polícia, escola, justiça), que produz desvantagens sistemáticas.<\/li><li>A Constituição de 1988 tornou o <strong>racismo crime inafiançável e imprescritível<\/strong>; a injúria racial foi equiparada ao crime de racismo em 2023.<\/li><\/ul>\n<h4>4. Gênero<\/h4>\n<ul><li><strong>Gênero:<\/strong> construção social dos papéis atribuídos a homens e mulheres (ver Beauvoir, F6).<\/li><li><strong>Patriarcado:<\/strong> sistema de dominação masculina que atravessa a família, o trabalho e a política.<\/li><li><strong>Heleieth Saffioti<\/strong>, socióloga brasileira: gênero, <strong>classe<\/strong> e <strong>raça<\/strong> formam um \"nó\" inseparável; estudou a <strong>violência de gênero<\/strong>. No texto do ENEM 2025, ela observa que, como o Estado parte de uma igualdade abstrata, é possível convencê-lo a criar políticas de <strong>discriminação positiva<\/strong> para mulheres.<\/li><li><strong>Leis e políticas:<\/strong> Delegacias de Defesa da Mulher (a primeira em São Paulo, em 1985); <strong>Lei Maria da Penha<\/strong> (2006), contra a violência doméstica; <strong>Lei do Feminicídio<\/strong> (2015, como qualificadora do homicídio; crime autônomo desde 2024).<\/li><\/ul>\n<h4>5. Discriminação positiva e ações afirmativas<\/h4>\n<ul><li><strong>Discriminação positiva:<\/strong> tratar de forma <strong>diferenciada<\/strong> um grupo em desvantagem, justamente para <strong>reduzir<\/strong> essa desvantagem e alcançar a igualdade material.<\/li><li>Exemplos: <strong>cotas<\/strong> nas universidades federais (Lei 12.711/2012, atualizada em 2023) e em concursos públicos; delegacias e varas especializadas para mulheres; reserva de vagas para pessoas com deficiência.<\/li><li><strong>Não são<\/strong> discriminação positiva: medidas <strong>universais<\/strong>, que valem igualmente para todos (sufrágio universal, por exemplo); nem medidas que <strong>retiram<\/strong> proteção do grupo.<\/li><li>A ideia é antiga: Rui Barbosa, em 1921, já dizia que a verdadeira igualdade consiste em tratar desigualmente os desiguais, na medida em que se desigualam.<\/li><\/ul>\n<div class=\"callout\"><strong>A chave do seu erro na questão 81:<\/strong> \"sufrágio universal\" é o <strong>oposto<\/strong> de discriminação positiva, porque não diferencia ninguém. Discriminação positiva = política <strong>focalizada<\/strong> num grupo desfavorecido, como uma delegacia especializada no atendimento à mulher.<\/div>\n<h4>6. Movimentos sociais<\/h4>\n<ul><li><strong>Tradicionais:<\/strong> organizados em torno da <strong>classe<\/strong> e do trabalho (sindicatos, movimento operário).<\/li><li><strong>Novos movimentos sociais<\/strong> (a partir dos anos 1960–1970): organizados em torno de <strong>identidade, cultura e direitos<\/strong> (feminista, negro, LGBTQIA+, ambientalista, indígena, estudantil).<\/li><li>No Brasil: Movimento Negro Unificado (1978), MST (1984), movimentos de moradia (MTST), movimentos indígenas (forte presença na Constituinte de 1987–1988), Jornadas de Junho de 2013.<\/li><li>Os movimentos sociais mudam leis e políticas públicas (H22): a Lei Maria da Penha, as cotas e os direitos territoriais indígenas e quilombolas resultaram de mobilizações.<\/li><\/ul>", "resumo": [["Castas, estamentos, classes", "Nascimento e religião; tradição e lei; economia"], ["Marshall × Carvalho", "Civis → políticos → sociais × no Brasil, sociais primeiro"], ["Igualdade formal × material", "Perante a lei × condições reais"], ["Racismo estrutural", "Nas instituições, não só nos indivíduos"], ["Saffioti", "Gênero, classe e raça; violência de gênero"], ["Discriminação positiva", "Tratamento diferenciado para reduzir desigualdade (cotas, delegacia da mulher)"], ["Novos movimentos sociais", "Identidade, cultura, direitos"]], "qs": ["FS-31", "FS-32", "FS-33", "S4.4", "S4.5"]}, {"id": "S5", "vol": "FS", "line": "S", "title": "Instituições, poder e vida urbana", "habs": "H11, H14, H21, H24", "faixa": "C", "note": "Cai menos como conteúdo isolado, mas Bourdieu, Bauman e a vida na metrópole aparecem com frequência (em 2025, Bauman e as relações apressadas da vida urbana).", "html": "<h4>1. Socialização e instituições<\/h4>\n<ul><li><strong>Socialização:<\/strong> processo pelo qual aprendemos as normas e os valores do grupo. <strong>Primária<\/strong> (família, na infância) e <strong>secundária<\/strong> (escola, trabalho, religião, mídia, amigos).<\/li><li><strong>Instituições sociais:<\/strong> estruturas estáveis que organizam a vida coletiva (família, escola, Estado, religião, mercado).<\/li><li><strong>Controle social:<\/strong> formal (leis, polícia, tribunais) e informal (olhares, fofocas, exclusão). <strong>Desvio:<\/strong> comportamento que rompe as normas do grupo.<\/li><\/ul>\n<h4>2. Pierre Bourdieu (1930–2002)<\/h4>\n<ul><li><strong>Capitais:<\/strong> econômico (dinheiro, bens), <strong>cultural<\/strong> (diplomas, gostos, conhecimentos, modo de falar), social (rede de contatos) e simbólico (prestígio).<\/li><li><strong>Habitus:<\/strong> disposições incorporadas ao longo da vida (gostos, gestos, modos de ver) que orientam as escolhas \"naturalmente\".<\/li><li>A <strong>escola<\/strong> parece neutra e baseada no mérito, mas valoriza o capital cultural que os filhos das classes altas já trazem de casa; assim, <strong>reproduz<\/strong> desigualdades e as faz parecer resultado do talento individual.<\/li><li><strong>Violência simbólica:<\/strong> dominação exercida de forma suave e invisível, aceita como natural pelos próprios dominados.<\/li><\/ul>\n<h4>3. Erving Goffman (1922–1982)<\/h4>\n<ul><li><strong>Instituições totais:<\/strong> locais onde pessoas vivem isoladas da sociedade, sob regras rígidas e uma autoridade única, com todas as atividades controladas (prisões, manicômios, quartéis, conventos, internatos). Despojam o indivíduo de sua identidade anterior (uniforme, número, cabelo raspado).<\/li><li><strong>Estigma:<\/strong> marca social que desqualifica uma pessoa (deficiência, doença, passagem pela prisão).<\/li><li><strong>A vida como encenação:<\/strong> desempenhamos papéis e cuidamos da \"fachada\" diante dos outros.<\/li><\/ul>\n<h4>4. A vida na metrópole<\/h4>\n<ul><li><strong>Georg Simmel<\/strong> (<em>A metrópole e a vida mental<\/em>, 1903): a cidade grande bombardeia o indivíduo de estímulos; para se proteger, ele desenvolve uma <strong>atitude blasé<\/strong> (indiferença, embotamento da capacidade de reagir) e uma postura de <strong>reserva<\/strong> diante dos outros. As relações se tornam mais <strong>impessoais<\/strong>, mediadas pelo dinheiro e pela pontualidade, mas a metrópole também amplia a <strong>liberdade<\/strong> individual.<\/li><li><strong>Bauman:<\/strong> pressa, relações descartáveis, insegurança; mas também a ideia de que a <strong>utopia<\/strong> (imaginar um mundo melhor e acreditar na capacidade humana de construí-lo) é condição para a transformação social.<\/li><\/ul>\n<h4>5. Religião e sociedade<\/h4>\n<ul><li><strong>Durkheim:<\/strong> a religião separa o <strong>sagrado<\/strong> do <strong>profano<\/strong> e reforça a coesão do grupo.<\/li><li><strong>Weber:<\/strong> religiões moldam condutas econômicas (ética protestante); a modernidade traz o <strong>desencantamento do mundo<\/strong>.<\/li><li><strong>Marx:<\/strong> a religião é \"o suspiro da criatura oprimida\" e \"o ópio do povo\": consola, mas desvia a atenção da exploração.<\/li><li><strong>Secularização<\/strong> e pluralismo religioso; no Brasil, os censos mostram queda na proporção de católicos e crescimento dos evangélicos e dos sem religião.<\/li><\/ul>", "resumo": [["Socialização", "Primária (família) e secundária (escola, mídia...)"], ["Bourdieu", "Capital cultural; habitus; escola reproduz desigualdade; violência simbólica"], ["Goffman", "Instituições totais; estigma"], ["Simmel", "Metrópole; atitude blasé; reserva; impessoalidade"], ["Religião", "Sagrado × profano (Durkheim); desencantamento (Weber); ópio do povo (Marx)"]], "qs": ["FS-34", "FS-35", "FS-36", "S5.4", "S5.5"]}], "questions": [{"id": "HG-1", "vol": "HG", "n": 1, "tag": "Inédita, estilo ENEM", "base": ["O Iphan registrou como patrimônio cultural do Brasil o ofício de mestres e mestras que produzem, há gerações, os instrumentos e as vestimentas usados numa festa popular do interior. O registro prevê ações de apoio à transmissão desses saberes aos mais jovens, como oficinas e documentação em vídeo."], "src": "Texto elaborado para esta apostila.", "cmd": "O registro descrito tem como finalidade", "alts": ["restaurar edificações históricas ligadas à festa.", "transformar a festa em atração turística internacional.", "preservar um patrimônio imaterial ligado à identidade de um grupo social.", "impedir mudanças na forma de realizar a festa.", "substituir a transmissão oral por registros escritos."], "mod": "H1", "ans": "C", "ex": {"C": "um ofício tradicional (saber transmitido entre gerações) é patrimônio <strong>imaterial<\/strong>; o registro busca garantir sua continuidade e reconhece seu vínculo com a identidade do grupo.", "A": "edificações são patrimônio material (tombamento), e o texto fala de saberes.", "B": "o turismo pode ser um efeito, mas não é a finalidade do registro; o texto fala em transmissão aos jovens.", "D": "o patrimônio imaterial é <strong>dinâmico<\/strong>; o registro não congela a festa.", "E": "o registro apoia a transmissão (oficinas), não substitui a oralidade."}, "hab": "H1, H2", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-2", "vol": "HG", "n": 2, "tag": "Inédita, estilo ENEM", "base": ["Em um trabalho escolar sobre a Idade Média, um estudante escreveu: \"Os senhores feudais violavam a legislação trabalhista ao exigir dos servos dias de trabalho gratuito em suas terras, sem carteira assinada nem férias\"."], "src": "Texto elaborado para esta apostila.", "cmd": "O professor apontou um problema de método na afirmação do estudante, que é o(a)", "alts": ["etnocentrismo, pois o estudante desvaloriza a cultura dos servos.", "relativismo, pois o estudante aceita a servidão como natural.", "uso de fonte primária sem crítica.", "confusão entre memória e história.", "anacronismo, pois o estudante aplica ao período medieval conceitos de outra época."], "mod": "H1", "ans": "E", "ex": {"E": "\"legislação trabalhista\", \"carteira assinada\" e \"férias\" são conceitos do século XX aplicados à Idade Média: anacronismo.", "A": "o estudante não desvaloriza a cultura dos servos; ele aplica categorias erradas de tempo.", "B": "relativismo seria compreender a servidão em seus próprios termos, o oposto do que ele fez.", "C": "a frase não cita nenhuma fonte.", "D": "o erro não é confundir lembrança com análise; é de tempo histórico."}, "hab": "H1, H3", "dif": "fácil", "traps": {"B": "oposto"}, "kind": "fixacao"}, {"id": "HG-3", "vol": "HG", "n": 3, "tag": "Inédita, estilo ENEM", "base": ["Na praça central de uma cidade, uma estátua homenageava um comerciante do século XIX que enriqueceu com o tráfico de africanos escravizados. Após debates na Câmara Municipal e audiências públicas, a estátua foi transferida para um museu, com um painel explicativo sobre o tráfico, e a praça passou a homenagear uma liderança quilombola da região."], "src": "Texto elaborado para esta apostila.", "cmd": "A decisão da cidade expressa a", "alts": ["disputa pela memória coletiva e pelos sentidos atribuídos ao passado no espaço público.", "eliminação dos registros históricos sobre o período escravista.", "neutralidade dos monumentos em relação aos conflitos sociais.", "recusa em reconhecer a importância dos museus.", "valorização das elites econômicas como heroínas nacionais."], "mod": "H1", "ans": "A", "ex": {"A": "mudar quem é homenageado na praça é uma disputa sobre <strong>que passado a cidade quer lembrar<\/strong> e como; a memória no espaço público é um campo de conflito.", "B": "a estátua não foi destruída; foi para um museu <strong>com explicação<\/strong> sobre o tráfico. O registro histórico foi ampliado.", "C": "o próprio debate mostra que monumentos <strong>não<\/strong> são neutros.", "D": "a cidade usou o museu, reconhecendo seu papel.", "E": "a decisão retirou a homenagem a um membro da elite escravista."}, "hab": "H1, H2", "dif": "média", "traps": {}, "kind": "fixacao"}, {"id": "HG-4", "vol": "HG", "n": 4, "tag": "Inédita, estilo ENEM", "base": ["Na Atenas do século V a.C., as decisões sobre guerra, impostos e obras públicas eram tomadas na Assembleia, onde cada cidadão podia falar e votar diretamente. Estima-se, porém, que os cidadãos fossem uma parcela minoritária dos habitantes da cidade."], "src": "Texto elaborado para esta apostila.", "cmd": "A contradição apontada no texto se explica porque, na democracia ateniense,", "alts": ["o voto era censitário, restrito aos proprietários de grandes terras.", "mulheres, escravizados e estrangeiros eram excluídos da cidadania.", "as decisões eram tomadas por representantes eleitos, e não pelos cidadãos.", "apenas os sacerdotes podiam votar nos assuntos públicos.", "o rei tinha poder de veto sobre todas as decisões da Assembleia."], "mod": "H2", "ans": "B", "ex": {"B": "a democracia direta ateniense excluía mulheres, escravizados e estrangeiros (metecos); por isso os cidadãos eram minoria.", "A": "o critério de cidadania era o nascimento (filho de pai e mãe atenienses), não a renda.", "C": "em Atenas, a democracia era <strong>direta<\/strong>, na Assembleia.", "D": "sacerdotes não tinham monopólio do voto.", "E": "a Atenas democrática não tinha rei."}, "hab": "H11, H22", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-5", "vol": "HG", "n": 5, "tag": "Inédita, estilo ENEM", "base": ["Durante o Império Romano, os governantes distribuíam trigo gratuitamente à população pobre de Roma e promoviam espetáculos no Coliseu e no Circo Máximo, com corridas de bigas e lutas de gladiadores, muitas vezes por vários dias seguidos."], "src": "Texto elaborado para esta apostila.", "cmd": "Essas práticas tinham como objetivo político", "alts": ["ampliar a participação da plebe nas decisões do Senado.", "estimular a produção agrícola nas províncias.", "difundir os valores do cristianismo entre os pobres.", "controlar a população urbana e reduzir o risco de revoltas.", "financiar as campanhas militares com a venda de ingressos."], "mod": "H2", "ans": "D", "ex": {"D": "a política do \"pão e circo\" distribuía alimento e diversão para controlar a plebe urbana e evitar revoltas.", "A": "a plebe não ganhava poder no Senado com isso; a medida substituía a participação política.", "B": "o trigo distribuído vinha das províncias; a distribuição não estimulava a produção.", "C": "os espetáculos eram pagãos; muitas vezes, cristãos eram vítimas neles.", "E": "os espetáculos eram, em geral, gratuitos, oferecidos pelos governantes."}, "hab": "H11, H13", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-6", "vol": "HG", "n": 6, "tag": "Inédita, estilo ENEM", "base": ["No século I, os cristãos eram perseguidos em Roma por se recusarem a prestar culto ao imperador. Cerca de três séculos depois, o cristianismo tornou-se religião oficial do Império, e templos pagãos foram fechados por ordem imperial."], "src": "Texto elaborado para esta apostila.", "cmd": "A mudança descrita indica que o cristianismo", "alts": ["permaneceu marginal durante toda a Antiguidade.", "foi imposto aos romanos desde a fundação de Roma.", "se manteve separado do poder político imperial.", "desapareceu com a queda do Império do Ocidente.", "passou de religião perseguida a religião associada ao poder do Estado."], "mod": "H2", "ans": "E", "ex": {"E": "de perseguido (século I) a religião oficial (Teodósio, 380), o cristianismo se aliou ao poder imperial.", "A": "o texto mostra a ascensão, não a marginalidade.", "B": "o cristianismo surgiu no século I, séculos depois da fundação de Roma.", "C": "tornar-se religião oficial é justamente unir-se ao poder político.", "D": "o cristianismo se fortaleceu na Idade Média, depois da queda do Império do Ocidente (476)."}, "hab": "H3, H11", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-7", "vol": "HG", "n": 7, "tag": "Inédita, estilo ENEM", "base": ["Ao convocar os fiéis para a luta no Oriente, o papa anunciou que todo aquele que partisse com a intenção sincera de libertar os lugares santos teria perdoadas as penas de seus pecados. Camponeses, cavaleiros e senhores, que até então viam na vida dos monges o caminho mais seguro para o céu, passaram a enxergar uma via de salvação aberta a quem permanecia leigo."], "src": "Texto elaborado para esta apostila.", "cmd": "De acordo com o texto, a convocação para as Cruzadas alterou a percepção dos fiéis ao associar a salvação à", "alts": ["decisão pessoal de participar de uma ação militar e religiosa.", "entrada obrigatória na vida monástica.", "leitura individual dos textos sagrados.", "celebração de missas exclusivas para a nobreza.", "recusa a qualquer forma de violência."], "mod": "H3", "ans": "A", "ex": {"A": "a salvação passou a depender de uma <strong>decisão pessoal<\/strong> do leigo: partir para a luta no Oriente. É o mesmo raciocínio da questão 69 de 2025.", "B": "o texto diz o contrário: a salvação ficou aberta a quem <strong>permanecia leigo<\/strong>.", "C": "a leitura individual da Bíblia é um tema da Reforma Protestante (século XVI).", "D": "a convocação valia para camponeses também; não era exclusiva da nobreza.", "E": "as Cruzadas eram expedições militares; o texto fala de luta."}, "hab": "H1, H3", "dif": "média", "traps": {"B": "oposto"}, "kind": "fixacao"}, {"id": "HG-8", "vol": "HG", "n": 8, "tag": "Inédita, estilo ENEM", "base": ["Um bispo do século XI escreveu que a casa de Deus, que parece una, é na verdade tripla: uns oram, outros combatem e outros trabalham. Os três vivem juntos e não podem ser separados, pois os serviços de uns permitem a existência dos outros."], "src": "Texto elaborado para esta apostila, com base em ideia corrente na Idade Média.", "cmd": "Essa concepção cumpria a função de", "alts": ["incentivar a mobilidade social entre camponeses e nobres.", "defender a igualdade de direitos entre as ordens.", "legitimar a hierarquia social como parte de uma ordem divina.", "criticar os privilégios do clero e da nobreza.", "estimular o trabalho assalariado nas cidades."], "mod": "H3", "ans": "C", "ex": {"C": "a teoria das três ordens (oratores, bellatores, laboratores) apresentava a desigualdade como vontade divina e, portanto, imutável.", "A": "a sociedade de ordens tinha <strong>pouca mobilidade<\/strong>; cada um devia permanecer no seu lugar.", "B": "as ordens tinham funções e direitos diferentes, e o texto fala de complementaridade, não de igualdade.", "D": "o autor é um bispo que <strong>defende<\/strong> a ordem; não há crítica.", "E": "a concepção é rural e feudal; não trata de trabalho assalariado urbano."}, "hab": "H11, H13", "dif": "média", "traps": {}, "kind": "fixacao"}, {"id": "HG-9", "vol": "HG", "n": 9, "tag": "Inédita, estilo ENEM", "base": ["Depois da Peste Negra, em muitas regiões da Europa ocidental, senhores tentaram obrigar os camponeses a trabalhar pelos mesmos pagamentos e obrigações de antes. Mesmo assim, muitos trabalhadores abandonaram as terras em busca de senhores que oferecessem condições melhores, e revoltas camponesas se espalharam."], "src": "Texto elaborado para esta apostila.", "cmd": "A situação descrita está relacionada ao(à)", "alts": ["aumento da população rural, que barateou a mão de obra.", "fortalecimento da servidão, que prendeu os camponeses à terra.", "fim das cidades medievais, que expulsou os artesãos para o campo.", "escassez de mão de obra, que aumentou o poder de negociação dos camponeses.", "chegada de trabalhadores escravizados da América."], "mod": "H3", "ans": "D", "ex": {"D": "a peste matou cerca de um terço da população europeia; com menos trabalhadores, os camponeses ganharam poder de negociação e resistiram às tentativas de manter as velhas obrigações.", "A": "a peste <strong>reduziu<\/strong> a população.", "B": "os camponeses <strong>abandonavam<\/strong> as terras; a servidão enfraqueceu na Europa ocidental.", "C": "as cidades não desapareceram; continuaram crescendo nos séculos seguintes.", "E": "a peste foi em 1348, antes da chegada dos europeus à América (1492)."}, "hab": "H15, H17", "dif": "média", "traps": {}, "kind": "fixacao"}, {"id": "HG-10", "vol": "HG", "n": 10, "tag": "Inédita, estilo ENEM", "base": ["Poucas décadas depois de Lutero afixar suas teses, folhetos com suas ideias e traduções da Bíblia para o alemão circulavam aos milhares por cidades e aldeias. Comerciantes e artesãos que sabiam ler passaram a discutir as Escrituras sem a mediação de um padre."], "src": "Texto elaborado para esta apostila.", "cmd": "A rápida difusão descrita foi favorecida pela", "alts": ["proibição da leitura pela Igreja católica.", "imprensa de tipos móveis, que multiplicou e barateou a produção de textos.", "adoção do latim como língua das traduções populares.", "criação das universidades medievais.", "invenção do rádio, que levou as ideias aos analfabetos."], "mod": "H4", "ans": "B", "ex": {"B": "a imprensa de tipos móveis (Gutenberg, meados do século XV) barateou a produção de livros e folhetos e acelerou a difusão das ideias reformistas.", "A": "a Igreja controlava a leitura, mas uma proibição não <strong>difundiria<\/strong> textos.", "C": "as traduções populares eram em <strong>alemão<\/strong>; o latim era a língua da Igreja e dos eruditos.", "D": "as universidades surgiram na Idade Média e não explicam a circulação massiva entre artesãos.", "E": "o rádio é do século XX: anacronismo."}, "hab": "H3, H17", "dif": "fácil", "traps": {"E": "anacronismo"}, "kind": "fixacao"}, {"id": "HG-11", "vol": "HG", "n": 11, "tag": "Inédita, estilo ENEM", "base": ["Pelas normas impostas pela metrópole, os colonos não podiam vender seus produtos a navios estrangeiros nem instalar manufaturas de tecidos. O açúcar seguia para Lisboa, onde era revendido a outros países com grande lucro, e os tecidos e ferramentas usados na colônia vinham obrigatoriamente do reino."], "src": "Texto elaborado para esta apostila.", "cmd": "O conjunto de normas descrito corresponde ao", "alts": ["liberalismo econômico, que defendia o comércio livre entre as nações.", "feudalismo, baseado em relações de suserania e vassalagem.", "socialismo, que previa o controle estatal das fábricas.", "protecionismo da colônia contra a metrópole.", "exclusivo metropolitano, característico da política mercantilista."], "mod": "H4", "ans": "E", "ex": {"E": "proibir a colônia de comerciar com estrangeiros e de produzir manufaturas é o <strong>exclusivo metropolitano<\/strong> (pacto colonial), parte do mercantilismo.", "A": "o liberalismo defendia o comércio livre, o oposto das normas descritas.", "B": "suserania e vassalagem são relações feudais entre nobres.", "C": "socialismo é do século XIX e não se aplica.", "D": "o protecionismo era <strong>da metrópole<\/strong> sobre a colônia, não da colônia contra a metrópole."}, "hab": "H15, H18", "dif": "fácil", "traps": {"A": "oposto"}, "kind": "fixacao"}, {"id": "HG-12", "vol": "HG", "n": 12, "tag": "Inédita, estilo ENEM", "base": ["\"Tudo estaria perdido se o mesmo homem, ou o mesmo corpo de nobres ou de povo, exercesse os três poderes: o de fazer as leis, o de executar as resoluções públicas e o de julgar os crimes ou as divergências dos indivíduos.\""], "src": "MONTESQUIEU. O espírito das leis, 1748. Obra em domínio público; tradução livre feita para esta apostila.", "cmd": "Nesse trecho, o pensador iluminista critica a", "alts": ["concentração de poder característica das monarquias absolutistas.", "participação do povo na elaboração das leis.", "existência de tribunais independentes.", "separação entre Igreja e Estado.", "influência dos comerciantes sobre o rei."], "mod": "H4", "ans": "A", "ex": {"A": "Montesquieu defende a separação dos três poderes e critica sua concentração em uma só pessoa, característica do absolutismo.", "B": "o trecho não critica o povo; menciona-o como um dos possíveis detentores de poder concentrado.", "C": "a separação dos poderes <strong>pressupõe<\/strong> juízes independentes.", "D": "o trecho não trata de religião.", "E": "o trecho não fala de comerciantes."}, "hab": "H11, H12", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-13", "vol": "HG", "n": 13, "tag": "Inédita, estilo ENEM", "base": ["Em 1812, em regiões têxteis da Inglaterra, grupos de trabalhadores invadiram fábricas à noite e destruíram teares mecânicos. Em cartas, diziam que não eram contra o trabalho, mas contra as máquinas que tiravam seus empregos e reduziam seus salários a ponto de não poderem alimentar suas famílias."], "src": "Texto elaborado para esta apostila.", "cmd": "A ação descrita, conhecida como ludismo, expressava", "alts": ["o apoio dos operários à mecanização da produção.", "a defesa do retorno à servidão feudal.", "uma reação às condições de trabalho e de vida impostas pela industrialização.", "a reivindicação do direito de voto para as mulheres.", "a luta pela independência das colônias inglesas."], "mod": "H5", "ans": "C", "ex": {"C": "os luditas destruíam máquinas como reação ao desemprego e aos salários miseráveis gerados pela industrialização.", "A": "destruir teares é o oposto de apoiar a mecanização.", "B": "as cartas dizem que eles não eram contra o trabalho; não há defesa da servidão.", "D": "o sufrágio feminino não aparece no texto.", "E": "a independência das colônias inglesas da América é de 1776 e não tem relação."}, "hab": "H17, H18", "dif": "fácil", "traps": {"A": "oposto"}, "kind": "fixacao"}, {"id": "HG-14", "vol": "HG", "n": 14, "tag": "Inédita, estilo ENEM", "base": ["Em 1791, a escritora Olympe de Gouges publicou uma declaração que reproduzia, artigo por artigo, a Declaração dos Direitos do Homem e do Cidadão de 1789, mas trocando \"homem\" por \"mulher\" e \"cidadão\" por \"cidadã\". Ela foi executada em 1793."], "src": "Texto elaborado para esta apostila.", "cmd": "A iniciativa de Olympe de Gouges evidencia a", "alts": ["aceitação plena dos direitos das mulheres pela Revolução Francesa.", "defesa do absolutismo pelas mulheres da nobreza.", "recusa das mulheres em participar da vida política.", "contradição entre o discurso universal de direitos e a exclusão das mulheres da cidadania.", "influência do socialismo marxista sobre a Revolução Francesa."], "mod": "H5", "ans": "D", "ex": {"D": "ao reescrever a Declaração para as mulheres, Olympe mostrou que os \"direitos universais\" excluíam metade da população; sua execução reforça a contradição.", "A": "a execução desmente qualquer \"aceitação plena\".", "B": "Olympe defendia direitos, não o absolutismo.", "C": "ela participou ativamente da vida política.", "E": "o marxismo surgiu décadas depois (século XIX)."}, "hab": "H22, H24", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-15", "vol": "HG", "n": 15, "tag": "Inédita, estilo ENEM", "base": ["Em 1910, o museu nacional de história natural de uma potência europeia financiou uma expedição de três anos ao interior da América do Sul. Os pesquisadores voltaram com milhares de animais empalhados, plantas, objetos de povos indígenas e fotografias, que passaram a ser exibidos em salões abertos ao público da capital, sob o título \"Povos e natureza das terras distantes\"."], "src": "Texto elaborado para esta apostila.", "cmd": "No contexto histórico do período, iniciativas como essa estavam associadas ao(à)", "alts": ["cooperação humanitária entre as nações europeias e sul-americanas.", "valorização dos saberes indígenas como ciência equivalente à europeia.", "lazer de estudantes financiado por instituições privadas.", "proteção ambiental das áreas visitadas.", "projeto imperialista, em que ciência e coleções reforçavam o prestígio e o domínio das potências sobre outras regiões."], "mod": "H5", "ans": "E", "ex": {"E": "expedições financiadas por museus nacionais de potências, com coleta de objetos e de povos \"exóticos\", eram parte do projeto imperialista: ciência a serviço do prestígio e do domínio. Mesmo raciocínio da questão 90 de 2025.", "A": "o texto não fala de cooperação nem de ajuda humanitária.", "B": "a exposição tratava os indígenas como objeto de estudo exótico, não como produtores de ciência.", "C": "o financiamento era de um museu nacional, e o objetivo era coleta científica, não lazer.", "D": "a coleta de milhares de animais não protege o ambiente."}, "hab": "H7, H8", "dif": "média", "traps": {}, "kind": "fixacao"}, {"id": "HG-16", "vol": "HG", "n": 16, "tag": "Inédita, estilo ENEM", "base": ["Nos anos 1930, o regime de um país europeu criou um ministério dedicado a controlar jornais, rádio, cinema e teatro. Desfiles monumentais, cartazes com a imagem do líder e transmissões radiofônicas obrigatórias em locais públicos difundiam a ideia de que a nação só seria grande se todos obedecessem a um só partido."], "src": "Texto elaborado para esta apostila.", "cmd": "As práticas descritas são características de regimes", "alts": ["liberais, que defendiam a liberdade de imprensa.", "totalitários, que usavam a propaganda para controlar a sociedade.", "socialistas utópicos, que buscavam comunidades cooperativas.", "anarquistas, que pretendiam abolir o Estado.", "parlamentaristas, em que o governo dependia do apoio do Legislativo."], "mod": "H6", "ans": "B", "ex": {"B": "ministério de propaganda, culto ao líder e partido único são marcas dos totalitarismos (nazismo, fascismo, stalinismo).", "A": "o controle de jornais e rádio é o oposto da liberdade de imprensa.", "C": "socialistas utópicos criavam comunidades, não ministérios de propaganda.", "D": "anarquistas defendiam o fim do Estado, não seu fortalecimento.", "E": "\"um só partido\" é incompatível com o parlamentarismo pluripartidário."}, "hab": "H11, H13", "dif": "fácil", "traps": {"A": "oposto"}, "kind": "fixacao"}, {"id": "HG-17", "vol": "HG", "n": 17, "tag": "Inédita, estilo ENEM", "base": ["Em 1957, a União Soviética lançou o primeiro satélite artificial. Doze anos depois, astronautas norte-americanos pisaram na Lua, em uma transmissão acompanhada ao vivo por centenas de milhões de pessoas."], "src": "Texto elaborado para esta apostila.", "cmd": "No contexto da Guerra Fria, essas conquistas tinham o significado político de", "alts": ["cooperação científica entre as duas superpotências.", "abandono da corrida armamentista em favor da ciência.", "apoio conjunto das superpotências à descolonização.", "demonstração da superioridade tecnológica e ideológica de cada bloco.", "fim da disputa entre capitalismo e socialismo."], "mod": "H6", "ans": "D", "ex": {"D": "a corrida espacial era uma forma de disputa sem guerra direta: cada bloco mostrava ao mundo a superioridade do seu sistema.", "A": "havia competição, não cooperação.", "B": "a corrida espacial andou junto com a armamentista (foguetes e mísseis).", "C": "a descolonização não aparece no texto.", "E": "a Guerra Fria continuou até 1991."}, "hab": "H7, H11", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-18", "vol": "HG", "n": 18, "tag": "Inédita, estilo ENEM", "base": ["Entre o fim dos anos 1940 e o início dos anos 1990, leis de um país africano determinavam onde cada grupo racial podia morar, estudar e trabalhar, proibiam casamentos inter-raciais e reservavam à minoria branca o direito de voto. Um dos principais líderes da resistência passou 27 anos na prisão e, depois de libertado, foi eleito presidente."], "src": "Texto elaborado para esta apostila.", "cmd": "O texto descreve o regime de", "alts": ["apartheid na África do Sul.", "partilha da África na Conferência de Berlim.", "colonialismo português em Angola.", "socialismo na União Soviética.", "independência da Índia."], "mod": "H6", "ans": "A", "ex": {"A": "segregação legal por raça, voto exclusivo da minoria branca e um líder (Nelson Mandela) preso por 27 anos e depois eleito presidente: apartheid na África do Sul (1948–1994).", "B": "a Conferência de Berlim (1884–1885) partilhou a África no século XIX.", "C": "Angola tornou-se independente em 1975, e o texto descreve leis raciais até os anos 1990.", "D": "a URSS não fica na África.", "E": "a Índia fica na Ásia e se tornou independente em 1947."}, "hab": "H9, H24", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-19", "vol": "HG", "n": 19, "tag": "Inédita, estilo ENEM", "base": ["Com a instalação da Corte no Rio de Janeiro, em 1808, criaram-se em poucos anos o Erário Régio, o Conselho da Fazenda, a Intendência-Geral de Polícia e uma tipografia oficial que imprimia decretos, alvarás e regulamentos remetidos às capitanias, inclusive às mais distantes do litoral."], "src": "Texto elaborado para esta apostila.", "cmd": "O conjunto de instituições descrito tinha a função política de", "alts": ["preparar a independência do Brasil em relação a Portugal.", "divulgar na Europa as riquezas naturais da colônia.", "estruturar no Rio de Janeiro um centro de poder capaz de administrar e integrar o território.", "transferir para as capitanias a autonomia administrativa da Coroa.", "reduzir o controle português sobre o comércio colonial."], "mod": "H7", "ans": "C", "ex": {"C": "órgãos de governo, polícia e uma tipografia que envia ordens às capitanias mais distantes estruturam no Rio um centro de poder capaz de administrar e integrar o território.", "A": "a Corte não pretendia a independência; a ideia é <strong>teleológica<\/strong> (ler o passado pelo que veio depois).", "B": "a tipografia imprimia decretos para as capitanias, não propaganda para a Europa.", "D": "as instituições <strong>centralizavam<\/strong> o poder no Rio.", "E": "a abertura dos portos (1808) reduziu o exclusivo, mas o texto trata de instituições administrativas."}, "hab": "H7, H11", "dif": "média", "traps": {}, "kind": "fixacao"}, {"id": "HG-20", "vol": "HG", "n": 20, "tag": "Inédita, estilo ENEM", "base": ["No século XVII, na Serra da Barriga, formou-se um conjunto de povoados que chegou a reunir milhares de pessoas, entre africanos fugidos, seus descendentes, indígenas e brancos pobres. Os moradores plantavam, criavam animais, faziam comércio com vilas próximas e resistiram por décadas a expedições militares."], "src": "Texto elaborado para esta apostila.", "cmd": "A experiência descrita representa uma forma de", "alts": ["colaboração entre senhores de engenho e escravizados.", "aldeamento organizado pelos jesuítas.", "colonização promovida pela Coroa portuguesa.", "revolta nativista contra os impostos da metrópole.", "resistência à escravidão, com organização social e econômica própria."], "mod": "H7", "ans": "E", "ex": {"E": "Palmares foi uma forma de resistência à escravidão com organização social, produção e comércio próprios, que resistiu por décadas.", "A": "os quilombos eram combatidos pelos senhores.", "B": "os aldeamentos jesuíticos reuniam indígenas sob controle missionário; não era o caso.", "C": "a Coroa enviou expedições <strong>contra<\/strong> o quilombo.", "D": "revoltas nativistas eram de colonos contra a metrópole (impostos, comércio)."}, "hab": "H1, H24", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-21", "vol": "HG", "n": 21, "tag": "Inédita, estilo ENEM", "base": ["Os conjurados de Minas Gerais, em 1789, eram em sua maioria proprietários, padres, militares e intelectuais. Os conjurados da Bahia, em 1798, eram em grande parte soldados, alfaiates e outros artesãos, muitos deles negros e pardos, e alguns escravizados."], "src": "Texto elaborado para esta apostila.", "cmd": "Uma diferença entre os dois movimentos, relacionada à composição social descrita, é que", "alts": ["apenas os mineiros defendiam a independência em relação a Portugal.", "os baianos defendiam o fim da escravidão, ponto ausente do projeto dos mineiros.", "apenas os baianos eram influenciados por ideias iluministas.", "os mineiros pretendiam manter o Brasil como colônia.", "os dois movimentos foram vitoriosos e implantaram repúblicas."], "mod": "H7", "ans": "B", "ex": {"B": "com base popular, de negros e pardos, a Conjuração Baiana defendia, além da república, o fim da escravidão e a igualdade; a Mineira, de elite, não propunha a abolição.", "A": "as duas defendiam a independência.", "C": "as duas sofreram influência iluminista.", "D": "os mineiros queriam a independência da região.", "E": "as duas foram derrotadas e reprimidas."}, "hab": "H11, H24", "dif": "média", "traps": {}, "kind": "fixacao"}, {"id": "HG-22", "vol": "HG", "n": 22, "tag": "Inédita, estilo ENEM", "base": ["\"Ficam proibidas as aquisições de terras devolutas por outro título que não seja o de compra.\""], "src": "BRASIL. Lei n. 601, de 18 de setembro de 1850, art. 1º. Texto de lei.", "cmd": "No contexto da época, a determinação dessa lei contribuiu para", "alts": ["dificultar o acesso à terra para imigrantes pobres e futuros libertos, favorecendo a concentração fundiária.", "distribuir terras gratuitamente aos ex-escravizados.", "estimular a ocupação das terras indígenas pelos próprios indígenas.", "acabar com os latifúndios cafeeiros do Vale do Paraíba.", "garantir a reforma agrária no Segundo Reinado."], "mod": "H8", "ans": "A", "ex": {"A": "ao permitir o acesso à terra só pela compra, a Lei de Terras excluiu os pobres, os imigrantes e os futuros libertos, consolidando a concentração fundiária.", "B": "o texto diz que a aquisição só seria por <strong>compra<\/strong>, não gratuita.", "C": "a lei não protegia terras indígenas; contribuiu para a apropriação delas.", "D": "a lei favoreceu os grandes proprietários.", "E": "não houve reforma agrária no Império."}, "hab": "H8, H15", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-23", "vol": "HG", "n": 23, "tag": "Inédita, estilo ENEM", "base": ["Pela Constituição de 1824, o imperador podia nomear senadores vitalícios a partir de listas, dissolver a Câmara dos Deputados, suspender magistrados e nomear e demitir livremente os ministros. Essas atribuições estavam reunidas num poder que não existia na proposta de Montesquieu."], "src": "Texto elaborado para esta apostila.", "cmd": "O poder descrito no texto é o", "alts": ["Executivo, exercido pelo primeiro-ministro.", "Legislativo, exercido pela Assembleia Geral.", "Judiciário, exercido pelo Supremo Tribunal.", "Moderador, exercido pelo imperador acima dos demais poderes.", "Constituinte, exercido pelos deputados eleitos."], "mod": "H8", "ans": "D", "ex": {"D": "dissolver a Câmara, nomear senadores e ministros e suspender magistrados eram atribuições do Poder Moderador, criado pela Constituição de 1824 e exercido pelo imperador acima dos outros três.", "A": "o cargo de presidente do Conselho de Ministros só foi criado em 1847, e o texto atribui os poderes ao imperador.", "B": "a Assembleia Geral era o Legislativo, que podia ser dissolvido pelo Moderador.", "C": "o Judiciário era um dos poderes controlados.", "E": "o poder constituinte foi exercido pela Assembleia de 1823, dissolvida por D. Pedro I."}, "hab": "H11, H12", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-24", "vol": "HG", "n": 24, "tag": "Inédita, estilo ENEM", "base": ["Em 13 de maio de 1888, a Lei Áurea declarou extinta a escravidão no Brasil. Nos anos seguintes, sem acesso à terra, à escola ou a empregos regulares, muitos libertos permaneceram nas fazendas em troca de moradia e comida ou se dirigiram às periferias das cidades, onde passaram a ser alvo de leis contra a \"vadiagem\"."], "src": "Texto elaborado para esta apostila.", "cmd": "O texto evidencia que a abolição", "alts": ["garantiu a plena cidadania aos ex-escravizados.", "foi acompanhada de uma ampla reforma agrária.", "pôs fim à escravidão sem políticas de integração, mantendo a exclusão da população negra.", "foi imediatamente seguida pela indenização aos libertos.", "transformou os libertos em pequenos proprietários de terra."], "mod": "H8", "ans": "C", "ex": {"C": "a Lei Áurea extinguiu a escravidão, mas não houve acesso à terra, à educação ou ao trabalho regular; a repressão à \"vadiagem\" mostra a exclusão continuada.", "A": "o texto descreve o oposto da cidadania plena.", "B": "não houve reforma agrária.", "D": "não houve indenização aos libertos (os senhores é que chegaram a pedi-la para si).", "E": "o texto diz que os libertos ficaram sem terra."}, "hab": "H24, H25", "dif": "fácil", "traps": {"A": "oposto"}, "kind": "fixacao"}, {"id": "HG-25", "vol": "HG", "n": 25, "tag": "Inédita, estilo ENEM", "base": ["Na Primeira República, em muitas cidades do interior, o voto era declarado em voz alta diante dos mesários. Os eleitores, muitas vezes empregados ou dependentes de um grande fazendeiro, eram levados ao local de votação em grupos, alimentados e vigiados até o momento de votar."], "src": "Texto elaborado para esta apostila.", "cmd": "A prática descrita está relacionada ao", "alts": ["voto secreto, instituído pela Constituição de 1891.", "sufrágio feminino, conquistado no início da República.", "parlamentarismo, que fortalecia os partidos nacionais.", "tenentismo, que defendia o fim das eleições.", "coronelismo, em que o controle do voto era garantido pelo voto aberto e pela dependência econômica."], "mod": "H9", "ans": "E", "ex": {"E": "voto aberto, eleitores dependentes do fazendeiro e vigiados até a votação descrevem o coronelismo e o voto de cabresto.", "A": "o voto secreto só veio com o Código Eleitoral de 1932; na Primeira República, era aberto, como o texto descreve.", "B": "o voto feminino só foi conquistado em 1932.", "C": "a Primeira República era presidencialista, com partidos estaduais.", "D": "os tenentes defendiam o voto secreto e a moralização das eleições."}, "hab": "H11, H22", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-26", "vol": "HG", "n": 26, "tag": "Inédita, estilo ENEM", "base": ["Em 1904, no Rio de Janeiro, moradores ergueram barricadas e enfrentaram a polícia por vários dias. Nos anos anteriores, centenas de cortiços tinham sido demolidos para abrir avenidas, e agentes sanitários entravam nas casas para desinfetar e, agora, para vacinar à força."], "src": "Texto elaborado para esta apostila.", "cmd": "A revolta descrita expressava a reação popular à", "alts": ["cobrança de impostos sobre o café exportado.", "modernização urbana e sanitária imposta de forma autoritária aos mais pobres.", "proibição do culto religioso pela Constituição republicana.", "volta da monarquia, defendida pelos moradores.", "chegada de imigrantes europeus à capital."], "mod": "H9", "ans": "B", "ex": {"B": "a Revolta da Vacina reagiu à demolição de cortiços (reforma urbana) e à vacinação obrigatória feita à força, ou seja, à modernização autoritária que atingia os pobres.", "A": "o texto não fala de impostos sobre o café.", "C": "a Constituição de 1891 separou Igreja e Estado, mas não proibiu cultos.", "D": "a revolta não tinha como bandeira a volta da monarquia.", "E": "os imigrantes não aparecem no texto."}, "hab": "H9, H24", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-27", "vol": "HG", "n": 27, "tag": "Inédita, estilo ENEM", "base": ["Durante o Estado Novo, foram criados o salário mínimo, a Justiça do Trabalho e a Consolidação das Leis do Trabalho. Ao mesmo tempo, só podiam funcionar sindicatos reconhecidos pelo Ministério do Trabalho, um por categoria em cada base territorial, e as greves eram consideradas recursos antissociais."], "src": "Texto elaborado para esta apostila.", "cmd": "O texto evidencia que a política trabalhista desse período combinava", "alts": ["liberdade sindical plena e ausência de direitos trabalhistas.", "extensão dos direitos a trabalhadores rurais e domésticos.", "estímulo às greves como forma de pressão por salários.", "concessão de direitos e controle estatal sobre a organização dos trabalhadores.", "privatização das relações de trabalho e fim da Justiça do Trabalho."], "mod": "H9", "ans": "D", "ex": {"D": "o Estado Novo concedeu direitos (salário mínimo, CLT, Justiça do Trabalho) e, ao mesmo tempo, controlou os sindicatos e proibiu greves.", "A": "havia direitos e <strong>não<\/strong> havia liberdade sindical.", "B": "a CLT não alcançou de imediato os trabalhadores rurais e domésticos.", "C": "as greves eram consideradas \"antissociais\".", "E": "a Justiça do Trabalho foi <strong>criada<\/strong> (1939–1941), e o Estado regulou fortemente as relações de trabalho."}, "hab": "H11, H16", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-28", "vol": "HG", "n": 28, "tag": "Inédita, estilo ENEM", "base": ["Em dezembro de 1968, um ato baixado pelo governo autorizou o presidente a decretar o recesso do Congresso, cassar mandatos e suspender direitos políticos, além de suspender a garantia de habeas corpus nos casos de crimes contra a segurança nacional."], "src": "Texto elaborado para esta apostila.", "cmd": "O ato descrito teve como consequência", "alts": ["o aprofundamento da repressão política e da censura no país.", "a convocação de eleições diretas para presidente.", "o retorno do pluripartidarismo.", "a anistia aos presos políticos e exilados.", "a promulgação de uma Constituição democrática."], "mod": "H10", "ans": "A", "ex": {"A": "o AI-5 permitiu fechar o Congresso, cassar mandatos e suspender o habeas corpus: aprofundou a repressão e a censura.", "B": "as eleições diretas para presidente só voltaram em 1989.", "C": "o pluripartidarismo voltou em 1979.", "D": "a anistia veio em 1979.", "E": "a Constituição democrática é de 1988."}, "hab": "H11, H22", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-29", "vol": "HG", "n": 29, "tag": "Inédita, estilo ENEM", "base": ["Entre 1968 e 1973, o PIB brasileiro cresceu em média mais de 10% ao ano. No mesmo período, o salário mínimo real perdeu poder de compra, a participação dos 10% mais ricos na renda nacional aumentou e a dívida externa cresceu rapidamente."], "src": "Texto elaborado para esta apostila, com base em tendências reconhecidas pela historiografia.", "cmd": "Os dados apresentados indicam que o chamado \"milagre econômico\"", "alts": ["distribuiu a renda de forma mais igualitária.", "foi financiado exclusivamente com recursos internos.", "combinou crescimento econômico com concentração de renda e endividamento.", "aumentou o poder de compra dos trabalhadores de menor renda.", "ocorreu em um período de liberdade sindical."], "mod": "H10", "ans": "C", "ex": {"C": "os dados combinam crescimento alto do PIB, queda do salário real, aumento da renda dos 10% mais ricos e crescimento da dívida externa.", "A": "a renda se concentrou.", "B": "a dívida <strong>externa<\/strong> cresceu, o que mostra recursos de fora.", "D": "o salário mínimo real <strong>perdeu<\/strong> poder de compra.", "E": "o período foi de forte repressão e controle dos sindicatos."}, "hab": "H17, H18", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-30", "vol": "HG", "n": 30, "tag": "Inédita, estilo ENEM", "base": ["\"Aos remanescentes das comunidades dos quilombos que estejam ocupando suas terras é reconhecida a propriedade definitiva, devendo o Estado emitir-lhes os títulos respectivos.\""], "src": "BRASIL. Constituição Federal de 1988. Ato das Disposições Constitucionais Transitórias, art. 68. Texto de lei.", "cmd": "O dispositivo constitucional expressa a # Parte II — Geografia !&gt; <strong>Como o ENEM cobra Geografia:<\/strong> com mapas, gráficos, imagens de satélite, fotos e notícias. Quase sempre a pergunta é sobre a <strong>relação<\/strong> entre sociedade e espaço: por que um fenômeno acontece <strong>ali<\/strong>, quem ganha e quem perde com ele, que consequência ele tem. Estude cada tema perguntando: \"qual processo produziu essa paisagem?\".", "alts": ["continuidade da Lei de Terras de 1850.", "ampliação da cidadania, ao reconhecer direitos territoriais de um grupo historicamente excluído.", "privatização de terras públicas para grandes empresas.", "proibição da ocupação de terras por descendentes de africanos.", "transferência das terras quilombolas para a União."], "mod": "H10", "ans": "B", "ex": {"B": "reconhecer a propriedade das terras quilombolas amplia a cidadania de um grupo excluído desde a escravidão.", "A": "a Lei de Terras de 1850 contribuiu para excluir esses grupos; o artigo vai na direção contrária.", "C": "o artigo reconhece a terra das comunidades, não de empresas.", "D": "é o oposto: garante a terra aos descendentes de quilombolas.", "E": "a propriedade é das <strong>comunidades<\/strong>, e o Estado só emite os títulos."}, "hab": "H22, H24", "dif": "fácil", "traps": {"D": "oposto"}, "kind": "fixacao"}, {"id": "HG-31", "vol": "HG", "n": 31, "tag": "Inédita, estilo ENEM", "base": ["Em um mapa topográfico na escala 1 : 50 000, um estudante mediu com a régua a distância em linha reta entre duas cachoeiras e obteve 4 cm."], "src": "Texto elaborado para esta apostila.", "cmd": "A distância real em linha reta entre as cachoeiras é de", "alts": ["200 m.", "500 m.", "1,25 km.", "2 km.", "20 km."], "mod": "G1", "ans": "D", "ex": {"D": "4 cm × 50 000 = 200 000 cm = 2 000 m = <strong>2 km<\/strong>.", "A": "200 m sairia de 4 × 5 000; o denominador foi lido com um zero a menos.", "B": "500 m é o valor de <strong>1 cm<\/strong> nessa escala, não de 4 cm.", "C": "1,25 km sai de dividir 50 000 por 4, em vez de multiplicar.", "E": "20 km sai de errar a conversão (1 km = 100 000 cm) por um fator 10."}, "hab": "H6", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-32", "vol": "HG", "n": 32, "tag": "Inédita, estilo ENEM", "base": ["Brasília está no fuso de três horas a menos em relação ao horário de Greenwich (UTC−3). Tóquio está no fuso de nove horas a mais (UTC+9). Um torcedor em Brasília quer assistir, ao vivo, a uma partida que começa às 20h no horário de Tóquio."], "src": "Texto elaborado para esta apostila.", "cmd": "Em Brasília, a partida começará às", "alts": ["8h do mesmo dia.", "11h do mesmo dia.", "17h do mesmo dia.", "20h do dia anterior.", "8h do dia seguinte."], "mod": "G1", "ans": "A", "ex": {"A": "a diferença entre UTC+9 e UTC−3 é de 12 horas, e Tóquio está a leste (adiantada). 20h − 12h = <strong>8h do mesmo dia<\/strong> em Brasília.", "B": "11h é o horário de Greenwich (UTC), não o de Brasília.", "C": "17h sai de subtrair só 3 horas.", "D": "20h do dia anterior trata a diferença como se fosse de 24 horas.", "E": "\"dia seguinte\" inverte o sentido: quem está a oeste está <strong>atrasado<\/strong>."}, "hab": "H6", "dif": "média", "traps": {"E": "oposto"}, "kind": "fixacao"}, {"id": "HG-33", "vol": "HG", "n": 33, "tag": "Inédita, estilo ENEM", "base": ["Um sistema desenvolvido por um instituto público brasileiro processa diariamente imagens de satélite e emite alertas sobre novas áreas de desmatamento na Amazônia em poucos dias, permitindo que órgãos de fiscalização cheguem ao local enquanto a derrubada ainda ocorre."], "src": "Texto elaborado para esta apostila.", "cmd": "O texto evidencia a importância do(a)", "alts": ["projeção de Mercator para a navegação.", "escala grande para a representação de continentes.", "anamorfose para a análise de dados populacionais.", "uso de mapas antigos na demarcação de terras.", "sensoriamento remoto no monitoramento ambiental."], "mod": "G1", "ans": "E", "ex": {"E": "imagens de satélite processadas para gerar alertas de desmatamento são sensoriamento remoto aplicado ao monitoramento ambiental.", "A": "a projeção de Mercator serve à navegação; não monitora florestas.", "B": "escala grande representa áreas <strong>pequenas<\/strong>, com detalhe.", "C": "anamorfose deforma países segundo uma variável; não há dados populacionais no texto.", "D": "o sistema usa imagens diárias, não mapas antigos."}, "hab": "H6, H26", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-34", "vol": "HG", "n": 34, "tag": "Inédita, estilo ENEM", "base": ["Em um mesmo dia, dois tremores de terra de magnitude parecida foram registrados: um no litoral do Peru, que derrubou casas e provocou alerta de tsunami, e outro no interior de Minas Gerais, que apenas fez tremer vidraças."], "src": "Texto elaborado para esta apostila.", "cmd": "A diferença entre os dois eventos está relacionada principalmente ao fato de", "alts": ["o Brasil ter solos mais resistentes que os do Peru.", "o Peru estar numa zona de subducção, na borda de placas, e o Brasil estar no interior de uma placa.", "as construções peruanas serem mais antigas que as brasileiras.", "o clima úmido do Brasil absorver as ondas sísmicas.", "o Peru estar mais próximo da linha do Equador."], "mod": "G2", "ans": "B", "ex": {"B": "o Peru está na zona de subducção da placa de Nazca sob a Sul-Americana (borda de placas), onde os tremores são fortes e frequentes; Minas Gerais está no interior da placa, onde os abalos são pequenos.", "A": "a resistência dos solos não explica a diferença na origem dos tremores.", "C": "a idade das construções pode influenciar os danos, mas o comando pede a diferença principal, que é geológica.", "D": "o clima não absorve ondas sísmicas.", "E": "a latitude não tem relação com terremotos."}, "hab": "H27, H29", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-35", "vol": "HG", "n": 35, "tag": "Inédita, estilo ENEM", "base": ["Em uma cidade construída sobre rochas calcárias, uma rua afundou de repente, abrindo uma cratera de 20 metros de diâmetro. Geólogos explicaram que a água da chuva, levemente ácida, infiltrou-se por séculos nas fraturas da rocha e criou cavidades subterrâneas, cujo teto acabou cedendo. A retirada excessiva de água de poços na região agravou o problema."], "src": "Texto elaborado para esta apostila.", "cmd": "O fenômeno descrito resulta, principalmente, da", "alts": ["atividade vulcânica sob a cidade.", "colisão entre placas tectônicas.", "dissolução da rocha pelo intemperismo químico.", "deposição de sedimentos trazidos pelos rios.", "erosão causada pelo vento."], "mod": "G2", "ans": "C", "ex": {"C": "a água ácida dissolveu o calcário (intemperismo químico), criando cavidades cujo teto cedeu: é uma dolina, típica do relevo cárstico.", "A": "não há vulcanismo no texto (nem no Brasil).", "B": "o texto fala de infiltração de água, não de placas.", "D": "deposição forma planícies; não abre crateras.", "E": "o agente é a água subterrânea, não o vento."}, "hab": "H27", "dif": "média", "traps": {}, "kind": "fixacao"}, {"id": "HG-36", "vol": "HG", "n": 36, "tag": "Inédita, estilo ENEM", "base": ["Em uma área de pastagem degradada no interior paulista, formou-se uma fenda que hoje tem 30 metros de profundidade e centenas de metros de comprimento. Ela cresce a cada estação chuvosa e já ameaça uma estrada vizinha. Antes da pastagem, a área era coberta por vegetação nativa."], "src": "Texto elaborado para esta apostila.", "cmd": "A formação descrita é uma voçoroca, cuja origem está relacionada à", "alts": ["retirada da cobertura vegetal, que deixou o solo exposto à erosão pela água da chuva.", "atividade sísmica comum no interior do país.", "dissolução de rochas calcárias pela água subterrânea.", "ação do vento em ambiente desértico.", "deposição de sedimentos durante as cheias."], "mod": "G2", "ans": "A", "ex": {"A": "sem a vegetação, a água da chuva escoa com força sobre o solo exposto e abre sulcos que crescem até virar voçorocas.", "B": "o interior do Brasil tem pouca atividade sísmica; voçorocas são erosivas.", "C": "dissolução de calcário forma dolinas e cavernas, não fendas de erosão superficial que crescem a cada chuva.", "D": "o interior paulista não é deserto, e o agente é a chuva.", "E": "deposição <strong>acumula<\/strong> material; voçoroca é retirada."}, "hab": "H27, H28", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-37", "vol": "HG", "n": 37, "tag": "Inédita, estilo ENEM", "base": ["Medições feitas numa tarde de verão em uma capital brasileira registraram 34 °C num bairro central, densamente construído e com poucas árvores, e 28 °C num parque arborizado a apenas 5 km dali."], "src": "Texto elaborado para esta apostila.", "cmd": "A diferença de temperatura é explicada pelo fenômeno da", "alts": ["inversão térmica, que aquece as áreas arborizadas.", "chuva orográfica, que resfria o centro da cidade.", "maritimidade, que aquece as áreas longe do mar.", "ilha de calor, associada à impermeabilização e à falta de vegetação.", "friagem, causada pela massa polar atlântica."], "mod": "G3", "ans": "D", "ex": {"D": "o centro construído e sem árvores retém mais calor (asfalto, concreto, pouca evapotranspiração): ilha de calor.", "A": "a inversão térmica retém poluentes, sobretudo no inverno; não aquece parques.", "B": "chuva orográfica depende de relevo; não há serra no texto.", "C": "os dois pontos estão a 5 km, na mesma cidade; maritimidade não explica a diferença.", "E": "friagem é uma queda de temperatura na Amazônia causada por massa polar."}, "hab": "H27, H29", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-38", "vol": "HG", "n": 38, "tag": "Inédita, estilo ENEM", "base": ["Em manhãs de inverno, sem vento e com céu limpo, moradores de uma metrópole observam uma faixa marrom de poluição no horizonte, e os atendimentos por problemas respiratórios aumentam nos hospitais. Por volta do meio-dia, a faixa costuma se desfazer."], "src": "Texto elaborado para esta apostila.", "cmd": "O fenômeno atmosférico que explica a situação é a", "alts": ["chuva ácida, que deposita poluentes no solo.", "destruição da camada de ozônio no inverno.", "passagem de uma frente fria, que traz chuvas.", "ilha de calor, que só ocorre de manhã.", "inversão térmica, que impede a dispersão vertical dos poluentes perto do solo."], "mod": "G3", "ans": "E", "ex": {"E": "manhãs de inverno, sem vento e com céu limpo, com poluição retida perto do solo que se dissipa ao meio-dia (quando o solo aquece): inversão térmica.", "A": "a chuva ácida precisa de chuva; o texto descreve céu limpo.", "B": "a camada de ozônio fica na estratosfera e não forma faixas marrons.", "C": "frentes frias trazem vento e chuva, que <strong>dispersam<\/strong> poluentes.", "D": "a ilha de calor é mais intensa à noite e não se restringe às manhãs de inverno."}, "hab": "H27, H29", "dif": "média", "traps": {}, "kind": "fixacao"}, {"id": "HG-39", "vol": "HG", "n": 39, "tag": "Inédita, estilo ENEM", "base": ["Na encosta da Serra do Mar voltada para o oceano, os índices de chuva estão entre os mais altos do país, enquanto no planalto, logo depois da serra, chove bem menos ao longo do ano."], "src": "Texto elaborado para esta apostila.", "cmd": "A diferença nos índices de chuva é explicada pela", "alts": ["atuação da massa tropical continental no litoral.", "ascensão do ar úmido vindo do oceano, que se resfria e se condensa na encosta da serra.", "maior latit
