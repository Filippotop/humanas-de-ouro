<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Estudo interativo de Ciências Humanas para o ENEM: História, Geografia, Filosofia e Sociologia, com provas oficiais.">
<meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1120" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Humanas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>window.__PWA=true;</script>
<title>Humanas de Ouro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a transit map of Humanas. Four lines (História, Geografia, Filosofia, Sociologia), each module a station. Gold marks what matters today. */
:root{
  --scale:1;
  --bg:#F2F3F7; --surface:#FFFFFF; --sunk:#E8EAF1; --ink:#141A2E; --muted:#5A6079; --rule:#D7DBE6;
  --gold:#9A6B00; --gold-soft:#F6E7C1; --gold-ink:#3D2A00;
  --h:#C33A33; --g:#1F7F55; --f:#3150C8; --s:#8A3BAE;
  --ok:#1E7A4A; --ok-soft:#DDF1E5; --bad:#B3261E; --bad-soft:#F9DEDB; --warn:#A35F00; --warn-soft:#FCEBD0;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --read:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1120; --surface:#171B2D; --sunk:#1F2439; --ink:#E8EAF3; --muted:#9BA1BA; --rule:#2B3150;
  --gold:#E8B53E; --gold-soft:#3A2F12; --gold-ink:#F7E3B0;
  --h:#F2665E; --g:#3FBF85; --f:#7A93FF; --s:#C383EA;
  --ok:#4CC787; --ok-soft:#163626; --bad:#FF7A70; --bad-soft:#3E1A1A; --warn:#F2A640; --warn-soft:#3A2A10;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#171B2D; --sunk:#1F2439; --ink:#E8EAF3; --muted:#9BA1BA; --rule:#2B3150;
  --gold:#E8B53E; --gold-soft:#3A2F12; --gold-ink:#F7E3B0;
  --h:#F2665E; --g:#3FBF85; --f:#7A93FF; --s:#C383EA;
  --ok:#4CC787; --ok-soft:#163626; --bad:#FF7A70; --bad-soft:#3E1A1A; --warn:#F2A640; --warn-soft:#3A2A10;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.01em;cursor:pointer;background:none;border:0;padding:0}
.brand .dot{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--h) 0 25%,var(--g) 0 50%,var(--f) 0 75%,var(--s) 0);box-shadow:inset 0 0 0 5px var(--surface)}
.brand em{font-style:normal;color:var(--gold)}
.count{margin-left:auto;font-family:var(--mono);font-size:12px;background:var(--gold-soft);color:var(--gold-ink);padding:5px 10px;border-radius:999px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:7px 12px;border-radius:999px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer}
nav.tabs button[aria-current="true"]{background:var(--ink);color:var(--surface)}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current="true"]:hover{color:var(--surface)}
main{padding-block:22px 80px}
.sync{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* generic */
.btn{border:1px solid var(--rule);background:var(--surface);padding:9px 14px;border-radius:999px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip.A{background:var(--gold-soft);color:var(--gold-ink);font-weight:600}
.lc-H{--lc:var(--h)} .lc-G{--lc:var(--g)} .lc-F{--lc:var(--f)} .lc-S{--lc:var(--s)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px;flex-wrap:wrap}
.sec-title h2{font-size:22px;font-weight:800;letter-spacing:-.01em}

/* hero / mission */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.hero>*{min-width:0}
.mission h2{font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.08}
.mission p.lead{font-family:var(--read);font-size:16px;color:var(--muted);max-width:56ch;margin:8px 0 14px}
.tasks{display:grid;gap:8px}
.task{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.task:hover{border-color:var(--ink)}
.task .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:12px;color:#fff;background:var(--lc,var(--gold))}
.task b{display:block;font-size:15px}
.task small{color:var(--muted);font-size:13px}
.task.done{opacity:.55}
.task .go{font-family:var(--mono);font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px}
.stat .n{font-family:var(--mono);font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat .bar2{height:5px;border-radius:3px;background:var(--sunk);margin-top:8px;overflow:hidden}
.stat .bar2 i{display:block;height:100%;background:var(--gold)}

/* metro */
.line{margin-bottom:14px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px 0 10px}
.line-head{display:flex;align-items:center;gap:10px;padding:0 16px 6px;flex-wrap:wrap}
.line-head .badge{width:28px;height:28px;border-radius:7px;background:var(--lc);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-weight:600}
.line-head h3{font-size:17px;font-weight:800}
.line-head .pct{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.track{overflow-x:auto;padding:4px 16px 4px}
.stations{position:relative;display:flex;gap:0;min-width:max-content;padding-top:8px}
.stations::before{content:"";position:absolute;left:44px;right:44px;top:22px;height:6px;border-radius:3px;background:var(--lc);opacity:.9}
.st{position:relative;width:88px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:0 2px 6px;text-align:center}
.st .c{width:26px;height:26px;border-radius:50%;background:var(--surface);border:5px solid var(--lc);position:relative;z-index:1;transition:transform .15s}
.st:hover .c{transform:scale(1.15)}
.st.part .c{background:linear-gradient(90deg,var(--lc) 50%,var(--surface) 50%)}
.st.done .c{background:var(--lc)}
.st.weak .c{box-shadow:0 0 0 3px var(--bad)}
.st.strong .c{box-shadow:0 0 0 3px var(--ok)}
.st .code{font-family:var(--mono);font-size:11px;font-weight:600}
.st .t{font-size:11.5px;line-height:1.2;color:var(--muted);max-width:84px}
.st .fa{position:absolute;top:-4px;right:18px;z-index:2;font-family:var(--mono);font-size:9px;font-weight:600;background:var(--gold);color:var(--bg);border-radius:4px;padding:1px 4px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:4px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:50%;border:3px solid var(--muted);display:inline-block}

/* module */
.mod-head{border-left:6px solid var(--lc);padding:4px 0 4px 16px;margin-bottom:16px}
.mod-head h1{font-size:clamp(26px,4.5vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.mod-head .note{font-family:var(--read);color:var(--muted);margin-top:6px;max-width:70ch}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;margin-bottom:12px;font-family:var(--mono);font-size:12px}
.subtabs{display:flex;gap:6px;border-bottom:1px solid var(--rule);margin-bottom:18px;overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.subtabs button[aria-current="true"]{color:var(--ink);border-color:var(--lc,var(--gold))}
.prose{font-family:var(--read);font-size:calc(17px*var(--scale));line-height:1.62;max-width:70ch}
.prose h4{font-family:var(--display);font-size:19px;font-weight:800;margin:28px 0 8px;letter-spacing:-.01em}
.prose p{margin:0 0 12px}
.prose ul,.prose ol{padding-left:22px;margin:0 0 14px}
.prose li{margin-bottom:6px}
.prose strong{font-weight:600}
.prose blockquote{margin:12px 0;padding:12px 16px;background:var(--sunk);border-radius:8px;font-size:calc(16px*var(--scale))}
.prose blockquote p{margin:0 0 4px}
.prose .src{font-size:13px;color:var(--muted);text-align:right;font-style:italic}
.callout{background:var(--gold-soft);color:var(--gold-ink);border-radius:8px;padding:12px 16px;margin:14px 0;font-family:var(--display);font-size:15px;line-height:1.5}
.tw{overflow-x:auto;margin:12px 0 18px;max-width:100%}
table{border-collapse:collapse;font-family:var(--display);font-size:14px;line-height:1.4;min-width:100%}
th{background:var(--ink);color:var(--surface);text-align:left;padding:8px 10px;font-weight:600}
td{border-bottom:1px solid var(--rule);padding:8px 10px;vertical-align:top}
.prose .tw{max-width:min(100%,900px)}
.layout2{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px;align-items:start}
.side{position:sticky;top:120px;display:grid;gap:10px}
.toc a{display:block;color:var(--muted);text-decoration:none;font-size:13px;padding:4px 0;border-left:2px solid var(--rule);padding-left:10px}
.toc a:hover{color:var(--ink);border-color:var(--lc)}

/* resumo flip cards */
.flipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.flip{perspective:900px;border:0;background:none;padding:0;cursor:pointer;min-height:120px;text-align:left}
.flip .in{position:relative;height:100%;min-height:120px;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fa1,.flip .fa2{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.flip .fa1{background:var(--surface);border:1px solid var(--rule);border-top:4px solid var(--lc)}
.flip .fa1 b{font-size:17px;font-weight:800}
.flip .fa2{background:var(--ink);color:var(--surface);transform:rotateY(180deg);font-family:var(--read);font-size:15.5px}
@media (prefers-reduced-motion:reduce){.flip .in{transition:none}}

/* question */
.q{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:18px;margin-bottom:16px}
.q .qh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.q .qh b{font-weight:800}
.q blockquote{font-family:var(--read);font-size:calc(16.5px*var(--scale));line-height:1.55;background:var(--sunk);margin:0 0 12px;padding:12px 16px;border-radius:8px}
.q blockquote p{margin:0 0 6px}
.q .qsrc{font-family:var(--read);font-size:12.5px;color:var(--muted);font-style:italic;margin:-4px 0 12px;text-align:right}
.q .cmd{font-family:var(--read);font-size:calc(17px*var(--scale));font-weight:600;margin:0 0 12px;line-height:1.45}
.alts{display:grid;gap:8px}
.alt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer;font-family:var(--read);font-size:calc(16px*var(--scale));line-height:1.4}
.alt:hover:not(:disabled){border-color:var(--ink)}
.alt .L{font-family:var(--mono);font-weight:600;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-size:13px}
.alt:disabled{cursor:default}
.alt.picked{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.alt.right{border-color:var(--ok);background:var(--ok-soft)}
.alt.right .L{background:var(--ok);color:#fff}
.alt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.alt.wrong .L{background:var(--bad);color:#fff}
.alt.dim{opacity:.55}
.alt .old{font-family:var(--mono);font-size:10.5px;color:var(--bad);display:block;margin-top:4px}
.fb{margin-top:12px;border-radius:8px;padding:12px 14px;font-size:14.5px}
.fb.trap{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn)}
.fb.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fb.no{background:var(--bad-soft);border-left:4px solid var(--bad)}
.ex{display:grid;gap:6px;margin-top:12px}
.ex div{display:grid;grid-template-columns:30px 1fr;gap:8px;font-family:var(--read);font-size:calc(15px*var(--scale));line-height:1.45;padding:8px 10px;border-radius:6px;background:var(--sunk)}
.ex div.c{background:var(--ok-soft)}
.ex .L{font-family:var(--mono);font-weight:600}
.ex .tg{display:inline-block;font-family:var(--mono);font-size:10.5px;background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px}
.tutor-out{font-family:var(--read);font-size:15.5px;line-height:1.55;white-space:pre-wrap;background:var(--gold-soft);color:var(--gold-ink);border-radius:8px;padding:12px 14px;margin-top:10px}
.tutor-only{display:none}
body.has-tutor .tutor-only{display:revert}
body.has-tutor .tutor-only.row{display:flex}
textarea{width:100%;min-height:90px;font:inherit;font-family:var(--read);font-size:16px;padding:12px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);resize:vertical}

/* arena */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.game{text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:170px}
.game:hover{border-color:var(--ink)}
.game .gi{font-family:var(--mono);font-size:12px;color:var(--gold)}
.game h3{font-size:19px;font-weight:800}
.game p{margin:0;color:var(--muted);font-size:14px;font-family:var(--read)}
.game .best{margin-top:auto;font-family:var(--mono);font-size:12px}
.stage{max-width:720px;margin:0 auto}
.timer{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin:10px 0 16px}
.timer i{display:block;height:100%;background:var(--gold);width:100%}
.prompt{font-family:var(--read);font-size:calc(20px*var(--scale));line-height:1.45;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:20px;margin-bottom:12px}
.prompt .k{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:14px;font-weight:600;cursor:pointer;text-align:left}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.score{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--muted)}
.big{font-family:var(--mono);font-size:56px;font-weight:600;letter-spacing:-.03em}
.card3{min-height:200px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}
.card3 .ans{margin-top:14px;padding-top:14px;border-top:1px dashed var(--rule);color:var(--ink)}
.boxes{display:flex;gap:6px;justify-content:center;margin:10px 0}
.boxes span{font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:6px;background:var(--sunk)}

/* recal */
.recal-grid{display:grid;gap:16px}
.rc-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.como{margin-top:12px;font-family:var(--read);font-size:16px;line-height:1.55;background:var(--gold-soft);color:var(--gold-ink);border-radius:8px;padding:12px 14px}
.done-mark{font-family:var(--mono);font-size:11px;color:var(--ok)}

/* sim */
.simnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.simnav button{width:34px;height:34px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);font-family:var(--mono);font-size:12px;cursor:pointer}
.simnav button.a{background:var(--ink);color:var(--surface)}
.simnav button.cur{outline:2px solid var(--gold)}
.simnav button.r{background:var(--ok-soft);border-color:var(--ok)}
.simnav button.w{background:var(--bad-soft);border-color:var(--bad)}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice button{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}
.choice button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* painel */
.heat{display:grid;gap:10px}
.heat .hl{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center}
.heat .cells{display:flex;gap:5px;flex-wrap:wrap}
.cell{width:44px;height:38px;border-radius:6px;border:0;font-family:var(--mono);font-size:11px;font-weight:600;cursor:pointer;background:var(--sunk);color:var(--muted)}
.cell.p0{background:var(--bad);color:#fff}.cell.p1{background:var(--warn);color:#fff}.cell.p2{background:var(--ok);color:#fff}
.bars{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:150px 1fr 52px;gap:10px;align-items:center;font-size:14px}
.brow .track2{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden;position:relative}
.brow .track2 i{display:block;height:100%;border-radius:6px;background:var(--lc,var(--gold))}
.brow .track2 b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2>*{min-width:0}

<script>
const DATA = {"modules": [{"id": "H1", "vol": "HG", "line": "H", "title": "Como o ENEM cobra História", "habs": "H1, H2, H3, H4, H5", "faixa": "A", "note": "Não é um período: é o modo de pensar que todas as questões exigem.", "html": "<h4>1. O ENEM não pede datas, pede processos<\/h4>\n<p>Quase nenhuma questão pergunta \"em que ano...?\". A prova apresenta uma <strong>fonte<\/strong> (documento, imagem, charge, mapa, trecho de historiador) e pede que você reconheça um <strong>processo<\/strong>: uma causa, uma consequência, uma permanência, uma ruptura, um interesse em jogo. A data serve para você <strong>situar<\/strong> o texto, não para ser decorada.<\/p>\n<h4>2. Fontes históricas<\/h4>\n<ul><li><strong>Fonte primária:<\/strong> produzida na época estudada (carta, lei, jornal, pintura, fotografia, objeto). <strong>Fonte secundária:<\/strong> análise posterior (livro de historiador).<\/li><li>Toda fonte tem <strong>autor, lugar e intenção<\/strong>. Uma carta de um colonizador mostra o olhar do colonizador; um cartaz de propaganda mostra o que o governo queria que se pensasse. Por isso o comando costuma perguntar \"o que a fonte <strong>revela<\/strong>\" ou \"qual <strong>interesse<\/strong> ela expressa\".<\/li><li><strong>Fontes não escritas<\/strong> contam: tradição oral, arqueologia, arquitetura, culinária, festas, músicas.<\/li><\/ul>\n<h4>3. Memória, história e patrimônio (cai muito)<\/h4>\n<ul><li><strong>Memória<\/strong> é a lembrança que um grupo constrói e preserva sobre o passado; é <strong>seletiva<\/strong> e está em <strong>disputa<\/strong> (quem é lembrado, quem é esquecido). <strong>História<\/strong> é o estudo crítico do passado, com método e fontes.<\/li><li><strong>Lugares de memória:<\/strong> monumentos, museus, arquivos, datas comemorativas, nomes de ruas. Quando se ergue, se demole ou se rebatiza um monumento, está-se disputando a memória coletiva.<\/li><li><strong>Patrimônio material:<\/strong> bens concretos (edifícios, centros históricos, objetos). <strong>Patrimônio imaterial:<\/strong> saberes, celebrações, formas de expressão e lugares (o ofício das baianas de acarajé, o samba de roda do Recôncavo, a capoeira, o frevo, o Círio de Nazaré, o modo de fazer queijo artesanal de Minas). No Brasil, o órgão federal responsável é o <strong>Iphan<\/strong>; a Unesco reconhece patrimônios da humanidade.<\/li><li><strong>Função do patrimônio:<\/strong> preservar a memória e a <strong>identidade<\/strong> de grupos sociais, muitas vezes daqueles que a história oficial apagou (povos indígenas, africanos e afro-brasileiros, trabalhadores).<\/li><\/ul>\n<h4>4. Conceitos que derrubam alternativas<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Conceito<\/th><th>O que é<\/th><th>Como aparece como pegadinha<\/th><\/tr><\/thead><tbody><tr><td><strong>Anacronismo<\/strong><\/td><td>Julgar ou explicar o passado com valores, ideias ou conceitos de outra época<\/td><td>\"A Roda dos Expostos, no século XVIII, visava defender os direitos humanos\" (o conceito é do século XX)<\/td><\/tr><tr><td><strong>Etnocentrismo<\/strong><\/td><td>Julgar outras culturas a partir dos valores da sua, tomada como superior<\/td><td>Europeus chamando de \"selvagens\" práticas indígenas cujo sentido ignoravam<\/td><\/tr><tr><td><strong>Relativismo cultural<\/strong><\/td><td>Entender cada prática a partir do sentido que ela tem para o próprio grupo<\/td><td>Base das alternativas corretas sobre povos indígenas e africanos<\/td><\/tr><tr><td><strong>Permanência × ruptura<\/strong><\/td><td>O que continua × o que muda<\/td><td>\"A abolição de 1888 rompeu com a escravidão, mas a exclusão social da população negra <strong>permaneceu<\/strong>\"<\/td><\/tr><tr><td><strong>Tempo de curta e longa duração<\/strong><\/td><td>Acontecimento × estrutura que muda devagar<\/td><td>Uma batalha × a estrutura agrária concentrada desde a colonização<\/td><\/tr><tr><td><strong>Historiografia<\/strong><\/td><td>A forma como os historiadores escreveram a história ao longo do tempo<\/td><td>A \"história vista de baixo\" dá voz a trabalhadores, mulheres, escravizados, que a história tradicional ignorava<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Como cai no ENEM<\/h4>\n<ul><li>Texto sobre um bem tombado ou registrado e a pergunta sobre a <strong>função<\/strong> do patrimônio.<\/li><li>Fonte de época e a pergunta sobre o <strong>olhar<\/strong> do autor ou o interesse que ela expressa.<\/li><li>Alternativas com anacronismo ou etnocentrismo como distratores.<\/li><\/ul>", "resumo": [["Fonte", "Tem autor, lugar e intenção"], ["Memória", "Seletiva, construída e disputada"], ["Patrimônio imaterial", "Saberes, celebrações, formas de expressão"], ["Anacronismo", "Valores de outra época aplicados ao passado"], ["Etnocentrismo", "A própria cultura como medida das outras"], ["Permanência × ruptura", "O que fica × o que muda"]], "qs": ["HG-1", "HG-2", "HG-3", "H1.4", "H1.5"]}, {"id": "H2", "vol": "HG", "line": "H", "title": "Antiguidade", "habs": "H11, H12, H24", "faixa": "C", "note": "Costuma vir com texto que contém a resposta; o conteúdo serve para reconhecer conceitos.", "html": "<h4>1. Primeiras civilizações (o mínimo)<\/h4>\n<ul><li><strong>Mesopotâmia e Egito<\/strong> surgiram às margens de rios (Tigre e Eufrates; Nilo). O controle das cheias e da irrigação favoreceu a formação de <strong>Estados centralizados<\/strong> e <strong>teocráticos<\/strong> (o governante ligado ao divino, como o faraó).<\/li><li><strong>Escrita<\/strong> (cuneiforme, hieróglifos): administração, impostos, leis. O <strong>Código de Hamurábi<\/strong> (Babilônia) é um dos primeiros códigos escritos, com a lei de talião (\"olho por olho\").<\/li><\/ul>\n<h4>2. Grécia<\/h4>\n<ul><li><strong>Pólis:<\/strong> cidade-Estado independente, com cultura comum grega.<\/li><li><strong>Esparta:<\/strong> oligárquica e militarista.<\/li><li><strong>Atenas:<\/strong> berço da <strong>democracia<\/strong> (reformas de Clístenes, fim do século VI a.C.; auge com Péricles, século V a.C.). Era <strong>direta<\/strong>: os cidadãos votavam na assembleia (Eclésia).<\/li><li><strong>Cidadania restrita:<\/strong> só homens adultos, livres, filhos de atenienses. <strong>Mulheres, escravizados e estrangeiros (metecos) ficavam de fora<\/strong>: a maioria da população. Essa é a pegadinha mais cobrada sobre Atenas.<\/li><li>Legado: filosofia, teatro, política como debate público, ideia de cidadania (aprofundado no volume 2).<\/li><\/ul>\n<h4>3. Roma<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Período<\/th><th>Marcas<\/th><\/tr><\/thead><tbody><tr><td><strong>Monarquia<\/strong> (até 509 a.C.)<\/td><td>Reis; patrícios no Senado<\/td><\/tr><tr><td><strong>República<\/strong> (509–27 a.C.)<\/td><td>Poder do <strong>Senado<\/strong>, dominado pelos <strong>patrícios<\/strong> (aristocracia). Lutas dos <strong>plebeus<\/strong> por direitos: criação dos <strong>tribunos da plebe<\/strong>; <strong>Lei das Doze Tábuas<\/strong> (meados do século V a.C.), que <strong>pôs as leis por escrito<\/strong> e reduziu o arbítrio dos patrícios na justiça; fim da escravidão por dívidas. Expansão militar, latifúndios com mão de obra escravizada, crise social (irmãos Graco tentam a reforma agrária).<\/td><\/tr><tr><td><strong>Império<\/strong> (27 a.C.–476 d.C. no Ocidente)<\/td><td>Augusto; poder centralizado no imperador. <strong>\"Pão e circo\":<\/strong> distribuição de alimentos e espetáculos para controlar a plebe urbana e evitar revoltas.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Cristianismo em Roma:<\/strong> nasce no século I, é <strong>perseguido<\/strong> (recusa do culto ao imperador), torna-se <strong>tolerado<\/strong> com o <strong>Édito de Milão (313)<\/strong>, de Constantino, e <strong>religião oficial<\/strong> do Império com Teodósio (380). A partir daí, a Igreja passa a combater práticas pagãs e espetáculos (teatro, circo), vistos como imorais.<\/p>\n<p><strong>Fim do Império Romano do Ocidente (476):<\/strong> crise econômica, dificuldade de defender as fronteiras, migrações germânicas. O Império do Oriente (Bizantino) dura até 1453.<\/p>", "resumo": [["Democracia ateniense", "Direta, mas cidadania restrita a homens livres atenienses"], ["Patrícios × plebeus", "Aristocracia × maioria; plebeus conquistam tribunos e leis escritas"], ["Lei das Doze Tábuas", "Leis escritas, menos arbítrio dos patrícios"], ["Pão e circo", "Controle da plebe urbana"], ["Cristianismo", "Perseguido → tolerado (313) → oficial (380)"]], "qs": ["HG-4", "HG-5", "HG-6", "H2.4", "H2.5"]}, {"id": "H3", "vol": "HG", "line": "H", "title": "Idade Média", "habs": "H1, H11, H15", "faixa": "C", "note": "mas ligada a um erro seu (questão 69).", "html": "<h4>1. Feudalismo<\/h4>\n<ul><li>Economia <strong>agrária<\/strong>, <strong>autossuficiente<\/strong> e pouco monetizada; poder <strong>descentralizado<\/strong> entre senhores feudais.<\/li><li><strong>Suserania e vassalagem:<\/strong> relações de fidelidade entre nobres (o suserano concede terra, o feudo; o vassalo deve lealdade e ajuda militar).<\/li><li><strong>Servidão:<\/strong> o servo não é escravo (não pode ser vendido), mas está <strong>preso à terra<\/strong> e deve obrigações ao senhor: <strong>corveia<\/strong> (trabalho gratuito nas terras do senhor), <strong>talha<\/strong> (parte da produção), <strong>banalidades<\/strong> (pagamento pelo uso do moinho, do forno).<\/li><li><strong>Sociedade de ordens<\/strong> (estamental, quase sem mobilidade): <strong>os que oram<\/strong> (clero), <strong>os que guerreiam<\/strong> (nobreza) e <strong>os que trabalham<\/strong> (camponeses). A Igreja apresentava essa divisão como <strong>vontade de Deus<\/strong>, o que justificava a desigualdade.<\/li><\/ul>\n<h4>2. A Igreja medieval<\/h4>\n<ul><li>Maior proprietária de terras e principal instituição cultural (mosteiros copiavam livros; o latim era a língua da cultura).<\/li><li>Controlava o acesso à <strong>salvação<\/strong>: sacramentos, missas, penitências. <strong>Excomunhão<\/strong> era uma arma política.<\/li><li><strong>Indulgências:<\/strong> perdão de penas pelos pecados, concedido pela Igreja em troca de ações (peregrinações, participação nas Cruzadas, doações). Mais tarde, sua venda seria criticada por Lutero.<\/li><\/ul>\n<h4>3. Islã e Cruzadas<\/h4>\n<ul><li>O <strong>Islã<\/strong> surgiu no século VII (Maomé) e se expandiu rapidamente do Oriente Médio ao norte da África e à Península Ibérica. Os árabes preservaram e traduziram textos gregos e avançaram em matemática, medicina e astronomia.<\/li><li><strong>Cruzadas (1096–1291):<\/strong> expedições militares cristãs para conquistar Jerusalém e a \"Terra Santa\".<ul><li><strong>Motivação religiosa:<\/strong> o papa prometia <strong>indulgência plenária<\/strong> (perdão dos pecados) a quem partisse. A salvação passava a depender de uma <strong>escolha e de uma ação do fiel leigo<\/strong>, sem que ele precisasse se tornar monge ou padre.<\/li><li><strong>Outras motivações:<\/strong> nobres sem terras (filhos não primogênitos), interesses comerciais de cidades italianas (Veneza, Gênova), excesso populacional.<\/li><li><strong>Consequências:<\/strong> <strong>reabertura do Mar Mediterrâneo<\/strong> ao comércio europeu, contato com o Oriente, fortalecimento das cidades italianas e do comércio, violência e intolerância contra muçulmanos e judeus.<\/li><\/ul><\/li><\/ul>\n<h4>4. Baixa Idade Média: renascimento comercial e urbano<\/h4>\n<ul><li>Crescimento populacional, novas técnicas agrícolas, <strong>feiras<\/strong>, rotas comerciais, <strong>burgos<\/strong> (cidades), <strong>burguesia<\/strong> (comerciantes e artesãos).<\/li><li><strong>Corporações de ofício:<\/strong> associações de artesãos de uma mesma profissão (mestres, oficiais e aprendizes) que controlavam preços, qualidade e acesso ao ofício.<\/li><li><strong>Universidades<\/strong> (Bolonha, Paris, Oxford, séculos XI a XIII): instituições medievais, ligadas à Igreja, com autonomia corporativa. Muitas instituições atuais (universidade, parlamento) são herança medieval: a Idade Média <strong>não<\/strong> foi uma \"idade das trevas\" sem produção cultural. Esse rótulo foi criado por renascentistas e iluministas.<\/li><\/ul>\n<h4>5. Crise do século XIV<\/h4>\n<p>Fome, <strong>Peste Negra<\/strong> (1347–1351, matou cerca de um terço da população europeia), Guerra dos Cem Anos e revoltas camponesas. Com a <strong>falta de mão de obra<\/strong>, os camponeses passaram a ter mais poder de barganha: a servidão entrou em declínio na Europa Ocidental. A crise abriu caminho para a centralização monárquica e a expansão marítima.<\/p>\n<h4>Como cai no ENEM<\/h4>\n<ul><li>Trecho de documento ou historiador sobre a mentalidade religiosa e a pergunta sobre <strong>como se alcançava a salvação<\/strong> ou <strong>por que<\/strong> a Igreja agia de certa forma.<\/li><li>Comparação entre o legado medieval e instituições atuais.<\/li><li>Consequências das Cruzadas e da Peste Negra.<\/li><\/ul>\n<p><strong>Pegadinhas:<\/strong> tratar o servo como escravo; chamar a Idade Média inteira de \"idade das trevas\"; atribuir o comércio medieval à \"proibição pela Igreja\" de forma absoluta.<\/p>", "resumo": [["Servidão", "Preso à terra; corveia, talha, banalidades"], ["Sociedade de ordens", "Oram, guerreiam, trabalham; justificativa religiosa"], ["Indulgência", "Perdão das penas por ações (Cruzadas, peregrinação)"], ["Cruzadas", "Salvação pela ação do fiel; reabertura do Mediterrâneo"], ["Baixa Idade Média", "Burgos, feiras, burguesia, corporações, universidades"], ["Peste Negra", "Falta de mão de obra → declínio da servidão"]], "qs": ["HG-7", "HG-8", "HG-9", "H3.4", "H3.5"]}, {"id": "H4", "vol": "HG", "line": "H", "title": "Idade Moderna", "habs": "H1, H7, H15, H23", "faixa": "C", "note": "", "html": "<h4>1. Renascimento e humanismo (séculos XIV a XVI)<\/h4>\n<ul><li><strong>Humanismo:<\/strong> valorização do ser humano, da razão e da cultura greco-romana; <strong>antropocentrismo<\/strong> (sem abandonar a religião).<\/li><li>Mecenato de ricos comerciantes e banqueiros das cidades italianas (Florença, Veneza), que enriqueceram com o <strong>comércio mediterrâneo<\/strong> com o Oriente.<\/li><li><strong>Imprensa de tipos móveis<\/strong> (Gutenberg, meados do século XV): barateou e multiplicou livros, acelerando a circulação de ideias.<\/li><\/ul>\n<h4>2. Reformas religiosas<\/h4>\n<ul><li><strong>Reforma protestante (1517):<\/strong> Lutero critica a venda de indulgências e defende a <strong>salvação pela fé<\/strong>, a <strong>leitura da Bíblia pelos fiéis<\/strong> (traduziu-a para o alemão) e o fim da autoridade papal. Apoio de príncipes alemães interessados em terras da Igreja e em autonomia política.<\/li><li><strong>Calvinismo:<\/strong> <strong>predestinação<\/strong>; valorização do trabalho e da disciplina (base do argumento de Weber sobre a \"ética protestante\", no volume 2).<\/li><li><strong>Anglicanismo:<\/strong> Henrique VIII rompe com Roma; o rei passa a chefiar a Igreja da Inglaterra.<\/li><li><strong>Contrarreforma:<\/strong> Concílio de Trento, <strong>jesuítas<\/strong> (Companhia de Jesus, educação e missões, inclusive no Brasil), Inquisição, Índice de livros proibidos.<\/li><\/ul>\n<h4>3. Estado absolutista e mercantilismo<\/h4>\n<ul><li><strong>Absolutismo:<\/strong> concentração de poder no rei, justificada pelo <strong>direito divino<\/strong> (Bossuet) ou pela necessidade de ordem (Hobbes). Exemplo clássico: Luís XIV (\"o Estado sou eu\", frase a ele atribuída).<\/li><li><strong>Mercantilismo:<\/strong> política econômica dos Estados modernos: <strong>metalismo<\/strong> (riqueza = ouro e prata), <strong>balança comercial favorável<\/strong>, protecionismo e <strong>colonialismo<\/strong>.<\/li><li><strong>Pacto colonial (exclusivo metropolitano):<\/strong> a colônia só podia comerciar com a metrópole, fornecendo matérias-primas e comprando produtos manufaturados. A colônia existia <strong>para enriquecer a metrópole<\/strong>.<\/li><\/ul>\n<h4>4. Expansão marítima<\/h4>\n<ul><li><strong>Portugal pioneiro:<\/strong> centralização política precoce, posição geográfica favorável, experiência náutica, interesse da burguesia mercantil e da Coroa.<\/li><li><strong>Objetivos:<\/strong> chegar às especiarias do Oriente sem passar pelos intermediários italianos e muçulmanos; buscar metais; expandir a fé cristã.<\/li><li><strong>Consequências:<\/strong> comércio em escala mundial, colonização da América, <strong>genocídio e escravização de povos indígenas<\/strong>, <strong>tráfico de africanos escravizados<\/strong>, deslocamento do eixo econômico do Mediterrâneo para o Atlântico.<\/li><\/ul>\n<h4>5. Revoluções inglesas e Iluminismo<\/h4>\n<ul><li><strong>Revoluções inglesas (1640–1689):<\/strong> conflito entre rei e Parlamento; a <strong>Revolução Gloriosa (1688–1689)<\/strong> e o <strong>Bill of Rights<\/strong> limitam o poder do rei: nasce a <strong>monarquia parlamentar<\/strong>.<\/li><li><strong>Iluminismo (século XVIII):<\/strong> razão contra a tradição e o dogma; crítica ao <strong>absolutismo<\/strong>, aos privilégios da nobreza e do clero e à intolerância religiosa.<ul><li><strong>Locke:<\/strong> direitos naturais (vida, liberdade, propriedade); governo baseado no consentimento.<\/li><li><strong>Montesquieu:<\/strong> <strong>separação dos três poderes<\/strong> (Executivo, Legislativo, Judiciário) para evitar a tirania.<\/li><li><strong>Voltaire:<\/strong> tolerância religiosa, liberdade de expressão.<\/li><li><strong>Rousseau:<\/strong> soberania popular e vontade geral.<\/li><li><strong>Adam Smith (liberalismo econômico):<\/strong> livre mercado, crítica ao mercantilismo.<\/li><li>Difusão das ideias: livros, a <strong>Enciclopédia<\/strong>, cafés, academias e <strong>salões<\/strong> literários.<\/li><\/ul><\/li><li><strong>Despotismo esclarecido:<\/strong> monarcas que adotaram reformas inspiradas no Iluminismo sem abrir mão do poder absoluto (em Portugal, o <strong>Marquês de Pombal<\/strong>).<\/li><\/ul>", "resumo": [["Renascimento", "Humanismo, antropocentrismo, comércio italiano, imprensa"], ["Reforma", "Salvação pela fé, Bíblia ao fiel, crítica às indulgências"], ["Contrarreforma", "Trento, jesuítas, Inquisição"], ["Absolutismo", "Rei concentra poder; direito divino"], ["Mercantilismo", "Metalismo, balança favorável, pacto colonial"], ["Iluminismo", "Razão; crítica ao absolutismo; separação de poderes"]], "qs": ["HG-10", "HG-11", "HG-12", "H4.4", "H4.5"]}, {"id": "H5", "vol": "HG", "line": "H", "title": "Revoluções e século XIX", "habs": "H7, H13, H15, H16", "faixa": "B", "note": "\"Idade Contemporânea\" é o bloco nº 1 de História no levantamento histórico; inclui também o H6.", "html": "<h4>1. Revolução Industrial<\/h4>\n<ul><li><strong>Início:<\/strong> Inglaterra, segunda metade do século XVIII.<\/li><li><strong>Por que lá:<\/strong> capital acumulado no comércio e nas colônias; <strong>cercamentos<\/strong> (as terras comuns foram cercadas para a criação de ovelhas, expulsando camponeses, que viraram mão de obra barata nas cidades); carvão e ferro; monarquia parlamentar favorável à burguesia.<\/li><li><strong>Mudanças:<\/strong> máquina a vapor; fábrica; <strong>divisão do trabalho<\/strong>; o artesão perde o controle do processo; <strong>jornadas de 14 a 16 horas<\/strong>, trabalho infantil e feminino mal pago, cidades insalubres.<\/li><li><strong>Reações operárias:<\/strong> <strong>ludismo<\/strong> (quebra de máquinas, vistas como causa do desemprego e da miséria), <strong>cartismo<\/strong> (luta por direitos políticos, como o voto), <strong>sindicatos<\/strong> (trades unions).<\/li><li><strong>Segunda Revolução Industrial<\/strong> (fim do século XIX): eletricidade, petróleo, aço, química, linha de montagem (fordismo, no século XX).<\/li><\/ul>\n<h4>2. Independência dos Estados Unidos (1776)<\/h4>\n<p>Primeira independência na América; inspirada no Iluminismo (direitos naturais, governo pelo consentimento). Gerou uma república federativa, mas <strong>manteve a escravidão<\/strong> no Sul e excluiu indígenas e mulheres.<\/p>\n<h4>3. Revolução Francesa (1789)<\/h4>\n<ul><li><strong>Causas:<\/strong> crise financeira do Estado, privilégios do clero (1º Estado) e da nobreza (2º Estado), o <strong>Terceiro Estado<\/strong> (burguesia, camponeses, trabalhadores urbanos) arcando com os impostos, fome, ideias iluministas.<\/li><li><strong>Marcos:<\/strong> Queda da Bastilha (14/07/1789); <strong>Declaração dos Direitos do Homem e do Cidadão<\/strong> (1789): igualdade perante a lei, liberdade, propriedade, soberania nacional. <strong>Limites:<\/strong> mulheres não tiveram direitos políticos (Olympe de Gouges escreveu, em 1791, a <em>Declaração dos Direitos da Mulher e da Cidadã<\/em> e foi executada em 1793).<\/li><li><strong>Fases:<\/strong> Monarquia constitucional → <strong>Convenção<\/strong> (república; período jacobino, o <strong>Terror<\/strong>, Robespierre) → Diretório → <strong>Era Napoleônica<\/strong> (1799–1815; Código Civil; <strong>Bloqueio Continental<\/strong>, em 1806, contra a Inglaterra, que levou a família real portuguesa a vir para o Brasil em 1808).<\/li><li><strong>Legado:<\/strong> fim do Antigo Regime, ascensão da burguesia, ideias de cidadania, nação e república, divisão política em \"esquerda\" e \"direita\" (posição na Assembleia).<\/li><\/ul>\n<h4>4. Revolução do Haiti (1791–1804)<\/h4>\n<p>Única revolução de <strong>escravizados<\/strong> vitoriosa: acabou com a escravidão e fundou o primeiro país independente da América Latina governado por ex-escravizados. Assustou as elites escravistas de toda a América, inclusive no Brasil (o medo de \"haitianismo\").<\/p>\n<h4>5. Independências da América espanhola (1810–1825)<\/h4>\n<p>Lideradas pelos <strong>criollos<\/strong> (elite nascida na América), com Bolívar e San Martín. A fragmentação em vários países, a permanência das elites e a exclusão de indígenas e negros marcaram o resultado.<\/p>\n<h4>6. Ideias do século XIX<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Corrente<\/th><th>Ideia central<\/th><\/tr><\/thead><tbody><tr><td><strong>Liberalismo<\/strong><\/td><td>Liberdades individuais, propriedade, livre mercado, Estado limitado<\/td><\/tr><tr><td><strong>Socialismo utópico<\/strong><\/td><td>Sociedades igualitárias por cooperação (Owen, Fourier)<\/td><\/tr><tr><td><strong>Socialismo científico (Marx e Engels)<\/strong><\/td><td>Luta de classes; o proletariado superaria o capitalismo (<em>Manifesto Comunista<\/em>, 1848)<\/td><\/tr><tr><td><strong>Anarquismo<\/strong><\/td><td>Fim do Estado e de toda autoridade (Proudhon, Bakunin); forte entre operários imigrantes no Brasil no início do século XX<\/td><\/tr><tr><td><strong>Nacionalismo<\/strong><\/td><td>Identidade nacional; unificações da Itália e da Alemanha (1870–1871)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>7. Imperialismo (neocolonialismo)<\/h4>\n<ul><li><strong>Quando e por quê:<\/strong> de meados do século XIX até 1914. A Segunda Revolução Industrial exigia <strong>matérias-primas, mercados consumidores e áreas para investir capitais<\/strong>.<\/li><li><strong>Partilha da África:<\/strong> <strong>Conferência de Berlim (1884–1885)<\/strong> dividiu o continente entre potências europeias, <strong>sem nenhum africano presente<\/strong>, traçando fronteiras que ignoravam povos e culturas.<\/li><li><strong>Justificativas ideológicas:<\/strong> <strong>darwinismo social<\/strong> (aplicação distorcida da teoria de Darwin às sociedades, hierarquizando \"raças\"), \"missão civilizadora\", o \"fardo do homem branco\".<\/li><li><strong>Ciência e império:<\/strong> expedições científicas, coleções de museus, mapas e estudos de povos \"exóticos\" serviam ao <strong>conhecimento e ao controle<\/strong> de territórios e ao <strong>prestígio nacional<\/strong> das potências. Museus de história natural e etnografia europeus encheram-se de objetos e animais coletados nas colônias e em regiões de interesse. Uma expedição financiada por um Estado europeu no início do século XX, em busca de espécimes e dados sobre povos sul-americanos, se encaixa nesse projeto.<\/li><li><strong>Na Ásia:<\/strong> Guerra do Ópio (Inglaterra × China), domínio britânico da Índia.<\/li><li><strong>Resistências:<\/strong> Revolta dos Sipaios (Índia), Guerra dos Bôeres, resistências africanas.<\/li><\/ul>\n<h4>Como cai no ENEM<\/h4>\n<ul><li>Texto sobre condições de trabalho nas fábricas e a pergunta sobre a reação operária.<\/li><li>Declarações de direitos e seus <strong>limites<\/strong> (quem ficou de fora).<\/li><li>Imperialismo com justificativa científica ou \"civilizadora\".<\/li><\/ul>\n<p><strong>Pegadinhas:<\/strong> achar que os luditas eram \"contra o progresso\" por ignorância (protestavam contra a miséria); tratar a Declaração de 1789 como universal na prática; descrever o imperialismo como \"missão humanitária\".<\/p>", "resumo": [["Revolução Industrial", "Inglaterra; cercamentos; fábrica; jornadas longas"], ["Ludismo / cartismo", "Quebra de máquinas / direitos políticos"], ["Revolução Francesa", "Fim do Antigo Regime; Declaração de 1789; Terror; Napoleão"], ["Haiti", "Única revolução escrava vitoriosa"], ["Imperialismo", "Matérias-primas, mercados, capitais; Berlim 1884–85"], ["Darwinismo social", "Justificativa \"científica\" da dominação"], ["Ciência e império", "Expedições e museus a serviço do controle e do prestígio"]], "qs": ["HG-13", "HG-14", "HG-15", "H5.4", "H5.5"]}, {"id": "H6", "vol": "HG", "line": "H", "title": "Século XX e mundo atual", "habs": "H7, H13, H15, H24", "faixa": "B", "note": "", "html": "<h4>1. Primeira Guerra Mundial (1914–1918)<\/h4>\n<ul><li><strong>Causas:<\/strong> disputas <strong>imperialistas<\/strong>, <strong>nacionalismos<\/strong>, corrida armamentista e <strong>sistema de alianças<\/strong> (Tríplice Entente: Reino Unido, França, Rússia × Tríplice Aliança: Alemanha, Áustria-Hungria e, inicialmente, Itália). Estopim: assassinato do herdeiro austríaco em Sarajevo.<\/li><li>Guerra de <strong>trincheiras<\/strong>, armas químicas, milhões de mortos. Entrada dos EUA em 1917.<\/li><li><strong>Tratado de Versalhes (1919):<\/strong> a Alemanha, culpada pela guerra, perde territórios e paga indenizações pesadas: ressentimento que alimentará o nazismo.<\/li><li><strong>Gripe espanhola (1918–1920):<\/strong> pandemia que matou dezenas de milhões. O nome vem do fato de a <strong>Espanha, neutra, não censurar<\/strong> as notícias sobre a doença, enquanto os países em guerra controlavam as informações vindas do front.<\/li><\/ul>\n<h4>2. Revolução Russa (1917)<\/h4>\n<p>Fevereiro: queda do czar. Outubro: os <strong>bolcheviques<\/strong> (Lênin) tomam o poder. Nasce a <strong>URSS<\/strong> (1922), primeiro Estado socialista: estatização da economia, partido único. Com <strong>Stálin<\/strong>: planos quinquenais, coletivização forçada, repressão política (expurgos, campos de trabalho forçado).<\/p>\n<h4>3. Crise de 1929<\/h4>\n<p><strong>Superprodução<\/strong>, especulação e queda da Bolsa de Nova York; desemprego em massa no mundo inteiro. Resposta nos EUA: <strong>New Deal<\/strong> (Roosevelt), com <strong>intervenção do Estado<\/strong> na economia (ideias de Keynes). No Brasil, a crise derrubou o preço do café e contribuiu para a Revolução de 1930.<\/p>\n<h4>4. Totalitarismos<\/h4>\n<ul><li><strong>Fascismo<\/strong> (Itália, Mussolini, 1922) e <strong>nazismo<\/strong> (Alemanha, Hitler, chanceler em 1933).<\/li><li><strong>Características comuns:<\/strong> partido único, <strong>culto ao líder<\/strong>, <strong>propaganda<\/strong> maciça e controle dos meios de comunicação, censura, <strong>nacionalismo<\/strong> exacerbado, militarismo, anticomunismo, antiliberalismo; no nazismo, <strong>racismo e antissemitismo<\/strong>.<\/li><li><strong>Holocausto:<\/strong> extermínio sistemático de cerca de <strong>6 milhões de judeus<\/strong>, além de ciganos (roma e sinti), pessoas com deficiência, homossexuais e opositores.<\/li><li>Regimes inspirados nesse modelo: Salazar (Portugal), Franco (Espanha) e, em parte, o Estado Novo de Vargas.<\/li><\/ul>\n<h4>5. Segunda Guerra Mundial (1939–1945)<\/h4>\n<p>Eixo (Alemanha, Itália, Japão) × Aliados (Reino Unido, URSS, EUA e outros). O Brasil enviou a <strong>FEB<\/strong> à Itália (1944). Fim com a derrota alemã e as <strong>bombas atômicas<\/strong> em Hiroshima e Nagasaki (agosto de 1945). Criação da <strong>ONU (1945)<\/strong> e <strong>Declaração Universal dos Direitos Humanos (1948)<\/strong>.<\/p>\n<h4>6. Guerra Fria (1947–1991)<\/h4>\n<ul><li>Disputa <strong>bipolar<\/strong> entre <strong>EUA (capitalismo)<\/strong> e <strong>URSS (socialismo)<\/strong>, <strong>sem confronto militar direto<\/strong> entre as duas, mas com guerras indiretas (Coreia, Vietnã, Afeganistão), <strong>corrida armamentista<\/strong> (ameaça nuclear) e <strong>corrida espacial<\/strong> (Sputnik, 1957; chegada à Lua, 1969), propaganda e espionagem.<\/li><li>Instrumentos: <strong>Plano Marshall<\/strong> (ajuda americana à Europa Ocidental) e <strong>OTAN<\/strong> (1949) × Pacto de Varsóvia (1955).<\/li><li><strong>Muro de Berlim (1961–1989):<\/strong> símbolo da divisão do mundo. Sua queda, em 1989, marca o fim do bloco soviético. <strong>Fim da URSS: 1991.<\/strong><\/li><li><strong>América Latina:<\/strong> <strong>Revolução Cubana (1959)<\/strong>, Crise dos Mísseis (1962). Os EUA apoiaram <strong>ditaduras militares<\/strong> anticomunistas: Brasil (1964), Chile (1973, golpe de Pinochet), Argentina (1976–1983), Uruguai (1973–1985). A <strong>Operação Condor<\/strong> coordenou a repressão entre esses regimes. Desaparecimentos forçados de opositores marcaram essas ditaduras, e familiares de desaparecidos organizaram movimentos de busca por memória e justiça.<\/li><\/ul>\n<h4>7. Descolonização da Ásia e da África<\/h4>\n<p>Após 1945, com potências europeias enfraquecidas e a ONU defendendo a autodeterminação. <strong>Índia (1947)<\/strong>, com a resistência não violenta de <strong>Gandhi<\/strong>; Argélia (guerra contra a França); colônias portuguesas na África (Angola, Moçambique, Guiné-Bissau e outras) só em <strong>1974–1975<\/strong>, após a Revolução dos Cravos. <strong>Apartheid<\/strong> na África do Sul (segregação racial oficial, de 1948 ao início dos anos 1990); <strong>Nelson Mandela<\/strong>, preso por 27 anos, foi eleito presidente em 1994.<\/p>\n<h4>8. Mundo pós-Guerra Fria<\/h4>\n<ul><li><strong>Globalização<\/strong> e <strong>neoliberalismo<\/strong> (privatizações, abertura comercial, Estado mínimo), ascensão da China, blocos econômicos (ver G9).<\/li><li>Conflitos de base étnica e religiosa (ex-Iugoslávia nos anos 1990), terrorismo (11 de setembro de 2001), questão <strong>Israel-Palestina<\/strong> (Estado de Israel criado em 1948; deslocamento de palestinos; guerras e ocupações).<\/li><li><strong>Muros e memória:<\/strong> trechos preservados do Muro de Berlim são patrimônio e lugares de memória.<\/li><\/ul>", "resumo": [["1ª Guerra", "Imperialismo, nacionalismos, alianças; Versalhes humilha a Alemanha"], ["Gripe espanhola", "Espanha neutra noticiava; países em guerra censuravam"], ["Totalitarismo", "Partido único, líder, propaganda, censura, nacionalismo"], ["Guerra Fria", "EUA × URSS sem guerra direta; corrida armamentista e espacial"], ["Ditaduras latino-americanas", "Anticomunismo, apoio dos EUA, repressão, desaparecidos"], ["Descolonização", "Pós-1945; Índia 1947; África portuguesa 1974–75"]], "qs": ["HG-16", "HG-17", "HG-18", "H6.4", "H6.5"]}, {"id": "H7", "vol": "HG", "line": "H", "title": "Brasil Colônia (1500–1822)", "habs": "H1, H3, H11, H15", "faixa": "A", "note": "É o 2º bloco de História no levantamento histórico e ligado a um erro seu (questão 83).", "html": "<h4>1. Povos indígenas e o \"descobrimento\"<\/h4>\n<ul><li>Em 1500, viviam no território milhões de indígenas, de centenas de povos e línguas (troncos <strong>tupi<\/strong> e <strong>macro-jê<\/strong>, entre outros). Termos como \"descobrimento\" refletem o olhar europeu; hoje se fala em <strong>chegada<\/strong>, <strong>conquista<\/strong> ou <strong>invasão<\/strong>.<\/li><li><strong>Pau-brasil (1500–1530):<\/strong> extração por <strong>escambo<\/strong> (trocas) com indígenas.<\/li><li><strong>Etnocentrismo europeu:<\/strong> práticas como a <strong>antropofagia ritual<\/strong> tupi (comer o inimigo capturado, num ritual regrado que <strong>honrava<\/strong> o guerreiro morto e transferia sua força) eram lidas como pura \"selvageria\". Para os tupis, morrer em combate e ser devorado era honroso.<\/li><\/ul>\n<h4>2. Organização colonial<\/h4>\n<ul><li><strong>Capitanias hereditárias (1534):<\/strong> faixas de terra doadas a particulares (donatários), que deveriam colonizar com recursos próprios. A maioria fracassou.<\/li><li><strong>Governo-geral (1549):<\/strong> Tomé de Sousa funda <strong>Salvador<\/strong>, primeira capital; chegam os <strong>jesuítas<\/strong> (catequese, aldeamentos, colégios).<\/li><li><strong>Igreja e assistência:<\/strong> Santas Casas de Misericórdia, irmandades e a <strong>Roda dos Expostos<\/strong> (para bebês abandonados) seguiam a lógica da <strong>caridade cristã<\/strong>, não a de \"direitos\" (conceito posterior).<\/li><\/ul>\n<h4>3. Economia açucareira e escravidão<\/h4>\n<ul><li><strong>Plantation:<\/strong> latifúndio, monocultura, mão de obra escravizada, produção para exportação. Centro: <strong>engenho<\/strong> (Nordeste, sobretudo Pernambuco e Bahia).<\/li><li><strong>Escravização indígena<\/strong> (resistida e combatida pelos jesuítas, que defendiam os aldeamentos) e <strong>tráfico de africanos<\/strong>: cerca de 4 a 5 milhões de africanos foram trazidos ao Brasil, o maior destino do tráfico atlântico.<\/li><li><strong>Resistência:<\/strong> fugas, sabotagens, revoltas, irmandades, preservação de religiões e culturas e <strong>quilombos<\/strong>. <strong>Palmares<\/strong> (Serra da Barriga, Alagoas) resistiu por quase todo o século XVII; foi destruído em 1694, e <strong>Zumbi<\/strong> foi morto em 20 de novembro de 1695 (hoje Dia Nacional de Zumbi e da Consciência Negra).<\/li><li><strong>Invasões holandesas<\/strong> no Nordeste (1630–1654), no contexto da <strong>União Ibérica<\/strong> (1580–1640, Portugal sob o rei da Espanha).<\/li><\/ul>\n<h4>4. Expansão e mineração<\/h4>\n<ul><li><strong>Bandeirantes<\/strong> paulistas: captura de indígenas, busca de metais, expansão para o interior (além da linha de Tordesilhas).<\/li><li><strong>Ouro em Minas Gerais<\/strong> (fim do século XVII): deslocamento do eixo econômico para o Centro-Sul; <strong>capital transferida para o Rio de Janeiro em 1763<\/strong>; crescimento urbano (Vila Rica), sociedade mais diversificada, <strong>barroco mineiro<\/strong> (Aleijadinho).<\/li><li><strong>Controle fiscal:<\/strong> <strong>quinto<\/strong> (20% do ouro para a Coroa), casas de fundição, <strong>derrama<\/strong> (cobrança forçada dos impostos atrasados).<\/li><li><strong>Marquês de Pombal<\/strong> (segunda metade do século XVIII): reformas centralizadoras, <strong>expulsão dos jesuítas (1759)<\/strong>, Diretório dos Índios.<\/li><\/ul>\n<h4>5. Revoltas coloniais<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Tipo<\/th><th>Revoltas<\/th><th>Característica<\/th><\/tr><\/thead><tbody><tr><td><strong>Nativistas<\/strong> (contra abusos, sem romper com Portugal)<\/td><td>Beckman (MA, 1684), Emboabas (MG, 1707–1709), Mascates (PE, 1710–1711), Vila Rica (1720)<\/td><td>Conflitos locais, impostos, monopólios<\/td><\/tr><tr><td><strong>Emancipacionistas<\/strong> (querem independência)<\/td><td><strong>Inconfidência Mineira (1789)<\/strong>: elite mineira endividada, ameaçada pela derrama, inspirada no Iluminismo e na independência dos EUA; não propunha abolir a escravidão; Tiradentes executado em 1792<\/td><td><strong>Elitista<\/strong><\/td><\/tr><tr><td><\/td><td><strong>Conjuração Baiana (1798)<\/strong>, ou dos Alfaiates: soldados, artesãos, escravizados e libertos; queria república, igualdade e <strong>fim da escravidão<\/strong>; influenciada pela Revolução Francesa<\/td><td><strong>Popular<\/strong><\/td><\/tr><tr><td><\/td><td>Revolução Pernambucana (1817)<\/td><td>Republicana, contra os impostos do período joanino<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>6. Período joanino (1808–1821)<\/h4>\n<ul><li><strong>Por quê:<\/strong> o Bloqueio Continental de Napoleão e a invasão de Portugal levaram a Corte a se transferir para o Rio de Janeiro, com apoio britânico.<\/li><li><strong>Medidas:<\/strong> <strong>abertura dos portos às nações amigas (1808)<\/strong>, que, na prática, encerrou o exclusivo metropolitano e favoreceu a Inglaterra (tratados de 1810); fim da proibição de manufaturas; <strong>Banco do Brasil<\/strong>; <strong>Impressão Régia (1808)<\/strong>; Biblioteca Real; Jardim Botânico; escolas de medicina; Missão Artística Francesa (1816).<\/li><li><strong>Reino Unido a Portugal e Algarves (1815):<\/strong> o Brasil deixa formalmente de ser colônia.<\/li><li><strong>Função política:<\/strong> o Rio de Janeiro passa a ser <strong>sede do Império português<\/strong>. A Impressão Régia publicava as leis, decretos e atos do governo: era um instrumento para <strong>fazer o poder central chegar a todo o território<\/strong> e legitimar o novo projeto de império na América (não um mero jornal nem um meio de divulgar conquistas na Europa).<\/li><\/ul>\n<h4>Como cai no ENEM<\/h4>\n<ul><li>Documentos sobre povos indígenas, africanos e a colonização, com olhar etnocêntrico a ser reconhecido.<\/li><li>Instituições coloniais e seus fundamentos (religiosos, econômicos, de controle).<\/li><li>Diferença entre revoltas (elitistas × populares; quem queria abolir a escravidão).<\/li><li>Período joanino e a montagem do aparato do Estado no Brasil.<\/li><\/ul>\n<p><strong>Pegadinhas:<\/strong> anacronismo (\"direitos humanos\" no século XVIII); dizer que a Inconfidência queria abolir a escravidão; tratar a abertura dos portos como \"independência econômica do Brasil\".<\/p>", "resumo": [["Plantation", "Latifúndio, monocultura, escravidão, exportação"], ["Palmares e Zumbi", "Resistência quilombola; 20 de novembro"], ["Mineração", "Eixo para o Sudeste; capital no Rio (1763); quinto e derrama"], ["Inconfidência × Conjuração Baiana", "Elite, sem abolição × popular, com abolição"], ["Período joanino", "Abertura dos portos, Impressão Régia, Banco do Brasil, Reino Unido (1815)"], ["Função da Impressão Régia", "Integrar o território ao poder central e legitimar o império"]], "qs": ["HG-19", "HG-20", "HG-21", "H7.4", "H7.5"]}, {"id": "H8", "vol": "HG", "line": "H", "title": "Brasil Império (1822–1889)", "habs": "H11, H13, H22, H24", "faixa": "A", "note": "3º bloco de História no levantamento histórico.", "html": "<h4>1. Independência (1822)<\/h4>\n<ul><li><strong>Contexto:<\/strong> a <strong>Revolução do Porto (1820)<\/strong> exige a volta de D. João VI e tenta reduzir a autonomia do Brasil (\"recolonização\"). D. Pedro fica (Dia do Fico, janeiro de 1822) e declara a independência em 7 de setembro.<\/li><li><strong>Caráter conservador:<\/strong> manteve a <strong>monarquia<\/strong>, a <strong>escravidão<\/strong>, o latifúndio e a <strong>unidade territorial<\/strong>, com apoio das elites. Houve guerras de independência (na Bahia, a vitória veio em <strong>2 de julho de 1823<\/strong>).<\/li><li>Reconhecimento pela Inglaterra e por Portugal com custos (indenização e acordos comerciais).<\/li><\/ul>\n<h4>2. Primeiro Reinado (1822–1831)<\/h4>\n<ul><li><strong>Constituição de 1824<\/strong> (outorgada, imposta): <strong>Poder Moderador<\/strong> (exclusivo do imperador, acima dos outros três), <strong>voto censitário<\/strong> (por renda) e indireto, catolicismo como religião oficial.<\/li><li><strong>Confederação do Equador (1824):<\/strong> revolta republicana e federalista em Pernambuco contra a centralização. Abdicação de D. Pedro I em 1831.<\/li><\/ul>\n<h4>3. Período Regencial (1831–1840)<\/h4>\n<p>Governo de regentes enquanto D. Pedro II era menor. Descentralização (Ato Adicional de 1834) e muitas revoltas:<\/p>\n<div class=\"tw\"><table><thead><tr><th>Revolta<\/th><th>Onde<\/th><th>Quem<\/th><\/tr><\/thead><tbody><tr><td>Cabanagem (1835–1840)<\/td><td>Pará<\/td><td>População pobre, indígenas e mestiços; uma das mais sangrentas<\/td><\/tr><tr><td><strong>Revolta dos Malês (1835)<\/strong><\/td><td>Salvador<\/td><td>Africanos escravizados e libertos <strong>muçulmanos<\/strong><\/td><\/tr><tr><td>Sabinada (1837–1838)<\/td><td>Bahia<\/td><td>Camadas médias urbanas<\/td><\/tr><tr><td>Balaiada (1838–1841)<\/td><td>Maranhão<\/td><td>Sertanejos pobres e escravizados<\/td><\/tr><tr><td>Farroupilha (1835–1845)<\/td><td>Rio Grande do Sul<\/td><td>Elite estancieira (impostos sobre o charque); a mais longa<\/td><\/tr><\/tbody><\/table><\/div>\n<p>O <strong>Golpe da Maioridade (1840)<\/strong> antecipou a coroação de D. Pedro II para conter a instabilidade.<\/p>\n<h4>4. Segundo Reinado (1840–1889)<\/h4>\n<ul><li><strong>Café:<\/strong> primeiro no Vale do Paraíba (com escravizados), depois no <strong>Oeste Paulista<\/strong> (terra roxa, ferrovias, imigrantes). Base da economia e do poder político.<\/li><li><strong>1850, ano-chave:<\/strong> <strong>Lei Eusébio de Queirós<\/strong> (fim do tráfico de africanos, sob pressão britânica) e <strong>Lei de Terras<\/strong> (as terras devolutas só podiam ser obtidas por <strong>compra<\/strong>; dificultou o acesso à terra para imigrantes pobres, libertos e posseiros e consolidou o <strong>latifúndio<\/strong>).<\/li><li><strong>Imigração:<\/strong> europeus (italianos, alemães, depois japoneses, já na República) como substitutos da mão de obra escravizada; sistema de parceria e, depois, imigração subsidiada. Também havia o projeto de <strong>\"branqueamento\"<\/strong> da população.<\/li><li><strong>Guerra do Paraguai (1864–1870):<\/strong> Tríplice Aliança (Brasil, Argentina, Uruguai) contra o Paraguai; fortaleceu o Exército, endividou o Império, devastou o Paraguai.<\/li><\/ul>\n<h4>5. Abolição gradual<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Lei<\/th><th>Ano<\/th><th>O que fez<\/th><\/tr><\/thead><tbody><tr><td>Eusébio de Queirós<\/td><td>1850<\/td><td>Proíbe o tráfico atlântico<\/td><\/tr><tr><td>Ventre Livre<\/td><td>1871<\/td><td>Filhos de escravizadas nascem livres (mas podiam ficar sob tutela do senhor até os 21 anos)<\/td><\/tr><tr><td>Sexagenários (Saraiva-Cotegipe)<\/td><td>1885<\/td><td>Liberta os escravizados com mais de 60 anos (poucos chegavam a essa idade)<\/td><\/tr><tr><td><strong>Áurea<\/strong><\/td><td><strong>1888<\/strong><\/td><td>Extingue a escravidão<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>Abolicionismo:<\/strong> jornais, associações, fugas em massa organizadas, quilombos abolicionistas, artistas e intelectuais (Joaquim Nabuco, <strong>Luís Gama<\/strong>, André Rebouças, José do Patrocínio), além da ação dos próprios escravizados.<\/li><li><strong>Abolição sem reparação:<\/strong> nenhuma política de terra, educação ou trabalho para os libertos. A <strong>exclusão da população negra permaneceu<\/strong> depois de 1888: é uma <strong>permanência<\/strong> histórica.<\/li><\/ul>\n<h4>6. Cidadania no Império: a Lei Saraiva (1881)<\/h4>\n<p>Instituiu o <strong>voto direto<\/strong>, mas manteve critérios de renda e passou a <strong>exigir a alfabetização<\/strong> dos novos eleitores. Num país majoritariamente analfabeto, o eleitorado despencou (de mais de 1 milhão de votantes nos anos 1870 para pouco mais de 100 mil em 1886). A República de 1891 manteve a exclusão dos analfabetos.<\/p>\n<h4>7. Crise do Império<\/h4>\n<p>Questão religiosa, questão militar (militares fortalecidos e positivistas), <strong>abolição<\/strong> sem indenização (os ex-senhores retiraram o apoio à monarquia) e movimento republicano (Partido Republicano Paulista, 1873). <strong>Proclamação da República: 15 de novembro de 1889<\/strong>, por um golpe militar com pouca participação popular.<\/p>", "resumo": [["Independência", "Conservadora: monarquia, escravidão, unidade"], ["Constituição de 1824", "Poder Moderador; voto censitário"], ["Regência", "Muitas revoltas (Cabanagem, Malês, Farroupilha...)"], ["1850", "Fim do tráfico; Lei de Terras (terra só por compra)"], ["Abolição", "Gradual; Áurea em 1888; sem integração dos libertos"], ["Lei Saraiva", "Voto direto, mas exige alfabetização: eleitorado despenca"]], "qs": ["HG-22", "HG-23", "HG-24", "H8.4", "H8.5"]}, {"id": "H9", "vol": "HG", "line": "H", "title": "República: de 1889 a 1964", "habs": "H13, H15, H21, H22, H24", "faixa": "A", "note": "Era Vargas é presença quase garantida.", "html": "<h4>1. Primeira República (1889–1930)<\/h4>\n<ul><li><strong>República da Espada<\/strong> (Deodoro e Floriano): governos militares, instabilidade.<\/li><li><strong>Constituição de 1891:<\/strong> <strong>federalismo<\/strong> (estados com autonomia), presidencialismo, <strong>Estado laico<\/strong> (separação Igreja-Estado), voto <strong>direto, mas aberto<\/strong> (não secreto) e excluindo <strong>analfabetos<\/strong>, mendigos, praças e, na prática, mulheres.<\/li><li><strong>República Oligárquica:<\/strong><ul><li><strong>Política dos governadores:<\/strong> o presidente apoiava as oligarquias estaduais; elas garantiam deputados aliados.<\/li><li><strong>\"Café com leite\":<\/strong> alternância (não absoluta) entre São Paulo e Minas Gerais na presidência.<\/li><li><strong>Coronelismo:<\/strong> o \"coronel\" (grande proprietário) controlava os votos da sua região em troca de favores do governo: <strong>voto de cabresto<\/strong> (o eleitor votava em quem o coronel mandava, o que o voto aberto facilitava), <strong>currais eleitorais<\/strong>, fraudes (eleições \"a bico de pena\").<\/li><\/ul><\/li><li><strong>Revoltas e movimentos sociais:<\/strong><\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>Movimento<\/th><th>Ano<\/th><th>O que foi<\/th><\/tr><\/thead><tbody><tr><td><strong>Canudos<\/strong><\/td><td>1896–1897<\/td><td>Comunidade sertaneja liderada por Antônio Conselheiro, no interior da Bahia; destruída pelo Exército. Pobreza, religiosidade e concentração de terras<\/td><\/tr><tr><td><strong>Revolta da Vacina<\/strong><\/td><td>1904<\/td><td>Rio de Janeiro: reação à <strong>vacinação obrigatória<\/strong> contra a varíola e às <strong>reformas urbanas<\/strong> autoritárias (prefeito Pereira Passos), que demoliram cortiços e expulsaram pobres do centro (\"bota-abaixo\")<\/td><\/tr><tr><td><strong>Revolta da Chibata<\/strong><\/td><td>1910<\/td><td>Marinheiros, muitos deles negros, liderados por João Cândido, contra os castigos físicos na Marinha<\/td><\/tr><tr><td><strong>Contestado<\/strong><\/td><td>1912–1916<\/td><td>Divisa SC/PR: camponeses expulsos por uma ferrovia e uma madeireira estrangeiras; movimento messiânico<\/td><\/tr><tr><td>Greve geral<\/td><td>1917<\/td><td>Operários (muitos imigrantes, influência anarquista) por melhores salários e jornada<\/td><\/tr><tr><td><strong>Tenentismo<\/strong><\/td><td>anos 1920<\/td><td>Jovens oficiais contra as oligarquias (18 do Forte, Coluna Prestes)<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>Semana de Arte Moderna (1922):<\/strong> renovação cultural e busca de uma identidade nacional (ver apostila de Literatura).<\/li><\/ul>\n<h4>2. Revolução de 1930 e Era Vargas (1930–1945)<\/h4>\n<ul><li><strong>1930:<\/strong> a crise de 1929 derruba o café; ruptura do \"café com leite\"; Vargas chega ao poder com apoio de Minas, Rio Grande do Sul, Paraíba e tenentes.<\/li><li><strong>Governo Provisório (1930–1934):<\/strong> centralização; <strong>Revolução Constitucionalista (1932)<\/strong> em São Paulo; <strong>Código Eleitoral de 1932<\/strong>: <strong>voto secreto<\/strong> e <strong>voto feminino<\/strong>, Justiça Eleitoral.<\/li><li><strong>Constituição de 1934<\/strong> e governo constitucional; Intentona Comunista (1935) usada como justificativa para endurecer o regime.<\/li><li><strong>Estado Novo (1937–1945):<\/strong> ditadura. Fechamento do Congresso, <strong>censura<\/strong>, <strong>DIP<\/strong> (Departamento de Imprensa e Propaganda, criado em 1939: propaganda do regime e controle da imprensa, do rádio e do cinema; promovia uma imagem do Brasil para dentro e para fora), culto à figura de Vargas (\"pai dos pobres\"), nacionalismo.<\/li><li><strong>Trabalhismo:<\/strong> salário mínimo (1940), <strong>CLT (1943)<\/strong>, carteira de trabalho, Justiça do Trabalho. Os direitos vieram com <strong>controle<\/strong>: sindicatos atrelados ao Estado (sindicato único por categoria, imposto sindical). Trabalhadores rurais e domésticos ficaram de fora da CLT.<\/li><li><strong>Indústria de base e nacionalismo econômico:<\/strong> Companhia Siderúrgica Nacional (Volta Redonda), Vale do Rio Doce.<\/li><li>Fim do Estado Novo em 1945, com a vitória das democracias na 2ª Guerra expondo a contradição de uma ditadura que lutara contra o fascismo.<\/li><\/ul>\n<h4>3. República de 1946 (1946–1964)<\/h4>\n<ul><li><strong>Dutra<\/strong> (1946–1951): alinhamento aos EUA na Guerra Fria.<\/li><li><strong>Vargas eleito<\/strong> (1951–1954): nacionalismo (<strong>\"O petróleo é nosso\"<\/strong>, criação da <strong>Petrobras, 1953<\/strong>). Crise política com a oposição da UDN (Carlos Lacerda) e de setores militares; o <strong>atentado da Rua Tonelero<\/strong> (agosto de 1954), contra Lacerda, atribuído a membros da guarda pessoal de Vargas, aprofundou a crise. Vargas se suicida em <strong>24 de agosto de 1954<\/strong>, deixando a <strong>carta-testamento<\/strong>; a comoção popular adiou a queda do grupo trabalhista.<\/li><li><strong>JK<\/strong> (1956–1961): <strong>Plano de Metas<\/strong> (\"50 anos em 5\"), indústria automobilística com capital estrangeiro, <strong>Brasília (1960)<\/strong>, rodovias; inflação e endividamento.<\/li><li><strong>Jânio<\/strong> (1961): renuncia em menos de sete meses.<\/li><li><strong>Jango<\/strong> (1961–1964): parlamentarismo provisório; <strong>reformas de base<\/strong> (agrária, urbana, educacional, eleitoral); polarização; golpe civil-militar em <strong>1964<\/strong>.<\/li><\/ul>", "resumo": [["Constituição de 1891", "Federalismo, Estado laico, voto aberto, analfabetos excluídos"], ["Coronelismo", "Voto de cabresto, currais eleitorais"], ["Revolta da Vacina", "Vacina obrigatória + reformas urbanas autoritárias"], ["1932", "Voto secreto e feminino"], ["Estado Novo", "Ditadura, DIP, censura, CLT com sindicatos controlados"], ["1954", "Crise, atentado da Rua Tonelero, suicídio de Vargas"], ["JK", "Plano de Metas, Brasília, capital estrangeiro"]], "qs": ["HG-25", "HG-26", "HG-27", "H9.4", "H9.5"]}, {"id": "H10", "vol": "HG", "line": "H", "title": "Ditadura militar e redemocratização (1964 até hoje)", "habs": "H2, H10, H13, H21, H22, H24", "faixa": "B", "note": "", "html": "<h4>1. Golpe e regime (1964–1985)<\/h4>\n<ul><li><strong>Golpe civil-militar<\/strong> (31 de março a 1º de abril de 1964), com apoio de setores empresariais, da imprensa, da Igreja, de parte da classe média e dos EUA, em nome do anticomunismo.<\/li><li><strong>Atos Institucionais:<\/strong> AI-1 (cassações), <strong>AI-2 (1965)<\/strong>: bipartidarismo (<strong>ARENA<\/strong>, governista, e <strong>MDB<\/strong>, oposição consentida) e eleições indiretas para presidente.<\/li><li><strong>AI-5 (13 de dezembro de 1968):<\/strong> o mais duro. Fechamento do Congresso, suspensão do <strong>habeas corpus<\/strong> para crimes políticos, cassações, <strong>censura<\/strong> prévia. Abriu o período de maior repressão: <strong>tortura<\/strong>, mortes e <strong>desaparecimentos<\/strong> de opositores, exílio.<\/li><li><strong>Resistência:<\/strong> movimento estudantil (Passeata dos Cem Mil, 1968), guerrilhas, artistas (canções de protesto, teatro), imprensa alternativa, setores da Igreja.<\/li><li><strong>\"Milagre econômico\" (1968–1973):<\/strong> crescimento alto do PIB com <strong>arrocho salarial<\/strong>, <strong>concentração de renda<\/strong> (\"fazer o bolo crescer para depois dividir\") e aumento da <strong>dívida externa<\/strong>. Grandes obras (Transamazônica, Itaipu, ponte Rio-Niterói). O choque do petróleo de 1973 encerrou o \"milagre\".<\/li><li><strong>Abertura \"lenta, gradual e segura\"<\/strong> (Geisel e Figueiredo): fim do AI-5 (1978), <strong>Lei da Anistia (1979)<\/strong> (que anistiou presos e exilados, mas também agentes da repressão), volta do pluripartidarismo (1979), <strong>greves do ABC<\/strong> (1978–1980, novo sindicalismo).<\/li><li><strong>Diretas Já (1984):<\/strong> grande campanha popular por eleições diretas; a emenda foi derrotada, e <strong>Tancredo Neves<\/strong> foi eleito pelo <strong>Colégio Eleitoral<\/strong> (indireto) em 1985. Morreu antes da posse; assumiu <strong>José Sarney<\/strong>.<\/li><\/ul>\n<h4>2. Constituição de 1988 (\"Constituição Cidadã\")<\/h4>\n<ul><li><strong>Direitos políticos:<\/strong> voto direto e secreto; voto <strong>facultativo<\/strong> para analfabetos, jovens de 16 e 17 anos e maiores de 70.<\/li><li><strong>Direitos sociais:<\/strong> saúde universal (<strong>SUS<\/strong>), educação, previdência, assistência; direitos trabalhistas ampliados (incluindo trabalhadores rurais).<\/li><li><strong>Racismo<\/strong> como crime inafiançável e imprescritível.<\/li><li><strong>Povos indígenas:<\/strong> direito originário às terras que tradicionalmente ocupam, com demarcação pela União.<\/li><li><strong>Quilombolas:<\/strong> direito à propriedade definitiva das terras que ocupam (art. 68 do Ato das Disposições Constitucionais Transitórias).<\/li><li><strong>Função social da propriedade:<\/strong> a terra que não cumpre a função social (produtividade, respeito ao meio ambiente e às leis trabalhistas) pode ser <strong>desapropriada<\/strong> para reforma agrária.<\/li><li><strong>Meio ambiente<\/strong> ecologicamente equilibrado como direito de todos.<\/li><li>Proteção à criança e ao adolescente (base do ECA, de 1990), à pessoa idosa, à pessoa com deficiência.<\/li><\/ul>\n<h4>3. Nova República<\/h4>\n<p>Primeira eleição direta para presidente desde 1960 (1989); <strong>impeachment de Collor (1992)<\/strong>, com mobilização dos \"caras-pintadas\"; <strong>Plano Real (1994)<\/strong> e controle da inflação; programas de transferência de renda; <strong>Comissão Nacional da Verdade (2012–2014)<\/strong>, que investigou as violações de direitos humanos da ditadura e é um marco das <strong>políticas de memória<\/strong>.<\/p>\n<h4>Como cai no ENEM<\/h4>\n<ul><li>Documentos da ditadura (atos institucionais, letras censuradas, relatos de presos) e a pergunta sobre o <strong>instrumento de repressão<\/strong> ou a forma de resistência.<\/li><li>Constituição de 1988 e a <strong>ampliação da cidadania<\/strong>.<\/li><li>Memória, verdade e reparação (relaciona-se com H1).<\/li><\/ul>", "resumo": [["AI-2", "Bipartidarismo (ARENA × MDB)"], ["AI-5", "Fecha o Congresso, suspende habeas corpus, censura prévia"], ["Milagre", "Crescimento + concentração de renda + dívida"], ["Anistia (1979)", "Presos e exilados, mas também torturadores"], ["Diretas Já", "Derrotada; eleição indireta de Tancredo"], ["Constituição de 1988", "SUS, racismo crime, terras indígenas e quilombolas, função social"]], "qs": ["HG-28", "HG-29", "HG-30", "H10.4", "H10.5"]}, {"id": "G1", "vol": "HG", "line": "G", "title": "Cartografia e geotecnologias", "habs": "H6, H26", "faixa": "C", "note": "mas a leitura de mapas e gráficos (H6) atravessa toda a prova.", "html": "<h4>1. Escala<\/h4>\n<ul><li><strong>Escala numérica<\/strong> 1 : 50 000 → 1 cm no mapa = 50 000 cm = <strong>500 m<\/strong> no real.<\/li><li><strong>Escala grande<\/strong> (denominador pequeno, como 1 : 10 000): mostra área pequena com <strong>muito detalhe<\/strong> (planta de bairro). <strong>Escala pequena<\/strong> (denominador grande, como 1 : 50 000 000): área grande, pouco detalhe (mapa-múndi).<\/li><li>Conta típica: distância real = distância no mapa × denominador. Converta: 100 000 cm = 1 km.<\/li><\/ul>\n<h4>2. Coordenadas, fusos e projeções<\/h4>\n<ul><li><strong>Latitude:<\/strong> distância ao Equador (0° a 90° N ou S). <strong>Longitude:<\/strong> distância ao meridiano de Greenwich (0° a 180° L ou O).<\/li><li><strong>Fusos horários:<\/strong> 360° ÷ 24 h = 15° por hora. A leste, as horas estão <strong>adiantadas<\/strong>; a oeste, <strong>atrasadas<\/strong>. Brasília fica em UTC−3 (o Brasil tem quatro fusos e, desde 2019, não adota horário de verão).<\/li><li><strong>Projeções:<\/strong> nenhuma representa a Terra sem distorções.<\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>Projeção<\/th><th>Preserva<\/th><th>Distorce<\/th><th>Uso e crítica<\/th><\/tr><\/thead><tbody><tr><td><strong>Mercator<\/strong> (cilíndrica, conforme)<\/td><td><strong>Formas<\/strong> e ângulos (útil à navegação)<\/td><td><strong>Áreas<\/strong> perto dos polos (a Groenlândia parece do tamanho da África, que é cerca de 14 vezes maior)<\/td><td>Criticada por \"aumentar\" o hemisfério Norte e a Europa: <strong>eurocentrismo<\/strong><\/td><\/tr><tr><td><strong>Peters<\/strong> (equivalente)<\/td><td><strong>Áreas<\/strong><\/td><td>Formas (continentes \"esticados\")<\/td><td>Proposta para dar a dimensão real aos países do Sul<\/td><\/tr><tr><td>Azimutal<\/td><td>Distâncias ou direções a partir de um ponto<\/td><td>Bordas<\/td><td>Mapa da ONU (centrado no polo)<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout\"><strong>Mapas não são neutros.<\/strong> Escolhem o centro, a projeção, o que mostrar e o que omitir. Ao longo da história, serviram à <strong>dominação<\/strong>: conhecer e representar um território é uma forma de controlá-lo.<\/div>\n<h4>3. Representações temáticas<\/h4>\n<ul><li><strong>Anamorfose:<\/strong> o tamanho de cada país é proporcional a uma variável (população, PIB, emissões), não à área.<\/li><li><strong>Mapas de fluxo<\/strong> (setas), <strong>coropléticos<\/strong> (cores por faixa de valor), <strong>isolinhas<\/strong> (curvas de nível no relevo; isotermas; isoietas).<\/li><li><strong>Climograma:<\/strong> barras de chuva + linha de temperatura ao longo do ano. Leia a estação seca, a amplitude térmica e o hemisfério.<\/li><\/ul>\n<h4>4. Geotecnologias<\/h4>\n<ul><li><strong>Sensoriamento remoto:<\/strong> imagens de <strong>satélite<\/strong> usadas para monitorar <strong>desmatamento<\/strong> e <strong>queimadas<\/strong> (no Brasil, os sistemas do Inpe), safras, expansão urbana, poluição atmosférica, previsão do tempo.<\/li><li><strong>GPS<\/strong> (sistema de posicionamento por satélites) e <strong>SIG<\/strong> (sistemas de informação geográfica, que cruzam dados em camadas).<\/li><li>Usos sociais: planejamento urbano, prevenção de desastres, demarcação de terras indígenas, pesquisas acadêmicas.<\/li><\/ul>", "resumo": [["Escala grande", "Pouca área, muito detalhe"], ["1 : 100 000", "1 cm = 1 km"], ["Fuso", "15° = 1 hora; leste adiantado"], ["Mercator", "Preserva formas; distorce áreas; eurocêntrico"], ["Peters", "Preserva áreas"], ["Sensoriamento remoto", "Satélites monitoram desmatamento e queimadas"]], "qs": ["HG-31", "HG-32", "HG-33", "G1.4", "G1.5"]}, {"id": "G2", "vol": "HG", "line": "G", "title": "Geologia, relevo e solos", "habs": "H26, H27, H29", "faixa": "C", "note": "(é a \"Geografia física\" do levantamento: 11%).", "html": "<h4>1. Estrutura da Terra e placas tectônicas<\/h4>\n<ul><li>Camadas: crosta, manto, núcleo. A crosta é dividida em <strong>placas tectônicas<\/strong>, que se movem sobre o manto.<\/li><li><strong>Limites convergentes:<\/strong> placas se chocam. Quando uma placa oceânica (mais densa) mergulha sob outra, ocorre <strong>subducção<\/strong>: forma cordilheiras e fossas e causa <strong>terremotos e vulcões<\/strong>. Exemplo: placa de Nazca sob a Sul-Americana → <strong>Andes<\/strong>, terremotos frequentes no Chile e no Peru.<\/li><li><strong>Limit
