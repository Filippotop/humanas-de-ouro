<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Estudo interativo de Ciências Humanas para o ENEM: História, Geografia, Filosofia e Sociologia, com provas oficiais.">
<meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1120" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Humanas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>window.__PWA=true;</script>
<title>Humanas de Ouro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a transit map of Humanas. Four lines (História, Geografia, Filosofia, Sociologia), each module a station. Gold marks what matters today. */
:root{
  --scale:1;
  --bg:#F2F3F7; --surface:#FFFFFF; --sunk:#E8EAF1; --ink:#141A2E; --muted:#5A6079; --rule:#D7DBE6;
  --gold:#8F6300; --gold-soft:#F6E7C1; --gold-ink:#3D2A00;
  --h:#C33A33; --g:#1F7F55; --f:#3150C8; --s:#8A3BAE; --rd:#0E7C86;
  --ok:#1E7A4A; --ok-soft:#DDF1E5; --bad:#B3261E; --bad-soft:#F9DEDB; --warn:#A35F00; --warn-soft:#FCEBD0;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --read:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --on-color:#fff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1120; --surface:#171B2D; --sunk:#1F2439; --ink:#E8EAF3; --muted:#9BA1BA; --rule:#2B3150;
  --gold:#E8B53E; --gold-soft:#3A2F12; --gold-ink:#F7E3B0;
  --h:#F2665E; --g:#3FBF85; --f:#7A93FF; --s:#C383EA; --rd:#3CC4CC;
  --ok:#4CC787; --ok-soft:#163626; --bad:#FF7A70; --bad-soft:#3E1A1A; --warn:#F2A640; --warn-soft:#3A2A10; --on-color:#0E1120;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#171B2D; --sunk:#1F2439; --ink:#E8EAF3; --muted:#9BA1BA; --rule:#2B3150;
  --gold:#E8B53E; --gold-soft:#3A2F12; --gold-ink:#F7E3B0;
  --h:#F2665E; --g:#3FBF85; --f:#7A93FF; --s:#C383EA; --rd:#3CC4CC;
  --ok:#4CC787; --ok-soft:#163626; --bad:#FF7A70; --bad-soft:#3E1A1A; --warn:#F2A640; --warn-soft:#3A2A10; --on-color:#0E1120;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.01em;cursor:pointer;background:none;border:0;padding:0}
.brand .dot{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--h) 0 25%,var(--g) 0 50%,var(--f) 0 75%,var(--s) 0);box-shadow:inset 0 0 0 5px var(--surface)}
.brand em{font-style:normal;color:var(--gold)}
.count{margin-left:auto;font-family:var(--mono);font-size:12px;background:var(--gold-soft);color:var(--gold-ink);padding:5px 10px;border-radius:999px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:7px 12px;border-radius:999px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer}
nav.tabs button[aria-current="true"]{background:var(--ink);color:var(--surface)}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current="true"]:hover{color:var(--surface)}
main{padding-block:22px 80px}
.sync{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* generic */
.btn{border:1px solid var(--rule);background:var(--surface);padding:9px 14px;border-radius:999px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip.A{background:var(--gold-soft);color:var(--gold-ink);font-weight:600}
.lc-H{--lc:var(--h)} .lc-G{--lc:var(--g)} .lc-F{--lc:var(--f)} .lc-S{--lc:var(--s)} .lc-R{--lc:var(--rd)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px;flex-wrap:wrap}
.sec-title h2{font-size:22px;font-weight:800;letter-spacing:-.01em}

/* hero / mission */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.hero>*{min-width:0}
.mission h2{font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.08}
.mission p.lead{font-family:var(--read);font-size:16px;color:var(--muted);max-width:56ch;margin:8px 0 14px}
.tasks{display:grid;gap:8px}
.task{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.task:hover{border-color:var(--ink)}
.task .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:12px;color:var(--on-color);background:var(--lc,var(--gold))}
.task b{display:block;font-size:15px}
.task small{color:var(--muted);font-size:13px}
.task.done{opacity:.55}
.task .go{font-family:var(--mono);font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px}
.stat .n{font-family:var(--mono);font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat .bar2{height:5px;border-radius:3px;background:var(--sunk);margin-top:8px;overflow:hidden}
.stat .bar2 i{display:block;height:100%;background:var(--gold)}

/* metro */
.line{margin-bottom:14px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px 0 10px}
.line-head{display:flex;align-items:center;gap:10px;padding:0 16px 6px;flex-wrap:wrap}
.line-head .badge{width:28px;height:28px;border-radius:7px;background:var(--lc);color:var(--on-color);display:grid;place-items:center;font-family:var(--mono);font-weight:600}
.line-head h3{font-size:17px;font-weight:800}
.line-head .pct{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.track{overflow-x:auto;padding:4px 16px 4px}
.stations{position:relative;display:flex;gap:0;min-width:max-content;padding-top:8px}
.stations::before{content:"";position:absolute;left:44px;right:44px;top:22px;height:6px;border-radius:3px;background:var(--lc);opacity:.9}
.st{position:relative;width:88px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:0 2px 6px;text-align:center}
.st .c{width:26px;height:26px;border-radius:50%;background:var(--surface);border:5px solid var(--lc);position:relative;z-index:1;transition:transform .15s}
.st:hover .c{transform:scale(1.15)}
.st.part .c{background:linear-gradient(90deg,var(--lc) 50%,var(--surface) 50%)}
.st.done .c{background:var(--lc)}
.st.weak .c{box-shadow:0 0 0 3px var(--bad)}
.st.strong .c{box-shadow:0 0 0 3px var(--ok)}
.st .code{font-family:var(--mono);font-size:11px;font-weight:600}
.st .t{font-size:11.5px;line-height:1.2;color:var(--muted);max-width:84px}
.st .fa{position:absolute;top:-4px;right:18px;z-index:2;font-family:var(--mono);font-size:9px;font-weight:600;background:var(--gold);color:var(--bg);border-radius:4px;padding:1px 4px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:4px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:50%;border:3px solid var(--muted);display:inline-block}

/* module */
.mod-head{border-left:6px solid var(--lc);padding:4px 0 4px 16px;margin-bottom:16px}
.mod-head h1{font-size:clamp(26px,4.5vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.mod-head .note{font-family:var(--read);color:var(--muted);margin-top:6px;max-width:70ch}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;margin-bottom:12px;font-family:var(--mono);font-size:12px}
.subtabs{display:flex;gap:6px;border-bottom:1px solid var(--rule);margin-bottom:18px;overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.subtabs button[aria-current="true"]{color:var(--ink);border-color:var(--lc,var(--gold))}
.prose{font-family:var(--read);font-size:calc(17px*var(--scale));line-height:1.62;max-width:70ch}
.prose h4{font-family:var(--display);font-size:19px;font-weight:800;margin:28px 0 8px;letter-spacing:-.01em}
.prose p{margin:0 0 12px}
.prose ul,.prose ol{padding-left:22px;margin:0 0 14px}
.prose li{margin-bottom:6px}
.prose strong{font-weight:600}
.prose blockquote{margin:12px 0;padding:12px 16px;background:var(--sunk);border-radius:8px;font-size:calc(16px*var(--scale))}
.prose blockquote p{margin:0 0 4px}
.prose .src{font-size:13px;color:var(--muted);text-align:right;font-style:italic}
.callout{background:var(--gold-soft);color:var(--gold-ink);border-radius:8px;padding:12px 16px;margin:14px 0;font-family:var(--display);font-size:15px;line-height:1.5}
.tw{overflow-x:auto;margin:12px 0 18px;max-width:100%}
table{border-collapse:collapse;font-family:var(--display);font-size:14px;line-height:1.4;min-width:100%}
th{background:var(--ink);color:var(--surface);text-align:left;padding:8px 10px;font-weight:600}
td{border-bottom:1px solid var(--rule);padding:8px 10px;vertical-align:top}
.prose .tw{max-width:min(100%,900px)}
.layout2{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px;align-items:start}
.side{position:sticky;top:120px;display:grid;gap:10px}
.toc a{display:block;color:var(--muted);text-decoration:none;font-size:13px;padding:4px 0;border-left:2px solid var(--rule);padding-left:10px}
.toc a:hover{color:var(--ink);border-color:var(--lc)}

/* resumo flip cards */
.flipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.flip{perspective:900px;border:0;background:none;padding:0;cursor:pointer;min-height:120px;text-align:left}
.flip .in{position:relative;height:100%;min-height:120px;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fa1,.flip .fa2{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.flip .fa1{background:var(--surface);border:1px solid var(--rule);border-top:4px solid var(--lc)}
.flip .fa1 b{font-size:17px;font-weight:800}
.flip .fa2{background:var(--ink);color:var(--surface);transform:rotateY(180deg);font-family:var(--read);font-size:15.5px}
@media (prefers-reduced-motion:reduce){.flip .in{transition:none}}

/* question */
.q{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:18px;margin-bottom:16px}
.q .qh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.q .qh b{font-weight:800}
.q blockquote{font-family:var(--read);font-size:calc(16.5px*var(--scale));line-height:1.55;background:var(--sunk);margin:0 0 12px;padding:12px 16px;border-radius:8px}
.q blockquote p{margin:0 0 6px}
.q .qsrc{font-family:var(--read);font-size:12.5px;color:var(--muted);font-style:italic;margin:-4px 0 12px;text-align:right}
.q .cmd{font-family:var(--read);font-size:calc(17px*var(--scale));font-weight:600;margin:0 0 12px;line-height:1.45}
.alts{display:grid;gap:8px}
.alt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer;font-family:var(--read);font-size:calc(16px*var(--scale));line-height:1.4}
.alt:hover:not(:disabled){border-color:var(--ink)}
.alt .L{font-family:var(--mono);font-weight:600;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-size:13px}
.alt:disabled{cursor:default}
.alt.picked{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.alt.right{border-color:var(--ok);background:var(--ok-soft)}
.alt.right .L{background:var(--ok);color:var(--on-color)}
.alt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.alt.wrong .L{background:var(--bad);color:var(--on-color)}
.alt.dim{opacity:.55}
.alt .old{font-family:var(--mono);font-size:10.5px;color:var(--bad);display:block;margin-top:4px}
.fb{margin-top:12px;border-radius:8px;padding:12px 14px;font-size:14.5px}
.fb.trap{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn)}
.fb.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fb.no{background:var(--bad-soft);border-left:4px solid var(--bad)}
.ex{display:grid;gap:6px;margin-top:12px}
.ex div{display:grid;grid-template-columns:30px 1fr;gap:8px;font-family:var(--read);font-size:calc(15px*var(--scale));line-height:1.45;padding:8px 10px;border-radius:6px;background:var(--sunk)}
.ex div.c{background:var(--ok-soft)}
.ex .L{font-family:var(--mono);font-weight:600}
.ex .tg{display:inline-block;font-family:var(--mono);font-size:10.5px;background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px}
.tutor-out{font-family:var(--read);font-size:15.5px;line-height:1.55;white-space:pre-wrap;background:var(--gold-soft);color:var(--gold-ink);border-radius:8px;padding:12px 14px;margin-top:10px}
.tutor-only{display:none}
body.has-tutor .tutor-only{display:revert}
body.has-tutor .tutor-only.row{display:flex}
textarea{width:100%;min-height:90px;font:inherit;font-family:var(--read);font-size:16px;padding:12px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);resize:vertical}

/* arena */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.game{text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:170px}
.game:hover{border-color:var(--ink)}
.game .gi{font-family:var(--mono);font-size:12px;color:var(--gold)}
.game h3{font-size:19px;font-weight:800}
.game p{margin:0;color:var(--muted);font-size:14px;font-family:var(--read)}
.game .best{margin-top:auto;font-family:var(--mono);font-size:12px}
.stage{max-width:720px;margin:0 auto}
.timer{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin:10px 0 16px}
.timer i{display:block;height:100%;background:var(--gold);width:100%}
.prompt{font-family:var(--read);font-size:calc(20px*var(--scale));line-height:1.45;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:20px;margin-bottom:12px}
.prompt .k{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:14px;font-weight:600;cursor:pointer;text-align:left}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.score{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--muted)}
.big{font-family:var(--mono);font-size:56px;font-weight:600;letter-spacing:-.03em}
.card3{min-height:200px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}
.card3 .ans{margin-top:14px;padding-top:14px;border-top:1px dashed var(--rule);color:var(--ink)}
.boxes{display:flex;gap:6px;justify-content:center;margin:10px 0}
.boxes span{font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:6px;background:var(--sunk)}

/* recal */
.recal-grid{display:grid;gap:16px}
.rc-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.como{margin-top:12px;font-family:var(--read);font-size:16px;line-height:1.55;background:var(--gold-soft);color:var(--gold-ink);border-radius:8px;padding:12px 14px}
.done-mark{font-family:var(--mono);font-size:11px;color:var(--ok)}

/* sim */
.simnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.simnav button{width:34px;height:34px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);font-family:var(--mono);font-size:12px;cursor:pointer}
.simnav button.a{background:var(--ink);color:var(--surface)}
.simnav button.cur{outline:2px solid var(--gold)}
.simnav button.r{background:var(--ok-soft);border-color:var(--ok)}
.simnav button.w{background:var(--bad-soft);border-color:var(--bad)}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice button{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}
.choice button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* painel */
.heat{display:grid;gap:10px}
.heat .hl{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center}
.heat .cells{display:flex;gap:5px;flex-wrap:wrap}
.cell{width:44px;height:38px;border-radius:6px;border:0;font-family:var(--mono);font-size:11px;font-weight:600;cursor:pointer;background:var(--sunk);color:var(--muted)}
.cell.p0{background:var(--bad);color:var(--on-color)}.cell.p1{background:var(--warn);color:var(--on-color)}.cell.p2{background:var(--ok);color:var(--on-color)}
.bars{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:150px 1fr 52px;gap:10px;align-items:center;font-size:14px}
.brow .track2{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden;position:relative}

      <button data-v="plano"><span class="ni" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span><span class="nl">Plano</span></button>
      <button data-v="painel"><span class="ni" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/></svg></span><span class="nl">Painel</span></button>
    </nav>

</header>
<div class="pop" id="pop" hidden role="dialog" aria-label="Painel rápido"></div>
<button class="simpill" id="simpill" hidden></button>
<button class="totop" id="totop" hidden aria-label="Voltar ao topo">↑ topo</button>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script src="data/base.js"></script>
<script>
const DATA = window.DATA;
/* Aprofundamentos (data/aprofundamento-*.js): teoria extra no fim do módulo e questões novas na contagem. */
function applyDeep(){ Object.entries(DATA.deep||{}).forEach(([id,d])=>{ const m=DATA.modules.find(x=>x.id===id); if(!m) return; if(d.html) m.html+=d.html; (d.questions||[]).forEach(q=>{ DATA.questions.push(q); m.qs.push(q.id); }); }); }
applyDeep();
const STUDY_LINES = ['F','S','H','G'];
const EXAM = new Date('2026-11-08T13:30:00-03:00');
const LINES = {H:{name:'História',vol:'HG'},G:{name:'Geografia',vol:'HG'},F:{name:'Filosofia',vol:'FS'},S:{name:'Sociologia',vol:'FS'},R:{name:'Redação',vol:'RD'}};
const ERRMOD = {G9:'46',G5:'67',H3:'69',H7:'83',H5:'90',F5:'50 e 76',F7:'66',F6:'79',S4:'81'};
const DIAG = {HG:{ok:24,n:29,label:'História e Geografia'},FS:{ok:11,n:16,label:'Filosofia e Sociologia'}};
const TRAPS = {
  oposto:{name:'Termo oposto',tip:'Essa alternativa diz o contrário do texto ou do comando. Troque-a pelo seu contrário: se o contrário combina mais com o texto, ela está errada.'},
  autor:{name:'Autor errado',tip:'A ideia existe, mas é de outro pensador. Volte à referência do texto: de quem é o trecho?'},
  anacronismo:{name:'Anacronismo',tip:'Aplica ao passado ideias, técnicas ou intenções de outra época.'},
  detalhe:{name:'Detalhe verdadeiro',tip:'É verdade sobre o tema, mas não responde ao que o comando pergunta.'},
  exagero:{name:'Exagero',tip:'Vai além do que o texto autoriza (uma medida pontual não resolve tudo).'}
};
const Q = Object.fromEntries(DATA.questions.map(q=>[q.id,q]));
const M = Object.fromEntries(DATA.modules.map(m=>[m.id,m]));
const $ = (s,el=document)=>el.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = h => { const d=document.createElement('div'); d.innerHTML=h; return d.textContent; };
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const today = () => { const d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); };
const addDays = n => { const d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); };
const pct = (a,b) => b? Math.round(100*a/b) : 0;

/* ---------- state ---------- */
const KEY='humanas-de-ouro-v1';
let S = {v:1, ans:{}, cards:{}, read:{}, best:{}, sims:[], recal:{}, vf:{}, notes:{}, plan:{}, rep:{}, marks:{}, chute:{}, redo:{}, snotes:{}, act:{}, pv:{}, updated:0};
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw)); }catch(e){}
function fix(){ ['vf','notes','plan','rep','recal','best','cards','read','ans','marks','chute','redo','snotes','act','pv','red'].forEach(k=>{ if(!S[k]||typeof S[k]!=='object') S[k]={}; }); if(!Array.isArray(S.sims)) S.sims=[]; }
fix();
let dbRef=null, saveTimer=null, saving=false, dirty=false;
function save(){
  S.updated=Date.now();
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
  dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,1200);
}
async function flush(){
  if(!dbRef||saving||!dirty) return;
  saving=true; dirty=false;
  try{ await dbRef.set(JSON.parse(JSON.stringify(S))); setSync('salvo na sua conta'); }
  catch(e){ setSync('salvo neste aparelho'); }
  saving=false; if(dirty) flush();
}
function setSync(t){ $('#sync').textContent=t; }
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbRef=db.doc('progresso/'+id);
    const snap=await dbRef.get();
    if(snap.exists){ const r=snap.data(); if(r && (r.updated||0)>(S.updated||0)){ S=Object.assign(S,r); fix(); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} render(); } else if((S.updated||0)>(r.updated||0)){ dirty=true; flush(); } }
    else if(S.updated){ dirty=true; flush(); }
    setSync('salvo na sua conta');
  }catch(e){}
})();
let sample=null;
(async()=>{ try{ if(window.claude&&window.claude.use){ sample=await window.claude.use('sample'); document.body.classList.toggle('has-tutor',!!sample); } }catch(e){} })();

function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2200); }

/* ---------- derived ---------- */
function modStats(mid){
  const m=M[mid]; let done=0, ok=0;
  m.qs.forEach(id=>{ const a=S.ans[id]; if(a){done++; if(a.ok) ok++;} });
  return {done, ok, n:m.qs.length, read:!!S.read[mid]};
}
function lineStats(L){
  let done=0,ok=0,n=0; DATA.modules.filter(m=>m.line===L).forEach(m=>{const s=modStats(m.id); done+=s.done; ok+=s.ok; n+=s.n;});
  return {done,ok,n};
}
function volStats(vol){
  let done=0,ok=0; DATA.questions.filter(q=>q.vol===vol).forEach(q=>{const a=S.ans[q.id]; if(a){done++; if(a.ok) ok++;}});
  return {done,ok};
}
function dueCards(vol){ const t=today(); return DATA.cards.filter(c=>(!vol||c.vol===vol) && (!S.cards[c.id] || S.cards[c.id].due<=t)); }
/* Modo Dia 1: o dia 2 fica guardado até 72/90 no dia 1 de 2024 (inteiro, cronometrado), até 9/11 ou até a liberação manual. */
const DIA2_META=72, DIA2_DATA='2026-11-09';
function dia2Best(){ const rs=pvState('24d1').runs.filter(r=>r.done&&r.mode==='prova'&&r.areas==='LH'); return rs.length?Math.max(...rs.map(r=>scoreRun('24d1',r).ok)):null; }
function dia2Status(){ const best=dia2Best();
  if(best!=null&&best>=DIA2_META) return {open:true,via:'criterio',best};
  if(S.dia2&&S.dia2.via) return {open:true,via:'manual',best};
  if(isoToday()>=DIA2_DATA) return {open:true,via:'data',best};
  return {open:false,via:null,best}; }
function unlockDia2(){ S.dia2={t:Date.now(),via:'manual'}; save(); }
function examTarget(){ return Date.now()<Date.parse('2026-11-08T19:00:00-03:00') ? EXAM : new Date('2026-11-15T13:30:00-03:00'); }
function daysLeft(){ const n=new Date(), t=examTarget(); const a=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()); const b=Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()); return Math.max(0,Math.round((b-a)/86400000)); }
function priority(m){
  if(m.line==='R') return -99;
  const s=modStats(m.id);
  let p={A:3,B:2,C:1}[m.faixa];
  if(ERRMOD[m.id]) p+=2;
  if(m.vol==='FS') p+=1.5;
  if(s.done===s.n){ if(s.ok/s.n<0.67) p+=2.5; else p-=10; }
  if(s.read && s.done<s.n) p+=1;
  return p;
}
function nextModules(k){ return DATA.modules.slice().sort((a,b)=>priority(b)-priority(a)).filter(m=>priority(m)>-5).slice(0,k); }

/* ---------- router ---------- */
let view='linhas', param=null;
function go(v,p){ view=v; param=p||null; if(v==='mod'&&param){ lsSet('humanas-last',{id:param.id,tab:param.tab||'teoria',t:Date.now()}); } closePop(); render(); window.scrollTo({top:0}); }
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) go(b.dataset.v);});
$('#brand').addEventListener('click',()=>go('linhas'));
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current', String(b.dataset.v===view || (view==='mod'&&b.dataset.v===((M[param&&param.id]||{}).line==='R'?'redacao':'linhas')) || (view==='game'&&b.dataset.v==='arena') || ((view==='prova'||view==='provares'||view==='papel')&&b.dataset.v==='provas'))));
  if(view!=='prova' && typeof pvTimer!=='undefined') clearInterval(pvTimer);
  document.body.dataset.view=view;
  if(view!=='game') clearInterval(gameTimer);
  $('#readbar').hidden=true; updateGoal();
  const d=daysLeft(), dd=examTarget().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); $('#count').textContent = d===1? `falta 1 dia · ${dd}` : `faltam ${d} dias · ${dd}`;
  ({linhas:vLinhas,mod:vMod,arena:vArena,game:vGame,biblioteca:vBib,treino:vTreino,plano:vPlano,painel:vPainel,busca:vBusca,provas:vProvas,prova:vProva,provares:vProvaRes,papel:vPapel,redacao:vRedacao}[view])();
}

/* ---------- LINHAS ---------- */
function vLinhas(){
  const nm=nextModules(2); const due=dueCards().length; const pday=planToday();
  const rc=DATA.recal.find(r=>!S.recal[r.vol+r.num]);
  const tasks=[];
  if(dia2Status().open) { const r25=allRuns('25d2'); const cur=pvState('25d2').runs.find(r=>!r.done); const doneAreas=r25.filter(runReal).map(r=>r.areas).join(''); const miss=['N','M'].filter(a=>!doneAreas.includes(a));
    if(miss.length) tasks.push({ic:'!',t:cur?'Continuar o ENEM 2025 · 2º dia':`Diagnóstico pendente: ENEM 2025 · ${miss.map(a=>AREAS[a].name).join(' e ')}`,s:cur?`${Object.keys(cur.ans).length} questões respondidas · o cronômetro continua correndo`:'A prova oficial está dentro do app, com cartão-resposta e correção. É a tarefa mais importante da semana.',act:()=> cur? go('prova',{id:'25d2',run:pvState('25d2').runs.indexOf(cur)}) : go('provas')});
    if(miss.length) tasks.push({ic:'✎',t:'Fez a prova no papel? Lance as respostas',s:'Marque as letras no cartão-resposta e o app corrige pelo gabarito oficial, como se você tivesse feito aqui.',act:()=>go('papel',{id:'25d2',areas:miss.join('')})}); }
  else { const b=dia2Status().best; tasks.push({ic:'★',t:'Simulado do dia 1 de 2024 · dom 1/11, 13h30',s:b==null?`É a chave do dia 2: ${DIA2_META}/90, inteiro e cronometrado (5h30), libera. Até lá, não abra essa prova.`:`Seu melhor: ${b}/90. Meta para liberar o dia 2: ${DIA2_META}/90.`,act:()=>go('provas')}); }
  { const w=Object.values(S.ans).filter(a=>!a.ok); const au=w.filter(a=>a.trap==='autor').length;
    { const rd=(S.red&&Array.isArray(S.red.drafts)?S.red.drafts:[]).filter(d=>d.done).map(d=>d.end||0); const last=rd.length?Math.max(...rd):0; const dd=last?Math.floor((Date.now()-last)/864e5):null;
      if(dd==null||dd>=4) tasks.push({ic:'✍',t:dd==null?'Redação: você ainda não escreveu nenhuma aqui':`Redação: ${dd} dias sem escrever`,s:'Até 1.000 pontos dependem de treino escrito. A Oficina tem projeto, cronômetro e correção por competência.',act:()=>go('redacao',{s:'oficina',novo:1})}); }
    if(w.length>=3 && au>=2 && au/w.length>=0.4) tasks.push({ic:'?',t:`Seu padrão: ${au} de ${w.length} erros foram "autor errado"`,s:'Não é falta de conteúdo: você conhece a ideia e troca o dono dela. O Quem disse? agora coloca lado a lado os autores que se confundem.',act:()=>go('game',{g:'quem'})}); }
  const last=lsGet('humanas-last'); if(last&&M[last.id]){ const lm=M[last.id], ls=modStats(lm.id); if(ls.done<ls.n) tasks.push({lc:lm.line,ic:'▸',t:`Continuar: ${lm.id} · ${lm.title}`,s:`Você parou em ${({teoria:'Teoria',resumo:'Cartões-resumo',vf:'V ou F',q:'Questões',tutor:'Tutor',notas:'Anotações'})[last.tab]||'Teoria'} · ${ls.done}/${ls.n} questões`,act:()=>go('mod',{id:lm.id,tab:last.tab})}); }
  if(pday){ const pd=planDone(pday); tasks.push({ic:'▦',t:`Plano de hoje: ${pday.foco}`,s:`${pd.done} de ${pd.n} tarefas feitas · ${pday.l}`,act:()=>go('plano'),done:pd.done===pd.n}); }
  nm.forEach(m=>{const s=modStats(m.id); tasks.push({lc:m.line,ic:m.id,t:`${m.id} · ${m.title}`,s: s.read? `Teoria lida. Faltam ${s.n-s.done} de ${s.n} questões.` : `Faixa ${m.faixa}${ERRMOD[m.id]?` · ligado ao seu erro na questão ${ERRMOD[m.id]} de 2025`:''}`,act:()=>go('mod',{id:m.id,tab:s.read?'q':'teoria'})});});
  tasks.push({ic:'◷',t:`Revisar ${Math.min(15,due)} cartões de véspera`,s:due? `${due} cartões vencidos hoje. Leva uns 6 minutos.`:'Nenhum cartão vencido. Volte amanhã.',act:()=>go('game',{g:'cards'}),done:!due});
  if(rc) tasks.push({ic:'↺',t:`Refazer o seu erro na questão ${rc.num} de 2025`,s:`${rc.subj}: tente de novo e faça a questão de reforço.`,act:()=>go('treino',{s:'recal'})});
  const tot=DATA.questions.length, done=Object.keys(S.ans).length, ok=Object.values(S.ans).filter(a=>a.ok).length;
  const mastered=Object.values(S.cards).filter(c=>c.box>=3).length;
  const fs=volStats('FS'), hg=volStats('HG');
  app.innerHTML=`
  <section class="hero">
    <div class="mission">
      <div class="eyebrow">Missão de hoje · ${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div>
      <h2>${done===0?'Comece pela linha que mais derrubou você em 2025.':'Continue de onde parou. A ordem abaixo já considera seus erros.'}</h2>
      <p class="lead">A missão escolhe os módulos pela incidência no ENEM, pelos seus erros no diagnóstico de 2025 e pelo que você errou aqui. Filosofia e Sociologia pesam mais porque foi lá que você mais perdeu pontos.</p>
      <div class="tasks">${tasks.map((t,i)=>`<button class="task ${t.done?'done':''} ${t.lc?'lc-'+t.lc:''}" data-i="${i}"><span class="ic">${esc(t.ic)}</span><span><b>${esc(t.t)}</b><small>${esc(t.s)}</small></span><span class="go">abrir →</span></button>`).join('')}</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="n">${done}<span class="muted" style="font-size:16px">/${tot}</span></div><div class="l">questões feitas</div><div class="bar2"><i style="width:${pct(done,tot)}%"></i></div></div>
      <div class="stat"><div class="n">${done?pct(ok,done)+'%':'—'}</div><div class="l">acerto na primeira tentativa</div></div>
      <div class="stat"><div class="n">${fs.done?pct(fs.ok,fs.done)+'%':'—'}</div><div class="l">Filosofia + Sociologia<br>(diagnóstico 2025: 69%)</div></div>
      <div class="stat"><div class="n">${hg.done?pct(hg.ok,hg.done)+'%':'—'}</div><div class="l">História + Geografia<br>(diagnóstico 2025: 83%)</div></div>
      <div class="stat" style="grid-column:1/-1"><div class="n">${mastered}<span class="muted" style="font-size:16px">/${DATA.cards.length}</span></div><div class="l">cartões de véspera dominados (caixa 3 ou mais)</div><div class="bar2"><i style="width:${pct(mastered,DATA.cards.length)}%"></i></div></div>
    </div>
  </section>
  <div class="sec-title"><h2>O mapa das linhas</h2><span class="eyebrow">${DATA.modules.filter(m=>STUDY_LINES.includes(m.line)).length} estações · ${DATA.questions.length} questões · ${DATA.vf.length} afirmações V ou F</span></div>
  ${STUDY_LINES.map(L=>{const ls=lineStats(L); const mods=DATA.modules.filter(m=>m.line===L);
    return `<div class="line lc-${L}"><div class="line-head"><span class="badge">${L}</span><h3>${LINES[L].name}</h3><span class="pct">${ls.done}/${ls.n} questões · ${ls.done?pct(ls.ok,ls.done)+'% de acerto':'sem respostas ainda'}</span></div>
      <div class="track"><div class="stations">${mods.map(m=>{const s=modStats(m.id); const cls=[s.done===s.n?'done':(s.done||s.read?'part':''), s.done===s.n?(s.ok/s.n<0.67?'weak':(s.ok===s.n?'strong':'')):''].join(' ');
        return `<button class="st ${cls}" data-m="${m.id}" title="${esc(m.title)}">${m.faixa==='A'?'<span class="fa">A</span>':''}<span class="c"></span><span class="code">${m.id}</span><span class="t">${esc(m.title.split(/[:(]/)[0])}</span></button>`}).join('')}</div></div></div>`}).join('')}
  <div class="legend"><span><i></i>não iniciado</span><span><i style="background:linear-gradient(90deg,var(--muted) 50%,transparent 50%)"></i>em andamento</span><span><i style="background:var(--muted)"></i>concluído</span><span><i style="box-shadow:0 0 0 2px var(--ok)"></i>3 de 3</span><span><i style="box-shadow:0 0 0 2px var(--bad)"></i>menos de 2 de 3</span><span><b class="chip A">A</b> cai todo ano</span></div>`;
  app.querySelectorAll('.task').forEach(b=>b.onclick=()=>tasks[+b.dataset.i].act());
  app.querySelectorAll('.st').forEach(b=>b.onclick=()=>go('mod',{id:b.dataset.m,tab:'teoria'}));
}

/* ---------- MODULE ---------- */
function vMod(){
  const m=M[param.id]; const tab=param.tab||'teoria'; const s=modStats(m.id);
  const lineMods=DATA.modules.filter(x=>x.line===m.line); const idx=lineMods.indexOf(m);
  app.innerHTML=`<div class="lc-${m.line}">
    <button class="back" id="back">← ${m.line==='R'?'Redação':'mapa das linhas'}</button>
    <div class="mod-head"><div class="row"><span class="eyebrow">Linha ${LINES[m.line].name} · estação ${idx+1} de ${lineMods.length}</span><span class="chip ${m.faixa}">Faixa ${m.faixa}</span><span class="chip">${esc(m.habs)}</span><span class="chip">leitura ~${Math.max(3,Math.round(strip(m.html).split(/\s+/).length/180))} min</span>${ERRMOD[m.id]?`<span class="chip" style="background:var(--bad-soft);color:var(--bad)">seu erro 2025: q. ${ERRMOD[m.id]}</span>`:''}</div>

async function askTutor(out,prompt){
  if(!sample){ out.innerHTML='<p class="empty">O tutor não está disponível nesta visualização.</p>'; return; }
  out.innerHTML='<div class="tutor-out">Pensando…</div>'; const box=out.firstChild;
  try{ const r=await sample(prompt,{modelTier:'default',cache:false,onText:({text})=>{box.textContent=text;}}); box.textContent=r.text; }
  catch(e){ box.textContent = e&&e.code==='not_granted' ? 'Você não autorizou o tutor nesta página. Ele pode ser liberado no menu de permissões do artefato.' : e&&e.code==='rate_limited' ? 'Muitas perguntas seguidas. Espere um minuto e tente de novo.' : (e&&e.text) || 'Não consegui responder agora. Tente de novo em instantes.'; }
}

/* ---------- question card ---------- */
function questionCard(el,q,opts={}){
  const prev=S.ans[q.id];
  const st={tries:[],locked:false};
  el.dataset.qid=q.id;
  const L='ABCDE';
  function paint(){
    const reveal=st.locked;
    el.innerHTML=`<div class="q lc-${q.mod?M[q.mod].line:(q.vol==='HG'?'H':'F')}">
      <div class="qh"><span><b>Questão ${q.n}</b> <span class="muted">· ${q.kind==='extra'?'extra do app':'volume '+(q.vol==='HG'?'1':'2')}</span></span><span class="chip">${esc(q.tag)}</span></div>
      ${q.base.length?`<blockquote>${q.base.map(p=>`<p>${p}</p>`).join('')}</blockquote>`:''}
      ${q.src?`<div class="qsrc">(${q.src})</div>`:''}
      <p class="cmd">${q.cmd}</p>
      <div class="alts">${q.alts.map((a,i)=>{const k=L[i]; let c=''; if(reveal){ c = k===q.ans?'right':(st.tries.includes(k)?'wrong':'dim'); } else if(st.tries.includes(k)) c='wrong';
        return `<button class="alt ${c}" data-k="${k}" ${reveal||st.tries.includes(k)?'disabled':''}><span class="L">${k}</span><span>${a}</span></button>`}).join('')}</div>
      <div class="fbz"></div></div>`;
    const fbz=el.querySelector('.fbz');
    if(!reveal && st.tries.length===1){
      const k=st.tries[0], tr=q.traps[k];
      fbz.innerHTML = tr ? `<div class="fb trap"><strong>Armadilha: ${TRAPS[tr].name}.</strong> ${TRAPS[tr].tip} Você tem mais uma tentativa.</div>` : `<div class="fb no"><strong>Ainda não.</strong> Releia o comando, traduza o texto numa frase sua e tente de novo. Você tem mais uma tentativa.</div>`;
    }
    if(reveal){
      const first=st.tries[0]; const okFirst=first===q.ans;
      fbz.innerHTML=`<div class="fb ${okFirst?'ok':'no'}"><strong>${okFirst?'Certa de primeira.':(st.tries.includes(q.ans)?'Certa na segunda tentativa. Conta como erro na sua estatística.':'Gabarito: '+q.ans+'.')}</strong> ${okFirst?'':'Leia o porquê de cada alternativa.'}</div>
        <div class="ex">${L.split('').map(k=>`<div class="${k===q.ans?'c':''}"><span class="L">${k}</span><span>${q.ex[k]||''}${q.traps[k]?`<span class="tg">${TRAPS[q.traps[k]].name}</span>`:''}</span></div>`).join('')}</div>
        <div class="meta">Habilidade ${esc(q.hab)} · dificuldade ${esc(q.dif)}${prev&&opts.showPrev!==false?` · primeira resposta registrada: ${prev.first} (${prev.ok?'certa':'errada'})`:''}</div>
        <div class="qtools"><button class="chipbtn mk" aria-pressed="${!!S.marks[q.id]}">${S.marks[q.id]?'★ marcada para revisar':'☆ revisar depois'}</button>${S.ans[q.id]&&S.ans[q.id].ok?`<button class="chipbtn ch" aria-pressed="${!!S.chute[q.id]}">${S.chute[q.id]?'chute: vai para o caderno de erros':'acertei no chute'}</button>`:''}</div>
        <div class="row" style="margin-top:10px">${prev?'<button class="btn redo">Tentar de novo (não muda a estatística)</button>':''}<button class="btn tex tutor-only">Explique de outro jeito</button></div><div class="tx"></div>`;
      const mk=fbz.querySelector('.mk'); mk.onclick=()=>{ S.marks[q.id]=!S.marks[q.id]; if(!S.marks[q.id]) delete S.marks[q.id]; save(); paint(); };
      const ch=fbz.querySelector('.ch'); if(ch) ch.onclick=()=>{ S.chute[q.id]=!S.chute[q.id]; if(!S.chute[q.id]) delete S.chute[q.id]; save(); paint(); };
      const rd=fbz.querySelector('.redo'); if(rd) rd.onclick=()=>{ st.tries=[]; st.locked=false; paint(); };
      const tb=fbz.querySelector('.tex'); if(tb) tb.onclick=()=>askTutor(fbz.querySelector('.tx'),`Você é um tutor de ENEM falando com o estudante, em português do Brasil, texto simples sem markdown, até 150 palavras. Explique de um jeito diferente e mais concreto por que a alternativa ${q.ans} é a correta${first!==q.ans?` e por que a ${first}, que ele marcou, está errada`:''}. Não invente fatos além do material.\n\nTexto-base: ${strip(q.base.join(' '))}\nFonte: ${strip(q.src)}\nComando: ${strip(q.cmd)}\nAlternativas: ${q.alts.map((a,i)=>L[i]+') '+strip(a)).join(' | ')}\nGabarito comentado: ${L.split('').map(k=>k+': '+strip(q.ex[k]||'')).join(' | ')}`);
    }
    el.querySelectorAll('.alt:not(:disabled)').forEach(b=>b.onclick=()=>pick(b.dataset.k));
  }
  function pick(k){
    st.tries.push(k);
    if(st.tries.length===1 && !S.ans[q.id]){ S.ans[q.id]={first:k,ok:k===q.ans,t:Date.now(),src:opts.src||'estudo',trap:k!==q.ans?(q.traps[k]||'conteudo'):null}; bump(); save(); }
    if(k===q.ans || st.tries.length>=2){ st.locked=true; opts.onDone&&opts.onDone(st.tries[0]===q.ans); }
    paint();
  }
  if(prev && opts.resume!==false){ st.tries=[prev.first]; if(prev.ok){st.locked=true;} else { st.tries=[prev.first]; } }
  if(prev && !prev.ok && opts.resume!==false){ st.locked=true; }
  paint();
}

function ankiText(){
  const cl=s=>strip(String(s)).replace(/[\t\r\n]+/g,' ').trim(); const rows=[];
  DATA.cards.forEach(c=>rows.push([cl(c.q),cl(c.a),'humanas-de-ouro véspera '+(c.vol||'')]));
  DATA.modules.forEach(m=>(m.resumo||[]).forEach(([k,v])=>rows.push([`${cl(k)} (${m.id} · ${cl(m.title)})`,cl(v),'humanas-de-ouro '+m.id])));
  DATA.quem.forEach(q=>rows.push([`Quem? ${cl(q.conceito)} · palavras: ${cl(q.palavras)}`,cl(q.autor),'humanas-de-ouro autores']));
  return '#separator:tab\n#html:false\n#tags column:3\n'+rows.map(r=>r.map(x=>x.replace(/\t/g,' ')).join('\t')).join('\n');
}
let gameTimer=null;

function endGame(key,score,total,lines){
  clearInterval(gameTimer);
  const rec = S.best[key]==null || score>S.best[key]; if(rec){S.best[key]=score; save();}
  app.innerHTML=`<div class="stage"><button class="back" id="back">← Arena</button><div class="panel" style="text-align:center"><div class="eyebrow">${rec?'novo recorde':'resultado'}</div><div class="big">${score}</div><p class="muted">${esc(total)}</p></div>

    <div class="row" style="margin-top:16px"><button class="btn primary" id="again">Jogar de novo</button><button class="btn" id="ar">Voltar à Arena</button></div></div>`;
  $('#back').onclick=$('#ar').onclick=()=>go('arena'); $('#again').onclick=()=>vGame();
}
function runRounds({key,rounds,secs,renderRound}){
  let i=0,score=0,hits=0,streak=0; const miss=[];
  function next(){
    if(i>=rounds.length) return endGame(key,score,`${hits} de ${rounds.length} certas`,miss);
    const r=rounds[i]; let left=secs*10; let answered=false;
    app.innerHTML=`<div class="stage"><button class="back" id="back">← Arena</button><div class="score"><span>rodada ${i+1}/${rounds.length}</span><span>sequência ${streak}</span><span>${score} pts</span></div>${secs?'<div class="timer"><i id="ti"></i></div>':'<div style="height:16px"></div>'}<div id="rd"></div></div>`;
    $('#back').onclick=()=>{clearInterval(gameTimer);go('arena');};
    const finish=(ok,missLine)=>{ if(answered) return; answered=true; clearInterval(gameTimer);
      bump(); if(ok){ hits++; streak++; score+= 100 + Math.round(left/ (secs||1)) + (streak>=3?25:0); } else { streak=0; if(missLine) miss.push(missLine); }
      const nb=document.createElement('div'); nb.className='row'; nb.style.marginTop='14px'; nb.innerHTML='<button class="btn primary" id="nx">Próxima →</button>'; $('#rd').appendChild(nb); $('#nx').focus(); $('#nx').onclick=()=>{i++;next();}; };
    renderRound($('#rd'),r,finish);

function confusers(autor){ const F=DATA.fichas||[], names=DATA.quem.map(x=>x.autor); const me=F.find(f=>f.autor===autor); const out=new Set();

function host(){ return document.getElementById('host')||app; }
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const lineOf = mod => mod? mod[0] : 'H';
function subtabs(items,cur,onpick){
  const html=`<div class="subtabs">${items.map(([k,l])=>`<button data-t="${k}" aria-current="${k===cur}">${l}</button>`).join('')}</div>`;
  setTimeout(()=>app.querySelectorAll('.subtabs button').forEach(b=>b.onclick=()=>onpick(b.dataset.t)),0);
  return html;
}
function stationBtn(mod){ return `<button class="chipbtn lc-${lineOf(mod)}" data-go="${mod}" style="border-color:var(--lc);color:var(--lc)">${mod}</button>`; }
function bindStations(el){ el.querySelectorAll('[data-go]').forEach(b=>b.onclick=e=>{e.stopPropagation(); go('mod',{id:b.dataset.go,tab:'teoria'});}); }

/* ---- V ou F inside stations ---- */
function vfItem(v){

function bindVF(el){

    S.vf[v.id]={ok:ans===v.v,t:Date.now()}; bump(); save();
    const tmp=document.createElement('div'); tmp.innerHTML=vfItem(v); box.replaceWith(tmp.firstElementChild); bindVF(el);
  }));
}

function gVF(){
  const items=shuffle(DATA.vf).slice(0,12);
  runRounds({key:'vf',secs:8,rounds:items.map(v=>({v,missLine:`${v.s} <strong>${v.v?'Verdadeira':'Falsa'}.</strong> ${v.why} ${stationBtn(v.mod)}`})),
    renderRound(el,r,finish){ el.innerHTML=`<div class="prompt"><span class="k">estação ${r.v.mod} · ${LINES[lineOf(r.v.mod)].name}</span>${r.v.s}</div>${optsHTML([{label:'Verdadeiro',ok:r.v.v},{label:'Falso',ok:!r.v.v}])}`;
      bindOpts(el,finish,r.missLine,()=>{ const p=document.createElement('div'); p.className='why'; p.style.marginTop='10px'; p.innerHTML=r.v.why; el.appendChild(p); }); }});
}
function pickEvents(n){
  for(let tries=0;tries<200;tries++){
    const s=shuffle(DATA.tl).slice(0,n); const ys=s.map(e=>Math.floor(e.y)).sort((a,b)=>a-b);
    if(ys.every((y,i)=>i===0||y-ys[i-1]>=1)) return s;
  }
  return shuffle(DATA.tl).slice(0,n);
}
function gOrdem(){
  const rounds=[0,1,2,3].map(()=>({evs:pickEvents(5)}));
  rounds.forEach(r=>r.missLine=r.evs.slice().sort((a,b)=>a.y-b.y).map(e=>`<span class="mono">${e.ly}</span> ${e.t}`).join('<br>'));
  runRounds({key:'ordem',secs:0,rounds,
    renderRound(el,r,finish){ const order=[];
      const paint=()=>{ el.innerHTML=`<div class="prompt" style="font-size:17px"><span class="k">toque do mais antigo para o mais recente</span>${order.length}/5 escolhidos</div><div class="orderopts">${r.evs.map((e,i)=>{const pos=order.indexOf(i); return `<button data-i="${i}" class="${pos>=0?'set':''}" ${pos>=0?'disabled':''}><span class="L">${pos>=0?pos+1:''}</span><span>${e.t}</span></button>`}).join('')}</div>${order.length?'<div class="row" style="margin-top:10px"><button class="btn" id="undo">Desfazer</button></div>':''}`;
        el.querySelectorAll('.orderopts button:not(:disabled)').forEach(b=>b.onclick=()=>{ order.push(+b.dataset.i); if(order.length===5) check(); else paint(); });
        const u=el.querySelector('#undo'); if(u) u.onclick=()=>{order.pop(); paint();}; };
      const check=()=>{ const sorted=r.evs.map((e,i)=>i).sort((a,b)=>r.evs[a].y-r.evs[b].y); const ok=order.every((v,i)=>v===sorted[i]);
        el.innerHTML=`<div class="prompt" style="font-size:17px"><span class="k">${ok?'ordem perfeita':'ordem certa abaixo'}</span>${ok?'Você acertou os cinco.':'Compare com a sua sequência.'}</div><div class="orderopts">${sorted.map((i,k)=>`<button disabled class="${order[k]===i?'right':'wrong'}"><span class="L">${k+1}</span><span><span class="mono" style="font-size:12px">${r.evs[i].ly}</span> · ${r.evs[i].t}</span></button>`).join('')}</div>`;
        finish(ok,r.missLine); };
      paint(); }});
}
function gAntes(){
  const rounds=[]; for(let i=0;i<10;i++){ const [a,b]=pickEvents(2); rounds.push({a,b,missLine:`<span class="mono">${a.ly}</span> ${a.t}<br><span class="mono">${b.ly}</span> ${b.t}`}); }
  runRounds({key:'antes',secs:8,rounds,
    renderRound(el,r,finish){ const first=r.a.y<r.b.y?r.a:r.b;
      el.innerHTML=`<div class="prompt" style="font-size:18px"><span class="k">qual veio primeiro?</span>Toque no fato mais antigo.</div>${optsHTML([r.a,r.b].map(e=>({label:e.t,ok:e===first})))}`;
      bindOpts(el,finish,r.missLine,()=>{ const p=document.createElement('div'); p.className='why'; p.style.marginTop='10px'; p.innerHTML=`<span class="mono">${r.a.ly}</span> ${r.a.t}<br><span class="mono">${r.b.ly}</span> ${r.b.t}`; el.appendChild(p); }); }});
}
const CITIES=[['Brasília',-3],['Manaus',-4],['Rio Branco',-5],['Fernando de Noronha',-2],['Londres',0],['Paris',1],['Cairo',2],['Moscou',3],['Dubai',4],['Pequim',8],['Tóquio',9],['Sydney',10],['Nova York',-5],['Cidade do México',-6],['Los Angeles',-8]];
const fmtN = n => n.toLocaleString('pt-BR',{maximumFractionDigits:2});
function geoRound(){
  if(Math.random()<.5){
    const sc=[10000,25000,50000,100000,250000,500000,1000000,5000000][Math.floor(Math.random()*8)], cm=[2,3,4,5,6,8,12][Math.floor(Math.random()*7)];
    const km=cm*sc/100000;
    const asLen=x=> x>=1? fmtN(x)+' km' : fmtN(x*1000)+' m';
    const opts=[...new Set([km,km*10,km/10,cm*sc/1000])].filter(x=>x>0).slice(0,4);
    return {k:'escala',prompt:`Num mapa na escala 1 : ${sc.toLocaleString('pt-BR')}, duas cidades estão a ${cm} cm de distância. Qual a distância real?`,
      opts:shuffle(opts).map(x=>({label:asLen(x),ok:x===km})),
      why:`${cm} cm × ${sc.toLocaleString('pt-BR')} = ${(cm*sc).toLocaleString('pt-BR')} cm. Como 1 km = 100.000 cm, isso dá ${asLen(km)}.`};
  }
  let a,b; do{ a=CITIES[Math.floor(Math.random()*CITIES.length)]; b=CITIES[Math.floor(Math.random()*CITIES.length)]; }while(a===b);
  const h=Math.floor(Math.random()*24); const diff=b[1]-a[1]; let hb=h+diff, day='do mesmo dia';
  if(hb>=24){hb-=24;day='do dia seguinte';} if(hb<0){hb+=24;day='do dia anterior';}
  const lab=(hh,d)=>`${String(hh).padStart(2,'0')}h ${d}`;
  const wrong1=((h-diff)%24+24)%24, wrong2=((h+diff+ (diff>0?-2:2))%24+24)%24;
  const set=new Map(); set.set(lab(hb,day),true); [lab(wrong1,day),lab(wrong2,day),lab(hb,day==='do mesmo dia'?(diff>0?'do dia anterior':'do dia seguinte'):'do mesmo dia')].forEach(x=>{ if(!set.has(x)) set.set(x,false); });
  return {k:'fuso',prompt:`São ${String(h).padStart(2,'0')}h em ${a[0]} (UTC${a[1]>=0?'+':''}${a[1]}). Que horas são em ${b[0]} (UTC${b[1]>=0?'+':''}${b[1]})?`,
    opts:shuffle([...set].slice(0,4).map(([label,ok])=>({label,ok}))),
    why:`A diferença é de ${Math.abs(diff)} hora(s); ${b[0]} está ${diff>0?'a leste (adiantado)':diff<0?'a oeste (atrasado)':'no mesmo fuso'}. Horários padrão, sem horário de verão.`};
}
function gGeo(){
  const rounds=[]; for(let i=0;i<10;i++){ const r=geoRound(); r.missLine=`${r.prompt} <strong>${r.opts.find(o=>o.ok).label}.</strong> ${r.why}`; rounds.push(r); }
  runRounds({key:'geo',secs:25,rounds,
    renderRound(el,r,finish){ el.innerHTML=`<div class="prompt"><span class="k">${r.k==='escala'?'escala':'fuso horário'}</span>${r.prompt}</div>${optsHTML(r.opts.map(o=>({label:esc(o.label),ok:o.ok})))}`;
      bindOpts(el,finish,r.missLine,()=>{ const p=document.createElement('div'); p.className='why'; p.style.marginTop='10px'; p.textContent=r.why; el.appendChild(p); }); }});
}

  const counts={}; wrong.forEach(([,a])=>{const k=a.trap||'conteudo'; counts[k]=(counts[k]||0)+1;});

  host().innerHTML=`<p style="font-family:var(--read);font-size:16px;max-width:68ch;margin-top:0">Todo erro de primeira tentativa entra aqui, junto com os acertos que você marcou como chute. Para cada um, escreva a <strong>regra</strong> que teria evitado o erro, em uma frase. Na véspera, você relê só as regras.</p>
    ${wrong.length?`<div class="filters"><button class="chipbtn" data-f="todos" ${f==='todos'?'style="background:var(--ink);color:var(--surface)"':''}>todos (${wrong.length})</button>${Object.entries(counts).map(([k,n])=>`<button class="chipbtn" data-f="${k}" ${f===k?'style="background:var(--ink);color:var(--surface)"':''}>${names[k]} (${n})</button>`).join('')}</div>
    <div id="el"></div>`:'<p class="empty">Nenhum erro registrado ainda. Faça as questões das estações ou um simulado.</p>'}
    ${Object.keys(S.notes).filter(k=>S.notes[k]).length?`<div class="sec-title"><h2>Suas regras</h2><span class="eyebrow">para reler na véspera</span></div><div class="panel"><ol style="font-family:var(--read);font-size:16px;margin:0;padding-left:22px">${Object.entries(S.notes).filter(([,v])=>v).map(([k,v])=>`<li style="margin-bottom:6px">${esc(v)} <span class="mono muted" style="font-size:11px">(${esc(Q[k]?Q[k].n:k)})</span></li>`).join('')}</ol></div>`:''}`;
  host().querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{param.f=b.dataset.f; vErros();});
  const el=$('#el'); if(!el) return;
  list.forEach(([id,a])=>{ const q=Q[id]; const d=document.createElement('details'); d.className='err';
    d.innerHTML=`<summary><span class="chip" style="background:var(--bad-soft);color:var(--bad)">${names[a.trap||'conteudo']}</span>${stationBtn(q.mod||(q.vol==='HG'?'H1':'F1'))}<b>${esc(q.n)}</b><span style="font-family:var(--read)">${strip(q.cmd).slice(0,90)}…</span><span class="mono muted" style="font-size:12px">sua: ${a.first} · gab: ${q.ans}</span>${S.notes[id]?'<span class="done-mark">● regra escrita</span>':''}${S.redo[id]?`<span class="mono" style="font-size:11px;color:${S.redo[id].ok?'var(--ok)':'var(--bad)'}">refeita: ${S.redo[id].ok?'acertou':'errou de novo'}</span>`:''}</summary><div class="inner"><div class="qq"></div><label class="eyebrow" for="n-${id}">a regra que teria evitado este erro</label><textarea id="n-${id}" placeholder="Ex.: quando o comando pede função, procure o fim, não o meio.">${esc(S.notes[id]||'')}</textarea></div>`;
    el.appendChild(d); bindStations(d);
    d.addEventListener('toggle',()=>{ if(d.open && !d.dataset.ok){ d.dataset.ok=1; questionCard(d.querySelector('.qq'),q,{}); } });
    const ta=d.querySelector('textarea'); let tm; ta.addEventListener('input',()=>{ clearTimeout(tm); tm=setTimeout(()=>{ S.notes[id]=ta.value.trim(); save(); },700); });

function isoToday(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function planToday(){ return DATA.plan.find(p=>p.d===isoToday()); }
function taskDone(p,i){ const t=p.tasks[i]; if(t.k==='red'){ if((S.red&&Array.isArray(S.red.drafts)?S.red.drafts:[]).some(d=>d.tema===t.a&&d.done)) return true; } if(t.k==='mod'){ const s=modStats(t.a); if(s.done===s.n) return true; } if(t.k==='prova'){ const [ex,ar]=t.a.split(':'); const ds=allRuns(ex).filter(runReal).map(r=>r.areas).join(''); if(ar.split('').every(a=>ds.includes(a))) return true; } return !!S.plan[p.d+'|'+i]; }
function planDone(p){ let d=0; p.tasks.forEach((t,i)=>{ if(taskDone(p,i)) d++; }); return {done:d,n:p.tasks.length}; }
function taskLabel(t){ if(t.k==='mod'){ const m=M[t.a]; return `${m.id} · ${m.title} <span class="muted">(teoria, cartões, V ou F e ${m.qs.length} questões)</span>`; } return esc(t.t); }
function taskGo(t){
  if(t.k==='mod') return ()=>go('mod',{id:t.a,tab:S.read[t.a]?'q':'teoria'});
  if(t.k==='game') return ()=>go('game',{g:t.a});
  if(t.k==='sim') return ()=>{ SIM=null; go('treino',{s:'sim',foco:t.a,n:/30/.test(t.t)?30:20}); };
  if(t.k==='recal') return ()=>go('treino',{s:'recal'});
  if(t.k==='erros') return ()=>go('treino',{s:'erros'});
  if(t.k==='bib') return ()=>go('biblioteca',{s:t.a});
  if(t.k==='painel') return ()=>go('painel');
  if(t.k==='prova') return ()=>go('provas');
  if(t.k==='provares') return ()=>{ const ex=t.a; go(allRuns(ex).some(r=>r.done)?'provares':'provas',{id:ex}); };
  if(t.k==='refazer') return ()=>go('treino',{s:'refazer'});
  if(t.k==='red') return ()=>{ const dr=(S.red&&S.red.drafts||[]).find(d=>d.tema===t.a&&!d.done); go('redacao',dr?{s:'oficina',d:dr.id}:{s:'oficina',novo:1,tema:t.a}); };
  return null;
}

let IDX=null;
function buildIndex(){
  IDX=[];

    const push=()=>{ if(buf.trim()) IDX.push({g:'Teoria',t:`${m.id} · ${sec}`,txt:buf,act:()=>go('mod',{id:m.id,tab:'teoria'})}); buf=''; };
    [...d.children].forEach(c=>{ if(c.tagName==='H4'){ push(); sec=c.textContent; } else buf+=' '+c.textContent; }); push();
    m.resumo.forEach(r=>IDX.push({g:'Glossário',t:strip(r[0]),txt:strip(r[1]),act:()=>go('biblioteca',{s:'glos',q:strip(r[0])})}));
  });
  DATA.questions.forEach(q=>IDX.push({g:'Questões',t:`Questão ${q.n} · ${q.mod||(q.kind==='simulado'?'simulado':'reforço')}`,txt:strip(q.base.join(' ')+' '+q.cmd),act:()=> q.mod? go('mod',{id:q.mod,tab:'q'}) : go('treino',{s:'sim'})}));
  DATA.fichas.forEach(f=>IDX.push({g:'Fichas de autor',t:f.autor,txt:strip(f.ideia+' '+f.obra+' '+f.hoje),act:()=>go('biblioteca',{s:'fichas',q:f.autor})}));
  DATA.rep.forEach(r=>IDX.push({g:'Repertório',t:strip(r.t),txt:strip(r.diz+' '+r.temas),act:()=>go('biblioteca',{s:'rep'})}));
  DATA.tl.forEach(e=>IDX.push({g:'Linha do tempo',t:e.ly,txt:strip(e.t),act:()=>go('biblioteca',{s:'tl'})}));
  DATA.con.forEach(c=>IDX.push({g:'Conexões',t:c.t,txt:c.p+' '+c.elos.map(e=>strip(e.t)).join(' '),act:()=>go('biblioteca',{s:'con'})}));
  DATA.vf.forEach(v=>IDX.push({g:'V ou F',t:`Estação ${v.mod}`,txt:strip(v.s),act:()=>go('mod',{id:v.mod,tab:'vf'})}));
  IDX.forEach(x=>x.n=norm(x.t+' '+x.txt));
}
function snippet(txt,qn){ const n=norm(txt); const i=n.indexOf(qn); if(i<0) return esc(txt.slice(0,160)); const a=Math.max(0,i-60), b=Math.min(txt.length,i+qn.length+100);
  return (a?'…':'')+esc(txt.slice(a,i))+'<mark>'+esc(txt.slice(i,i+qn.length))+'</mark>'+esc(txt.slice(i+qn.length,b))+(b<txt.length?'…':''); }
function vBusca(){
  if(!IDX) buildIndex();
  const q=(param&&param.q)||''; const qn=norm(q.trim()); $('#sq').value=q;
  const terms=qn.split(/\s+/).filter(Boolean);
  const hits=terms.length? IDX.filter(x=>terms.every(t=>x.n.includes(t))) : [];
  const groups={}; hits.forEach(h=>{ (groups[h.g]=groups[h.g]||[]).push(h); });
  const order=['Teoria','Glossário','Fichas de autor','Repertório','Conexões','Linha do tempo','V ou F','Questões'];
  app.innerHTML=`<div class="sec-title"><h2>Busca: “${esc(q)}”</h2><span class="eyebrow">${hits.length} resultados</span></div>
    ${hits.length?order.filter(g=>groups[g]).map(g=>`<div class="sec-title" style="margin-top:18px"><h2 style="font-size:17px">${g}</h2><span class="eyebrow">${groups[g].length}</span></div><div class="res">${groups[g].slice(0,12).map((h,i)=>`<button data-g="${g}" data-i="${i}"><small>${esc(h.t)}</small>${snippet(h.txt.trim(),terms[0])}</button>`).join('')}</div>`).join('')
    :`<p class="empty">Nada encontrado. Tente uma palavra só, sem acento ou no singular (ex.: "contrato", "fuso", "Weber").</p>`}`;

}

async function packS(){ const json=JSON.stringify(S); try{ const cs=new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw')); const buf=new Uint8Array(await new Response(cs).arrayBuffer()); let s=''; for(let i=0;i<buf.length;i+=0x8000) s+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000)); return 'HDO1.'+btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }catch(e){ return json; } }
async function unpackS(txt){ txt=String(txt).trim(); const m=txt.match(/HDO1\.([A-Za-z0-9_-]+)/); let o;
  if(m){ let b=m[1].replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b+='='; const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0)); const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw')); o=JSON.parse(await new Response(ds).text()); }
  else o=JSON.parse(txt);
  const r=o&&o.S?o.S:o; if(!r||typeof r!=='object'||!r.ans) throw new Error('formato'); return r; }

let audioCtx=null;
function beep(){ if(!prefs.sound||!audioCtx) return; try{ [0,0.35,0.7].forEach(dt=>{ const o=audioCtx.createOscillator(), gn=audioCtx.createGain(); o.frequency.value=880; gn.gain.setValueAtTime(0.0001,audioCtx.currentTime+dt); gn.gain.exponentialRampToValueAtTime(0.25,audioCtx.currentTime+dt+0.02); gn.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dt+0.28); o.connect(gn).connect(audioCtx.destination); o.start(audioCtx.currentTime+dt); o.stop(audioCtx.currentTime+dt+0.3); }); }catch(e){} }
function pomoStart(focus,pause,phase='foco'){
  try{ if(!audioCtx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) audioCtx=new AC(); } }catch(e){}
  pomo={running:true,focus,pause,phase,end:Date.now()+(phase==='foco'?focus:pause)*60000,sessions:(pomo.day===isoToday()?pomo.sessions||0:0),day:isoToday()};
  lsSet('humanas-pomo',pomo); pomoPaint(); closePop();
}
function pomoStop(){ pomo={running:false,sessions:pomo.sessions||0,day:pomo.day}; lsSet('humanas-pomo',pomo); pomoPaint(); closePop(); }
function pomoPaint(){
  const b=$('#pomoBtn'); if(!b) return;
  if(!pomo.running){ b.textContent='Foco'; b.classList.remove('on'); return; }
  const rem=Math.max(0,pomo.end-Date.now()); b.textContent=`${pomo.phase==='foco'?'Foco':'Pausa'} ${Math.floor(rem/60000)}:${String(Math.floor(rem/1000)%60).padStart(2,'0')}`; b.classList.toggle('on',pomo.phase==='foco');
}

    else { pomo.phase='foco'; pomo.end=Date.now()+pomo.focus*60000; toast('Pausa encerrada. Novo bloco de foco começou.'); }

      const n=parseInt(k,10); if(n>=1&&n<=opts.length){ opts[n-1].click(); return; } }

});

const RMODS = DATA.modules.filter(m=>m.line==='R');
const COMP = {1:'C1 · Norma-padrão',2:'C2 · Tema e repertório',3:'C3 · Argumentação',4:'C4 · Coesão',5:'C5 · Proposta'};
const COMP_MOD = {1:'R6',2:'R4',3:'R3',4:'R5',5:'R7'};
function redS(){ if(!S.red||typeof S.red!=='object') S.red={}; if(!S.red.plans) S.red.plans={}; if(!Array.isArray(S.red.drafts)) S.red.drafts=[]; if(!S.red.check) S.red.check={}; return S.red; }
function temaById(id){
  if(!id) return null;
  const tt=RED.temas_treino.find(t=>t.id===id); if(tt) return Object.assign({kind:'treino'},tt);
  const m=/^oficial(\d{4})$/.exec(id); if(m){ const a=RED.temas_ant.find(t=>t.ano===m[1]); if(a) return {id,kind:'oficial',t:a.t,kw:a.kw,arm:a.arm,ano:a.ano,perg:''}; }

}

function draftTotal(d){ if(!d||!d.notas) return null; const v=[1,2,3,4,5].map(i=>d.notas['c'+i]); if(v.some(x=>x==null)) return null; return v.reduce((a,b)=>a+b,0); }
function lastDrafts(){ return redS().drafts.filter(d=>d.done).sort((a,b)=>(b.end||0)-(a.end||0)); }
function weakComp(){ const ds=lastDrafts().filter(d=>draftTotal(d)!=null).slice(0,3); if(!ds.length) return null; let best=null; [1,2,3,4,5].forEach(i=>{ const avg=ds.reduce((a,d)=>a+d.notas['c'+i],0)/ds.length; if(!best||avg<best.avg) best={i,avg}; }); return best; }

/* ---- texto: estimativas honestas ---- */
const ORAL=[['a gente','a gente'],['tipo,','"tipo"'],[' né','"né"'],[' pra ','"pra"'],[' tá ','"tá"'],[' coisa','"coisa"'],[' vc ','"vc"'],[' aí ','"aí"'],['a nível de','"a nível de"'],[' etc','"etc."']];
const STOP=new Set('a o as os de da do das dos e é em um uma uns umas que se por para com sem como mais mas não na no nas nos ao aos à às ou ser são foi pelo pela pelos pelas seu sua seus suas esse essa isso este esta isto ele ela eles elas tal entre sobre também já ainda muito muitos muitas há assim forma cada qual quais quando onde porque pois sua lhe nesse nessa desse dessa deve devem pode podem sendo sido está estão tem têm'.split(' '));
function textStats(txt,tema){
  const paras=txt.split(/\n\s*\n|\n/).map(p=>p.trim()).filter(Boolean);
  const wpl=(S.red&&S.red.wpl)||12; let lines=0; paras.forEach(p=>{ const w=(p.match(/\S+/g)||[]).length; lines+=Math.max(1,Math.ceil((w+1)/wpl)); });
  const words=(txt.match(/[A-Za-zÀ-ÿ]+/g)||[]); const low=' '+txt.toLowerCase().replace(/\s+/g,' ')+' ';
  const oral=ORAL.filter(([k])=>low.includes(k)).map(x=>x[1]);
  const onde=(low.match(/\bonde\b/g)||[]).length;
  const eu=(low.match(/\b(eu|meu|minha|acho que)\b/g)||[]).length;
  const freq={}; words.forEach(w=>{ const k=w.toLowerCase(); if(k.length>4&&!STOP.has(k)) freq[k]=(freq[k]||0)+1; });
  const rep=Object.entries(freq).filter(([,n])=>n>=4).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const CON=['além disso','ademais','outrossim','no entanto','entretanto','contudo','todavia','porém','embora','ainda que','apesar de','portanto','logo','assim','dessa forma','desse modo','visto que','uma vez que','já que','dado que','de modo que','de forma que','a fim de','para que','por exemplo','isto é','ou seja','à medida que','em primeiro lugar','em segundo lugar','nesse contexto','nesse sentido','diante disso','paradoxalmente','sobretudo','por conseguinte','em virtude de'];
  const cons=CON.filter(c=>low.includes(c));
  const last=(paras[paras.length-1]||'').toLowerCase();
  const prop={
    agente:/\b(minist[ée]rio|governo|estado|escolas?|m[íi]dia|ongs?|prefeituras?|fam[íi]lias?|congresso|secretarias?|sociedade civil|empresas?|universidades?|poder p[úu]blico|cabe a|cabe ao|cabe à)\b/.test(last),
    acao:/\b(deve|devem|cabe|precisa|precisam|é necess[áa]rio que|compete)\b/.test(last),
    meio:/(por meio de|mediante|atrav[ée]s de|por intermédio|com a cria[çc][ãa]o|em parceria com|com o uso de|via )/.test(last),
    fim:/(a fim de|para que|com o objetivo|com o intuito|de modo a|de modo que|visando|com a finalidade|de forma a)/.test(last)
  };
  let kwHit=[]; if(tema&&tema.kw){ kwHit=tema.kw.split('·').map(s=>s.trim()).filter(Boolean).map(k=>{ const base=k.toLowerCase().split(' ').filter(w=>w.length>3).map(w=>w.slice(0,Math.max(5,w.length-2))); const hit=base.length? base.every(b=>low.includes(b)) : low.includes(k.toLowerCase()); return {k,hit}; }); }
  return {paras:paras.length,lines,words:words.length,oral,onde,eu,rep,cons,prop,kwHit};
}

C1 domínio da modalidade escrita formal (200: desvios só como excepcionalidade e sem reincidência).
C2 compreensão do tema e repertório (200: argumentação consistente com repertório legitimado, pertinente e produtivo; tangenciar = 40; repertório de bolso, sem conexão com a discussão, não é produtivo).
C3 seleção e organização de argumentos (200: consistente, organizado, com autoria; 120 e 80: limitado aos textos motivadores).
C4 coesão (200: articula bem as partes, repertório diversificado de recursos coesivos).

Formato obrigatório, nesta ordem:
C1: nota - justificativa
C2: nota - justificativa
C3: nota - justificativa
C4: nota - justificativa
C5: nota - justificativa (diga quais elementos encontrou)
TOTAL: soma
ERROS MAIS GRAVES: até 3, do mais grave ao menos grave
REESCRITAS: 2 trechos do texto com a reescrita sugerida (original -> reescrita)
PRÓXIMO FOCO: uma competência e o que treinar
Termine lembrando que é uma estimativa, não uma garantia. Máximo de 450 palavras.${hasImg?'':`\n\nREDAÇÃO:\n${txt}`}`;

function synthRun(ex){ const e=EX[ex]; if(!e.his) return null; return {id:'papel',areas:'LH',mode:'prova',ans:Object.assign({},e.his),flag:{},cut:{},start:Date.parse('2026-09-20T12:00:00-03:00'),done:true,end:Date.parse('2026-09-21T12:00:00-03:00'),time:null,papel:true}; }
function runReal(r){ if(!r||!r.done) return false; if(r.papel) return true; const n=areaNums(r.areas).length; return Object.keys(r.ans||{}).length>=Math.ceil(n*0.6); }
function allRuns(ex){ const st=pvState(ex); const r=st.runs.slice(); const s=synthRun(ex); if(s) r.unshift(s); return r; }
function scoreRun(ex,run){
  const e=EX[ex], res={total:0,ok:0,blank:0,anul:0,areas:{},wrong:[],flagWrong:0,flagOk:0,thirds:[[0,0],[0,0],[0,0]]};
  const nums=areaNums(run.areas);
  run.areas.split('').forEach(a=>res.areas[a]={n:0,ok:0,blank:0});
  nums.forEach((n,i)=>{ const k=e.key[n]; const a=Object.keys(AREAS).find(x=>n>=AREAS[x].a&&n<=AREAS[x].b); const r=res.areas[a];
    if(k==null){ res.anul++; return; }
    r.n++; res.total++; const g=run.ans[n]; const th=Math.min(2,Math.floor(((n-AREAS[a].a)/45)*3)); res.thirds[th][1]++;
    if(!g){ r.blank++; res.blank++; res.wrong.push(n); return; }
    if(g===k){ r.ok++; res.ok++; res.thirds[th][0]++; if(run.flag&&run.flag[n]) res.flagOk++; }
    else { res.wrong.push(n); if(run.flag&&run.flag[n]) res.flagWrong++; }
  });
  return res;
}
function runLabel(run){ if(run.id==='papel') return 'Diagnóstico no papel (set/2026)'; return `${new Date(run.start).toLocaleDateString('pt-BR')} · ${run.areas.split('').map(a=>AREAS[a].name.split(' ').pop()).join(' + ')} · ${run.papel?'lançada do papel':run.mode==='estudo'?'modo estudo':'modo prova'}${runReal(run)?'':' · incompleta'}`; }

function cardGrid(id,run,nums){
  const e=EX[id]; const groups={}; nums.forEach((n,i)=>{ const a=Object.keys(AREAS).find(x=>n>=AREAS[x].a&&n<=AREAS[x].b); (groups[a]=groups[a]||[]).push([n,i]); });

}
