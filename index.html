poder.", "hoje": "Vigilância digital, escolas, prisões, dados de saúde.", "conf": "Weber (Estado e monopólio da força) e Marx (poder de classe).", "mod": "F7"}, {"autor": "Derrida", "epoca": "Argélia/França, 1930–2004", "obra": "Força de lei", "ideia": "Direito é cálculo; justiça é incalculável; desconstrução de oposições.", "hoje": "Ações justas fora da lei: desobediência civil. É o seu erro na questão 50.", "conf": "Thoreau (prática da desobediência civil) e Bobbio (direitos históricos).", "mod": "F5"}, {"autor": "Bobbio", "epoca": "Itália, 1909–2004", "obra": "A era dos direitos", "ideia": "Direitos humanos são históricos e variáveis, nascidos de lutas; o desafio atual é protegê-los; gerações de direitos.", "hoje": "Novos direitos: ambiente, dados, internet.", "conf": "Visões jusnaturalistas (direitos naturais e eternos). É o seu erro na questão 76.", "mod": "F5"}, {"autor": "Durkheim", "epoca": "França, 1858–1917", "obra": "As regras do método sociológico; Da divisão do trabalho social; O suicídio", "ideia": "Fato social; consciência coletiva; solidariedade mecânica × orgânica; anomia.", "hoje": "Normas sociais, crises e coesão.", "conf": "Weber (ação com sentido) e Marx (conflito de classes).", "mod": "S1"}, {"autor": "Weber", "epoca": "Alemanha, 1864–1920", "obra": "A ética protestante e o espírito do capitalismo; Economia e sociedade", "ideia": "Ação social com sentido (4 tipos); dominação tradicional, carismática e legal; Estado como monopólio da força legítima; desencantamento.", "hoje": "Burocracia, liderança política, religião e economia.", "conf": "Durkheim (fato social) e Marx (infraestrutura determina).", "mod": "S1"}, {"autor": "Marx", "epoca": "Alemanha/Inglaterra, 1818–1883", "obra": "Manifesto Comunista (com Engels); O capital", "ideia": "Materialismo histórico; luta de classes; mais-valia; alienação; ideologia; religião como 'ópio do povo'.", "hoje": "Exploração do trabalho, desigualdade, uberização.", "conf": "Weber (valores também movem a economia) e Durkheim (coesão).", "mod": "S1"}, {"autor": "Bourdieu", "epoca": "França, 1930–2002", "obra": "A distinção; A reprodução", "ideia": "Capital cultural, social e simbólico; habitus; escola reproduz desigualdades; violência simbólica.", "hoje": "Meritocracia, vestibular, desigualdade escolar.", "conf": "Marx (capital econômico) e Goffman (interação).", "mod": "S5"}, {"autor": "Goffman", "epoca": "Canadá/EUA, 1922–1982", "obra": "Manicômios, prisões e conventos; Estigma", "ideia": "Instituições totais; estigma; vida social como representação de papéis.", "hoje": "Prisões, internações, preconceito.", "conf": "Foucault (disciplina em rede).", "mod": "S5"}, {"autor": "Simmel", "epoca": "Alemanha, 1858–1918", "obra": "A metrópole e a vida mental (1903)", "ideia": "Excesso de estímulos na cidade grande gera atitude blasé, reserva e impessoalidade, mas também liberdade individual.", "hoje": "Pressa, indiferença e solidão urbanas.", "conf": "Bauman (modernidade líquida, mais recente).", "mod": "S5"}, {"autor": "Bauman", "epoca": "Polônia/Inglaterra, 1925–2017", "obra": "Modernidade líquida; Amor líquido", "ideia": "Fluidez das relações e identidades; sociedade de consumidores; insegurança; utopia como motor de mudança.", "hoje": "Redes sociais, relações descartáveis, consumo.", "conf": "Simmel (metrópole) e Stuart Hall (identidade).", "mod": "S5"}, {"autor": "Stuart Hall", "epoca": "Jamaica/Inglaterra, 1932–2014", "obra": "A identidade cultural na pós-modernidade", "ideia": "Identidades múltiplas, fragmentadas e móveis na globalização.", "hoje": "Diásporas, migrantes, juventudes.", "conf": "Bauman (fluidez em geral).", "mod": "S3"}, {"autor": "Saffioti", "epoca": "Brasil, 1934–2010", "obra": "A mulher na sociedade de classes; O poder do macho", "ideia": "Gênero, classe e raça como um 'nó'; patriarcado; violência de gênero; discriminação positiva de mulheres.", "hoje": "Lei Maria da Penha, delegacias da mulher, feminicídio.", "conf": "Beauvoir (filosofia existencialista). É o seu erro na questão 81.", "mod": "S4"}], "rep": [{"t": "Constituição Federal de 1988, art. 6º", "tipo": "Lei", "diz": "Lista os direitos sociais: educação, saúde, alimentação, trabalho, moradia, transporte, lazer, segurança, previdência social, proteção à maternidade e à infância e assistência aos desamparados.", "temas": "educação, saúde, moradia, fome, mobilidade, trabalho", "uso": "\"Embora o artigo 6º da Constituição de 1988 assegure a moradia como direito social, milhões de brasileiros vivem em áreas de risco, o que revela a distância entre a lei e a realidade.\"", "cuidado": "Cite o direito específico que tem a ver com o tema; listar todos é decorativo.", "mod": "H10"}, {"t": "Constituição Federal de 1988, art. 225", "tipo": "Lei", "diz": "Todos têm direito ao meio ambiente ecologicamente equilibrado, bem de uso comum do povo; cabe ao Poder Público e à coletividade defendê-lo para as presentes e futuras gerações.", "temas": "meio ambiente, clima, desastres, consumo", "uso": "\"O art. 225 atribui ao Poder Público e à coletividade o dever de proteger o ambiente para as futuras gerações; a ação individual, portanto, não substitui a pública.\"", "cuidado": "Bom para a C5: o próprio artigo nomeia os agentes.", "mod": "G4"}, {"t": "Constituição Federal de 1988, art. 227", "tipo": "Lei", "diz": "É dever da família, da sociedade e do Estado assegurar à criança, ao adolescente e ao jovem, com absoluta prioridade, direitos como vida, saúde, educação, convivência familiar, além de protegê-los de negligência, exploração e violência.", "temas": "infância, juventude, educação, trabalho infantil", "uso": "\"A 'absoluta prioridade' garantida pelo art. 227 contrasta com os índices de evasão escolar entre jovens de baixa renda.\"", "cuidado": "Complementa-se com o ECA (1990).", "mod": "H10"}, {"t": "Estatuto da Criança e do Adolescente (Lei 8.069/1990)", "tipo": "Lei", "diz": "Reconhece crianças e adolescentes como sujeitos de direitos, em condição peculiar de desenvolvimento, com proteção integral.", "temas": "infância, violência, educação, trabalho infantil", "uso": "\"Ao tratar a criança como sujeito de direitos, o ECA rompeu com a lógica menorista que via a infância pobre apenas como problema de polícia.\"", "cuidado": "Não atribua ao ECA penas ou números que você não conhece.", "mod": "H10"}, {"t": "Lei Maria da Penha (Lei 11.340/2006)", "tipo": "Lei", "diz": "Cria mecanismos para coibir a violência doméstica e familiar contra a mulher, como medidas protetivas de urgência.", "temas": "violência de gênero, feminicídio, família", "uso": "\"Mesmo com a Lei Maria da Penha, a violência doméstica persiste, o que indica que a punição precisa vir acompanhada de educação e de redes de acolhimento.\"", "cuidado": "Feminicídio é outra lei (2015, qualificadora; crime autônomo desde 2024).", "mod": "S4"}, {"t": "Leis 10.639/2003 e 11.645/2008", "tipo": "Lei", "diz": "Tornam obrigatório o ensino de história e cultura afro-brasileira e indígena nas escolas.", "temas": "racismo, intolerância religiosa, educação, povos indígenas", "uso": "\"A obrigatoriedade do ensino de cultura afro-brasileira, prevista desde 2003, ainda esbarra na falta de formação de professores, o que perpetua estereótipos.\"", "cuidado": "Ótimo para temas de intolerância religiosa e valorização cultural.", "mod": "S3"}, {"t": "Lei de Cotas (Lei 12.711/2012)", "tipo": "Lei", "diz": "Reserva vagas nas universidades e institutos federais para estudantes de escolas públicas, com subcotas por renda e para pretos, pardos e indígenas (e pessoas com deficiência, desde 2016).", "temas": "desigualdade, educação, racismo", "uso": "\"As cotas são um exemplo de discriminação positiva: tratam desigualmente os desiguais para aproximar a igualdade formal da igualdade real.\"", "cuidado": "Você mesmo concorre por esta lei; não confunda com Prouni.", "mod": "S4"}, {"t": "Lei Brasileira de Inclusão (Lei 13.146/2015)", "tipo": "Lei", "diz": "Estatuto da Pessoa com Deficiência: assegura acessibilidade e inclusão, e trata a deficiência como resultado da interação entre impedimentos e barreiras.", "temas": "inclusão, acessibilidade, educação, trabalho", "uso": "\"Ao definir a deficiência pela interação com barreiras, a Lei Brasileira de Inclusão desloca o problema do indivíduo para a sociedade que não se adapta.\"", "cuidado": "Use o conceito de barreira; ele dá argumento, não só citação.", "mod": "S4"}, {"t": "Marco Civil da Internet (2014) e LGPD (2018)", "tipo": "Lei", "diz": "O Marco Civil estabelece princípios para o uso da internet no Brasil; a Lei Geral de Proteção de Dados regula o tratamento de dados pessoais.", "temas": "tecnologia, privacidade, redes sociais, desinformação", "uso": "\"Apesar da LGPD, a coleta massiva de dados por plataformas ainda ocorre de forma pouco transparente para o usuário comum.\"", "cuidado": "Não invente artigos; cite a lei pelo objetivo.", "mod": "F7"}, {"t": "Declaração Universal dos Direitos Humanos (ONU, 1948)", "tipo": "Documento", "diz": "Afirma que todos os seres humanos nascem livres e iguais em dignidade e direitos (art. 1º), após os horrores da Segunda Guerra.", "temas": "qualquer tema de direitos", "uso": "\"Proclamada em 1948, a Declaração Universal partiu da dignidade comum a todos os seres humanos, princípio violado quando...\"", "cuidado": "Funciona em quase todo tema, por isso precisa ser bem amarrada ao argumento.", "mod": "F5"}, {"t": "Agenda 2030 e os 17 ODS (ONU, 2015)", "tipo": "Documento", "diz": "Plano da ONU com 17 Objetivos de Desenvolvimento Sustentável, como erradicar a pobreza, educação de qualidade, igualdade de gênero e ação climática.", "temas": "meio ambiente, pobreza, educação, gênero", "uso": "\"O ODS 4, que prevê educação de qualidade para todos até 2030, está longe de ser cumprido em regiões onde...\"", "cuidado": "Confira o número do ODS antes de citar: 4 educação, 5 gênero, 13 clima.", "mod": "G3"}, {"t": "Relatório Brundtland (1987)", "tipo": "Documento", "diz": "Definiu desenvolvimento sustentável como aquele que atende às necessidades do presente sem comprometer as das futuras gerações.", "temas": "meio ambiente, consumo, energia", "uso": "\"Segundo o conceito consagrado pelo Relatório Brundtland, o desenvolvimento só é sustentável se não comprometer as futuras gerações, o que o modelo atual de consumo ignora.\"", "cuidado": "Combina bem com Hans Jonas e com o art. 225.", "mod": "G4"}, {"t": "Zygmunt Bauman, modernidade líquida", "tipo": "Sociologia", "diz": "As relações, os vínculos e as identidades se tornaram frágeis e descartáveis, numa sociedade marcada pelo consumo e pela insegurança.", "temas": "redes sociais, relações, consumo, solidão", "uso": "\"Na modernidade líquida descrita por Bauman, os vínculos se desfazem com a facilidade de um clique, o que ajuda a explicar...\"", "cuidado": "É o repertório mais usado do ENEM: use com análise, não só com o nome.", "mod": "S5"}, {"t": "Émile Durkheim, anomia e fato social", "tipo": "Sociologia", "diz": "Anomia é o enfraquecimento das normas sociais, típico de crises; fatos sociais são exteriores e coercitivos.", "temas": "violência, saúde mental, crises, juventude", "uso": "\"Em contextos de crise, observa-se o que Durkheim chamou de anomia: as normas perdem força e os indivíduos ficam sem referências coletivas.\"", "cuidado": "Anomia não é 'anarquia' nem 'apatia'.", "mod": "S1"}, {"t": "Karl Marx, alienação", "tipo": "Sociologia", "diz": "No trabalho capitalista, o trabalhador não controla o processo nem o produto, e o trabalho se torna estranho a ele.", "temas": "trabalho, uberização, consumo", "uso": "\"A rotina do entregador por aplicativo, controlado por um algoritmo que ele não conhece, atualiza o conceito marxista de alienação.\"", "cuidado": "Evite tom panfletário; use o conceito como ferramenta de análise.", "mod": "S1"}, {"t": "Max Weber, desencantamento e burocracia", "tipo": "Sociologia", "diz": "A modernidade racionaliza a vida (cálculo, burocracia) e recua a explicação mágica do mundo; risco de uma 'jaula de ferro'.", "temas": "burocracia, serviços públicos, tecnologia", "uso": "\"A burocracia, que Weber via como forma racional de organização, torna-se obstáculo quando o cidadão não consegue acessar um direito básico...\"", "cuidado": "", "mod": "S1"}, {"t": "Adorno e Horkheimer, indústria cultural", "tipo": "Filosofia", "diz": "A cultura produzida como mercadoria padronizada torna o público passivo e conformado.", "temas": "mídia, streaming, publicidade, leitura", "uso": "\"A lógica da indústria cultural, descrita por Adorno e Horkheimer, aparece nas plataformas que entregam sempre mais do mesmo para manter o usuário conectado.\"", "cuidado": "", "mod": "F7"}, {"t": "Michel Foucault, vigilância e disciplina", "tipo": "Filosofia", "diz": "O poder disciplinar produz comportamentos pela vigilância; o panóptico faz o vigiado se vigiar.", "temas": "privacidade, dados, escola, prisões", "uso": "\"A sensação de ser observado o tempo todo nas redes reproduz o efeito do panóptico analisado por Foucault: passamos a nos vigiar.\"", "cuidado": "", "mod": "F7"}, {"t": "Byung-Chul Han, sociedade do cansaço", "tipo": "Filosofia", "diz": "Na sociedade do desempenho, o indivíduo se autoexplora acreditando ser livre; depressão e esgotamento são sintomas.", "temas": "saúde mental, trabalho, juventude, redes", "uso": "\"Como aponta Byung-Chul Han, o sujeito do desempenho se cobra sem limites, o que ajuda a explicar o aumento dos casos de esgotamento entre jovens.\"", "cuidado": "Não cite dados de saúde mental sem fonte.", "mod": "F7"}, {"t": "Hannah Arendt, banalidade do mal", "tipo": "Filosofia", "diz": "Grandes males podem ser praticados por pessoas comuns que deixam de pensar e apenas obedecem.", "temas": "violência, discurso de ódio, intolerância, obediência", "uso": "\"A banalidade do mal, conceito de Hannah Arendt, ajuda a entender como ataques virtuais se normalizam quando ninguém para para pensar no outro.\"", "cuidado": "", "mod": "F5"}, {"t": "Kant, dignidade humana", "tipo": "Filosofia", "diz": "As pessoas devem ser tratadas sempre como fim, nunca apenas como meio; têm dignidade, não preço.", "temas": "trabalho escravo, tráfico de pessoas, bioética, consumo", "uso": "\"Ao reduzir trabalhadores a peças descartáveis, essa prática fere o princípio kantiano de que a pessoa nunca pode ser tratada apenas como meio.\"", "cuidado": "", "mod": "F6"}, {"t": "Aristóteles, o homem como animal político", "tipo": "Filosofia", "diz": "O ser humano só se realiza plenamente na vida em comunidade (pólis).", "temas": "participação, cidadania, isolamento", "uso": "\"Se, como afirmava Aristóteles, o ser humano é um animal político, o isolamento de idosos representa uma negação da própria condição humana.\"", "cuidado": "", "mod": "F2"}, {"t": "Simone de Beauvoir, 'ninguém nasce mulher'", "tipo": "Filosofia", "diz": "O 'ser mulher' é construção social e histórica, não destino biológico.", "temas": "gênero, trabalho, violência, educação", "uso": "\"A ideia de Beauvoir de que não se nasce mulher, torna-se, ajuda a entender por que meninas ainda são afastadas das carreiras de ciências.\"", "cuidado": "A frase curta é amplamente citada; mantenha-a assim.", "mod": "F6"}, {"t": "Hans Jonas, princípio responsabilidade", "tipo": "Filosofia", "diz": "O poder da técnica exige uma ética voltada para as gerações futuras e a preservação da vida.", "temas": "clima, tecnologia, bioética", "uso": "\"O princípio responsabilidade de Hans Jonas exige que as decisões de hoje considerem quem ainda vai nascer.\"", "cuidado": "", "mod": "F6"}, {"t": "Sérgio Buarque de Holanda, 'homem cordial' (Raízes do Brasil, 1936)", "tipo": "Brasil", "diz": "O 'homem cordial' (de coração) age por laços pessoais e afetivos, confundindo o público e o privado, e não por regras impessoais.", "temas": "corrupção, patrimonialismo, serviços públicos", "uso": "\"A confusão entre o público e o privado, que Sérgio Buarque associou ao 'homem cordial', ainda se manifesta no uso de cargos para favorecer amigos.\"", "cuidado": "Cordial NÃO significa educado ou gentil: é o erro mais comum.", "mod": "H9"}, {"t": "Florestan Fernandes e o mito da democracia racial", "tipo": "Brasil", "diz": "Mostrou que a abolição não integrou a população negra e criticou a ideia de harmonia racial no Brasil.", "temas": "racismo, desigualdade, educação", "uso": "\"Como demonstrou Florestan Fernandes, a abolição sem integração deixou à população negra um legado de exclusão que se reflete até hoje nos indicadores sociais.\"", "cuidado": "", "mod": "S4"}, {"t": "José Murilo de Carvalho, cidadania no Brasil", "tipo": "Brasil", "diz": "No Brasil, os direitos sociais vieram antes da consolidação dos políticos e civis, criando uma cidadania vista como concessão do Estado.", "temas": "cidadania, participação política, direitos", "uso": "\"A cidadania brasileira, construída 'de cima para baixo', como analisou José Murilo de Carvalho, ajuda a explicar a baixa participação política.\"", "cuidado": "", "mod": "S4"}, {"t": "Milton Santos, globalização como perversidade", "tipo": "Brasil", "diz": "A globalização, como existe, produz desemprego, pobreza e desigualdade; é possível outra globalização, mais humana.", "temas": "desigualdade, tecnologia, trabalho, migração", "uso": "\"Milton Santos chamou de 'perversidade' a globalização que integra mercados e exclui pessoas, como mostram...\"", "cuidado": "", "mod": "G9"}, {"t": "Paulo Freire, educação bancária (Pedagogia do oprimido)", "tipo": "Brasil", "diz": "Critica a educação que apenas 'deposita' conteúdos nos alunos e defende uma educação dialógica e crítica, ligada à realidade do educando.", "temas": "educação, leitura, cidadania, tecnologia", "uso": "\"Uma escola que apenas transmite conteúdos reproduz a educação bancária criticada por Paulo Freire e não forma cidadãos críticos.\"", "cuidado": "", "mod": "S5"}, {"t": "Pierre Bourdieu, capital cultural", "tipo": "Sociologia", "diz": "A escola valoriza a herança cultural das classes altas e transforma desigualdade social em 'mérito'.", "temas": "educação, vestibular, meritocracia, leitura", "uso": "\"Segundo Bourdieu, a escola premia o capital cultural trazido de casa, o que desmonta a ideia de que o desempenho depende só do esforço.\"", "cuidado": "", "mod": "S5"}, {"t": "Ailton Krenak, Ideias para adiar o fim do mundo (2019)", "tipo": "Brasil", "diz": "Critica a ideia de uma humanidade separada da natureza e valoriza os modos de vida indígenas.", "temas": "meio ambiente, povos indígenas, consumo", "uso": "\"Ailton Krenak questiona a ideia de uma humanidade separada da Terra, separação que está na raiz da crise ambiental.\"", "cuidado": "Não invente frases do autor; use a ideia.", "mod": "G4"}, {"t": "Habermas, esfera pública", "tipo": "Filosofia", "diz": "A democracia depende de um espaço de debate livre em que vença o melhor argumento.", "temas": "fake news, polarização, democracia", "uso": "\"A desinformação corrói a esfera pública descrita por Habermas, em que decisões deveriam nascer do melhor argumento, e não da mentira mais compartilhada.\"", "cuidado": "", "mod": "F7"}], "con": [{"t": "A terra no Brasil", "p": "Por que a terra é tão concentrada no Brasil, e o que se fez sobre isso?", "elos": [{"mod": "H7", "t": "Sesmarias: grandes doações de terra a quem tinha recursos."}, {"mod": "H8", "t": "Lei de Terras (1850): terra só por compra; pobres e futuros libertos excluídos."}, {"mod": "G5", "t": "Modernização conservadora: máquinas sem reforma agrária, êxodo rural."}, {"mod": "G5", "t": "Constituição de 1988: função social e desapropriação."}, {"mod": "S4", "t": "Movimentos sociais (MST) pressionam por reforma agrária."}], "why": "O ENEM mistura História e Geografia: um texto de 1850 e uma pergunta sobre conflito atual."}, {"t": "Trabalho: da escravidão ao aplicativo", "p": "Como as formas de explorar e de proteger o trabalho mudaram?", "elos": [{"mod": "H7", "t": "Escravidão africana e indígena na colônia."}, {"mod": "H8", /* ---------- derived ---------- */
function modStats(mid){
  const m=M[mid]; let done=0, ok=0;
  m.qs.forEach(id=>{ const a=S.ans[id]; if(a){done++; if(a.ok) ok++;} });
  return {done, ok, n:m.qs.length, read:!!S.read[mid]};
}
function lineStats(L){
  let done=0,ok=0,n=0; DATA.modules.filter(m=>m.line===L).forEach(m=>{const s=modStats(m.id); done+=s.done; ok+=s.ok; n+=s.n;});
  return {done,ok,n};
}
function volStats(vol){
  let done=0,ok=0; DATA.questions.filter(q=>q.vol===vol).forEach(q=>{const a=S.ans[q.id]; if(a){done++; if(a.ok) ok++;}});
  return {done,ok};
}
function dueCards(vol){ const t=today(); return DATA.cards.filter(c=>(!vol||c.vol===vol) && (!S.cards[c.id] || S.cards[c.id].due<=t)); }
function daysLeft(){ const n=new Date(); const a=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()); const b=Date.UTC(2026,10,8); return Math.max(0,Math.round((b-a)/86400000)); }
function priority(m){
  const s=modStats(m.id);
  let p={A:3,B:2,C:1}[m.faixa];
  if(ERRMOD[m.id]) p+=2;
  if(m.vol==='FS') p+=1.5;
  if(s.done===s.n){ if(s.ok/s.n<0.67) p+=2.5; else p-=10; }
  if(s.read && s.done<s.n) p+=1;
  return p;
}
function nextModules(k){ return DATA.modules.slice().sort((a,b)=>priority(b)-priority(a)).filter(m=>priority(m)>-5).slice(0,k); }

async function askTutor(out,prompt){
  if(!sample){ out.innerHTML='<p class="empty">O tutor não está disponível nesta visualização.</p>'; return; }
  out.innerHTML='<div class="tutor-out">Pensando…</div>'; const box=out.firstChild;
  try{ const r=await sample(prompt,{modelTier:'default',cache:false,onText:({text})=>{box.textContent=text;}}); box.textContent=r.text; }
  catch(e){ box.textContent = e&&e.code==='not_granted' ? 'Você não autorizou o tutor nesta página. Ele pode ser liberado no menu de permissões do artefato.' : e&&e.code==='rate_limited' ? 'Muitas perguntas seguidas. Espere um minuto e tente de novo.' : (e&&e.text) || 'Não consegui responder agora. Tente de novo em instantes.'; }
}

/* ---------- question card ---------- */
function questionCard(el,q,opts={}){
  const prev=S.ans[q.id];
  const st={tries:[],locked:false};
  el.dataset.qid=q.id;
  const L='ABCDE';
  function paint(){
    const reveal=st.locked;
    el.innerHTML=`<div class="q lc-${q.mod?M[q.mod].line:(q.vol==='HG'?'H':'F')}">
      <div class="qh"><span><b>Questão ${q.n}</b> <span class="muted">· ${q.kind==='extra'?'extra do app':'volume '+(q.vol==='HG'?'1':'2')}</span></span><span class="chip">${esc(q.tag)}</span></div>
      ${q.base.length?`<blockquote>${q.base.map(p=>`<p>${p}</p>`).join('')}</blockquote>`:''}
      ${q.src?`<div class="qsrc">(${q.src})</div>`:''}
      <p class="cmd">${q.cmd}</p>
      <div class="alts">${q.alts.map((a,i)=>{const k=L[i]; let c=''; if(reveal){ c = k===q.ans?'right':(st.tries.includes(k)?'wrong':'dim'); } else if(st.tries.includes(k)) c='wrong';
        return `<button class="alt ${c}" data-k="${k}" ${reveal||st.tries.includes(k)?'disabled':''}><span class="L">${k}</span><span>${a}</span></button>`}).join('')}</div>
      <div class="fbz"></div></div>`;
    const fbz=el.querySelector('.fbz');
    if(!reveal && st.tries.length===1){
      const k=st.tries[0], tr=q.traps[k];
      fbz.innerHTML = tr ? `<div class="fb trap"><strong>Armadilha: ${TRAPS[tr].name}.</strong> ${TRAPS[tr].tip} Você tem mais uma tentativa.</div>` : `<div class="fb no"><strong>Ainda não.</strong> Releia o comando, traduza o texto numa frase sua e tente de novo. Você tem mais uma tentativa.</div>`;
    }
    if(reveal){
      const first=st.tries[0]; const okFirst=first===q.ans;
      fbz.innerHTML=`<div class="fb ${okFirst?'ok':'no'}"><strong>${okFirst?'Certa de primeira.':(st.tries.includes(q.ans)?'Certa na segunda tentativa. Conta como erro na sua estatística.':'Gabarito: '+q.ans+'.')}</strong> ${okFirst?'':'Leia o porquê de cada alternativa.'}</div>
        <div class="ex">${L.split('').map(k=>`<div class="${k===q.ans?'c':''}"><span class="L">${k}</span><span>${q.ex[k]||''}${q.traps[k]?`<span class="tg">${TRAPS[q.traps[k]].name}</span>`:''}</span></div>`).join('')}</div>
        <div class="meta">Habilidade ${esc(q.hab)} · dificuldade ${esc(q.dif)}${prev&&opts.showPrev!==false?` · primeira resposta registrada: ${prev.first} (${prev.ok?'certa':'errada'})`:''}</div>
        <div class="qtools"><button class="chipbtn mk" aria-pressed="${!!S.marks[q.id]}">${S.marks[q.id]?'★ marcada para revisar':'☆ revisar depois'}</button>${S.ans[q.id]&&S.ans[q.id].ok?`<button class="chipbtn ch" aria-pressed="${!!S.chute[q.id]}">${S.chute[q.id]?'chute: vai para o caderno de erros':'acertei no chute'}</button>`:''}</div>
        <div class="row" style="margin-top:10px">${prev?'<button class="btn redo">Tentar de novo (não muda a estatística)</button>':''}<button class="btn tex tutor-only">Explique de outro jeito</button></div><div class="tx"></div>`;
      const mk=fbz.querySelector('.mk'); mk.onclick=()=>{ S.marks[q.id]=!S.marks[q.id]; if(!S.marks[q.id]) delete S.marks[q.id]; save(); paint(); };
      const ch=fbz.querySelector('.ch'); if(ch) ch.onclick=()=>{ S.chute[q.id]=!S.chute[q.id]; if(!S.chute[q.id]) delete S.chute[q.id]; save(); paint(); };
      const rd=fbz.querySelector('.redo'); if(rd) rd.onclick=()=>{ st.tries=[]; st.locked=false; paint(); };
      const tb=fbz.querySelector('.tex'); if(tb) tb.onclick=()=>askTutor(fbz.querySelector('.tx'),`Você é um tutor de ENEM falando com o estudante, em português do Brasil, texto simples sem markdown, até 150 palavras. Explique de um jeito diferente e mais concreto por que a alternativa ${q.ans} é a correta${first!==q.ans?` e por que a ${first}, que ele marcou, está errada`:''}. Não invente fatos além do material.\n\nTexto-base: ${strip(q.base.join(' '))}\nFonte: ${strip(q.src)}\nComando: ${strip(q.cmd)}\nAlternativas: ${q.alts.map((a,i)=>L[i]+') '+strip(a)).join(' | ')}\nGabarito comentado: ${L.split('').map(k=>k+': '+strip(q.ex[k]||'')).join(' | ')}`);
    }
    el.querySelectorAll('.alt:not(:disabled)').forEach(b=>b.onclick=()=>pick(b.dataset.k));
  }
  function pick(k){
    st.tries.push(k);
    if(st.tries.length===1 && !S.ans[q.id]){ S.ans[q.id]={first:k,ok:k===q.ans,t:Date.now(),src:opts.src||'estudo',trap:k!==q.ans?(q.traps[k]||'conteudo'):null}; bump(); save(); }
    if(k===q.ans || st.tries.length>=2){ st.locked=true; opts.onDone&&opts.onDone(st.tries[0]===q.ans); }
    paint();
  }
  if(prev && opts.resume!==false){ st.tries=[prev.first]; if(prev.ok){st.locked=true;} else { st.tries=[prev.first]; } }
  if(prev && !prev.ok && opts.resume!==false){ st.locked=true; }
  paint();
}

  app.querySelectorAll('.game').forEach(b=>b.onclick=()=>go('game',{g:b.dataset.g}));

  ak.innerHTML=`<div><div class="eyebrow">levar para o Anki</div><p style="font-family:var(--read);margin:6px 0 0">Os ${nAK} cartões do app (revisão de véspera, cartões-resumo das estações e autores) num texto que o Anki importa direto: no Anki do computador, <b>Arquivo → Importar</b>, escolha o arquivo e confirme <b>Tabulação</b> como separador. Cada cartão vem com a etiqueta da estação.</p></div>

    try{ navigator.clipboard.writeText(AK).then(()=>{ $('#akSt').textContent='Copiado. Cole num arquivo de texto (.txt) e importe no Anki.'; },fb); }catch(e){ fb(); } };
  if($('#akFile')) $('#akFile').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([AK],{type:'text/plain'})); a.download='humanas-de-ouro-anki.txt'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); $('#akSt').textContent='Arquivo salvo nos downloads.'; };

function ankiText(){
  const cl=s=>strip(String(s)).replace(/[\t\r\n]+/g,' ').trim(); const rows=[];
  DATA.cards.forEach(c=>rows.push([cl(c.q),cl(c.a),'humanas-de-ouro véspera '+(c.vol||'')]));
  DATA.modules.forEach(m=>(m.resumo||[]).forEach(([k,v])=>rows.push([`${cl(k)} (${m.id} · ${cl(m.title)})`,cl(v),'humanas-de-ouro '+m.id])));
  DATA.quem.forEach(q=>rows.push([`Quem? ${cl(q.conceito)} · palavras: ${cl(q.palavras)}`,cl(q.autor),'humanas-de-ouro autores']));

function runRounds({key,rounds,secs,renderRound}){

    $('#back').onclick=()=>{clearInterval(gameTimer);go('arena');};

      bump(); if(ok){ hits++; streak++; score+= 100 + Math.round(left/ (secs||1)) + (streak>=3?25:0); } else { streak=0; if(missLine) miss.push(missLine); }
      const nb=document.createElement('div'); nb.className='row'; nb.style.marginTop='14px'; nb.innerHTML='<button class="btn primary" id="nx">Próxima →</button>'; $('#rd').appendChild(nb); $('#nx').focus(); $('#nx').onclick=()=>{i++;next();}; };

function optsHTML(list){ return `<div class="opts">${list.map(o=>`<button class="opt" data-ok="${o.ok?1:0}">${o.label}</button>`).join('')}</div>`; }

}
function confusers(autor){ const F=DATA.fichas||[], names=DATA.quem.map(x=>x.autor); const me=F.find(f=>f.autor===autor); const out=new Set();
  const hit=(txt,nm)=>{ if(!txt) return false; if(txt.includes(nm)) return true; const last=nm.split(' ').pop(); return last.length>3 && txt.includes(last); };
  if(me) names.forEach(nm=>{ if(nm!==autor && hit(me.conf,nm)) out.add(nm); });
  F.forEach(f=>{ if(f.autor!==autor && hit(f.conf,autor)) out.add(f.autor); });
  const close=[...out]; const same=me?F.filter(f=>f.autor!==autor && f.mod===me.mod && !out.has(f.autor)).map(f=>f.autor):[];
  return shuffle(close).concat(shuffle(same)).filter(n=>names.includes(n)); }

const CITIES=[['Brasília',-3],['Manaus',-4],['Rio Branco',-5],['Fernando de Noronha',-2],['Londres',0],['Paris',1],['Cairo',2],['Moscou',3],['Dubai',4],['Pequim',8],['Tóquio',9],['Sydney',10],['Nova York',-5],['Cidade do México',-6],['Los Angeles',-8]];
const fmtN = n => n.toLocaleString('pt-BR',{maximumFractionDigits:2});
function geoRound(){
  if(Math.random()<.5){
    const sc=[10000,25000,50000,100000,250000,500000,1000000,5000000][Math.floor(Math.random()*8)], cm=[2,3,4,5,6,8,12][Math.floor(Math.random()*7)];
    const km=cm*sc/100000;
    const asLen=x=> x>=1? fmtN(x)+' km' : fmtN(x*1000)+' m';
    const opts=[...new Set([km,km*10,km/10,cm*sc/1000])].filter(x=>x>0).slice(0,4);
    return {k:'escala',prompt:`Num mapa na escala 1 : ${sc.toLocaleString('pt-BR')}, duas cidades estão a ${cm} cm de distância. Qual a distância real?`,
      opts:shuffle(opts).map(x=>({label:asLen(x),ok:x===km})),
      why:`${cm} cm × ${sc.toLocaleString('pt-BR')} = ${(cm*sc).toLocaleString('pt-BR')} cm. Como 1 km = 100.000 cm, isso dá ${asLen(km)}.`};
  }
  let a,b; do{ a=CITIES[Math.floor(Math.random()*CITIES.length)]; b=CITIES[Math.floor(Math.random()*CITIES.length)]; }while(a===b);
  const h=Math.floor(Math.random()*24); const diff=b[1]-a[1]; let hb=h+diff, day='do mesmo dia';
  if(hb>=24){hb-=24;day='do dia seguinte';} if(hb<0){hb+=24;day='do dia anterior';}
  const lab=(hh,d)=>`${String(hh).padStart(2,'0')}h ${d}`;
  const wrong1=((h-diff)%24+24)%24, wrong2=((h+diff+ (diff>0?-2:2))%24+24)%24;
  const set=new Map(); set.set(lab(hb,day),true); [lab(wrong1,day),lab(wrong2,day),lab(hb,day==='do mesmo dia'?(diff>0?'do dia anterior':'do dia seguinte'):'do mesmo dia')].forEach(x=>{ if(!set.has(x)) set.set(x,false); });
  return {k:'fuso',prompt:`São ${String(h).padStart(2,'0')}h em ${a[0]} (UTC${a[1]>=0?'+':''}${a[1]}). Que horas são em ${b[0]} (UTC${b[1]>=0?'+':''}${b[1]})?`,
    opts:shuffle([...set].slice(0,4).map(([label,ok])=>({label,ok}))),
    why:`A diferença é de ${Math.abs(diff)} hora(s); ${b[0]} está ${diff>0?'a leste (adiantado)':diff<0?'a oeste (atrasado)':'no mesmo fuso'}. Horários padrão, sem horário de verão.`};
}
function gGeo(){
  const rounds=[]; for(let i=0;i<10;i++){ const r=geoRound(); r.missLine=`${r.prompt} <strong>${r.opts.find(o=>o.ok).label}.</strong> ${r.why}`; rounds.push(r); }
  runRounds({key:'geo',secs:25,rounds,
    renderRound(el,r,finish){ el.innerHTML=`<div class="prompt"><span class="k">${r.k==='escala'?'escala':'fuso horário'}</span>${r.prompt}</div>${optsHTML(r.opts.map(o=>({label:esc(o.label),ok:o.ok})))}`;
      bindOpts(el,finish,r.missLine,()=>{ const p=document.createElement('div'); p.className='why'; p.style.marginTop='10px'; p.textContent=r.why; el.appendChild(p); }); }});

function isoToday(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function planToday(){ return DATA.plan.find(p=>p.d===isoToday()); }
function taskDone(p,i){ const t=p.tasks[i]; if(t.k==='mod'){ const s=modStats(t.a); if(s.done===s.n) return true; } if(t.k==='prova'){ const [ex,ar]=t.a.split(':'); const ds=allRuns(ex).filter(runReal).map(r=>r.areas).join(''); if(ar.split('').every(a=>ds.includes(a))) return true; } return !!S.plan[p.d+'|'+i]; }
function planDone(p){ let d=0; p.tasks.forEach((t,i)=>{ if(taskDone(p,i)) d++; }); return {done:d,n:p.tasks.length}; }
function taskLabel(t){ if(t.k==='mod'){ const m=M[t.a]; return `${m.id} · ${m.title} <span class="muted">(teoria, cartões, V ou F e 5 questões)</span>`; } return esc(t.t); }
function taskGo(t){
  if(t.k==='mod') return ()=>go('mod',{id:t.a,tab:S.read[t.a]?'q':'teoria'});
  if(t.k==='game') return ()=>go('game',{g:t.a});
  if(t.k==='sim') return ()=>{ SIM=null; go('treino',{s:'sim',foco:t.a,n:/30/.test(t.t)?30:20}); };
  if(t.k==='recal') return ()=>go('treino',{s:'recal'});
  if(t.k==='erros') return ()=>go('treino',{s:'erros'});
  if(t.k==='bib') return ()=>go('biblioteca',{s:t.a});
  if(t.k==='painel') return ()=>go('painel');
  if(t.k==='prova') return ()=>go('provas');
  if(t.k==='provares') return ()=>{ const ex=t.a; go(allRuns(ex).some(r=>r.done)?'provares':'provas',{id:ex}); };
  if(t.k==='refazer') return ()=>go('treino',{s:'refazer'});
  return null;
}

/* ---- Busca ---- */
let IDX=null;
function buildIndex(){
  IDX=[];
  DATA.modules.forEach(m=>{ const d=document.createElement('div'); d.innerHTML=m.html; let sec='Introdução'; let buf='';
    const push=()=>{ if(buf.trim()) IDX.push({g:'Teoria',t:`${m.id} · ${sec}`,txt:buf,act:()=>go('mod',{id:m.id,tab:'teoria'})}); buf=''; };
    [...d.children].forEach(c=>{ if(c.tagName==='H4'){ push(); sec=c.textContent; } else buf+=' '+c.textContent; }); push();
    m.resumo.forEach(r=>IDX.push({g:'Glossário',t:strip(r[0]),txt:strip(r[1]),act:()=>go('biblioteca',{s:'glos',q:strip(r[0])})}));
  });
  DATA.questions.forEach(q=>IDX.push({g:'Questões',t:`Questão ${q.n} · ${q.mod||(q.kind==='simulado'?'simulado':'reforço')}`,txt:strip(q.base.join(' ')+' '+q.cmd),act:()=> q.mod? go('mod',{id:q.mod,tab:'q'}) : go('treino',{s:'sim'})}));
  DATA.fichas.forEach(f=>IDX.push({g:'Fichas de autor',t:f.autor,txt:strip(f.ideia+' '+f.obra+' '+f.hoje),act:()=>go('biblioteca',{s:'fichas',q:f.autor})}));
  DATA.rep.forEach(r=>IDX.push({g:'Repertório',t:strip(r.t),txt:strip(r.diz+' '+r.temas),act:()=>go('biblioteca',{s:'rep'})}));
  DATA.tl.forEach(e=>IDX.push({g:'Linha do tempo',t:e.ly,txt:strip(e.t),act:()=>go('biblioteca',{s:'tl'})}));
  DATA.con.forEach(c=>IDX.push({g:'Conexões',t:c.t,txt:c.p+' '+c.elos.map(e=>strip(e.t)).join(' '),act:()=>go('biblioteca',{s:'con'})}));
  DATA.vf.forEach(v=>IDX.push({g:'V ou F',t:`Estação ${v.mod}`,txt:strip(v.s),act:()=>go('mod',{id:v.mod,tab:'vf'})}));
  IDX.forEach(x=>x.n=norm(x.t+' '+x.txt));
}
function snippet(txt,qn){ const n=norm(txt); const i=n.indexOf(qn); if(i<0) return esc(txt.slice(0,160)); const a=Math.max(0,i-60), b=Math.min(txt.length,i+qn.length+100);
  return (a?'…':'')+esc(txt.slice(a,i))+'<mark>'+esc(txt.slice(i,i+qn.length))+'</mark>'+esc(txt.slice(i+qn.length,b))+(b<txt.length?'…':''); }
function vBusca(){
  if(!IDX) buildIndex();
  const q=(param&&param.q)||''; const qn=norm(q.trim()); $('#sq').value=q;
  const terms=qn.split(/\s+/).filter(Boolean);
  const hits=terms.length? IDX.filter(x=>terms.every(t=>x.n.includes(t))) : [];
  const groups={}; hits.forEach(h=>{ (groups[h.g]=groups[h.g]||[]).push(h); });
  const order=['Teoria','Glossário','Fichas de autor','Repertório','Conexões','Linha do tempo','V ou F','Questões'];
  app.innerHTML=`<div class="sec-title"><h2>Busca: “${esc(q)}”</h2><span class="eyebrow">${hits.length} resultados</span></div>
    ${hits.length?order.filter(g=>groups[g]).map(g=>`<div class="sec-title" style="margin-top:18px"><h2 style="font-size:17px">${g}</h2><span class="eyebrow">${groups[g].length}</span></div><div class="res">${groups[g].slice(0,12).map((h,i)=>`<button data-g="${g}" data-i="${i}"><small>${esc(h.t)}</small>${snippet(h.txt.trim(),terms[0])}</button>`).join('')}</div>`).join('')
    :`<p class="empty">Nada encontrado. Tente uma palavra só, sem acento ou no singular (ex.: "contrato", "fuso", "Weber").</p>`}`;
  app.querySelectorAll('.res button').forEach(b=>b.onclick=()=>groups[b.dataset.g][+b.dataset.i].act());
}

function lsGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function bump(n=1){ const d=isoToday(); S.act[d]=(S.act[d]||0)+n; }
function lastDays(n){ const out=[]; for(let i=n-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`); } return out; }
function dayStreak(){ const ds=lastDays(60).reverse(); let i=0; if(!(S.act[ds[0]]>0)) i=1; let n=0; for(;i<ds.length;i++){ if(S.act[ds[i]]>0) n++; else break; } return n; }
function errList(){

}

  if(m){ let b=m[1].replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b+='='; const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0)); const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw')); o=JSON.parse(await new Response(ds).text()); }

const EX = DATA.exams;
const AREAS = {L:{name:'Linguagens',a:1,b:45},H:{name:'Ciências Humanas',a:46,b:90},N:{name:'Ciências da Natureza',a:91,b:135},M:{name:'Matemática',a:136,b:180}};
const imgUrl = (ex,n) => `provas/${ex}/${EX[ex].img[n].f}`;
function pvState(ex){ S.pv=S.pv||{}; S.pv[ex]=S.pv[ex]||{runs:[],notes:{}}; return S.pv[ex]; }
function areaNums(areas){ const out=[]; areas.split('').forEach(a=>{ for(let n=AREAS[a].a;n<=AREAS[a].b;n++) out.push(n); }); return out; }
function examAreas(ex){ return EX[ex].dia===1?'LH':'NM'; }
function runLimit(areas){ if(areas.length===2) return areas==='LH'?330:300; return 150; }
function synthRun(ex){ const e=EX[ex]; if(!e.his) return null; return {id:'papel',areas:'LH',mode:'prova',ans:Object.assign({},e.his),flag:{},cut:{},start:Date.parse('2026-09-20T12:00:00-03:00'),done:true,end:Date.parse('2026-09-21T12:00:00-03:00'),time:null,papel:true}; }
function runReal(r){ if(!r||!r.done) return false; if(r.papel) return true; const n=areaNums(r.areas).length; return Object.keys(r.ans||{}).length>=Math.ceil(n*0.6); }
function allRuns(ex){ const st=pvState(ex); const r=st.runs.slice(); const s=synthRun(ex); if(s) r.unshift(s); return r; }
function scoreRun(ex,run){
  const e=EX[ex], res={total:0,ok:0,blank:0,anul:0,areas:{},wrong:[],flagWrong:0,flagOk:0,thirds:[[0,0],[0,0],[0,0]]};
  const nums=areaNums(run.areas);
  run.areas.split('').forEach(a=>res.areas[a]={n:0,ok:0,blank:0});
  nums.forEach((n,i)=>{ const k=e.key[n]; const a=Object.keys(AREAS).find(x=>n>=AREAS[x].a&&n<=AREAS[x].b); const r=res.areas[a];
    if(k==null){ res.anul++; return; }
    r.n++; res.total++; const g=run.ans[n]; const th=Math.min(2,Math.floor(((n-AREAS[a].a)/45)*3)); res.thirds[th][1]++;
    if(!g){ r.blank++; res.blank++; res.wrong.push(n); return; }
    if(g===k){ r.ok++; res.ok++; res.thirds[th][0]++; if(run.flag&&run.flag[n]) res.flagOk++; }
    else { res.wrong.push(n); if(run.flag&&run.flag[n]) res.flagWrong++; }
  });
  return res;
}
function runLabel(run){ if(run.id==='papel') return 'Diagnóstico no papel (set/2026)'; return `${new Date(run.start).toLocaleDateString('pt-BR')} · ${run.areas.split('').map(a=>AREAS[a].name.split(' ').pop()).join(' + ')} · ${run.papel?'lançada do papel':run.mode==='estudo'?'modo estudo':'modo prova'}${runReal(run)?'':' · incompleta'}`; }

  let run; if(param.run==='papel') run=runs.find(r=>r.id==='papel'); else if(param.run!=null && pvState(id).runs[param.run] && pvState(id).runs[param.run].done) run=pvState(id).runs[param.run]; if(!run) run=runs[runs.length-1];
  const sc=scoreRun(id,run); const filt=param.f||'erradas'; const st=pvState(id);
  const list=areaNums(run.areas).filter(n=>{ const g=run.ans[n], k=e.key[n]; if(filt==='erradas') return k!=null && g!==k; if(filt==='duvida') return run.flag&&run.flag[n]; if(filt==='certas') return k!=null && g===k; return true; });
  const th=sc.thirds.map(([o,t])=>t?Math.round(100*o/t):0);
  app.innerHTML=`<button class="back" id="back">← provas</button>
  <div class="pagehead"><div><div class="eyebrow">correção pelo gabarito oficial · ${runLabel(run)}</div><h1>${e.title}</h1></div>
    ${run.id!=='papel'?`<button class="btn ghost" id="delrun">Apagar esta tentativa</button>`:''}${runs.length>1?`<select id="runsel" aria-label="Escolher tentativa">${runs.map((r,i)=>`<option value="${i}" ${r===run?'selected':''}>${runLabel(r)}</option>`).join('')}</select>`:''}</div>
  <div class="resgrid">
    ${Object.entries(sc.areas).map(([a,v])=>`<div class="panel kpi"><span class="lbl">${AREAS[a].name}</span><span class="big3">${v.ok}<small>/${v.n}</small></span><div class="bar2"><i style="width:${pct(v.ok,v.n)}%"></i></div><span class="mono muted" style="font-size:12px">${pct(v.ok,v.n)}% · ${v.blank} em branco</span></div>`).join('')}
    <div class="panel kpi"><span class="lbl">tempo usado</span><span class="big3">${run.time?Math.round(run.time/60000)+'<small> min</small>':'—'}</span><span class="mono muted" style="font-size:12px">${run.time?`${(run.time/60000/Math.max(1,Object.keys(run.ans).length)).toFixed(1)} min por questão respondida`:'feita no papel'}</span></div>
  </div>
  <div class="grid2" style="margin-top:14px">
    <div class="panel"><div class="eyebrow">ritmo dentro de cada área</div><p class="muted" style="font-size:13.5px">Acerto no primeiro, no segundo e no último terço das questões. Queda forte no fim indica cansaço ou falta de tempo.</p>
      <div class="bars">${['início','meio','fim'].map((l,i)=>`<div class="brow"><span>${l}</span><span class="track2"><i style="width:${th[i]}%"></i></span><span class="mono">${th[i]}%</span></div>`).join('')}</div></div>
    <div class="panel"><div class="eyebrow">certeza × acerto</div>${Object.keys(run.flag||{}).length?`<p style="font-family:var(--read);margin:8px 0 0">Das questões que você marcou como dúvida, acertou <b>${sc.flagOk}</b> e errou <b>${sc.flagWrong}</b>. Os outros <b>${sc.wrong.length-sc.flagWrong}</b> erros foram em questões que você achou que sabia: são os mais perigosos, porque você não volta nelas.</p>`:`<p class="muted" style="margin:8px 0 0">Na próxima prova, marque as questões de dúvida: a correção vai mostrar se as suas certezas estão certas.</p>`}
      <p class="muted" style="font-size:12.5px;margin-bottom:0">${sc.anul?`${sc.anul} questão(ões) anulada(s) fora da conta. `:''}Acertos não viram nota diretamente: a TRI pesa cada item.</p></div>
  </div>
  <div class="sec-title"><h2>Cartão corrigido</h2><span class="eyebrow">toque para ver a questão</span></div>
  <div class="panel">${cardGrid(id,run,areaNums(run.areas)).replace('cartão-resposta','')}</div>
  <div class="sec-title"><h2>Revisão</h2><div class="filters" style="margin:0">${[['erradas','Erradas e em branco'],['duvida','Marcadas como dúvida'],['certas','Certas'],['todas','Todas']].map(([k,l])=>`<button class="chipbtn" data-f="${k}" ${filt===k?'style="background:var(--ink);color:var(--surface)"':''}>${l}</button>`).join('')}</div></div>
  <div id="rvlist"></div>
  <div class="row" style="margin-top:18px"><button class="btn" id="toPv">Voltar às provas</button>${run.papel?'':`<button class="btn" id="delrun">Apagar esta tentativa</button>`}</div>`;
  $('#back').onclick=$('#toPv').onclick=()=>go('provas');
  const rs=$('#runsel'); if(rs) rs.onchange=()=>{ const r=runs[+rs.value]; const i=pvState(id).runs.indexOf(r); go('provares',{id,run:r.id==='papel'?'papel':i,f:filt}); };
  const dlb=$('#delrun'); if(dlb) dlb.onclick=()=>{ if(!dlb.dataset.ok){ dlb.dataset.ok=1; dlb.textContent='Toque de novo para apagar'; return; } const ix=pvState(id).runs.indexOf(run); if(ix>=0){ pvState(id).runs.splice(ix,1); save(); toast('Tentativa apagada.'); } go('provas'); };
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ param.f=b.dataset.f; vProvaRes(); });
  app.querySelectorAll('[data-go-q]').forEach(b=>b.onclick=()=>{ const n=areaNums(run.areas)[+b.dataset.goQ]; const el=document.getElementById('rv-'+n); if(el){ el.open=true; el.scrollIntoView({behavior:'smooth',block:'start'}); } else { param.f='todas'; vProvaRes(); setTimeout(()=>{ const x=document.getElementById('rv-'+n); if(x){ x.open=true; x.scrollIntoView({block:'start'}); } },60); } });
  const dr=$('#delrun'); if(dr) dr.onclick=()=>{ if(!dr.dataset.c){ dr.dataset.c=1; dr.textContent='Toque de novo para apagar'; return; } const i=st.runs.indexOf(run); st.runs.splice(i,1); save(); go('provas'); };
  const box=$('#rvlist');
  if(!list.length){ box.innerHTML='<p class="empty">Nada nesta lista.</p>'; return; }
  list.forEach(n=>{ const g=run.ans[n], k=e.key[n]; const d=document.createElement('details'); d.className='err'; d.id='rv-'+n;
    const status=k==null?'anulada':!g?'em branco':g===k?'certa':'errada';
    d.innerHTML=`<summary><span class="chip" style="background:${status==='certa'?'var(--ok-soft)':status==='anulada'?'var(--sunk)':'var(--bad-soft)'};color:${status==='certa'?'var(--ok)':status==='anulada'?'var(--muted)':'var(--bad)'}">${status}</span><b>Questão ${n}</b><span class="mono muted" style="font-size:12px">sua: ${g||'—'} · gabarito: ${k||'anulada'}</span>${run.flag&&run.flag[n]?'<span class="mono" style="font-size:11px;color:var(--warn)">dúvida</span>':''}${st.notes[n]?'<span class="done-mark">● regra escrita</span>':''}</summary><div class="inner"></div>`;
    box.appendChild(d);
    d.addEventListener('toggle',()=>{ if(!d.open||d.dataset.ok) return; d.dataset.ok=1; const sh=Object.entries(e.shared||{}).find(([kk])=>{ const [a,b]=kk.split('-').map(Number); return n>=a&&n<=b; });
      d.querySelector('.inner').innerHTML=`${sh?`<figure class="qimg shared"><img loading="lazy" src="provas/${id}/${sh[1].f}" alt="Texto-base" width="${sh[1].w}" height="${sh[1].h}"></figure>`:''}<figure class="qimg ${e.img[n].w>1000?'wide':''}"><img loading="lazy" src="${imgUrl(id,n)}" alt="Questão ${n}" width="${e.img[n].w}" height="${e.img[n].h}"></figure>
        <div class="bubbles small">${'ABCDE'.split('').map(L=>`<div class="bub"><span class="bL ${L===k?'right':''} ${L===g&&g!==k?'wrong':''}">${L}</span></div>`).join('')}</div>
        <div class="row tutor-only" style="margin-top:10px"><button class="btn gold xp">Explicar com o tutor</button></div><div class="xo"></div>
        <label class="eyebrow" for="pn-${id}-${n}" style="display:block;margin-top:12px">a regra que teria evitado este erro</label><textarea id="pn-${id}-${n}" placeholder="Ex.: em proporção, conferir as unidades antes de multiplicar.">${esc(st.notes[n]||'')}</textarea>`;
      d.querySelector('.xp').onclick=()=>explainOfficial(d.querySelector('.xo'),id,n,g);
      const ta=d.querySelector('textarea'); let tm; ta.addEventListener('input',()=>{ clearTimeout(tm); tm=setTimeout(()=>{ const v=ta.value.trim(); if(v) st.notes[n]=v; else delete st.notes[n]; save(); },700); });
    });
  });
  const first=box.querySelector('details'); if(first&&filt==='erradas') first.open=true;
}
async function imgBlobs(src){
  const img=new Image(); img.src=src; await img.decode();
  const parts=[]; const W=img.naturalWidth, H=img.naturalHeight; const maxH=Math.round(W*1.6);
  const n=Math.min(3,Math.ceil(H/maxH));
  for(let i=0;i<n;i++){ const y0=Math.max(0,Math.round(i*H/n)-30), y1=Math.min(H,Math.round((i+1)*H/n)+30);
    const c=document.createElement('canvas'); c.width=W; c.height=y1-y0; const cx=c.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,W,c.height); cx.drawImage(img,0,y0,W,y1-y0,0,0,W,y1-y0);
    parts.push(await new Promise(r=>c.toBlob(r,'image/png'))); }
  return parts;
}
function officialPrompt(id,n,his,sh){ const e=EX[id], k=e.key[n]; return `Você é um professor de cursinho preparando o estudante para o ENEM 2026, em português do Brasil, texto simples sem markdown. As imagens são, em ordem, ${sh?'o texto-base compartilhado e ':''}a questão ${n} do ${e.title} (Caderno Azul), recortada do caderno oficial, possivelmente em mais de uma parte. Gabarito oficial: ${k==null?'questão anulada pelo Inep':k}. ${his?`Ele marcou ${his}.`:'Ele deixou em branco.'}
Faça: 1) Em uma linha, o que a questão pede e qual conteúdo da Matriz ela cobra. 2) A resolução passo a passo até chegar ao gabarito, com as contas conferidas, se houver. 3) ${his&&his!==k?`Por que a ${his} está errada e qual raciocínio provavelmente levou a ela.`:'Qual alternativa é o distrator mais perigoso e por quê.'} 4) Uma regra curta para não errar de novo. Se alguma parte da imagem estiver ilegível, diga isso em vez de inventar. Máximo de 280 palavras.`; }
async function explainOfficial(out,id,n,his){
  if(!sample){ out.innerHTML='<p class="empty">O tutor não está disponível nesta visualização.</p>'; return; }
  const e=EX[id], k=e.key[n];
  out.innerHTML='<div class="tutor-out">Lendo a questão…</div>'; const box=out.firstChild;
  try{
    const lim=await sample.limits().catch(()=>null);
    if(!lim||!lim.images){ box.textContent='Esta visualização não permite enviar imagens ao tutor. Copie o número da questão e peça a explicação no chat do projeto.'; return; }
    let blobs=await imgBlobs(imgUrl(id,n)); const sh=Object.entries(e.shared||{}).find(([kk])=>{ const [a,b]=kk.split('-').map(Number); return n>=a&&n<=b; });
    if(sh) blobs=(await imgBlobs(`provas/${id}/${sh[1].f}`)).concat(blobs);
    blobs=blobs.slice(0,lim.images.maxCount||3);
    const prompt=officialPrompt(id,n,his,sh);
    const r=await sample(prompt,{images:blobs,modelTier:'complex',cache:false,onText:({text})=>{box.textContent=text;}}); box.textContent=r.text;
  }catch(err){ box.textContent= err&&err.code==='not_granted'?'Você não autorizou o tutor nesta página. Libere no menu de permissões do artefato.': err&&err.code==='rate_limited'?'Muitas perguntas seguidas. Espere um minuto.': (err&&err.text)||'Não consegui explicar agora. Tente de novo em instantes.'; }
}
document.addEventListener('keydown',e=>{
  if(view!=='prova') return; const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select') return;
  const k=e.key; if(/^[a-eA-E]$/.test(k)){ const b=app.querySelector(`.bL[data-L="${k.toUpperCase()}"]:not(:disabled)`); if(b){ e.preventDefault(); b.click(); } }
  else if(k==='ArrowRight'){ const b=$('#pvnext'); if(b&&!b.disabled) b.click(); } else if(k==='ArrowLeft'){ const b=$('#pvprev'); if(b&&!b.disabled) b.click(); }
  else if(k==='m'||k==='M'){ const b=$('#pvflag'); if(b) b.click(); }
},true);

render();
</script>
