lação para todos."], "ans": "C", "ex": {"A": "Termo oposto: o texto diz o contrário.", "B": "Exagero: as fronteiras continuam fortes para pessoas.", "C": "Capital circula livremente; pessoas pobres encontram muros e barreiras.", "D": "Termo oposto: os fluxos financeiros são intensos.", "E": "Termo oposto: o texto mostra desigualdade de circulação."}, "hab": "H7, H9", "dif": "fácil", "mod": "G9", "kind": "extra", "traps": {"A": "oposto", "B": "exagero", "D": "oposto", "E": "oposto"}}, {"id": "F1.4", "vol": "FS", "n": "F1.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Um professor ateniense do século V a.C., que cobrava pelas aulas, ensinava os jovens a defender, com igual habilidade, a tese de que uma lei era justa e a tese contrária. Segundo ele, sobre cada assunto há sempre dois discursos opostos, e o critério de verdade é o próprio ser humano."], "src": "Texto elaborado para esta apostila.", "cmd": "A posição desse professor está associada", "alts": ["aos sofistas, como Protágoras, e ao relativismo.", "a Sócrates, que buscava definições universais.", "a Parmênides, para quem o ser é imóvel.", "a Platão, que defendia o conhecimento das Ideias eternas.", "aos pré-socráticos naturalistas, que buscavam a arché."], "ans": "A", "ex": {"A": "Aulas pagas, retórica de dois discursos e 'o homem é a medida de todas as coisas': sofística e relativismo de Protágoras.", "B": "Autor errado: Sócrates criticava esse relativismo e buscava definições válidas para todos.", "C": "Autor errado: Parmênides trata do ser, não da retórica.", "D": "Autor errado: Platão foi o maior crítico dos sofistas.", "E": "Os naturalistas investigavam a natureza, não a persuasão política."}, "hab": "H1, H4", "dif": "fácil", "mod": "F1", "kind": "extra", "traps": {"B": "autor", "C": "autor", "D": "autor"}}, {"id": "F1.5", "vol": "FS", "n": "F1.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Para dois filósofos gregos do século V a.C., tudo o que existe é formado por partículas minúsculas, invisíveis e indivisíveis, que se movem no vazio. As diferenças entre as coisas decorrem apenas da forma, da posição e do arranjo dessas partículas."], "src": "Texto elaborado para esta apostila.", "cmd": "A concepção descrita é o", "alts": ["devir de Heráclito.", "ceticismo de Pirro.", "dualismo de Platão.", "empirismo de Locke.", "atomismo de Leucipo e Demócrito."], "ans": "E", "ex": {"A": "Autor errado: Heráclito fala do fluxo e da unidade dos contrários.", "B": "Autor errado: Pirro propõe suspender o juízo.", "C": "Autor errado: Platão separa mundo sensível e inteligível.", "D": "Anacronismo: Locke é do século XVII.", "E": "Partículas indivisíveis (átomos) e vazio: atomismo de Leucipo e Demócrito."}, "hab": "H1", "dif": "fácil", "mod": "F1", "kind": "extra", "traps": {"A": "autor", "B": "autor", "C": "autor", "D": "anacronismo"}}, {"id": "F2.4", "vol": "FS", "n": "F2.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Para um filósofo grego, um governo em que um só homem manda é bom quando ele governa visando ao bem de todos; quando o mesmo homem passa a governar apenas em proveito próprio, o regime se degenera, ainda que continue sendo o governo de um só."], "src": "Texto elaborado para esta apostila.", "cmd": "Segundo esse critério aristotélico, o regime degenerado de um só é a", "alts": ["monarquia.", "aristocracia.", "tirania.", "politeia.", "oligarquia."], "ans": "C", "ex": {"A": "Monarquia é a forma pura do governo de um só.", "B": "Aristocracia é a forma pura do governo de poucos.", "C": "O governo de um só em benefício próprio é a tirania, desvio da monarquia.", "D": "Politeia é a forma pura do governo de muitos.", "E": "Oligarquia é o desvio do governo de poucos."}, "hab": "H11, H14", "dif": "fácil", "mod": "F2", "kind": "extra", "traps": {}}, {"id": "F2.5", "vol": "FS", "n": "F2.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Um pintor representa uma cama. O marceneiro fez a cama observando a ideia de cama; o pintor apenas copia a aparência da cama feita pelo marceneiro, de um único ângulo. Por isso, para o filósofo, o pintor está afastado da verdade em dois graus."], "src": "Texto elaborado para esta apostila, com base em Platão, A República, livro X.", "cmd": "O argumento expressa a concepção platônica de que a arte", "alts": ["é a forma mais elevada de conhecimento.", "deve ser valorizada por despertar emoções.", "revela a essência eterna das coisas.", "é imitação de imitação, afastada do mundo das Ideias.", "não tem nenhuma relação com o mundo sensível."], "ans": "D", "ex": {"A": "Termo oposto: para Platão, o conhecimento mais alto é o das Ideias, pela razão.", "B": "Platão desconfiava justamente da arte que mexe com as emoções.", "C": "Termo oposto: a arte copia aparências, não essências.", "D": "A cama pintada copia a cama sensível, que já copia a Ideia: imitação de imitação.", "E": "A arte copia justamente o mundo sensível."}, "hab": "H1, H5", "dif": "média", "mod": "F2", "kind": "extra", "traps": {"A": "oposto", "C": "oposto"}}, {"id": "F3.4", "vol": "FS", "n": "F3.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Um bispo do século IV perguntava: se Deus é bom e criou todas as coisas, de onde vem o mal? Sua resposta foi que o mal não é uma substância criada, mas a ausência ou privação de um bem, e que o mal moral nasce do mau uso que o ser humano faz de sua vontade livre."], "src": "Texto elaborado para esta apostila.", "cmd": "A resposta apresentada é característica do pensamento de", "alts": ["Santo Agostinho.", "Epicuro.", "Tomás de Aquino.", "Nietzsche.", "Maquiavel."], "ans": "A", "ex": {"A": "Mal como ausência de bem e livre-arbítrio: Agostinho, bispo de Hipona (séculos IV–V).", "B": "Autor errado: Epicuro é grego pagão e trata do prazer e do medo da morte.", "C": "Autor errado: Tomás é do século XIII e é conhecido pela conciliação com Aristóteles.", "D": "Anacronismo: Nietzsche é do século XIX e crítico do cristianismo.", "E": "Anacronismo: Maquiavel é do século XVI e trata da política."}, "hab": "H1, H3", "dif": "fácil", "mod": "F3", "kind": "extra", "traps": {"B": "autor", "C": "autor", "D": "anacronismo", "E": "anacronismo"}}, {"id": "F3.5", "vol": "FS", "n": "F3.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Para uma escola filosófica grega, a cada argumento pode-se opor outro de igual força. Como não há critério seguro para decidir qual é verdadeiro, o sábio deve suspender o juízo, e é dessa suspensão que nasce a tranquilidade da alma."], "src": "Texto elaborado para esta apostila.", "cmd": "A posição descrita é a do", "alts": ["estoicismo, que manda viver segundo a razão universal.", "epicurismo, que identifica a felicidade ao prazer.", "ceticismo, que propõe a suspensão do juízo.", "platonismo, que afirma o conhecimento das Ideias.", "cinismo, que despreza as convenções sociais."], "ans": "C", "ex": {"A": "Autor errado: os estoicos confiam na razão que ordena o cosmo.", "B": "Autor errado: o epicurismo propõe prazeres moderados, não suspender o juízo.", "C": "Força igual dos argumentos, suspensão do juízo (epoché) e tranquilidade: ceticismo de Pirro.", "D": "Termo oposto: Platão afirma que há conhecimento verdadeiro.", "E": "O cinismo fala de vida simples e crítica às convenções, não de suspensão do juízo."}, "hab": "H1", "dif": "média", "mod": "F3", "kind": "extra", "traps": {"A": "autor", "B": "autor", "D": "oposto"}}, {"id": "F4.4", "vol": "FS", "n": "F4.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Para um filósofo alemão do século XVIII, nunca conhecemos as coisas como são em si mesmas, mas apenas como aparecem para nós, organizadas pelas formas do espaço e do tempo e pelas categorias do nosso entendimento."], "src": "Texto elaborado para esta apostila.", "cmd": "Essa concepção corresponde à distinção kantiana entre", "alts": ["fenômeno e coisa em si.", "mundo sensível e mundo das Ideias.", "ato e potência.", "substância pensante e substância extensa.", "sagrado e profano."], "ans": "A", "ex": {"A": "O que aparece para nós (fenômeno) e o que a coisa é independentemente de nós (coisa em si, incognoscível): Kant.", "B": "Autor errado: essa é a distinção de Platão.", "C": "Autor errado: Aristóteles.", "D": "Autor errado: Descartes.", "E": "Autor errado: Durkheim, sobre religião."}, "hab": "H1", "dif": "média", "mod": "F4", "kind": "extra", "traps": {"B": "autor", "C": "autor", "D": "autor", "E": "autor"}}, {"id": "F4.5", "vol": "FS", "n": "F4.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Durante séculos, os astrônomos explicaram o movimento dos planetas com a Terra no centro do universo, acrescentando correções sempre que surgiam observações que não se encaixavam no modelo. Quando essas anomalias se acumularam, um novo modelo, com o Sol no centro, acabou substituindo o antigo, e a forma de fazer astronomia mudou."], "src": "Texto elaborado para esta apostila.", "cmd": "Na concepção de Thomas Kuhn, o processo descrito é um exemplo de", "alts": ["acúmulo linear de verdades, sem rupturas.", "confirmação definitiva da teoria antiga.", "revolução científica, com a substituição de um paradigma por outro.", "abandono da observação na ciência.", "retorno ao pensamento mítico."], "ans": "C", "ex": {"A": "Termo oposto: Kuhn enfatiza rupturas.", "B": "Termo oposto: a teoria antiga foi substituída.", "C": "Anomalias acumuladas, crise e troca de modelo: revolução científica e mudança de paradigma.", "D": "As observações foram justamente o que pressionou a mudança.", "E": "O novo modelo continuou científico."}, "hab": "H1, H20", "dif": "fácil", "mod": "F4", "kind": "extra", "traps": {"A": "oposto", "B": "oposto"}}, {"id": "F5.4", "vol": "FS", "n": "F5.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Ao acompanhar o julgamento de um funcionário nazista responsável pela logística das deportações para os campos de extermínio, uma filósofa surpreendeu-se: ele não parecia um monstro movido por ódio, mas um burocrata comum, preocupado com a carreira, que repetia clichês e dizia apenas ter cumprido ordens."], "src": "Texto elaborado para esta apostila.", "cmd": "A análise da filósofa deu origem ao conceito de", "alts": ["vontade geral.", "banalidade do mal.", "imperativo categórico.", "estado de natureza.", "virtù."], "ans": "B", "ex": {"A": "Autor errado: vontade geral é Rousseau.", "B": "Hannah Arendt, sobre Eichmann: o mal extremo praticado por pessoas comuns que não pensam nem julgam por si.", "C": "Autor errado: imperativo categórico é Kant.", "D": "Autor errado: estado de natureza é dos contratualistas.", "E": "Autor errado: virtù é Maquiavel."}, "hab": "H11, H23", "dif": "fácil", "mod": "F5", "kind": "extra", "traps": {"A": "autor", "C": "autor", "D": "autor", "E": "autor"}}, {"id": "F5.5", "vol": "FS", "n": "F5.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Imagine que um grupo deve escolher as regras de uma sociedade sem saber se, nela, será rico ou pobre, homem ou mulher, saudável ou com deficiência, de que raça ou religião. Para um filósofo norte-americano, as regras escolhidas nessas condições seriam justas."], "src": "Texto elaborado para esta apostila.", "cmd": "A situação descrita é o chamado", "alts": ["contrato social de Hobbes, que cria um soberano absoluto.", "estado de natureza de Rousseau.", "imperativo hipotético de Kant.", "princípio da utilidade de Bentham.", "véu da ignorância de John Rawls."], "ans": "E", "ex": {"A": "Autor errado: Hobbes parte do medo da guerra de todos contra todos.", "B": "Autor errado: o estado de natureza de Rousseau é o do bom selvagem.", "C": "Autor errado: imperativo hipotético é Kant e não trata de escolher regras sociais.", "D": "Autor errado: o utilitarismo soma felicidades.", "E": "Escolher sem saber a própria posição é o véu da ignorância de Rawls, base da justiça como equidade."}, "hab": "H12, H23", "dif": "fácil", "mod": "F5", "kind": "extra", "traps": {"A": "autor", "B": "autor", "C": "autor", "D": "autor"}}, {"id": "F6.4", "vol": "FS", "n": "F6.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Uma fiscalização encontrou trabalhadores mantidos em alojamentos insalubres, com documentos retidos e dívidas impagáveis com o empregador. O dono da fazenda alegou que eles tinham aceitado as condições e que a produção gerava empregos para a região."], "src": "Texto elaborado para esta apostila.", "cmd": "Na perspectiva da ética kantiana, a conduta do fazendeiro é condenável porque", "alts": ["gera pouca felicidade para o maior número.", "reduz a produtividade da fazenda.", "não segue o justo meio entre excesso e falta.", "contraria a vontade divina.", "trata pessoas apenas como meios para seus fins, desrespeitando sua dignidade."], "ans": "E", "ex": {"A": "Autor errado: esse é o critério utilitarista.", "B": "O critério kantiano não é econômico.", "C": "Autor errado: justo meio é Aristóteles.", "D": "A ética kantiana se funda na razão, não na vontade divina.", "E": "Pela fórmula da humanidade, ninguém pode ser tratado só como meio; pessoas têm dignidade, não preço."}, "hab": "H23, H24", "dif": "fácil", "mod": "F6", "kind": "extra", "traps": {"A": "autor", "C": "autor"}}, {"id": "F6.5", "vol": "FS", "n": "F6.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Para um filósofo inglês do século XIX, o único motivo legítimo para a sociedade limitar a liberdade de um indivíduo, contra a vontade dele, é impedir que ele cause dano a outras pessoas. O próprio bem do indivíduo, físico ou moral, não é justificativa suficiente."], "src": "Texto elaborado para esta apostila.", "cmd": "O princípio apresentado foi formulado por", "alts": ["Hobbes, defensor do poder absoluto.", "Kant, que fundou a ética do dever.", "Marx, crítico do capitalismo.", "John Stuart Mill, em Sobre a liberdade.", "Platão, em A República."], "ans": "D", "ex": {"A": "Autor errado: Hobbes defende um soberano forte, não a limitação mínima.", "B": "Autor errado: Kant não formulou o princípio do dano.", "C": "Autor errado: Marx não trata da liberdade individual nesses termos.", "D": "É o princípio do dano de Mill (1859): só se limita a liberdade para evitar dano a terceiros.", "E": "Anacronismo e autor errado."}, "hab": "H23, H24", "dif": "média", "mod": "F6", "kind": "extra", "traps": {"A": "autor", "B": "autor", "C": "autor", "E": "autor"}}, {"id": "F7.4", "vol": "FS", "n": "F7.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["A partir do século XVIII, os governos passaram a recensear a população, medir taxas de natalidade e mortalidade, organizar campanhas de vacinação e de higiene e regular o saneamento das cidades. Para um filósofo francês, o poder passou a ter como objeto a vida da população."], "src": "Texto elaborado para esta apostila.", "cmd": "O texto descreve o conceito de", "alts": ["indústria cultural.", "biopoder ou biopolítica.", "razão comunicativa.", "banalidade do mal.", "sociedade unidimensional."], "ans": "B", "ex": {"A": "Autor errado: Adorno e Horkheimer, sobre cultura.", "B": "Gerir natalidade, saúde e higiene das populações é o biopoder, em Foucault.", "C": "Autor errado: Habermas.", "D": "Autor errado: Arendt.", "E": "Autor errado: Marcuse."}, "hab": "H11, H24", "dif": "média", "mod": "F7", "kind": "extra", "traps": {"A": "autor", "C": "autor", "D": "autor", "E": "autor"}}, {"id": "F7.5", "vol": "FS", "n": "F7.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Um filósofo sul-coreano radicado na Alemanha afirma que hoje ninguém precisa de um patrão vigiando: as pessoas se cobram metas sem fim, acreditam ser empreendedoras de si mesmas e se exploram voluntariamente, até o esgotamento. Para ele, a depressão e o burnout seriam sintomas dessa sociedade."], "src": "Texto elaborado para esta apostila.", "cmd": "O autor descreve uma sociedade", "alts": ["disciplinar, marcada pela vigilância externa e pelas proibições.", "do desempenho, em que a autoexploração se apresenta como liberdade.", "feudal, baseada em laços de vassalagem.", "de solidariedade mecânica.", "sem qualquer forma de pressão sobre o indivíduo."], "ans": "B", "ex": {"A": "Termo oposto: o autor contrapõe a sociedade atual à disciplinar.", "B": "Byung-Chul Han, em Sociedade do cansaço: o sujeito do desempenho explora a si mesmo acreditando ser livre.", "C": "Anacronismo: não há relação com o feudalismo.", "D": "Autor errado: solidariedade mecânica é Durkheim.", "E": "Termo oposto: a pressão existe, mas é interiorizada."}, "hab": "H16, H20", "dif": "média", "mod": "F7", "kind": "extra", "traps": {"A": "oposto", "C": "anacronismo", "D": "autor", "E": "oposto"}}, {"id": "S1.4", "vol": "FS", "n": "S1.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Em um estudo do fim do século XIX, um sociólogo francês observou que as taxas de suicídio aumentavam tanto em crises econômicas quanto em períodos de enriquecimento repentino. Para ele, em ambos os casos as normas que regulavam os desejos e as expectativas das pessoas se enfraqueciam."], "src": "Texto elaborado para esta apostila.", "cmd": "O tipo de suicídio associado a essas situações e o conceito usado pelo autor são, respectivamente,", "alts": ["altruísta e consciência coletiva.", "egoísta e solidariedade mecânica.", "anômico e anomia.", "fatalista e mais-valia.", "anômico e alienação."], "ans": "C", "ex": {"A": "O suicídio altruísta liga-se a integração excessiva ao grupo.", "B": "O egoísta liga-se a integração fraca; solidariedade mecânica é outro conceito.", "C": "Normas enfraquecidas em crises ou mudanças bruscas: anomia, e o suicídio anômico, em Durkheim.", "D": "Autor errado: mais-valia é Marx.", "E": "Autor errado: alienação é Marx."}, "hab": "H11, H15", "dif": "média", "mod": "S1", "kind": "extra", "traps": {"D": "autor", "E": "autor"}}, {"id": "S1.5", "vol": "FS", "n": "S1.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Um médico recusa uma propina para liberar um laudo falso, mesmo sabendo que poderá perder o emprego. Ele afirma que age assim porque a honestidade é um valor do qual não abre mão, independentemente das consequências."], "src": "Texto elaborado para esta apostila.", "cmd": "Na tipologia de Max Weber, a ação do médico é", "alts": ["racional com relação a valores.", "racional com relação a fins.", "afetiva.", "tradicional.", "anômica."], "ans": "A", "ex": {"A": "Agir por convicção, independentemente do resultado: ação racional com relação a valores.", "B": "Termo oposto: a ação com relação a fins calcula meios para obter um resultado; o médico ignora as consequências.", "C": "A ação não é movida por emoção momentânea.", "D": "A ação não é movida por costume.", "E": "Autor errado: anomia é conceito de Durkheim."}, "hab": "H11, H23", "dif": "média", "mod": "S1", "kind": "extra", "traps": {"B": "oposto", "E": "autor"}}, {"id": "S2.4", "vol": "FS", "n": "S2.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Uma operação de fiscalização encontrou costureiros trabalhando 16 horas por dia numa oficina sem ventilação, dormindo no local de trabalho e pagando ao dono, com o próprio salário, uma dívida pela viagem até o Brasil, que nunca diminuía."], "src": "Texto elaborado para esta apostila.", "cmd": "Pela legislação brasileira, a situação descrita caracteriza", "alts": ["contrato de trabalho intermitente.", "trabalho em condição análoga à de escravo.", "terceirização permitida por lei.", "microempreendedorismo individual.", "greve de categoria."], "ans": "B", "ex": {"A": "O trabalho intermitente é contrato legal e não envolve dívida nem condições degradantes.", "B": "Jornada exaustiva, condições degradantes e servidão por dívida configuram trabalho análogo ao de escravo (Código Penal, art. 149).", "C": "Terceirização não autoriza condições degradantes.", "D": "Não há trabalho autônomo; há dependência e coerção.", "E": "Não há greve no texto."}, "hab": "H16, H24", "dif": "fácil", "mod": "S2", "kind": "extra", "traps": {}}, {"id": "S2.5", "vol": "FS", "n": "S2.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Uma pesquisa mostrou que, num mesmo casal em que os dois trabalham fora em tempo integral, a mulher dedica, em média, quase o dobro de horas semanais aos afazeres domésticos e ao cuidado de filhos e idosos do que o homem."], "src": "Texto elaborado para esta apostila.", "cmd": "O dado evidencia o(a)", "alts": ["igualdade na distribuição do trabalho doméstico.", "desaparecimento do trabalho não remunerado.", "preferência natural das mulheres pelas tarefas de cuidado.", "divisão sexual do trabalho, que impõe às mulheres uma dupla jornada.", "fim das desigualdades de gênero no mercado de trabalho."], "ans": "D", "ex": {"A": "Termo oposto: a distribuição é desigual.", "B": "O trabalho doméstico continua existindo e não é pago.", "C": "Naturalizar o papel é justamente o que a sociologia critica: é construção social.", "D": "Trabalho remunerado mais cuidado doméstico não pago: dupla jornada produzida pela divisão sexual do trabalho.", "E": "Exagero e termo oposto: o dado mostra desigualdade."}, "hab": "H16, H24", "dif": "fácil", "mod": "S2", "kind": "extra", "traps": {"A": "oposto", "E": "oposto"}}, {"id": "S3.4", "vol": "FS", "n": "S3.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Uma jovem nascida em São Paulo, filha de pai boliviano e mãe pernambucana, frequenta um culto evangélico, dança k-pop com amigos, participa de um coletivo feminista e se define, conforme a situação, como paulistana, latino-americana ou nordestina."], "src": "Texto elaborado para esta apostila.", "cmd": "A situação ilustra a concepção de Stuart Hall de que, na modernidade tardia, as identidades são", "alts": ["fixas, definidas apenas pelo local de nascimento.", "múltiplas, fragmentadas e móveis, marcadas pela globalização.", "determinadas exclusivamente pela classe social.", "iguais em todas as pessoas de uma mesma nação.", "imutáveis desde a infância."], "ans": "B", "ex": {"A": "Termo oposto: a jovem se identifica de várias formas.", "B": "Várias pertenças que mudam conforme a situação: identidades múltiplas e móveis, segundo Hall.", "C": "Exagero: a classe é uma dimensão, não a única.", "D": "Termo oposto: o texto mostra diversidade.", "E": "Termo oposto: as identidades mudam."}, "hab": "H1, H3", "dif": "fácil", "mod": "S3", "kind": "extra", "traps": {"A": "oposto", "C": "exagero", "D": "oposto", "E": "oposto"}}, {"id": "S3.5", "vol": "FS", "n": "S3.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["No século XIX, alguns antropólogos classificavam as sociedades humanas em uma escala única, que ia da \"selvageria\" à \"barbárie\" e desta à \"civilização\", cujo modelo era a Europa industrial. Essa classificação foi usada para justificar a dominação colonial."], "src": "Texto elaborado para esta apostila.", "cmd": "A teoria descrita, o evolucionismo cultural, foi criticada por expressar", "alts": ["relativismo cultural.", "alteridade.", "etnocentrismo.", "hibridismo cultural.", "cidadania cultural."], "ans": "C", "ex": {"A": "Termo oposto: o relativismo foi justamente a crítica a essa teoria (Franz Boas).", "B": "Termo oposto: alteridade é reconhecer o outro como legítimo.", "C": "Tomar a própria sociedade como medida e topo da evolução é etnocentrismo.", "D": "Hibridismo é mistura cultural, não hierarquia.", "E": "A teoria hierarquizava povos; não ampliava direitos."}, "hab": "H1, H4", "dif": "fácil", "mod": "S3", "kind": "extra", "traps": {"A": "oposto", "B": "oposto"}}, {"id": "S4.4", "vol": "FS", "n": "S4.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Por muito tempo, divulgou-se a ideia de que o Brasil seria um paraíso de convivência harmoniosa entre brancos, negros e indígenas. A partir dos anos 1950, pesquisas de sociólogos como Florestan Fernandes mostraram a exclusão da população negra do mercado de trabalho, da escola e da política depois da abolição."], "src": "Texto elaborado para esta apostila.", "cmd": "As pesquisas citadas contribuíram para", "alts": ["confirmar a existência de uma democracia racial no Brasil.", "demonstrar que o racismo havia acabado com a abolição.", "comprovar que as diferenças de renda não tinham relação com a cor.", "provar a superioridade biológica de algum grupo.", "questionar o mito da democracia racial, evidenciando desigualdades raciais."], "ans": "E", "ex": {"A": "Termo oposto: as pesquisas desmontaram essa ideia.", "B": "Termo oposto: mostraram exclusão após a abolição.", "C": "Termo oposto: mostraram desigualdade associada à cor.", "D": "Raça não é categoria biológica entre humanos; as pesquisas tratavam de desigualdade social.", "E": "Mostrar exclusão real é questionar o mito da harmonia racial."}, "hab": "H11, H24", "dif": "fácil", "mod": "S4", "kind": "extra", "traps": {"A": "oposto", "B": "oposto", "C": "oposto"}}, {"id": "S4.5", "vol": "FS", "n": "S4.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Na Índia tradicional, a posição de cada pessoa era definida pelo nascimento e pela religião, e o casamento entre grupos diferentes era proibido. Na Europa feudal, a sociedade se dividia em clero, nobreza e servos, com direitos fixados pela tradição e pela lei. No capitalismo, as posições dependem principalmente da renda e da propriedade."], "src": "Texto elaborado para esta apostila.", "cmd": "Os três sistemas de estratificação descritos são, respectivamente,", "alts": ["classes, castas e estamentos.", "castas, estamentos e classes.", "estamentos, classes e castas.", "castas, classes e estamentos.", "classes, estamentos e castas."], "ans": "B", "ex": {"A": "Ordem errada: o primeiro é casta.", "B": "Nascimento e religião (castas), tradição e lei (estamentos), posição econômica (classes).", "C": "Ordem errada.", "D": "Ordem errada: o feudal é estamental.", "E": "Ordem errada."}, "hab": "H11", "dif": "fácil", "mod": "S4", "kind": "extra", "traps": {}}, {"id": "S5.4", "vol": "FS", "n": "S5.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Uma milícia passou a cobrar taxas de moradores e comerciantes de um bairro, alegando oferecer \"segurança\", e a punir quem não pagava. Especialistas afirmaram que, ali, o Estado havia perdido algo que o define."], "src": "Texto elaborado para esta apostila.", "cmd": "Com base na definição de Max Weber, o Estado perdeu, nesse bairro, o", "alts": ["monopólio do uso legítimo da força física.", "carisma de seus governantes.", "controle da produção industrial.", "poder de arrecadar impostos sobre a renda.", "direito de realizar eleições."], "ans": "A", "ex": {"A": "Para Weber, o Estado é quem reivindica com sucesso o monopólio do uso legítimo da força num território; a milícia disputa esse monopólio.", "B": "Carisma é um tipo de dominação, não o que define o Estado.", "C": "O Estado não se define pelo controle da indústria.", "D": "Detalhe verdadeiro: a milícia cobra taxas, mas a definição weberiana é a da força legítima.", "E": "Eleições não são o critério de Weber para definir o Estado."}, "hab": "H11, H14", "dif": "média", "mod": "S5", "kind": "extra", "traps": {"D": "detalhe"}}, {"id": "S5.5", "vol": "FS", "n": "S5.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["\"A miséria religiosa é, ao mesmo tempo, a expressão da miséria real e o protesto contra a miséria real. A religião é o suspiro da criatura oprimida, o coração de um mundo sem coração [...]. É o ópio do povo.\""], "src": "MARX, K. Crítica da filosofia do direito de Hegel: introdução, 1844. Obra em domínio público; tradução livre feita para esta apostila.", "cmd": "No trecho, a religião é apresentada como", "alts": ["fundamento racional da moral universal.", "força que separa o sagrado do profano e mantém a coesão do grupo.", "origem do espírito do capitalismo.", "consolo diante da opressão, que ao mesmo tempo desvia a atenção de suas causas reais.", "ilusão sem nenhuma relação com as condições sociais."], "ans": "D", "ex": {"A": "Autor errado: lembra Kant, não Marx.", "B": "Autor errado: Durkheim.", "C": "Autor errado: Weber (ética protestante).", "D": "O 'suspiro da criatura oprimida' consola, mas como 'ópio' anestesia e afasta a luta contra a miséria real.", "E": "Termo oposto: o trecho liga a religião à 'miséria real'."}, "hab": "H3, H11", "dif": "média", "mod": "S5", "kind": "extra", "traps": {"A": "autor", "B": "autor", "C": "autor", "E": "oposto"}}], "cards": [{"id": "HG-c0", "vol": "HG", "q": "O que é anacronismo?", "a": "Aplicar conceitos de uma época a outra"}, {"id": "HG-c1", "vol": "HG", "q": "Patrimônio imaterial é o quê?", "a": "Saberes, celebrações, formas de expressão, lugares (registrados pelo Iphan)"}, {"id": "HG-c2", "vol": "HG", "q": "Quem não era cidadão em Atenas?", "a": "Mulheres, escravizados e estrangeiros (metecos)"}, {"id": "HG-c3", "vol": "HG", "q": "\"Pão e circo\" servia para quê?", "a": "Controlar a plebe urbana e evitar revoltas"}, {"id": "HG-c4", "vol": "HG", "q": "Por que um leigo se salvaria nas Cruzadas?", "a": "Pela decisão de partir e lutar (indulgência)"}, {"id": "HG-c5", "vol": "HG", "q": "Efeito da Peste Negra no trabalho?", "a": "Falta de mão de obra; camponeses negociam e se revoltam"}, {"id": "HG-c6", "vol": "HG", "q": "O que espalhou a Reforma?", "a": "A imprensa de tipos móveis"}, {"id": "HG-c7", "vol": "HG", "q": "Exclusivo metropolitano?", "a": "A colônia só comercia com a metrópole (mercantilismo)"}, {"id": "HG-c8", "vol": "HG", "q": "Ludismo?", "a": "Destruição de máquinas contra o desemprego e a miséria"}, {"id": "HG-c9", "vol": "HG", "q": "Imperialismo e ciência?", "a": "Expedições e museus a serviço do prestígio e do domínio"}, {"id": "HG-c10", "vol": "HG", "q": "Totalitarismo?", "a": "Partido único, propaganda, culto ao líder, repressão"}, {"id": "HG-c11", "vol": "HG", "q": "Guerra Fria sem guerra direta?", "a": "Corrida espacial e armamentista, guerras indiretas"}, {"id": "HG-c12", "vol": "HG", "q": "Função da Impressão Régia (1808)?", "a": "Integrar o território ao poder central no Rio"}, {"id": "HG-c13", "vol": "HG", "q": "Quilombo dos Palmares?", "a": "Resistência com organização socia postos": [{"par": "Ética", "l1": "<strong>Kant<\/strong>: dever, intenção, regra universal", "l2": "<strong>Utilitarismo<\/strong> (Bentham, Mill): consequências, maior felicidade"}, {"par": "Conhecimento", "l1": "<strong>Racionalismo<\/strong> (Descartes): razão, ideias inatas", "l2": "<strong>Empirismo<\/strong> (Locke, Hume): experiência, sentidos"}, {"par": "Estado de natureza", "l1": "<strong>Hobbes<\/strong>: guerra de todos contra todos", "l2": "<strong>Rousseau<\/strong>: bom selvagem, corrompido pela propriedade"}, {"par": "Origem da sociedade", "l1": "<strong>Durkheim<\/strong>: a sociedade molda o indivíduo (fato social)", "l2": "<strong>Weber<\/strong>: a sociedade se explica pelo sentido das ações individuais"}, {"par": "Diversidade", "l1": "<strong>Etnocentrismo<\/strong>: minha cultura é a medida", "l2": "<strong>Relativismo<\/strong>: cada cultura nos seus próprios termos"}, {"par": "Solidariedade", "l1": "<strong>Mecânica<\/strong>: semelhança (sociedades simples)", "l2": "<strong>Orgânica<\/strong>: divisão do trabalho (sociedades complexas)"}, {"par": "Antigos", "l1": "<strong>Heráclito<\/strong>: tudo flui, unidade dos contrários", "l2": "<strong>Parmênides<\/strong>: o ser é, o movimento é ilusão"}, {"par": "Política", "l1": "<strong>Maquiavel<\/strong>: a política tem lógica própria, separada da moral cristã", "l2": "<strong>Aristóteles / Platão<\/strong>: política e ética são inseparáveis"}, {"par": "Direito", "l1": "<strong>Direito positivo<\/strong>: a lei escrita, calculável", "l2": "<strong>Justiça<\/strong>: o que a lei pode não garantir (desobediência civil)"}], "recal": [{"vol": "HG", "num": 46, "subj": "Geografia", "resumo": "Uma notícia informa que entrou em vigor, em 2019, o acordo que mudou o nome da Macedônia para <strong>Macedônia do Norte<\/strong>, encerrando um impasse com a Grécia (que tem uma província com o nome Macedônia). Por causa do impasse, a Grécia <strong>bloqueava as negociações de adesão<\/strong> do vizinho à União Europeia.", "cmd": "Para o país originado da antiga Iugoslávia, a mudança de nome é uma estratégia política para", "alts": ["criar a moeda própria.", "proteger a cultura local.", "subjugar a minoria étnica.", "expandir o território nacional.", "intensificar a integração regional."], "his": "B", "ans": "E", "como": "O comando pergunta pela <strong>finalidade<\/strong> da mudança (\"estratégia política para\"). A única finalidade que o texto informa é destravar a adesão à UE. A alternativa B tem um <strong>detalhe verdadeiro<\/strong>: disputas de nome envolvem identidade cultural. Mas o país <strong>abriu mão<\/strong> do nome; quem protegeu a própria cultura foi a Grécia. Regra: <strong>pergunte \"para quê?\" e procure a resposta no texto, não no tema.<\/strong>", "reforco": "HG-58"}, {"vol": "HG", "num": 67, "subj": "Geografia", "resumo": "Um texto publicado no site da Associação dos Geógrafos Brasileiros relata que a desapropriação da fazenda Cabaceiras, no sul do Pará, foi a primeira motivada pelo desrespeito à <strong>função social<\/strong> do imóvel rural prevista na Constituição de 1988, por exploração de trabalho análogo à escravidão e por graves infrações ambientais.", "cmd": "O texto considera a promoção da justiça como um mecanismo de", "alts": ["manutenção da ordem agrária.", "legitimação da propriedade privada.", "hegemonia das classes dominantes.", "revisão das desigualdades econômicas.", "homogeneização da distribuição fundiária."], "his": "A", "ans": "D", "como": "Desapropriar quem descumpre a função social <strong>muda<\/strong> a ordem agrária; \"manutenção\" é o <strong>termo oposto<\/strong>. A B e a C também invertem o sentido (a medida limita a propriedade e contraria os interesses dos grandes proprietários). A E é o <strong>exagero<\/strong>: uma desapropriação não torna homogênea a distribuição de terras do país. Regra: <strong>antes de marcar, troque a alternativa pelo seu contrário; se o contrário combinar mais com o texto, ela está errada.<\/strong>", "reforco": "HG-59"}, {"vol": "HG", "num": 69, "subj": "História", "resumo": "Um trecho do historiador André Vauchez explica que pregadores e eremitas difundiram entre os leigos o desejo de alcançar a salvação <strong>sem renunciar ao seu estado<\/strong> (sem virar clérigo ou monge). Pela primeira vez, a Igreja abria \"as portas da graça\" a todos os fiéis, com uma <strong>única condição<\/strong>: partir para o Oriente para lutar contra os \"inimigos de Cristo\".", "cmd": "Conforme o texto, no imaginário dos fiéis cristãos do período medieval, a salvação era alcançada por meio das", "alts": ["palavras escritas.", "práticas litúrgicas.", "ações voluntárias.", "ideias messiânicas.", "celebrações coletivas."], "his": "B", "ans": "C", "como": "O texto fala das <strong>Cruzadas<\/strong>. A condição para a salvação era uma <strong>decisão do fiel<\/strong>: partir. Liturgia é o ritual conduzido pelo <strong>clero<\/strong>, e o texto insiste que o leigo se salvaria sem se tornar clérigo. Regra: <strong>localize a \"condição\" que o texto dá e escolha a alternativa que a nomeia.<\/strong> Conhecer o contexto (H3) transforma uma questão de leitura difícil em questão fácil.", "reforco": "HG-60"}, {"vol": "HG", "num": 83, "subj": "História", "resumo": "Um artigo acadêmico explica que a <strong>Impressão Régia<\/strong> foi criada em 1808 para dar continuidade à nova sede do Império português no Rio de Janeiro, num momento em que o projeto de reforma do império se tornava um projeto de <strong>construção de um novo império português na América<\/strong>; a tipografia atuou na <strong>legitimação e sustentação<\/strong> desse projeto político (o título do artigo menciona a \"colonização dos sertões\").", "cmd": "A função política da tecnologia mencionada no texto favoreceu a nova sede do Império português por", "alts": ["estabelecer as normativas ideológicas aos periódicos.", "propagar as diretrizes administrativas às capitanias.", "divulgar as conquistas às metrópoles europeias.", "integrar as regiões territoriais ao poder central.", "difundir as publicações às elites lusitanas."], "his": "A", "ans": "D", "como": "\"Função política\" + \"nova sede\" + \"construção de um império na América\" + \"sertões\" = levar a autoridade do <strong>centro<\/strong> (Rio) ao <strong>território<\/strong>. A A fala de periódicos, que o texto nem menciona. A B é o distrator mais perigoso: descreve <strong>o que a tipografia fazia<\/strong> (o meio), e não <strong>para que servia<\/strong> (o fim). Regra (a mesma da filosofia): <strong>separe meio e fim; quando o comando pede função, procure o fim.<\/strong>", "reforco": "HG-61"}, {"vol": "HG", "num": 90, "subj": "História", "resumo": "Um livro publicado pela Casa de Oswaldo Cruz descreve uma expedição de estudantes russos que, em 1914, partiu para a América do Sul enviada pelo Museu de Antropologia e Etnografia de São Petersburgo, com zoólogos, etnógrafos e um antropólogo, para <strong>coletar material biológico e etnográfico<\/strong> e compor <strong>coleções<\/strong> das instituições que a financiaram.", "cmd": "Além do significado científico, o evento mencionado conectava-se a um projeto nacionalista de caráter", "alts": ["imperialista e colonizador.", "militar e disciplinador.", "lúdico e filantrópico.", "mercantil e predatório.", "religioso e humanitário."], "his": "C", "ans": "A", "como": "Data (1914) + potência europeia + museu nacional + coleta de objetos e dados de povos de outro continente = <strong>ciência a serviço do imperialismo<\/strong> (H5). Nada no texto fala de lazer ou caridade. A D atrai pela palavra \"coleta\", mas \"mercantil\" exigiria venda e lucro, que o texto não menciona. Regra: <strong>quando a questão diz \"projeto nacionalista\" no início do século XX, pense em imperialismo.<\/strong>", "reforco": "HG-62"}, {"vol": "FS", "num": 50, "subj": "Derrida", "resumo": "Num trecho de <em>Força de lei<\/em>, Derrida afirma que o <strong>direito não é a justiça<\/strong>: o direito é o elemento do <strong>cálculo<\/strong>, enquanto a justiça é <strong>incalculável<\/strong>, e a decisão entre o justo e o injusto nunca é garantida por uma regra.", "cmd": "De acordo com o texto, ainda que estejam em desconformidade com o ordenamento jurídico, são exemplos de ação justa:", "alts": ["Casos de desobediência civil.", "Repressões do aparato estatal.", "Conflitos de natureza intercontinental.", "Manifestações do movimento sindical.", "Mobilizações de agremiações estudantis."], "his": "D", "ans": "A", "como": "O comando junta duas condições: <strong>contra a lei<\/strong> e <strong>justa<\/strong>. A única categoria que é, por definição, descumprimento da lei em nome da justiça é a <strong>desobediência civil<\/strong>. Manifestações sindicais e estudantis são, em regra, <strong>direitos previstos em lei<\/strong> (não estão \"em desconformidade\" com o ordenamento). Regra: <strong>quando o comando traz duas condições, a correta precisa satisfazer as duas.<\/strong>", "reforco": "FS-37"}, {"vol": "FS", "num": 66, "subj": "Marcuse", "resumo": "Num trecho de <em>Ideologia da sociedade industrial<\/em>, Marcuse afirma que a independência de pensamento, a autonomia e o direito à oposição estão <strong>perdendo sua função crítica<\/strong> numa sociedade que parece cada vez mais capaz de <strong>atender às necessidades<\/strong> dos indivíduos; com o padrão de vida crescente, o não conformismo parece <strong>socialmente inútil<\/strong>.", "cmd": "Qual é a característica da sociedade industrial do século XX apresentada no texto?", "alts": ["Gestão integrada.", "Relativismo moral.", "Desobediência civil.", "Realidade unidimensional.", "Desenvolvimento tecnológico."], "his": "E", "ans": "D", "como": "O nome do autor era a pista: <strong>Marcuse → unidimensional<\/strong>. O texto não fala de tecnologia; fala da <strong>perda da dimensão crítica<\/strong>. \"Desenvolvimento tecnológico\" é verdade sobre a sociedade industrial, mas <strong>não é o que o texto apresenta<\/strong> (detalhe verdadeiro, de novo). Regra: <strong>a alternativa certa resume o texto; a errada resume o tema.<\/strong>", "reforco": "FS-38"}, {"vol": "FS", "num": 76, "subj": "Bobbio", "resumo": "Num trecho de <em>A era dos direitos<\/em>, Bobbio afirma que os direitos do homem constituem uma <strong>classe variável<\/strong>: o elenco de direitos se modificou e continua a se modificar com as <strong>condições históricas<\/strong>, os interesses, as classes no poder e as transformações técnicas; direitos declarados absolutos no século XVIII foram limitados, e direitos sociais, antes nem mencionados, passaram a ser proclamados.", "cmd": "Os argumentos apresentados no texto sustentam que os direitos humanos são variáveis porque os considera como", "alts": ["fenômenos espontâneos.", "conquistas atemporais.", "convenções coletivas.", "resquícios religiosos.", "imposições políticas."], "his": "B", "ans": "C", "como": "O comando já diz \"<strong>variáveis<\/strong>\". \"Atemporais\" é o <strong>contrário<\/strong> de variáveis: a alternativa contradiz o próprio comando. Entre as restantes, só \"convenções coletivas\" explica a variação por <strong>acordos sociais de cada época<\/strong>. \"Imposições políticas\" é parcial (o texto fala de interesses e de condições técnicas, não só de poder). Regra: <strong>releia o comando depois de escolher. Se a alternativa nega uma palavra do comando, está errada.<\/strong>", "reforco": "FS-39"}, {"vol": "FS", "num": 79, "subj": "Bentham", "resumo": "Num trecho de <em>Uma introdução aos princípios da moral e da legislação<\/em>, Bentham afirma que a missão dos governantes é <strong>promover a felicidade<\/strong> da sociedade, punindo e recompensando; a necessidade de punir uma ação é <strong>proporcional<\/strong> ao quanto ela perturba a felicidade; e a felicidade consiste em desfrutar prazeres e estar isento de dores.", "cmd": "Qual perspectiva de justiça emerge da relação, estabelecida no texto, entre punição e felicidade?", "alts": ["Aplicação de meios para atingir um fim.", "Imposição de regras para estabelecer um dever.", "Sobreposição de princípios para fundamentar um direito.", "Criação de parâmetros para reconhecer uma prescrição.", "Elaboração de convenções para referendar um costume."], "his": "B", "ans": "A", "como": "<strong>Bentham → utilitarismo → consequências.<\/strong> Punir é um <strong>meio<\/strong>; a felicidade da sociedade é o <strong>fim<\/strong>. \"Regras que estabelecem um dever\" descrevem a ética de <strong>Kant<\/strong>: você marcou a resposta certa para o <strong>autor errado<\/strong>. Regra: <strong>antes de ler as alternativas, escreva ao lado da referência: \"Bentham = meio/fim; Kant = dever\".<\/strong>", "reforco": "FS-40"}, {"vol": "FS", "num": 81, "subj": "Saffioti", "resumo": "Num trecho de Heleieth Saffioti e Suely Souza de Almeida, as autoras observam que, por causa da naturalização da inferioridade social da mulher e da concepção de justiça do Estado baseada numa <strong>igualdade abstrata<\/strong>, é possível convencê-lo a implementar políticas de <strong>discriminação positiva<\/strong> de mulheres, embora isso pareça paradoxal.", "cmd": "No contexto atual, qual medida atende ao tipo de política pública abordada no texto?", "alts": ["Ampliação do sufrágio universal.", "Diminuição da jornada de trabalho.", "Extinção do crime de feminicídio.", "Redução da licença-maternidade.", "Criação de delegacia especializada."], "his": "A", "ans": "E", "como": "Discriminação positiva = política <strong>focalizada<\/strong> num grupo em desvantagem. O sufrágio universal vale para <strong>todos<\/strong> (é o oposto); a B também é geral; a C e a D <strong>retirariam<\/strong> proteção das mulheres. Só a delegacia especializada é dirigida especificamente às mulheres. Regra: <strong>\"positiva\" = a favor do grupo; \"discriminação\" = tratamento diferente. As duas condições precisam estar na alternativa.<\/strong>", "reforco": "FS-41"}], "opening": {"HG": "<p>Humanas é a área em que o texto mais ajuda: na maioria das questões, <strong>a resposta está no texto-base<\/strong>, e o conteúdo serve para reconhecê-la com segurança. O método abaixo é o mesmo da apostila de Português, adaptado.<\/p>\n<ol><li><strong>Leia o comando primeiro.<\/strong> Sublinhe a palavra que diz o que se pede: <em>causa<\/em>, <em>consequência<\/em>, <em>objetivo<\/em>, <em>crítica<\/em>, <em>característica<\/em>, <em>função política<\/em>.<\/li><li><strong>Leia a referência da fonte.<\/strong> Autor, título e <strong>data<\/strong> situam o texto. Um documento de 1808 fala da lógica de 1808, não da de hoje.<\/li><li><strong>Leia o texto procurando a resposta ao comando<\/strong>, não um resumo do texto.<\/li><li><strong>Preveja a resposta com as suas palavras<\/strong> antes de olhar as alternativas.<\/li><li><strong>Elimine<\/strong> por quatro filtros:<ul><li><strong>Termo oposto:<\/strong> diz o contrário do texto (o seu erro na 67).<\/li><li><strong>Detalhe verdadeiro:<\/strong> é verdade sobre o tema, mas não responde ao comando (o seu erro na 46).<\/li><li><strong>Anacronismo:<\/strong> aplica ao passado ideias e valores de outra época (por exemplo, \"defesa dos direitos humanos\" numa instituição colonial do século XVIII).<\/li><li><strong>Generalização e juízo de valor:<\/strong> palavras absolutas (\"sempre\", \"todos\") e adjetivos fortes que o texto não autoriza.<\/li><\/ul><\/li><li><strong>Confira a alternativa escolhida contra o texto<\/strong>: aponte a frase que a sustenta.<\/li><\/ol>\n<div class=\"callout\"><strong>A regra dos meios e fins.<\/strong> Muitas questões perguntam a \"função\", o \"objetivo\" ou a \"estratégia\". Alternativas que descrevem um <strong>meio<\/strong> (o que foi feito) costumam ser distratores quando o comando pede o <strong>fim<\/strong> (para que foi feito). Foi o que aconteceu na sua questão 83.<\/div>", "FS": "<p>Filosofia e Sociologia têm um padrão próprio: <strong>o texto é de um autor, e a pergunta é sobre o conceito que ele defende.<\/strong> As alternativas costumam ser palavras abstratas (\"realidade unidimensional\", \"convenções coletivas\", \"capilarização das práticas de controle\"). O método:<\/p>\n<ol><li><strong>Leia a referência primeiro.<\/strong> O nome do autor já ativa o conceito: Bentham → utilidade; Kant → dever; Marcuse → unidimensional; Foucault → disciplina; Durkheim → fato social.<\/li><li><strong>Leia o comando<\/strong> e marque o que se pede: <em>conceito<\/em>, <em>perspectiva<\/em>, <em>característica<\/em>, <em>função<\/em>, <em>crítica<\/em>.<\/li><li><strong>Traduza o texto numa frase sua<\/strong>, com palavras simples. Ex.: \"punir só vale se aumentar a felicidade\".<\/li><li><strong>Procure a alternativa que diz a mesma coisa em linguagem abstrata.<\/strong> O ENEM quase sempre \"embrulha\" a ideia em vocabulário difícil; desembrulhe.<\/li><li><strong>Elimine<\/strong> pelos filtros de sempre: termo oposto, detalhe verdadeiro, anacronismo, generalização. E por um filtro novo: <strong>o autor errado<\/strong>. Muitas alternativas descrevem corretamente a ideia de <strong>outro<\/strong> filósofo (foi o seu caso na 79: a alternativa B é Kant, não Bentham).<\/li><\/ol>\n<div class=\"callout\"><strong>A regra dos meios e fins.<\/strong> Quando um texto trata algo como <strong>meio<\/strong> para atingir outra coisa (punir <strong>para<\/strong> a felicidade), pense em utilitarismo ou em razão instrumental. Quando trata algo como <strong>valioso em si<\/strong>, independentemente do resultado (cumprir o dever <strong>porque<\/strong> é dever), pense em Kant.<\/div>"}, "vf": [{"id": "vf0", "mod": "H1", "s": "Monumentos e nomes de ruas são fontes neutras, que apenas registram fatos do passado.", "v": false, "why": "Monumentos escolhem o que lembrar e como lembrar: são disputas de memória."}, {"id": "vf1", "mod": "H1", "s": "Anacronismo é usar conceitos de uma época para julgar ou explicar outra.", "v": true, "why": "Exemplo: falar em 'direitos trabalhistas' de servos medievais."}, {"id": "vf2", "mod": "H1", "s": "Saberes, celebrações e formas de expressão podem ser registrados como patrimônio imaterial.", "v": true, "why": "O registro protege o que é vivo e transmitido, não só edifícios."}, {"id": "vf3", "mod": "H1", "s": "Uma fonte oral é sempre mais confiável que uma fonte escrita.", "v": false, "why": "Toda fonte passa por crítica; a memória também seleciona e reinterpreta."}, {"id": "vf4", "mod": "H2", "s": "Na democracia ateniense, todos os habitantes da cidade votavam na Assembleia.", "v": false, "why": "Mulheres, escravizados e estrangeiros (metecos) eram excluídos."}, {"id": "vf5", "mod": "H2", "s": "A política do pão e circo buscava controlar a plebe urbana e evitar revoltas.", "v": true, "why": "Distribuição de trigo e espetáculos garantiam apoio e ordem."}, {"id": "vf6", "mod": "H2", "s": "A Lei das Doze Tábuas resultou das lutas da plebe por leis escritas e conhecidas.", "v": true, "why": "Leis escritas reduziam o arbítrio dos patrícios."}, {"id": "vf7", "mod": "H2", "s": "O cristianismo foi religião oficial de Roma desde a fundação da cidade.", "v": false, "why": "Foi perseguido no início e só virou religião oficial no fim do século IV."}, {"id": "vf8", "mod": "H3", "s": "A teoria das três ordens apresentava a hierarquia feudal como parte de uma ordem divina.", "v": true, "why": "Oratores, bellatores e laboratores: cada um no seu lugar, por vontade de Deus."}, {"id": "vf9", "mod": "H3", "s": "A Peste Negra aumentou a oferta de mão de obra e baixou os salários na Europa.", "v": false, "why": "Ao matar cerca de um terço da população, reduziu a mão de obra e fortaleceu os camponeses."}, {"id": "vf10", "mod": "H3", "s": "Nas Cruzadas, a Igreja associou a salvação dos leigos à decisão de partir para lutar no Oriente.", "v": true, "why": "É o conteúdo da questão 69 de 2025."}, {"id": "vf11", "mod": "H3", "s": "Os sábios do mundo islâmico ajudaram a preservar e difundir obras gregas na Europa medieval.", "v": true, "why": "Traduções árabes chegaram ao latim e às universidades."}, {"id": "vf12", "mod": "H4", "s": "A imprensa de tipos móveis favoreceu a difusão das ideias da Reforma Protestante.", "v": true, "why": "Folhetos e Bíblias em alemão circularam aos milhares."}, {"id": "vf13", "mod": "H4", "s": "O mercantilismo defendia o livre comércio entre colônias e qualquer nação.", "v": false, "why": "Defendia o exclusivo metropolitano e o acúmulo de metais."}, {"id": "vf14", "mod": "H4", "s": "Montesquieu defendia que os três poderes ficassem nas mãos do rei.", "v": false, "why": "Defendia a separação dos poderes contra a concentração absolutista."}, {"id": "vf15", "mod": "H4", "s": "O Concílio de Trento faz parte da Reforma Católica.", "v": true, "why": "Reafirmou dogmas, criou seminários e fortaleceu a Igreja contra o protestantismo."}, {"id": "vf16", "mod": "H5", "s": "O ludismo foi a destruição de máquinas por trabalhadores ingleses diante do desemprego e da miséria.", "v": true, "why": "Reação às condições impostas pela Revolução Industrial."}, {"id": "vf17", "mod": "H5", "s": "A Revolução do Haiti combinou independência e abolição feita pelos próprios escravizados.", "v": true, "why": "Caso único nas Américas (1791–1804)."}, {"id": "vf18", "mod": "H5", "s": "A Declaração de 1789 garantiu às mulheres plena cidadania política.", "v": false, "why": "Olympe de Gouges denunciou a exclusão e foi executada em 1793."}, {"id": "vf19", "mod": "H5", "s": "Expedições científicas e museus do século XIX podiam servir ao projeto imperialista.", "v": true, "why": "Coleta de objetos e dados reforçava prestígio e domínio. É o conteúdo da questão 90 de 2025."}, {"id": "vf20", "mod": "H6", "s": "O Tratado de Versalhes contribuiu para o ressentimento que favoreceu o nazismo.", "v": true, "why": "Culpa pela guerra, perdas territoriais e indenizações altas."}, {"id": "vf21", "mod": "H6", "s": "A corrida espacial foi uma forma de cooperação ica, podem gerar conflitos socioambientais.", "v": true, "why": "Ruído, uso da terra e contratos com comunidades."}, {"id": "vf67", "mod": "G7", "s": "Carros elétricos têm impacto ambiental nulo em qualquer país.", "v": false, "why": "Depende da fonte de eletricidade e da mineração das baterias."}, {"id": "vf68", "mod": "G8", "s": "A taxa de fecundidade brasileira está abaixo do nível de reposição.", "v": true, "why": "Abaixo de cerca de 2,1 filhos por mulher."}, {"id": "vf69", "mod": "G8", "s": "Para os reformistas, a pobreza é causa, e não consequência, do crescimento populacional.", "v": true, "why": "Oposição a Malthus e aos neomalthusianos."}, {"id": "vf70", "mod": "G8", "s": "A Lei de Migração de 2017 trata o migrante principalmente como ameaça à segurança nacional.", "v": false, "why": "Trata-o como sujeito de direitos; a visão de ameaça era do Estatuto do Estrangeiro."}, {"id": "vf71", "mod": "G8", "s": "Migração pendular é o deslocamento diário entre cidades para trabalhar ou estudar.", "v": true, "why": "Ida e volta no mesmo dia."}, {"id": "vf72", "mod": "G9", "s": "O Mercosul é uma união econômica e monetária com moeda única.", "v": false, "why": "É uma união aduaneira imperfeita, sem moeda única."}, {"id": "vf73", "mod": "G9", "s": "No Conselho de Segurança da ONU, cinco membros permanentes têm poder de veto.", "v": true, "why": "EUA, Rússia, China, Reino Unido e França."}, {"id": "vf74", "mod": "G9", "s": "A adesão à União Europeia exige a concordância de todos os membros.", "v": true, "why": "Por isso a Grécia podia bloquear a Macedônia (questão 46 de 2025)."}, {"id": "vf75", "mod": "G9", "s": "Milton Santos via a globalização apenas como fonte de oportunidades e igualdade.", "v": false, "why": "Criticou a 'globalização como perversidade' e propôs outra globalização."}, {"id": "vf76", "mod": "F1", "s": "Para Heráclito, a realidade é marcada pelo devir e pela tensão dos contrários.", "v": true, "why": "Tudo flui."}, {"id": "vf77", "mod": "F1", "s": "Par ": true, "why": "Penso, logo existo."}, {"id": "vf89", "mod": "F4", "s": "Para Hume, a causalidade é uma conexão necessária observada diretamente.", "v": false, "why": "É uma expectativa formada pelo hábito."}, {"id": "vf90", "mod": "F4", "s": "Para Popper, uma teoria científica precisa poder ser refutada.", "v": true, "why": "Critério da falseabilidade."}, {"id": "vf91", "mod": "F4", "s": "Kant afirmava que conhecemos as coisas exatamente como são em si mesmas.", "v": false, "why": "Conhecemos fenômenos; a coisa em si é inacessível."}, {"id": "vf92", "mod": "F5", "s": "Para Hobbes, o estado de natureza é uma guerra de todos contra todos.", "v": true, "why": "Daí o soberano absoluto."}, {"id": "vf93", "mod": "F5", "s": "Locke negava qualquer direito de resistência contra o governo.", "v": false, "why": "Defendia a resistência contra governo que viola direitos naturais."}, {"id": "vf94", "mod": "F5", "s": "Desobediência civil é o descumprimento público e não violento de uma lei considerada injusta.", "v": true, "why": "Thoreau, Gandhi, Martin Luther King. É o seu erro na questão 50."}, {"id": "vf95", "mod": "F5", "s": "Para Bobbio, os direitos humanos são atemporais e imutáveis.", "v": false, "why": "São históricos e variáveis. É o seu erro na questão 76."}, {"id": "vf96", "mod": "F6", "s": "Para Kant, a ação moral é a que produz as melhores consequências.", "v": false, "why": "É a que se faz por dever, segundo máxima universalizável."}, {"id": "vf97", "mod": "F6", "s": "Para Bentham, a punição se justifica como meio para aumentar a felicidade geral.", "v": true, "why": "Princípio da utilidade. É o seu erro na questão 79."}, {"id": "vf98", "mod": "F6", "s": "Sartre afirmava que a existência precede a essência.", "v": true, "why": "Somos o que fazemos de nós."}, {"id": "vf99", "mod": "F6", "s": "Beauvoir defendia que ser mulher é um destino biológico.", "v": false, "why": "Para ela, 'ninguém nasce mulher: torna-se mulher'."}, {"id": "vf100", "mod": "F7", "s": "A indústria cultural produz cultura como mercadoria padronizada.", "v": true, "why": "Adorno e Horkheimer."}, {"id": "vf101", "mod": "F7", "s": "Marcuse via a sociedade industrial como um espaço que estimula a crítica radical.", "v": false, "why": "Ela absorve a crítica: é unidimensional. É o seu erro na questão 66."}, {"id": "vf102", "mod": "F7", "s": "Para Foucault, o poder está espalhado em redes e não pertence só ao Estado.", "v": true, "why": "Microfísica do poder."}, {"id": "vf103", "mod": "F7", "s": "Para Benjamin, a reprodutibilidade técnica faz a obra de arte perder a aura.", "v": true, "why": "E amplia o acesso."}, {"id": "vf104", "mod": "S1", "s": "Fato social é exterior, coercitivo e geral.", "v": true, "why": "Durkheim."}, {"id": "vf105", "mod": "S1", "s": "A solidariedade orgânica se baseia na semelhança entre os indivíduos.", "v": false, "why": "Baseia-se na diferença e na interdependência da divisão do trabalho."}, {"id": "vf106", "mod": "S1", "s": "Para Weber, valores religiosos influenciaram a formação do capitalismo moderno.", "v": true, "why": "A ética protestante."}, {"id": "vf107", "mod": "S1", "s": "Mais-valia é o valor produzido pelo trabalhador e não pago a ele.", "v": true, "why": "Marx."}, {"id": "vf108", "mod": "S2", "s": "O toyotismo trabalha com grandes estoques e produção padronizada em massa.", "v": false, "why": "Isso é o fordismo; o toyotismo usa just in time e estoques mínimos."}, {"id": "vf109", "mod": "S2", "s": "Na uberização, custos e riscos do trabalho são transferidos ao trabalhador.", "v": true, "why": "Sem vínculo e com gestão por algoritmo."}, {"id": "vf110", "mod": "S2", "s": "Jornada exaustiva e condições degradantes podem caracterizar trabalho análogo ao de escravo.", "v": true, "why": "Código Penal, art. 149."}, {"id": "vf111", "mod": "S2", "s": "O taylorismo uniu concepção e execução nas mãos do operário.", "v": false, "why": "Separou quem planeja (gerência) de quem executa."}, {"id": "vf112", "mod": "S3", "s": "Etnocentrismo é julgar outras culturas a partir dos valores da própria.", "v": true, "why": "Base do evolucionismo cultural do século XIX."}, {"id": "vf113", "mod": "S3", "s": "Relativismo cultural significa aceitar qualquer violação de direitos humanos.", "v": false, "why": "Significa compreender cada cultura em seus termos, sem hierarquizá-las."}, {"id": "vf114", "mod": "S3", "s": "A intolerância contra religiões de matriz africana é frequentemente chamada de racismo religioso.", "v": true, "why": "Preconceito religioso e racial se misturam."}, {"id": "vf115", "mod": "S3", "s": "Algoritmos de redes sociais podem formar bolhas que reforçam opiniões prévias.", "v": true, "why": "Câmaras de eco e polarização."}, {"id": "vf116", "mod": "S4", "s": "Discriminação positiva é tratar diferenciadamente um grupo em desvantagem para reduzir desigualdades.", "v": true, "why": "Cotas, delegacia da mulher. É o seu erro na questão 81."}, {"id": "vf117", "mod": "S4", "s": "O sufrágio universal é um exemplo de discriminação positiva.", "v": false, "why": "Vale igualmente para todos: é medida universal."}, {"id": "vf118", "mod": "S4", "s": "Para José Murilo de Carvalho, no Brasil os direitos sociais vieram antes da consolidação dos políticos e civis.", "v": true, "why": "Ordem inversa à descrita por Marshall para a Inglaterra."}, {"id": "vf119", "mod": "S4", "s": "Racismo estrutural se limita a ofensas individuais explícitas.", "v": false, "why": "Está no funcionamento das instituições."}, {"id": "vf120", "mod": "S5", "s": "Para Bourdieu, a escola é neutra e premia apenas o talento individual.", "v": false, "why": "Premia o capital cultural herdado e reproduz desigualdades."}, {"id": "vf121", "mod": "S5", "s": "Instituições totais controlam todos os aspectos da vida dos internos.", "v": true, "why": "Goffman: prisões, manicômios, quartéis."}, {"id": "vf122", "mod": "S5", "s": "A atitude blasé é a indiferença do morador da metrópole diante do excesso de estímulos.", "v": true, "why": "Simmel."}, ragmentos", "ideia": "Retórica como arte de persuadir; relativismo: 'o homem é a medida de todas as coisas'.", "hoje": "Debates sobre manipulação, marketing político e fake news.", "conf": "Sócrates, que buscava a verdade universal e não a vitória no debate.", "mod": "F1"}, {"autor": "Sócrates", "epoca": "Atenas, c. 470–399 a.C.", "obra": "Não escreveu; aparece nos diálogos de Platão", "ideia": "Ironia e maiêutica para chegar a definições universais; virtude é conhecimento; 'conhece-te a ti mesmo'.", "hoje": "Pensamento crítico: examinar as próprias certezas.", "conf": "Sofistas (persuasão paga) e Platão (que sistematiza a teoria das Ideias).", "mod": "F1"}, {"autor": "Platão", "epoca": "Atenas, c. 428–348 a.C.", "obra": "A República; Fédon; Banquete", "ideia": "Mundo sensível × mundo das Ideias; caverna; cidade justa governada por filósofos; arte como imitação.", "hoje": "Educação como libertação; crítica a governos de opinião.", "conf": "Aristóteles, que põe a essência nas próprias coisas.", "mod": "F2"}, {"autor": "Aristóteles", "epoca": "Estagira/Atenas, 384–322 a.C.", "obra": "Ética a Nicômaco; Política; Metafísica", "ideia": "Felicidade (eudaimonia), virtude como hábito e justo meio; o homem é animal político; formas de governo puras e desviadas.", "hoje": "Ética das virtudes; política voltada ao bem comum.", "conf": "Platão (dois mundos) e os contratualistas (sociedade como contrato, não como natureza).", "mod": "F2"}, {"autor": "Epicuro", "epoca": "Samos/Atenas, 341–270 a.C.", "obra": "Carta a Meneceu", "ideia": "Felicidade como prazer, entendido como ausência de dor e de perturbação; não temer a morte nem os deuses.", "hoje": "Crítica ao consumismo: prazeres simples e amizade.", "conf": "Utilitarismo (Bentham), que também fala de prazer, mas como cálculo social; e hedonismo de excessos, que Epicuro rejeitava.", "mod": "F3"}, {"autor": "Estoicos", "epoca": "Grécia e Roma, séc. III a.C.–II d.C. (Zenão, Sêneca, Epicteto, Marco Aurélio)", "obra": "Manual (Epicteto); Cartas a Lucílio (Sêneca)", "ideia": "Viver segundo a razão e a natureza; distinguir o que depende de nós do que não depende; serenidade diante do destino; cosmopolitismo.", "hoje": "Ansiedade e controle: focar no que está ao alcance.", "conf": "Epicuristas (prazer) e céticos (suspensão do juízo).", "mod": "F3"}, {"autor": "Agostinho", "epoca": "Hipona (norte da África), 354–430", "obra": "Confissões; A Cidade de Deus", "ideia": "Fé orienta a razão; mal como ausência de bem e fruto do livre-arbítrio; cidade de Deus × cidade terrena.", "hoje": "Questões sobre fé e razão e sobre o problema do mal.", "conf": "Tomás de Aquino (século XIII, aristotélico).", "mod": "F3"}, {"autor": "Tomás de Aquino", "epoca": "Itália/Paris, 1225–1274", "obra": "Suma teológica", "ideia": "Fé e razão não se contradizem; cristianização de Aristóteles; cinco vias para provar a existência de Deus; lei natural.", "hoje": "Questões sobre escolástica e universidades medievais.", "conf": "Agostinho (platonismo cristão, séculos IV–V).", "mod": "F3"}, {"autor": "Maquiavel", "epoca": "Florença, 1469–1527", "obra": "O Príncipe", "ideia": "Realismo político: a política tem lógica própria, separada da moral cristã; virtù e fortuna; melhor ser temido que amado, se preciso escolher.", "hoje": "Análises de estratégia e conservação do poder.", "conf": "Hobbes (contrato e soberano) e Aristóteles (política ligada à ética).", "mod": "F5"}, {"autor": "Descartes", "epoca": "França, 1596–1650", "obra": "Discurso do método; Meditações", "ideia": "Dúvida metódica, cogito ('penso, logo existo'), ideias inatas, dualismo mente-corpo.", "hoje": "Método científico; desconfiança dos sentidos.", "conf": "Empiristas (Locke, Hume), que fundam o conhecimento na experiência.", "mod": "F4"}, {"autor": "Hume", "epoca": "Escócia, 1711–1776", "obra": "Investigação sobre o entendimento humano", "ideia": "Ideias vêm de impressões; causalidade é hábito; problema da indução; desconfiança da eloquência que domina os afetos.", "hoje": "Crítica a generalizações apressadas.", "conf": "Descartes (racionalismo) e Kant, que responde a Hume.", "mod": "F4"}, {"autor": "Kant (conhecimento)", "epoca": "Prússia, 1724–1804", "obra": "Crítica da razão pura; O que é o Esclarecimento?", "ideia": "O sujeito estrutura a experiência (formas a priori); fenômeno × coisa em si; Esclarecimento é sair da menoridade (sapere aude).", "hoje": "Autonomia intelectual e pensamento crítico.", "conf": "Kant ético (dever) é o mesmo autor, outro tema; e Hume (hábito).", "mod": "F4"}, {"autor": "Hobbes", "epoca": "Inglaterra, 1588–1679", "obra": "Leviatã", "ideia": "Estado de natureza como guerra de todos contra todos; contrato que cria um soberano absoluto para garantir a paz.", "hoje": "Debates sobre segurança × liberdade.", "conf": "Locke (governo limitado) e Rousseau (bom selvagem).", "mod": "F5"}, {"autor": "Locke", "epoca": "Inglaterra, 1632–1704", "obra": "Segundo tratado sobre o governo civil; Ensaio sobre o entendimento humano", "ideia": "Direitos naturais (vida, liberdade, propriedade), governo por consentimento e direito de resistência; tábula rasa.", "hoje": "Base do liberalismo político.", "conf": "Hobbes (absolutismo) e Rousseau (vontade geral).", "mod": "F5"}, {"autor": "Rousseau", "epoca": "Genebra/França, 1712–1778", "obra": "Discurso sobre a desigualdade; Do contrato social", "ideia": "Bom selvagem; a propriedade privada funda a desigualdade; soberania popular e vontade geral.", "hoje": "Democracia participativa; crítica da desigualdade.", "conf": "Hobbes (homem lobo do homem) e Locke (propriedade como direito natural).", "mod": "F5"}, {"autor": "Kant (ética)", "epoca": "Prússia, 1724–1804", "obra": "Fundamentação da metafísica dos costumes", "ideia": "Agir por dever; imperativo categórico (lei universal; pessoa como fim, nunca só como meio); autonomia; dignidade.", "hoje": "Dignidade humana, direitos humanos, bioética.", "conf": "Utilitarismo (consequências). É a confusão do seu erro na questão 79.", "mod": "F6"}, {"autor": "Bentham e Mill", "epoca": "Inglaterra, séculos XVIII–XIX", "obra": "Introdução aos princípios da moral e da legislação; Utilitarismo; Sobre a liberdade", "ideia": "Princípio da utilidade: maior felicidade para o maior número; ações julgadas pelas consequências; Mill: qualidade dos prazeres e princípio do dano.", "hoje": "Políticas públicas de custo-benefício; punição como meio.", "conf": "Kant (dever) e Epicuro (prazer individual e tranquilidade).", "mod": "F6"}, {"autor": "Adam Smith", "epoca": "Escócia, 1723–1790", "obra": "Teoria dos sentimentos morais; A riqueza das nações", "ideia": "Mão invisível do mercado, mas também simpatia e espectador imparcial como base moral.", "hoje": "Ética nos negócios; responsabilidade social.", "conf": "Liberais que reduzem tudo ao interesse próprio; Marx (crítica do capital).", "mod": "F6"}, {"autor": "Nietzsche", "epoca": "Alemanha, 1844–1900", "obra": "Genealogia da moral; A gaia ciência; Assim falou Zaratustra", "ideia": "Valores têm história; moral de rebanho e ressentimento; 'Deus está morto'; vontade de potência; além-do-homem.", "hoje": "Crise de valores; crítica a moralismos.", "conf": "Sartre (liberdade e responsabilidade) e Marx (crítica social).", "mod": "F6"}, {"autor": "Sartre", "epoca": "França, 1905–1980", "obra": "O ser e o nada; O existencialismo é um humanismo", "ideia": "A existência precede a essência; condenados a ser livres; responsabilidade; má-fé.", "hoje": "Escolhas, autonomia, responsabilidade individual.", "conf": "Beauvoir (mesma corrente, foco no gênero).", "mod": "F6"}, {"autor": "Beauvoir", "epoca": "França, 1908–1986", "obra": "O segundo sexo", "ideia": "'Ninguém nasce mulher: torna-se mulher'; gênero como construção social; a mulher como o Outro.", "hoje": "Desigualdade de gênero, papéis sociais, violência contra a mulher.", "conf": "Saffioti (socióloga brasileira, gênero, classe e raça).", "mod": "F6"}, {"autor": "Arendt", "epoca": "Alemanha/EUA, 1906–1975", "obra": "Origens
