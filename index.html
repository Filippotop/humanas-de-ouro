es divergentes:<\/strong> placas se afastam (dorsal mesoatlântica). <strong>Transformantes:<\/strong> deslizam lado a lado (falha de San Andreas).<\/li><li><strong>Profundidade do foco:<\/strong> terremotos mais rasos tendem a causar mais destruição na superfície do que os profundos de mesma magnitude.<\/li><li><strong>O Brasil está no centro da placa Sul-Americana:<\/strong> não tem vulcões ativos nem dobramentos modernos, e os tremores são de pequena magnitude (acomodações de falhas antigas).<\/li><\/ul>\n<h4>2. Estrutura geológica e relevo do Brasil<\/h4>\n<ul><li><strong>Escudos cristalinos<\/strong> (rochas antigas, ricas em <strong>minérios<\/strong>, como o ferro do Quadrilátero Ferrífero e de Carajás) e <strong>bacias sedimentares<\/strong> (rochas sedimentares: <strong>petróleo<\/strong>, carvão, água subterrânea, como no Aquífero Guarani).<\/li><li>Relevo <strong>antigo e desgastado<\/strong>: altitudes modestas. Classificação mais usada (Jurandyr Ross): <strong>planaltos<\/strong> (predomina erosão), <strong>planícies<\/strong> (predomina deposição) e <strong>depressões<\/strong>.<\/li><\/ul>\n<h4>3. Agentes que modelam o relevo<\/h4>\n<ul><li><strong>Internos (endógenos):<\/strong> tectonismo, vulcanismo, abalos sísmicos.<\/li><li><strong>Externos (exógenos):<\/strong> <strong>intemperismo<\/strong> (decomposição das rochas) e <strong>erosão<\/strong> (transporte do material).<ul><li><strong>Intemperismo físico:<\/strong> variação de temperatura, congelamento; predomina em climas secos e frios.<\/li><li><strong>Intemperismo químico:<\/strong> água e reações químicas; predomina em climas <strong>quentes e úmidos<\/strong>, como o tropical. Em rochas <strong>calcárias<\/strong>, a água levemente ácida <strong>dissolve<\/strong> a rocha, formando cavernas e <strong>dolinas<\/strong> (afundamentos repentinos do solo quando o teto de uma cavidade subterrânea cede): é o <strong>relevo cárstico<\/strong>.<\/li><\/ul><\/li><li><strong>Erosão acelerada pela ação humana:<\/strong> desmatamento, solo exposto e manejo inadequado geram <strong>ravinas e voçorocas<\/strong> e levam sedimentos para os rios (<strong>assoreamento<\/strong>).<\/li><\/ul>\n<h4>4. Solos<\/h4>\n<ul><li>Formados pelo intemperismo da rocha-mãe, com matéria orgânica.<\/li><li>Em climas tropicais úmidos, a <strong>laterização<\/strong> (lixiviação de nutrientes e acúmulo de ferro e alumínio) gera solos ácidos e pobres; a fertilidade da Amazônia está na <strong>biomassa<\/strong>, não no solo.<\/li><li>Solos férteis famosos: <strong>terra roxa<\/strong> (de basalto, no Sul e no Sudeste), <strong>massapê<\/strong> (Zona da Mata nordestina).<\/li><li><strong>Manejo conservacionista:<\/strong> curvas de nível, terraceamento, plantio direto, cobertura vegetal, rotação de culturas.<\/li><\/ul>", "resumo": [["Subducção", "Placa mergulha; terremotos, vulcões, cordilheiras (Andes)"], ["Brasil", "Centro de placa; tremores pequenos; relevo antigo"], ["Escudos × bacias", "Minérios × petróleo, carvão, água"], ["Intemperismo químico", "Clima quente e úmido; dissolve calcário (dolinas)"], ["Voçoroca", "Erosão acelerada pelo desmatamento"], ["Laterização", "Solos tropicais ácidos e pobres"]], "qs": ["HG-34", "HG-35", "HG-36", "G2.4", "G2.5"]}, {"id": "G3", "vol": "HG", "line": "G", "title": "Clima e mudanças climáticas", "habs": "H6, H27, H30", "faixa": "B", "note": "", "html": "<h4>1. Tempo × clima; elementos e fatores<\/h4>\n<ul><li><strong>Tempo:<\/strong> estado da atmosfera num momento (\"hoje está chovendo\"). <strong>Clima:<\/strong> padrão médio de longo prazo (décadas).<\/li><li><strong>Elementos:<\/strong> temperatura, umidade, pressão, chuvas, ventos.<\/li><li><strong>Fatores:<\/strong><\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>Fator<\/th><th>Efeito<\/th><\/tr><\/thead><tbody><tr><td>Latitude<\/td><td>Mais perto do Equador, mais calor<\/td><\/tr><tr><td><strong>Altitude<\/strong><\/td><td>Cerca de 0,6 °C a menos a cada 100 m de subida<\/td><\/tr><tr><td><strong>Maritimidade × continentalidade<\/strong><\/td><td>Perto do mar: menor amplitude térmica, mais umidade. Interior: maior amplitude<\/td><\/tr><tr><td><strong>Massas de ar<\/strong><\/td><td>Levam características (calor, frio, umidade) de onde se formaram<\/td><\/tr><tr><td>Correntes marítimas<\/td><td>Frias deixam o litoral seco (deserto do Atacama, corrente de Humboldt)<\/td><\/tr><tr><td>Relevo<\/td><td>Barra ou canaliza massas de ar; <strong>chuvas orográficas (de relevo)<\/strong> na encosta voltada para o mar (Serra do Mar) e sombra de chuva do outro lado<\/td><\/tr><tr><td>Vegetação<\/td><td>Florestas mantêm umidade (evapotranspiração)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2. Massas de ar no Brasil<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Massa<\/th><th>Características<\/th><th>Efeitos<\/th><\/tr><\/thead><tbody><tr><td>Equatorial continental (mEc)<\/td><td>Quente e úmida (Amazônia)<\/td><td>Chuvas de verão no Centro-Oeste e Sudeste<\/td><\/tr><tr><td>Equatorial atlântica (mEa)<\/td><td>Quente e úmida<\/td><td>Litoral Norte e Nordeste<\/td><\/tr><tr><td>Tropical atlântica (mTa)<\/td><td>Quente e úmida<\/td><td>Litoral do Sudeste e do Sul<\/td><\/tr><tr><td>Tropical continental (mTc)<\/td><td>Quente e <strong>seca<\/strong><\/td><td>Calor e tempo seco no interior<\/td><\/tr><tr><td>Polar atlântica (mPa)<\/td><td><strong>Fria<\/strong><\/td><td>Frentes frias; geadas no Sul; <strong>friagem<\/strong> na Amazônia<\/td><\/tr><\/tbody><\/table><\/div>\n<p>As massas de ar e os ventos também <strong>transportam poluentes<\/strong>: a fumaça de queimadas na Amazônia, no Centro-Oeste e até em outros continentes pode chegar a cidades distantes.<\/p>\n<h4>3. Climas do Brasil<\/h4>\n<p>Equatorial (Amazônia: quente e chuvoso o ano todo), tropical (verão chuvoso e inverno seco: Cerrado), tropical de altitude (Sudeste serrano: mais ameno), tropical úmido ou litorâneo, <strong>semiárido<\/strong> (sertão nordestino: chuvas <strong>escassas e irregulares<\/strong>), subtropical (Sul: estações definidas, geadas).<\/p>\n<h4>4. Fenômenos que caem<\/h4>\n<ul><li><strong>El Niño:<\/strong> aquecimento anormal das águas do Pacífico equatorial. No Brasil, tende a causar <strong>seca no Norte e no Nordeste<\/strong> e <strong>chuvas excessivas no Sul<\/strong>. <strong>La Niña<\/strong> (resfriamento) tende a efeitos opostos.<\/li><li><strong>Ilha de calor:<\/strong> a cidade fica mais quente que o entorno (asfalto e concreto absorvem calor, pouca vegetação, prédios bloqueiam ventos, calor de motores e aparelhos). Combate: arborização, telhados verdes, parques, áreas permeáveis.<\/li><li><strong>Inversão térmica:<\/strong> comum no <strong>inverno<\/strong>, em noites frias e sem vento: o ar frio fica preso perto do solo sob uma camada de ar quente, e os <strong>poluentes não se dispersam<\/strong>. Agrava doenças respiratórias. A poluição <strong>não causa<\/strong> a inversão; a inversão <strong>retém<\/strong> a poluição.<\/li><li><strong>Chuva ácida, buraco no ozônio, efeito estufa:<\/strong> ver a apostila de Natureza (B2).<\/li><\/ul>\n<h4>5. Mudanças climáticas e acordos<\/h4>\n<ul><li><strong>Aquecimento global:<\/strong> intensificação do efeito estufa por queima de combustíveis fósseis, <strong>desmatamento e queimadas<\/strong> (as principais fontes de emissão do Brasil, junto com a agropecuária) e outras atividades humanas.<\/li><li><strong>Impactos:<\/strong> eventos extremos mais frequentes (secas, enchentes, ondas de calor), elevação do nível do mar, perda de biodiversidade, insegurança alimentar e hídrica, <strong>refugiados climáticos<\/strong>. Os mais pobres são os mais afetados: é a ideia de <strong>justiça climática<\/strong>.<\/li><li><strong>Mitigação<\/strong> (reduzir emissões e remover CO₂) × <strong>adaptação<\/strong> (preparar cidades e populações para os impactos: drenagem, áreas verdes, sistemas de alerta, retirada de moradias de áreas de risco).<\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>Marco<\/th><th>Ano<\/th><th>O que estabeleceu<\/th><\/tr><\/thead><tbody><tr><td>Rio-92 (Eco-92)<\/td><td>1992<\/td><td>Convenção do Clima, Agenda 21, desenvolvimento sustentável<\/td><\/tr><tr><td>Protocolo de Kyoto<\/td><td>1997<\/td><td>Metas obrigatórias <strong>só para países desenvolvidos<\/strong>; mercado de carbono<\/td><\/tr><tr><td><strong>Acordo de Paris<\/strong><\/td><td>2015<\/td><td>Todos os países apresentam metas próprias (NDCs); limitar o aquecimento a bem menos de 2 °C, buscando 1,5 °C<\/td><\/tr><tr><td>COPs<\/td><td>anuais<\/td><td>Conferências da ONU sobre o clima; a COP30 foi realizada em Belém, em 2025<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Tensão permanente nas COPs:<\/strong> países ricos (maiores emissores históricos) × países em desenvolvimento (que exigem financiamento e \"responsabilidades comuns, porém diferenciadas\"), além da pressão de <strong>organismos internacionais e da sociedade civil<\/strong> (ONGs, cientistas, povos indígenas, jovens).<\/p>", "resumo": [["Altitude", "−0,6 °C a cada 100 m"], ["Chuva orográfica", "Encosta voltada para o mar"], ["mPa", "Frentes frias, geada, friagem"], ["El Niño", "Seca no Norte/Nordeste; chuva no Sul"], ["Ilha de calor", "Concreto, asfalto, pouco verde"], ["Inversão térmica", "Inverno; retém poluentes"], ["Kyoto × Paris", "Metas só dos ricos × metas de todos (NDCs)"], ["Mitigação × adaptação", "Reduzir causas × preparar-se para os efeitos"]], "qs": ["HG-37", "HG-38", "HG-39", "G3.4", "G3.5"]}, {"id": "G4", "vol": "HG", "line": "G", "title": "Biomas, água e questões ambientais", "habs": "H26, H27, H28, H29, H30", "faixa": "A", "note": "\"Meio ambiente\" é o 2º bloco de Geografia no levantamento histórico.", "html": "<h4>1. Domínios morfoclimáticos (Aziz Ab'Sáber)<\/h4>\n<p>Amazônico, Cerrado, Caatinga, Mares de Morros (Mata Atlântica), Araucárias, Pradarias (Pampa), além de faixas de transição (Pantanal, Mata dos Cocais). As características de cada bioma estão na apostila de Natureza (B1). Aqui interessam os <strong>usos e conflitos<\/strong>.<\/p>\n<h4>2. Amazônia e \"rios voadores\"<\/h4>\n<ul><li>A floresta <strong>transpira<\/strong> enormes quantidades de água; correntes de ar levam essa umidade para o Centro-Oeste, o Sudeste e o Sul, os chamados <strong>rios voadores<\/strong>. Uma árvore grande pode liberar centenas de litros de água por dia.<\/li><li><strong>Desmatamento<\/strong> reduz essa umidade e pode afetar as chuvas, a agricultura e o abastecimento de outras regiões do país. Avança pelo <strong>arco do desmatamento<\/strong> (sul e leste da Amazônia), puxado por pecuária, grilagem de terras, soja, extração ilegal de madeira, garimpo e obras de infraestrutura.<\/li><li>O <strong>garimpo ilegal<\/strong> contamina rios com <strong>mercúrio<\/strong> e ameaça povos indígenas.<\/li><\/ul>\n<h4>3. Água<\/h4>\n<ul><li>O Brasil tem grande disponibilidade de água doce, mas <strong>mal distribuída<\/strong> (a maior parte na Amazônia, onde vive pouca gente).<\/li><li><strong>Crise hídrica:<\/strong> combinação de chuvas abaixo da média, desmatamento, poluição, desperdício e gestão inadequada. Afeta abastecimento e geração de energia (G7).<\/li><li><strong>Bacias hidrográficas<\/strong> como unidade de gestão; comitês de bacia; Lei das Águas (1997): a água é bem público e tem valor econômico.<\/li><li><strong>Aquíferos<\/strong> (Guarani, Alter do Chão) e risco de contaminação por agrotóxicos e esgoto.<\/li><\/ul>\n<h4>4. Desastres socioambientais<\/h4>\n<ul><li><strong>Inundações graduais<\/strong> (rios de planície sobem devagar, em dias) × <strong>enxurradas e inundações bruscas<\/strong> (em áreas de relevo acidentado e solo impermeabilizado, a água sobe em minutos ou horas, com grande força de arraste).<\/li><li><strong>Deslizamentos<\/strong> em encostas desmatadas e ocupadas, sobretudo nas chuvas intensas.<\/li><li><strong>Rompimento de barragens de rejeitos de mineração:<\/strong> <strong>Mariana<\/strong> (2015, barragem de Fundão) e <strong>Brumadinho<\/strong> (2019). Lama tóxica, mortes, destruição de comunidades e de rios (o rio Doce, em 2015), perda de modos de vida e de vínculos com o lugar.<\/li><li><strong>Desastre não é só natural:<\/strong> a vulnerabilidade depende de onde as pessoas são <strong>obrigadas<\/strong> a morar e de políticas públicas (ver G6).<\/li><\/ul>\n<h4>5. Proteção ambiental e desenvolvimento sustentável<\/h4>\n<ul><li><strong>Desenvolvimento sustentável:<\/strong> atender às necessidades atuais sem comprometer as das próximas gerações (Relatório Brundtland, 1987).<\/li><li><strong>Código Florestal (2012):<\/strong> <strong>Áreas de Preservação Permanente<\/strong> (margens de rios, nascentes, encostas e topos de morro) e <strong>Reserva Legal<\/strong> (porcentagem de cada propriedade rural que deve manter vegetação nativa: 80% em áreas de floresta da Amazônia Legal, menos em outros biomas).<\/li><li><strong>Unidades de conservação:<\/strong> de <strong>proteção integral<\/strong> (parques nacionais, estações ecológicas) e de <strong>uso sustentável<\/strong> (reservas extrativistas, florestas nacionais), em que comunidades tradicionais vivem e usam os recursos.<\/li><li><strong>Terras indígenas e comunidades tradicionais<\/strong> estão entre as áreas mais preservadas: os <strong>saberes tradicionais<\/strong> de manejo são reconhecidos como aliados da conservação.<\/li><li><strong>Agrotóxicos:<\/strong> contaminação de solo, água, alimentos e trabalhadores; morte de <strong>polinizadores<\/strong> (abelhas), essenciais à agricultura.<\/li><\/ul>", "resumo": [["Rios voadores", "Umidade amazônica leva chuva ao Centro-Sul"], ["Arco do desmatamento", "Sul e leste da Amazônia; pecuária, grilagem, soja"], ["Inundação brusca × gradual", "Relevo acidentado e solo impermeável × planície"], ["Mariana e Brumadinho", "Rejeitos de mineração; rios e comunidades destruídos"], ["APP e Reserva Legal", "Código Florestal"], ["Uso sustentável", "Reservas extrativistas, comunidades tradicionais"]], "qs": ["HG-40", "HG-41", "HG-42", "G4.4", "G4.5"]}, {"id": "G5", "vol": "HG", "line": "G", "title": "Espaço agrário e questão da terra", "habs": "H8, H18, H19, H27, H28", "faixa": "A", "note": "É o bloco mais frequente de Geografia no levantamento histórico (cerca de 17,5%) e foi um dos seus erros em 2025 (questão 67).", "html": "<h4>1. Concentração fundiária<\/h4>\n<ul><li>O Brasil tem uma das estruturas fundiárias <strong>mais concentradas do mundo<\/strong>: poucos estabelecimentos muito grandes ocupam a maior parte da área agrícola, enquanto a maioria dos estabelecimentos é pequena e ocupa uma fração pequena da terra. O índice de Gini da terra, nos censos agropecuários do IBGE, fica acima de 0,8 (quanto mais perto de 1, maior a concentração).<\/li><li><strong>Raízes históricas:<\/strong> sesmarias (H7), plantation, <strong>Lei de Terras de 1850<\/strong> (H8), que só permitia o acesso à terra pela compra.<\/li><li><strong>Agricultura familiar:<\/strong> segundo o Censo Agropecuário de 2017, responde pela grande maioria dos estabelecimentos (cerca de três quartos) e da mão de obra ocupada no campo, mas ocupa menos de um quarto da área. Produz parte importante dos alimentos do mercado interno (mandioca, feijão, hortaliças, leite). <em>Os percentuais exatos variam conforme a fonte; confira no IBGE se for usá-los na redação.<\/em><\/li><\/ul>\n<h4>2. Função social da propriedade e reforma agrária<\/h4>\n<p>A Constituição de 1988 garante o direito de propriedade, mas condiciona esse direito a uma <strong>função social<\/strong>.<\/p>\n<blockquote><p class=\"\">Art. 186. A função social é cumprida quando a propriedade rural atende, simultaneamente, segundo critérios e graus de exigência estabelecidos em lei, aos seguintes requisitos:<\/p><p class=\"\">I – aproveitamento racional e adequado;<\/p><p class=\"\">II – utilização adequada dos recursos naturais disponíveis e preservação do meio ambiente;<\/p><p class=\"\">III – observância das disposições que regulam as relações de trabalho;<\/p><p class=\"\">IV – exploração que favoreça o bem-estar dos proprietários e dos trabalhadores.<\/p><p class=\"src\">(BRASIL. Constituição da República Federativa do Brasil de 1988.)<\/p><\/blockquote>\n<ul><li><strong>Art. 184:<\/strong> a União pode <strong>desapropriar<\/strong>, para fins de reforma agrária, o imóvel rural que <strong>não cumpre<\/strong> a função social, mediante indenização (em títulos da dívida agrária).<\/li><li><strong>Art. 185:<\/strong> a <strong>propriedade produtiva<\/strong> e a pequena e média propriedade (quando é a única do dono) não podem ser desapropriadas para reforma agrária.<\/li><li><strong>Art. 243<\/strong> (redação de 2014): propriedades onde houver cultivo ilegal de plantas psicotrópicas ou <strong>trabalho escravo<\/strong> serão <strong>expropriadas sem indenização<\/strong>.<\/li><\/ul>\n<div class=\"callout\"><strong>A chave do seu erro na questão 67:<\/strong> desapropriar uma terra que não cumpre a função social é um instrumento de <strong>mudança<\/strong> da estrutura agrária, para <strong>reduzir desigualdades<\/strong>. Toda alternativa que fale em \"manter a ordem agrária\" ou \"legitimar a propriedade\" diz o <strong>oposto<\/strong>. E cuidado com o exagero: uma desapropriação isolada <strong>não homogeneíza<\/strong> a distribuição de terras do país.<\/div>\n<ul><li><strong>Reforma agrária:<\/strong> redistribuição de terras com apoio à produção (crédito, assistência técnica, estradas, escolas). Sem apoio, os assentamentos fracassam.<\/li><li><strong>Movimentos sociais:<\/strong> <strong>MST<\/strong> (Movimento dos Trabalhadores Rurais Sem Terra, fundado em 1984), Comissão Pastoral da Terra (registra os conflitos no campo).<\/li><li><strong>Conflitos no campo:<\/strong> grilagem (falsificação de títulos de terra), violência contra trabalhadores, indígenas e quilombolas, <strong>trabalho análogo à escravidão<\/strong> (ainda flagrado em fazendas, carvoarias e lavouras).<\/li><\/ul>\n<h4>3. Modernização do campo<\/h4>\n<ul><li><strong>Revolução Verde<\/strong> (a partir dos anos 1950–1960): pacote de sementes selecionadas, fertilizantes químicos, <strong>agrotóxicos<\/strong> e máquinas. Aumentou a produtividade, mas trouxe dependência de insumos, contaminação, perda de biodiversidade e favoreceu grandes produtores.<\/li><li><strong>Modernização conservadora<\/strong> (no Brasil, sobretudo durante a ditadura): o campo se mecanizou <strong>sem mudar a concentração da terra<\/strong>. Consequências: <strong>êxodo rural<\/strong>, trabalhadores volantes (<strong>boias-frias<\/strong>), inchaço das cidades.<\/li><li><strong>Agronegócio:<\/strong> integração entre agricultura, indústria (máquinas, insumos, processamento) e serviços (crédito, logística, exportação). Grande peso nas <strong>exportações de commodities<\/strong> (soja, milho, carnes, café, celulose, açúcar).<\/li><li><strong>Expansão da fronteira agrícola:<\/strong> do Sul e Sudeste para o <strong>Cerrado<\/strong> (Centro-Oeste e o Matopiba: Maranhão, Tocantins, Piauí, Bahia) e para a <strong>Amazônia<\/strong>, com desmatamento e conflitos.<\/li><\/ul>\n<h4>4. Alternativas e sustentabilidade<\/h4>\n<ul><li><strong>Agroecologia:<\/strong> produção sem agrotóxicos, com diversidade de cultivos, valorização de saberes tradicionais e circuitos curtos de venda (feiras).<\/li><li><strong>Sistemas agroflorestais (SAFs):<\/strong> árvores, lavouras e criações juntas, imitando a floresta.<\/li><li><strong>Reservas extrativistas<\/strong> (luta dos seringueiros, como <strong>Chico Mendes<\/strong>): uso sustentável da floresta por comunidades tradicionais.<\/li><li><strong>Compras públicas da agricultura familiar:<\/strong> a lei da alimentação escolar (PNAE) obriga que parte dos recursos federais da merenda seja usada na compra de alimentos da agricultura familiar.<\/li><li><strong>Polinizadores:<\/strong> abelhas e outros insetos são essenciais à produção de muitos alimentos; o uso intensivo de agrotóxicos e o desmatamento ameaçam essas populações.<\/li><\/ul>", "resumo": [["Estrutura fundiária", "Muito concentrada; raiz na Lei de Terras"], ["Função social (art. 186)", "Produtividade + meio ambiente + leis trabalhistas + bem-estar"], ["Desapropriação", "Instrumento de <strong>mudança<\/strong>, não de manutenção"], ["Trabalho escravo", "Expropriação <strong>sem<\/strong> indenização (art. 243)"], ["Modernização conservadora", "Máquinas sem reforma agrária; êxodo rural"], ["Agricultura familiar", "Muitos estabelecimentos, pouca área, muitos alimentos"], ["Agroecologia, SAF, Resex", "Alternativas sustentáveis"]], "qs": ["HG-43", "HG-44", "HG-45", "G5.4", "G5.5"]}, {"id": "G6", "vol": "HG", "line": "G", "title": "Espaço urbano", "habs": "H7, H8, H9, H24, H29", "faixa": "A", "note": "", "html": "<h4>1. Urbanização brasileira<\/h4>\n<ul><li><strong>Acelerada e concentrada<\/strong> na segunda metade do século XX: a população urbana superou a rural na década de 1960, e hoje a grande maioria dos brasileiros vive em cidades.<\/li><li><strong>Causas:<\/strong> industrialização no Sudeste (G7) e <strong>êxodo rural<\/strong> provocado pela concentração fundiária e pela modernização conservadora (G5).<\/li><li><strong>Resultado:<\/strong> cidades que cresceram <strong>mais rápido do que a infraestrutura<\/strong>: déficit habitacional, ocupações em encostas e várzeas, falta de saneamento, transporte precário.<\/li><\/ul>\n<h4>2. Conceitos que caem<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Conceito<\/th><th>Definição<\/th><\/tr><\/thead><tbody><tr><td><strong>Metropolização<\/strong><\/td><td>Formação de metrópoles que concentram população, serviços e poder de comando<\/td><\/tr><tr><td><strong>Conurbação<\/strong><\/td><td>Cidades vizinhas que crescem até se encontrarem fisicamente<\/td><\/tr><tr><td><strong>Região metropolitana<\/strong><\/td><td>Conjunto de municípios integrados, oficialmente reconhecidos<\/td><\/tr><tr><td><strong>Megalópole<\/strong><\/td><td>Junção de metrópoles (eixo Rio–São Paulo em formação)<\/td><\/tr><tr><td><strong>Rede e hierarquia urbana<\/strong><\/td><td>Cidades ligadas por fluxos; hoje uma cidade pequena pode se ligar diretamente a uma metrópole (internet, logística)<\/td><\/tr><tr><td><strong>Desmetropolização relativa<\/strong><\/td><td>Crescimento mais rápido das <strong>cidades médias<\/strong> do que das metrópoles<\/td><\/tr><tr><td><strong>Migração pendular<\/strong><\/td><td>Deslocamento diário entre cidades (morar em uma e trabalhar em outra)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3. Desigualdade no espaço urbano<\/h4>\n<ul><li><strong>Segregação socioespacial:<\/strong> os grupos sociais ocupam áreas diferentes da cidade conforme a renda. Os mais pobres vão para <strong>periferias<\/strong> distantes, favelas, áreas de risco (encostas, beira de rios), com menos serviços públicos.<\/li><li><strong>Autossegregação:<\/strong> grupos de alta renda se isolam em <strong>condomínios fechados<\/strong>, com muros e segurança privada.<\/li><li><strong>Especulação imobiliária:<\/strong> proprietários mantêm terrenos vazios à espera de valorização (<strong>vazios urbanos<\/strong>), enquanto falta moradia.<\/li><li><strong>Gentrificação:<\/strong> um bairro popular ou degradado recebe investimentos (revitalização, novos comércios, eventos); os preços sobem e os moradores antigos, de renda mais baixa, são <strong>expulsos<\/strong> pelo custo de vida.<\/li><li><strong>Verticalização:<\/strong> construção de prédios altos; adensa áreas valorizadas, pode gerar sombreamento, menos ventilação e sobrecarga de infraestrutura.<\/li><li><strong>Vulnerabilidade e desastres:<\/strong> deslizamentos e enchentes atingem principalmente quem foi empurrado para áreas de risco. <strong>O risco é social, não só natural.<\/strong><\/li><\/ul>\n<h4>4. Planejamento e direito à cidade<\/h4>\n<ul><li><strong>Constituição (arts. 182 e 183)<\/strong> e <strong>Estatuto da Cidade (Lei 10.257/2001):<\/strong> a propriedade <strong>urbana<\/strong> também tem <strong>função social<\/strong>.<\/li><li>Instrumentos: <strong>plano diretor<\/strong> (obrigatório para cidades com mais de 20 mil habitantes), <strong>IPTU progressivo no tempo<\/strong> para imóveis vazios ou subutilizados, parcelamento e edificação compulsórios, <strong>usucapião urbana<\/strong>, <strong>zonas especiais de interesse social (ZEIS)<\/strong> para moradia popular.<\/li><li><strong>Direito à cidade<\/strong> (ideia do filósofo Henri Lefebvre): todos devem poder usufruir da cidade, de seus espaços públicos, serviços e decisões.<\/li><li><strong>Mobilidade urbana:<\/strong> o modelo baseado no automóvel gera congestionamentos e poluição. Soluções: transporte coletivo de alta capacidade (metrô, trens, corredores de ônibus), ciclovias, integração tarifária, cidades mais compactas.<\/li><\/ul>", "resumo": [["Êxodo rural", "Concentração fundiária + modernização do campo"], ["Conurbação", "Cidades que se encontram"], ["Segregação × autossegregação", "Pobres empurrados × ricos que se isolam"], ["Gentrificação", "Revitalização que <strong>expulsa<\/strong> moradores antigos"], ["Especulação", "Terrenos vazios à espera de valorização"], ["Estatuto da Cidade", "Função social urbana; IPTU progressivo; plano diretor"]], "qs": ["HG-46", "HG-47", "HG-48", "G6.4", "G6.5"]}, {"id": "G7", "vol": "HG", "line": "G", "title": "Indústria, energia e transportes", "habs": "H16, H17, H18, H19, H20, H28, H29", "faixa": "B", "note": "Energia caiu forte em 2025 (geotérmica e carros elétricos).", "html": "<h4>1. Industrialização<\/h4>\n<ul><li><strong>Revoluções industriais:<\/strong> 1ª (século XVIII, carvão, máquina a vapor, têxtil, Inglaterra); 2ª (fim do XIX, eletricidade, petróleo, aço, química); 3ª (pós-1950/1970, eletrônica, informática, robótica, telecomunicações); fala-se hoje em uma <strong>4ª<\/strong> (automação, internet das coisas, inteligência artificial).<\/li><li><strong>Modelos de produção:<\/strong> taylorismo e fordismo (linha de montagem, produção em massa, estoques) × toyotismo (produção flexível, <em>just in time<\/em>, estoques mínimos, trabalhador polivalente, terceirização). Detalhes na apostila de Filosofia e Sociologia (mundo do trabalho).<\/li><li><strong>Industrialização brasileira:<\/strong> tardia e <strong>concentrada no Sudeste<\/strong> (capital do café, mercado consumidor, infraestrutura).<ul><li><strong>Vargas:<\/strong> indústria de base estatal (Companhia Siderúrgica Nacional, Vale do Rio Doce, Petrobras).<\/li><li><strong>JK:<\/strong> Plano de Metas, entrada de <strong>multinacionais<\/strong> (automobilísticas no ABC paulista), rodovias.<\/li><li><strong>Ditadura:<\/strong> \"milagre econômico\" com endividamento externo.<\/li><\/ul><\/li><li><strong>Desconcentração industrial<\/strong> (a partir dos anos 1970–1990): indústrias saem da Região Metropolitana de São Paulo para o interior, para outros estados e regiões, em busca de <strong>mão de obra mais barata<\/strong>, <strong>sindicatos menos atuantes<\/strong>, terrenos baratos, menos congestionamento e <strong>incentivos fiscais<\/strong> (a \"<strong>guerra fiscal<\/strong>\" entre estados).<\/li><li><strong>Desindustrialização:<\/strong> perda de participação da indústria no PIB, com maior peso de serviços e commodities.<\/li><\/ul>\n<h4>2. Energia<\/h4>\n<ul><li><strong>Matriz energética<\/strong> (toda a energia usada: transportes, indústria, residências) × <strong>matriz elétrica<\/strong> (só a eletricidade). O Brasil tem uma matriz energética com cerca de metade de fontes renováveis (muito acima da média mundial) e uma matriz elétrica <strong>predominantemente renovável<\/strong>, com a <strong>hidreletricidade<\/strong> como principal fonte, seguida pelo crescimento acelerado da <strong>eólica<\/strong> e da <strong>solar<\/strong>. <em>Percentuais exatos mudam ano a ano: confira no Balanço Energético Nacional (EPE) se precisar.<\/em><\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>Fonte<\/th><th>Vantagens<\/th><th>Problemas<\/th><\/tr><\/thead><tbody><tr><td><strong>Hidrelétrica<\/strong><\/td><td>Renovável, barata na operação<\/td><td>Alagamento de áreas, deslocamento de populações ribeirinhas e indígenas, perda de biodiversidade; <strong>depende das chuvas<\/strong> (crises hídricas elevam a conta de luz e acionam termelétricas)<\/td><\/tr><tr><td>Termelétrica (gás, carvão, óleo)<\/td><td>Pode ser ligada a qualquer momento<\/td><td>Emite gases do efeito estufa e poluentes<\/td><\/tr><tr><td><strong>Eólica<\/strong><\/td><td>Renovável, sem emissões na operação; forte no Nordeste<\/td><td>Intermitente; impactos em comunidades e na fauna (aves); conflitos por terra<\/td><\/tr><tr><td><strong>Solar<\/strong><\/td><td>Renovável, distribuída (telhados)<\/td><td>Intermitente; descarte de painéis<\/td><\/tr><tr><td>Nuclear<\/td><td>Não emite CO₂, gera muito em pouco espaço<\/td><td>Rejeitos radioativos, risco de acidentes<\/td><\/tr><tr><td><strong>Geotérmica<\/strong><\/td><td>Renovável e contínua<\/td><td>Só viável em áreas de <strong>atividade vulcânica ou tectônica<\/strong> (Islândia, Indonésia, Nova Zelândia); o Brasil não tem esse potencial em larga escala (G2)<\/td><\/tr><tr><td>Biomassa (etanol, bagaço)<\/td><td>Renovável; o etanol de cana reduz emissões nos transportes<\/td><td>Monocultura, concorrência com alimentos<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>Carros elétricos:<\/strong> não emitem gases pelo escapamento, mas o <strong>impacto total<\/strong> depende da <strong>origem da eletricidade<\/strong> (renovável ou fóssil) e da <strong>mineração<\/strong> de lítio, cobalto e níquel para as baterias. É o tipo de \"pegadinha de ciclo de vida\" que o ENEM gosta.<\/li><li><strong>Transição energética:<\/strong> troca de fontes fósseis por renováveis, com debate sobre quem paga e quem é afetado.<\/li><\/ul>\n<h4>3. Transportes e logística<\/h4>\n<ul><li>O Brasil fez uma opção histórica pelo <strong>rodoviarismo<\/strong> (sobretudo a partir de JK): a maior parte das cargas viaja de caminhão, mesmo em longas distâncias.<\/li><li><strong>Comparação para longas distâncias e cargas pesadas:<\/strong> hidrovia e ferrovia têm <strong>menor custo por tonelada transportada<\/strong> e menor consumo de combustível que a rodovia; a rodovia é mais flexível (porta a porta) e boa para curtas distâncias.<\/li><li>Consequências do rodoviarismo: <strong>custo logístico alto<\/strong> (o chamado \"custo Brasil\"), estradas sobrecarregadas, acidentes, emissões, vulnerabilidade a greves de caminhoneiros.<\/li><li><strong>Intermodalidade:<\/strong> combinar modais (rodovia até o terminal, ferrovia ou hidrovia até o porto). A soja do Centro-Oeste tem sido escoada cada vez mais pelos portos do <strong>Arco Norte<\/strong> (rios amazônicos).<\/li><\/ul>", "resumo": [["Desconcentração industrial", "Mão de obra barata, incentivos fiscais, menos sindicatos"], ["Matriz elétrica brasileira", "Predominantemente renovável; base hidrelétrica"], ["Hidrelétrica", "Depende de chuva; desloca populações"], ["Geotérmica", "Precisa de atividade vulcânica ou tectônica"], ["Carro elétrico", "Impacto depende da fonte de eletricidade e da mineração"], ["Rodoviarismo", "Caro em longa distância; ferrovia e hidrovia são mais baratas por tonelada"]], "qs": ["HG-49", "HG-50", "HG-51", "G7.4", "G7.5"]}, {"id": "G8", "vol": "HG", "line": "G", "title": "População e migrações", "habs": "H4, H5, H9, H15, H25", "faixa": "C", "note": "no conteúdo, mas migrações e refugiados aparecem com frequência ligados a direitos humanos.", "html": "<h4>1. Dinâmica demográfica<\/h4>\n<ul><li><strong>Crescimento vegetativo<\/strong> = natalidade − mortalidade.<\/li><li><strong>Transição demográfica:<\/strong> (1) natalidade e mortalidade altas; (2) mortalidade cai (vacinas, saneamento, medicina) e a população <strong>explode<\/strong>; (3) natalidade cai (urbanização, mulheres no mercado de trabalho e na escola, métodos contraceptivos); (4) ambas baixas: crescimento lento, <strong>envelhecimento<\/strong>.<\/li><li><strong>Brasil hoje:<\/strong> taxa de fecundidade <strong>abaixo do nível de reposição<\/strong> (cerca de 2,1 filhos por mulher), crescimento populacional desacelerado e <strong>envelhecimento rápido<\/strong>. O Censo 2022 registrou cerca de 203 milhões de habitantes.<\/li><li><strong>Bônus demográfico:<\/strong> fase em que a população em idade ativa é proporcionalmente grande; é uma janela de oportunidade para crescer, que o Brasil está deixando para trás.<\/li><li><strong>Consequências do envelhecimento:<\/strong> pressão sobre a <strong>previdência<\/strong> e a <strong>saúde<\/strong>, necessidade de cuidadores, mudanças no mercado de trabalho e nas cidades (acessibilidade).<\/li><li><strong>Pirâmide etária:<\/strong> base larga = muitos jovens (alta natalidade); topo largo = muitos idosos.<\/li><li><strong>Teorias:<\/strong> <strong>Malthus<\/strong> (população cresce mais que os alimentos; propunha controle moral), <strong>neomalthusianos<\/strong> (controle de natalidade nos países pobres), <strong>reformistas<\/strong> (a pobreza é causa, não consequência, do crescimento populacional; a solução é reduzir desigualdades).<\/li><\/ul>\n<h4>2. Migrações internas no Brasil<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Período<\/th><th>Fluxo principal<\/th><\/tr><\/thead><tbody><tr><td>Fim do XIX – início do XX<\/td><td>Imigrantes europeus e japoneses para o café e a indústria (H8, H9)<\/td><\/tr><tr><td>1950–1980<\/td><td><strong>Nordestinos para o Sudeste<\/strong> (industrialização, construção civil) e para Brasília<\/td><\/tr><tr><td>1970 em diante<\/td><td>Sul e Sudeste para o <strong>Centro-Oeste e o Norte<\/strong> (fronteira agrícola, garimpo, grandes obras)<\/td><\/tr><tr><td>1990 em diante<\/td><td><strong>Migração de retorno<\/strong> ao Nordeste; crescimento das <strong>cidades médias<\/strong>; migrações de curta distância e <strong>pendulares<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<h4>3. Migrações internacionais e refugiados<\/h4>\n<ul><li><strong>Migrante econômico<\/strong> × <strong>refugiado<\/strong> (pessoa que deixa o país por perseguição, guerra ou violação grave de direitos humanos e tem proteção internacional).<\/li><li><strong>Refugiados climáticos:<\/strong> termo usado para quem se desloca por desastres e mudanças ambientais (ainda sem a mesma proteção jurídica dos refugiados).<\/li><li><strong>No Brasil:<\/strong> haitianos (após o terremoto de 2010), <strong>venezuelanos<\/strong> (crise econômica e política; acolhimento pela fronteira de Roraima e interiorização para outros estados), sírios, afegãos, bolivianos (muitos submetidos a trabalho degradante na confecção).<\/li><li><strong>Lei de Migração (Lei 13.445/2017):<\/strong> substituiu o Estatuto do Estrangeiro, criado na ditadura, e trata o migrante como <strong>sujeito de direitos<\/strong> (acesso a serviços públicos, repúdio à xenofobia), e não como ameaça à segurança nacional.<\/li><li><strong>Xenofobia<\/strong> e endurecimento de fronteiras na Europa e nos Estados Unidos: tema recorrente em questões de direitos humanos.<\/li><\/ul>", "resumo": [["Transição demográfica", "Primeiro cai a mortalidade, depois a natalidade"], ["Brasil", "Fecundidade abaixo da reposição; envelhecimento rápido"], ["Envelhecimento", "Previdência, saúde, cuidado"], ["Reformistas", "Pobreza causa crescimento, não o contrário"], ["1950–1980", "Nordeste → Sudeste"], ["Lei de Migração (2017)", "Migrante como sujeito de direitos"]], "qs": ["HG-52", "HG-53", "HG-54", "G8.4", "G8.5"]}, {"id": "G9", "vol": "HG", "line": "G", "title": "Geopolítica e globalização", "habs": "H6, H7, H8, H9, H10, H17", "faixa": "B", "note": "Foi o seu erro na questão 46 (Macedônia do Norte e União Europeia).", "html": "<h4>1. Da Guerra Fria à ordem atual<\/h4>\n<ul><li><strong>Bipolaridade<\/strong> (EUA × URSS, 1947–1991) → <strong>unipolaridade<\/strong> militar dos EUA nos anos 1990 → <strong>multipolaridade<\/strong> crescente (China, União Europeia, Rússia, Índia, Brasil e outros emergentes).<\/li><li><strong>Conflitos e tensões atuais:<\/strong> guerra entre Rússia e Ucrânia (invasão em larga escala em 2022), conflito Israel–Palestina, disputa comercial e tecnológica entre EUA e China, nacionalismos e protecionismo.<\/li><\/ul>\n<h4>2. Globalização<\/h4>\n<ul><li>Integração mundial por <strong>fluxos<\/strong> de mercadorias, capitais, informações, pessoas e serviços, acelerada pelas tecnologias de transporte e comunicação.<\/li><li><strong>Milton Santos<\/strong> (geógrafo brasileiro): o espaço atual é o <strong>meio técnico-científico-informacional<\/strong>, em que ciência, técnica e informação estão incorporadas ao território (satélites, redes, agricultura de precisão). Ele criticou a <strong>globalização como perversidade<\/strong> (desemprego, pobreza, desigualdade) e propôs pensar \"outra globalização\", mais humana.<\/li><li><strong>Empresas transnacionais<\/strong>, fragmentação da produção (cada parte de um produto feita em um país), paraísos fiscais.<\/li><li><strong>Contradições:<\/strong> circulação livre de capitais e mercadorias × restrição à circulação de <strong>pessoas pobres<\/strong> (muros, xenofobia). Integração × <strong>exclusão digital<\/strong> e desigualdade entre países.<\/li><\/ul>\n<h4>3. Blocos econômicos e integração regional<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Nível de integração<\/th><th>Características<\/th><th>Exemplo<\/th><\/tr><\/thead><tbody><tr><td>Zona de livre comércio<\/td><td>Redução ou eliminação de tarifas entre os membros<\/td><td>Acordo entre EUA, México e Canadá<\/td><\/tr><tr><td><strong>União aduaneira<\/strong><\/td><td>Livre comércio + <strong>tarifa externa comum (TEC)<\/strong><\/td><td><strong>Mercosul<\/strong> (união aduaneira imperfeita, com exceções à TEC)<\/td><\/tr><tr><td>Mercado comum<\/td><td>+ livre circulação de pessoas, serviços e capitais<\/td><td>—<\/td><\/tr><tr><td><strong>União econômica e monetária<\/strong><\/td><td>+ moeda única e políticas econômicas comuns<\/td><td><strong>União Europeia<\/strong> (euro, adotado por parte dos membros)<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>União Europeia:<\/strong> origem na integração econômica do pós-Segunda Guerra (Comunidade Europeia do Carvão e do Aço, 1951); Tratado de Maastricht (1992) criou a UE; espaço Schengen (livre circulação sem controle de fronteiras internas); saída do Reino Unido (<strong>Brexit<\/strong>, efetivada em 2020).<\/li><li><strong>Adesão à UE:<\/strong> os candidatos precisam cumprir critérios (democracia, Estado de direito, direitos humanos, proteção de minorias, economia de mercado) e <strong>todos os membros atuais precisam concordar<\/strong>. Por isso um único país pode <strong>bloquear<\/strong> a entrada de um vizinho.<\/li><li><strong>Mercosul:<\/strong> Tratado de Assunção (1991), fundado por Brasil, Argentina, Paraguai e Uruguai; a Venezuela está suspensa desde 2016.<\/li><li><strong>Brics:<\/strong> articulação de grandes economias emergentes (Brasil, Rússia, Índia, China, África do Sul), ampliada a partir de 2024 com novos membros. Não é bloco econômico com tarifa comum; é um fórum político e econômico (com um banco de desenvolvimento próprio).<\/li><\/ul>\n<div class=\"callout\"><strong>A chave do seu erro na questão 46:<\/strong> a Macedônia mudou o nome para destravar um <strong>veto grego<\/strong> à sua adesão à UE. Aceitar mudar o próprio nome é o oposto de \"proteger a cultura local\". Quando o texto termina com \"bloqueou a adesão... depois chegaram a um acordo\", a resposta está na <strong>integração regional<\/strong>.<\/div>\n<h4>4. Organizações internacionais<\/h4>\n<ul><li><strong>ONU<\/strong> (1945): Assembleia Geral (todos os membros, um voto cada) e <strong>Conselho de Segurança<\/strong>, com <strong>5 membros permanentes com direito a veto<\/strong> (EUA, Rússia, China, Reino Unido e França). O veto de um só permanente barra uma resolução; por isso o Conselho fica paralisado em conflitos que envolvem as potências. O Brasil defende a <strong>reforma<\/strong> do Conselho e uma vaga permanente.<\/li><li><strong>OMC<\/strong> (comércio), <strong>FMI<\/strong> e <strong>Banco Mundial<\/strong> (finanças), <strong>Otan<\/strong> (aliança militar do Atlântico Norte, que se ampliou para o Leste Europeu após a Guerra Fria, o que a Rússia apresenta como ameaça).<\/li><\/ul>", "resumo": [["Ordem atual", "Multipolaridade crescente"], ["Milton Santos", "Meio técnico-científico-informacional; globalização como perversidade"], ["União aduaneira", "Tarifa externa comum (Mercosul)"], ["UE", "União econômica e monetária; adesão exige concordância de todos"], ["Conselho de Segurança", "5 permanentes com veto"], ["Globalização", "Fluxos livres de capital × barreiras a pessoas"]], "qs": ["HG-55", "HG-56", "HG-57", "G9.4", "G9.5"]}, {"id": "F1", "vol": "FS", "line": "F", "title": "Origens: mito, pré-socráticos, sofistas e Sócrates", "habs": "H1, H3, H4, H11", "faixa": "B", "note": "Filosofia antiga é a 2ª maior fatia de Filosofia no levantamento histórico; Heráclito e a crítica aos sofistas caíram em 2025.", "html": "<h4>1. Do mito ao logos<\/h4>\n<ul><li><strong>Mito:<\/strong> narrativa que explica a origem do mundo e dos fenômenos pela ação de deuses e forças sobrenaturais; vale pela <strong>autoridade da tradição<\/strong> e não é discutida.<\/li><li><strong>Logos<\/strong> (razão, discurso racional): explicação que busca <strong>causas naturais<\/strong>, apresenta <strong>argumentos<\/strong> e pode ser <strong>criticada e debatida<\/strong>.<\/li><li>A filosofia nasce nas colônias gregas da Jônia, no século VI a.C., num ambiente de <strong>comércio<\/strong>, contato entre culturas, <strong>escrita alfabética<\/strong> e, depois, <strong>debate público na pólis<\/strong>.<\/li><li>A passagem não foi uma ruptura instantânea: os primeiros filósofos ainda usavam imagens herdadas do mito. O que muda é a <strong>forma de justificar<\/strong>: não \"porque os deuses quiseram\", e sim \"porque a natureza funciona assim\".<\/li><\/ul>\n<h4>2. Os pré-socráticos (filósofos da natureza)<\/h4>\n<p>Buscavam a <strong>arché<\/strong>: o princípio que explica a origem e a unidade de todas as coisas da <strong>physis<\/strong> (natureza).<\/p>\n<div class=\"tw\"><table><thead><tr><th>Filósofo<\/th><th>Ideia central<\/th><\/tr><\/thead><tbody><tr><td><strong>Tales de Mileto<\/strong><\/td><td>A arché é a <strong>água<\/strong><\/td><\/tr><tr><td>Anaximandro<\/td><td>O <strong>ápeiron<\/strong> (o indeterminado, ilimitado)<\/td><\/tr><tr><td>Anaxímenes<\/td><td>O <strong>ar<\/strong>, que se condensa e se rarefaz<\/td><\/tr><tr><td><strong>Pitágoras<\/strong><\/td><td>Os <strong>números<\/strong>: a realidade tem estrutura matemática e harmônica<\/td><\/tr><tr><td><strong>Heráclito<\/strong> de Éfeso<\/td><td>Tudo flui (<strong>devir<\/strong>); \"não se entra duas vezes no mesmo rio\"; o fogo; a realidade é <strong>unidade e tensão dos contrários<\/strong> (dia-noite, guerra-paz); um <strong>logos<\/strong> ordena essa mudança<\/td><\/tr><tr><td><strong>Parmênides<\/strong> de Eleia<\/td><td><strong>O ser é, o não ser não é.<\/strong> O ser é uno, eterno e imóvel; a mudança percebida pelos sentidos é <strong>ilusão<\/strong> (opinião); só a razão alcança a verdade<\/td><\/tr><tr><td>Zenão de Eleia<\/td><td>Paradoxos (Aquiles e a tartaruga) para defender Parmênides<\/td><\/tr><tr><td>Empédocles<\/td><td>Quatro elementos (terra, água, ar, fogo), unidos pelo Amor e separados pelo Ódio<\/td><\/tr><tr><td><strong>Demócrito<\/strong> e Leucipo<\/td><td>Tudo é formado por <strong>átomos<\/strong> (indivisíveis) e <strong>vazio<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout\"><strong>Heráclito × Parmênides<\/strong> é o par mais cobrado: mudança como essência do real × permanência do ser, com a mudança como aparência.<\/div>\n<h4>3. Os sofistas<\/h4>\n<ul><li>Professores <strong>itinerantes e pagos<\/strong> que ensinavam <strong>retórica<\/strong> (a arte de persuadir) aos jovens que queriam participar da política na Atenas democrática.<\/li><li><strong>Protágoras:<\/strong> \"o homem é a medida de todas as coisas\", ou seja, a verdade depende de quem a julga (<strong>relativismo<\/strong>). <strong>Górgias:<\/strong> o poder quase mágico da palavra.<\/li><li><strong>A crítica de Platão:<\/strong> os sofistas ensinariam a <strong>parecer<\/strong> saber e a <strong>vencer<\/strong> discussões, não a buscar a <strong>verdade<\/strong>; a persuasão se dirige às emoções e não à razão. É a mesma crítica que o ENEM 2025 associou a um trecho de <strong>Hume<\/strong> sobre a eloquência que domina os afetos e \"subjuga o entendimento\".<\/li><li>Leitura justa: os sofistas também valorizaram a educação, a linguagem e o debate público, essenciais à democracia.<\/li><\/ul>\n<h4>4. Sócrates (c. 470–399 a.C.)<\/h4>\n<ul><li>Não escreveu nada; o conhecemos sobretudo pelos diálogos de <strong>Platão<\/strong>.<\/li><li>Volta a filosofia para o <strong>ser humano<\/strong> e a <strong>ética<\/strong>: o que é a justiça? a coragem? a virtude?<\/li><li><strong>\"Conhece-te a ti mesmo\"<\/strong> (inscrição do templo de Delfos que ele adotou como lema) e a consciência da própria ignorância (\"só sei que nada sei\", frase que resume a ideia).<\/li><li><strong>Método:<\/strong> <strong>ironia<\/strong> (fingir não saber e fazer perguntas que mostram as contradições das certezas do interlocutor) e <strong>maiêutica<\/strong> (\"arte do parto\": ajudar o outro a dar à luz as ideias por conta própria).<\/li><li>Busca <strong>definições universais<\/strong>, válidas para todos os casos, e não exemplos.<\/li><li><strong>Intelectualismo moral:<\/strong> a virtude é conhecimento; quem faz o mal o faz por ignorância.<\/li><li>Condenado à morte em 399 a.C. (acusado de corromper a juventude e de não honrar os deuses da cidade); recusou fugir para não desobedecer às leis.<\/li><\/ul>", "resumo": [["Mito × logos", "Tradição e sobrenatural × argumento e natureza"], ["Arché", "Princípio de todas as coisas"], ["Heráclito", "Devir, fluxo, unidade dos contrários"], ["Parmênides", "O ser é imóvel; o movimento é ilusão"], ["Demócrito", "Átomos e vazio"], ["Sofistas", "Retórica, persuasão, relativismo (Protágoras)"], ["Sócrates", "Ironia, maiêutica, \"conhece-te a ti mesmo\", virtude é conhecimento"]], "qs": ["FS-1", "FS-2", "FS-3", "F1.4", "F1.5"]}, {"id": "F2", "vol": "FS", "line": "F", "title": "Platão e Aristóteles", "habs": "H11, H12, H14, H23", "faixa": "B", "note": "(sobe para A em ética e política). Os dois caíram em 2025: Aristóteles (formas de governo) e Platão (cidade justa).", "html": "<h4>1. Platão (c. 428–348 a.C.)<\/h4>\n<ul><li><strong>Dois mundos:<\/strong> o <strong>sensível<\/strong> (das coisas que mudam, percebidas pelos sentidos: cópias imperfeitas) e o <strong>inteligível<\/strong> (das <strong>Ideias<\/strong> ou Formas: eternas, perfeitas, imutáveis, alcançadas pela razão). A ideia de Beleza é o modelo de todas as coisas belas.<\/li><li><strong>Doxa<\/strong> (opinião, baseada nos sentidos) × <strong>episteme<\/strong> (conhecimento verdadeiro, racional).<\/li><li><strong>Reminiscência:<\/strong> conhecer é lembrar as Ideias que a alma contemplou antes de nascer.<\/li><li><strong>Alegoria da caverna<\/strong> (<em>A República<\/em>, livro VII): prisioneiros acorrentados só veem <strong>sombras<\/strong> e as tomam pela realidade (doxa). Um deles se liberta, sobe com esforço, é ofuscado pela luz e, por fim, vê o Sol (a Ideia do Bem). Ao <strong>voltar<\/strong> para libertar os outros, é ridicularizado e ameaçado. Sentidos: a educação filosófica como libertação; o dever político do filósofo; uma alusão à morte de Sócrates.<\/li><li><strong>A cidade justa<\/strong> (<em>A República<\/em>): três classes correspondentes às três partes da alma.<\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>Parte da alma<\/th><th>Virtude<\/th><th>Classe na cidade<\/th><\/tr><\/thead><tbody><tr><td>Racional<\/td><td>Sabedoria<\/td><td><strong>Governantes-filósofos<\/strong><\/td><\/tr><tr><td>Irascível (ânimo)<\/td><td>Coragem<\/td><td>Guardiões (guerreiros)<\/td><\/tr><tr><td>Concupiscível (desejos)<\/td><td>Temperança<\/td><td>Produtores (artesãos, agricultores, comerciantes)<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>Justiça<\/strong> = cada parte cumprindo sua função, em harmonia, sob a direção da razão. Quem deve governar é quem conhece o Bem: o <strong>filósofo-rei<\/strong> (governo dos sábios, às vezes chamado de <strong>sofocracia<\/strong>). Para Platão, <strong>ética e exercício do poder são inseparáveis<\/strong>, e a cidade injusta é a governada por interesses particulares (como os dos proprietários). Platão criticava a democracia ateniense como governo da <strong>opinião<\/strong>.<\/li><li><strong>Arte como imitação:<\/strong> a arte copia as coisas sensíveis, que já são cópias das Ideias; fica duplamente afastada da verdade.<\/li><\/ul>\n<h4>2. Aristóteles (384–322 a.C.)<\/h4>\n<ul><li>Discípulo de Platão, critica os dois mundos: a essência (forma) está <strong>nas próprias coisas<\/strong>, unida à matéria. Valoriza a <strong>observação<\/strong> e a experiência.<\/li><li><strong>Ato e potência:<\/strong> a semente é árvore em potência; o movimento é a passagem da potência ao ato.<\/li><li><strong>Quatro causas<\/strong> (de uma estátua): material (o mármore), formal (a forma da estátua), eficiente (o escultor), final (o objetivo, a finalidade).<\/li><li><strong>Lógica:<\/strong> o <strong>silogismo<\/strong> (todo homem é mortal; Sócrates é homem; logo, Sócrates é mortal).<\/li><li><strong>Ética<\/strong> (<em>Ética a Nicômaco<\/em>):<ul><li>Toda ação busca um fim; o fim último é a <strong>felicidade<\/strong> (<strong>eudaimonia<\/strong>), entendida como vida plena segundo a razão, não como prazer passageiro.<\/li><li><strong>Virtude moral<\/strong> é uma <strong>disposição adquirida pelo hábito<\/strong> (tornamo-nos justos praticando atos justos) e consiste no <strong>justo meio<\/strong> entre dois vícios: coragem entre covardia (falta) e temeridade (excesso); generosidade entre avareza e esbanjamento.<\/li><li><strong>Prudência<\/strong> (<em>phronesis<\/em>): sabedoria prática para escolher o meio-termo em cada situação.<\/li><li><strong>Justiça:<\/strong> distributiva (repartir bens e honras de forma <strong>proporcional<\/strong> ao mérito, tratando desigualmente os desiguais) e corretiva (reparar danos nas trocas e nos crimes).<\/li><\/ul><\/li><li><strong>Política:<\/strong><ul><li>\"O homem é por natureza um <strong>animal político<\/strong>\": só realiza plenamente a sua natureza vivendo na <strong>pólis<\/strong>. Quem vive fora da cidade \"é um deus ou uma besta\".<\/li><li>A finalidade da cidade é o <strong>bem viver<\/strong> de seus membros, e a ética é inseparável da política.<\/li><li><strong>Formas de governo<\/strong> (caíram em 2025):<\/li><\/ul><\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>Quem governa<\/th><th>Forma pura (visa ao <strong>bem comum<\/strong>)<\/th><th>Forma desviada (visa ao interesse <strong>de uma parte<\/strong>)<\/th><\/tr><\/thead><tbody><tr><td>Um<\/td><td><strong>Monarquia<\/strong><\/td><td>Tirania<\/td><\/tr><tr><td>Poucos<\/td><td><strong>Aristocracia<\/strong><\/td><td>Oligarquia<\/td><\/tr><tr><td>Muitos<\/td><td><strong>Politeia<\/strong> (república, governo constitucional)<\/td><td>Democracia (no sentido de governo dos pobres em benefício próprio) ou demagogia<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout\"><strong>Atenção à tradução:<\/strong> no ENEM 2025 e em muitos livros, a forma pura do governo de muitos aparece simplesmente como \"<strong>democracia<\/strong>\", e a desviada como \"demagogia\". O critério é o que importa: <strong>bem comum = forma pura; interesse particular = desvio.<\/strong><\/div>\n<ul><li><strong>Anacronismo a evitar:<\/strong> Aristóteles justificava a escravidão como \"natural\" e excluía mulheres da cidadania. Explicar isso pelo contexto não é concordar com isso.<\/li><\/ul>", "resumo": [["Mundo das Ideias", "Platão: essências perfeitas, alcançadas pela razão"], ["Caverna", "Sombras (doxa) → luz (conhecimento); educação e dever político"], ["Cidade justa", "Cada classe na sua função; governo dos filósofos"], ["Ato e potência", "Aristóteles: a semente e a árvore"], ["Eudaimonia", "Felicidade como vida plena segundo a razão"], ["Justo meio", "Virtude como hábito entre excesso e falta"], ["Animal político", "O homem se realiza na pólis"], ["Formas de governo", "Bem comum (pura) × interesse de uma parte (desvio)"]], "qs": ["FS-4", "FS-5", "FS-6", "F2.4", "F2.5"]}, {"id": "F3", "vol": "FS", "line": "F", "title": "Filosofia helenística e medieval", "habs": "H1, H3, H23", "faixa": "C", "note": "Cai menos, mas os conceitos (ataraxia, fé e razão) aparecem em questões de ética e de história.", "html": "<h4>1. Filosofia helenística<\/h4>\n<ul><li><strong>Contexto:<\/strong> depois das conquistas de Alexandre (século IV a.C.), as cidades gregas perdem a autonomia política e passam a integrar grandes impérios. A filosofia se volta para a <strong>felicidade individual<\/strong> e a <strong>tranquilidade da alma<\/strong> (<strong>ataraxia<\/strong>), em vez da participação política na pólis.<\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>Escola<\/th><th>Ideia central<\/th><\/tr><\/thead><tbody><tr><td><strong>Epicurismo<\/strong> (Epicuro)<\/td><td>A felicidade é o <strong>prazer<\/strong>, entendido como <strong>ausência de dor<\/strong> no corpo e de perturbação na alma. Prazeres naturais e necessários, vida simples, <strong>amizade<\/strong>; não temer os deuses nem a <strong>morte<\/strong> (\"quando ela está, nós não estamos\")<\/td><\/tr><tr><td><strong>Estoicismo<\/strong> (Zenão de Cítio; depois Sêneca, Epicteto, Marco Aurélio)<\/td><td>Viver <strong>segundo a natureza e a razão<\/strong> que ordena o cosmo; distinguir o que <strong>depende de nós<\/strong> (juízos, desejos) do que <strong>não depende<\/strong> (corpo, riqueza, fama, morte); aceitar o destino com serenidade (<strong>apatia<\/strong>: não ser dominado pelas paixões); <strong>cosmopolitismo<\/strong> (somos todos cidadãos do mundo)<\/td><\/tr><tr><td><strong>Ceticismo<\/strong> (Pirro)<\/td><td>Como não há critério seguro de verdade, <strong>suspender o juízo<\/strong> (<em>epoché<\/em>) leva à tranquilidade<\/td><\/tr><tr><td>Cinismo (Diógenes)<\/td><td>Vida simples e conforme a natureza, desprezo pelas convenções sociais<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2. Filosofia medieval<\/h4>\n<p>O grande problema é a relação entre <strong>fé<\/strong> (revelação) e <strong>razão<\/strong> (filosofia grega).<\/p>\n<ul><li><strong>Patrística<\/strong> (séculos II–VIII): os \"padres da Igreja\" defendem e organizam a doutrina cristã. <strong>Santo Agostinho<\/strong> (354–430):<ul><li>Une cristianismo e <strong>platonismo<\/strong>: a verdade está em Deus, e a alma a alcança pela <strong>iluminação divina<\/strong>.<\/li><li>\"Creio para compreender\": a fé orienta a razão.<\/li><li>O <strong>mal<\/strong> não é uma substância criada por Deus; é <strong>ausência de bem<\/strong>, fruto do mau uso do <strong>livre-arbítrio<\/strong> humano.<\/li><li><em>A Cidade de Deus<\/em>: oposição entre a cidade terrena (amor de si) e a cidade de Deus (amor a Deus).<\/li><\/ul><\/li><li><strong>Escolástica<\/strong> (séculos IX–XV), ligada às <strong>universidades<\/strong>. <strong>São Tomás de Aquino<\/strong> (1225–1274):<ul><li>Concilia o cristianismo com <strong>Aristóteles<\/strong>.<\/li><li><strong>Fé e razão não se contradizem<\/strong>, pois têm a mesma origem (Deus); a razão pode demonstrar algumas verdades (como a existência de Deus pelas <strong>cinco vias<\/strong>), e outras só a fé alcança (como a Trindade).<\/li><li><strong>Lei natural<\/strong>: a razão humana participa da ordem racional criada por Deus.<\/li><li><strong>Querela dos universais<\/strong>: os conceitos gerais (\"humanidade\") existem de fato (realistas) ou são apenas nomes (nominalistas, como Guilherme de Ockham)?<\/li><\/ul><\/li><\/ul>", "resumo": [["Ataraxia", "Tranquilidade da alma, meta helenística"], ["Epicuro", "Prazer = ausência de dor; não temer a morte"], ["Estoicos", "O que depende de nós × o que não depende; razão e natureza"], ["Céticos", "Suspensão do juízo"], ["Agostinho", "Platonismo cristão; mal como ausência de bem; livre-arbítrio"], ["Tomás de Aquino", "Aristóteles + cristianismo; fé e razão em harmonia"]], "qs": ["FS-7", "FS-8", "FS-9", "F3.4", "F3.5"]}, {"id": "F4", "vol": "FS", "line": "F", "title": "Conhecimento e ciência", "habs": "H1, H16, H20", "faixa": "C", "note": "(teoria do conhecimento: cerca de 12% de Filosofia no levantamento). Hume apareceu em 2025.", "html": "<h4>1. O problema<\/h4>\n<p>De onde vem o conhecimento, e como saber se ele é verdadeiro? A modernidade (séculos XVII e XVIII), com a revolução científica de Galileu e Newton, colocou essa pergunta no centro.<\/p>\n<h4>2. Racionalismo: Descartes (1596–1650)<\/h4>\n<ul><li><strong>Dúvida metódica:<\/strong> duvidar de tudo o que possa ser posto em dúvida, para encontrar um fundamento <strong>absolutamente certo<\/strong>. Os sentidos às vezes enganam; posso estar sonhando; um \"gênio maligno\" poderia me enganar até na matemática.<\/li><li><strong>Cogito:<\/strong> mesmo que eu duvide de tudo, não posso duvidar de que estou duvidando, ou seja, pensando. \"<strong>Penso, logo existo.<\/strong>\" É a primeira certeza.<\/li><li>Critério de verdade: ideias <strong>claras e distintas<\/strong>. Algumas ideias são <strong>inatas<\/strong> (Deus, perfeição, ideias matemáticas).<\/li><li><strong>Dualismo:<\/strong> substância pensante (alma, <em>res cogitans<\/em>) × substância extensa (corpo e matéria, <em>res extensa<\/em>). O corpo e a natureza funcionam como máquinas.<\/li><li><em>Discurso do método<\/em>: regras da evidência (só aceitar o que é claro e distinto), da análise (dividir), da síntese (ordenar do simples ao complexo) e da enumeração (revisar tudo).<\/li><\/ul>\n<h4>3. Empirismo e método experimental<\/h4>\n<ul><li><strong>Francis Bacon<\/strong> (1561–1626): ciência pela <strong>observação e indução<\/strong> (partir de casos particulares para chegar a leis gerais) e pela experimentação. Os <strong>ídolos<\/strong> (preconceitos que atrapalham o conhecimento: da tribo, da caverna, do foro, do teatro). \"Saber é poder\": o conhecimento serve para dominar a natureza.<\/li><li><strong>John Locke<\/strong> (1632–1704): a mente é uma <strong>tábula rasa<\/strong> (folha em branco); não há ideias inatas; todo conhecimento vem da <strong>experiência<\/strong> (sensação e reflexão).<\/li><li><strong>David Hume<\/strong> (1711–1776):<ul><li>Todas as ideias derivam de <strong>impressões<\/strong> (dados dos sentidos).<\/li><li><strong>Crítica à causalidade:<\/strong> nunca observamos a \"conexão necessária\" entre causa e efeito, só que um fato costuma seguir o outro. Esperamos que o Sol nasça amanhã por <strong>hábito<\/strong> (costume), não por demonstração.<\/li><li><strong>Problema da indução:<\/strong> a experiência passada não garante logicamente o futuro.<\/li><li>Hume desconfiava também da <strong>eloquência<\/strong> que fala às paixões e enfraquece o juízo racional.<\/li><\/ul><\/li><\/ul>\n<h4>4. Kant (1724–1804): a síntese<\/h4>\n<ul><li>\"Todo conhecimento <strong>começa<\/strong> com a experiência, mas nem todo conhecimento <strong>deriva<\/strong> da experiência.\"<\/li><li><strong>Revolução copernicana:<\/strong> não é o sujeito que gira em torno dos objetos; os objetos é que se ajustam às <strong>estruturas do sujeito<\/strong>. Conhecemos o mundo por meio de <strong>formas a priori<\/strong> (espaço, tempo e as categorias do entendimento, como a causalidade).<\/li><li><strong>Fenômeno<\/strong> (a coisa como aparece para nós) × <strong>coisa em si<\/strong> (como ela é independentemente de nós), que não podemos conhecer.<\/li><li><strong>Esclarecimento<\/strong> (<em>O que é o Esclarecimento?<\/em>, 1784): a saída do ser humano da <strong>menoridade<\/strong>, isto é, da incapacidade de usar o próprio entendimento sem a direção de outro. Lema: <strong><em>Sapere aude<\/strong><\/em> (\"ousa saber\", \"tem coragem de servir-te do teu próprio entendimento\").<\/li><\/ul>\n<h4>5. Ciência no século XX<\/h4>\n<ul><li><strong>Positivismo<\/strong> (Auguste Comte, século XIX): a humanidade passaria pelos estados teológico, metafísico e <strong>positivo<\/strong> (científico); só a ciência produz conhecimento válido.<\/li><li><strong>Karl Popper:<\/strong> uma teoria é científica se pode ser <strong>refutada<\/strong> (falseada) por um teste empírico (<strong>falseabilidade<\/strong>). Teorias que \"explicam tudo\" e nunca podem ser contrariadas não são científicas. A ciência avança por conjecturas e refutações.<\/li><li><strong>Thomas Kuhn:<\/strong> a ciência funciona dentro de <strong>paradigmas<\/strong> (modelos aceitos pela comunidade científica). Anomalias acumuladas geram <strong>crises<\/strong> e <strong>revoluções científicas<\/strong>, quando um paradigma substitui o outro (como de Ptolomeu para Copérnico).<\/li><\/ul>", "resumo": [["Descartes", "Dúvida metódica, cogito, ideias inatas, dualismo"], ["Bacon", "Indução, experimento, ídolos"], ["Locke", "Tábula rasa"], ["Hume", "Causalidade é hábito; problema da indução"], ["Kant", "Formas a priori do sujeito; fenômeno × coisa em si; <em>sapere aude<\/em>"], ["Popper", "Falseabilidade"], ["Kuhn", "Paradigma, crise, revolução científica"]], "qs": ["FS-10", "FS-11", "FS-12", "F4.4", "F4.5"]}, {"id": "F5", "vol": "FS", "line": "F", "title": "Filosofia política", "habs": "H11, H12, H14, H22, H23, H24", "faixa": "A", "note": "Dois dos seus erros de 2025 estão aqui: Derrida (desobediência civil, questão 50) e Bobbio (direitos como construção histórica, questão 76).", "html": "<h4>1. Maquiavel (1469–1527)<\/h4>\n<ul><li><em>O Príncipe<\/em>: analisa a política <strong>como ela é<\/strong>, e não como deveria ser (<strong>realismo político<\/strong>).<\/li><li>A política tem uma <strong>lógica própria<\/strong>, separada da moral cristã: o governante deve fazer o que for necessário para <strong>conquistar e manter o Estado<\/strong>.<\/li><li><strong>Virtù<\/strong> (capacidade de agir com habilidade e no momento certo) × <strong>fortuna<\/strong> (o acaso, as circunstâncias). O príncipe virtuoso aproveita a ocasião.<\/li><li>Melhor ser amado e temido; não sendo possível os dois, <strong>é mais seguro ser temido<\/strong>. Mas deve evitar ser <strong>odiado<\/strong>.<\/li><li>A frase \"os fins justificam os meios\" é um resumo popular, não está escrita assim na obra; a ideia é que o julgamento do príncipe se faz pelos <strong>resultados<\/strong> para o Estado.<\/li><\/ul>\n<h4>2. Os contratualistas<\/h4>\n<p>Explicam a origem do Estado por um <strong>contrato<\/strong> entre indivíduos que deixam o <strong>estado de natureza<\/strong> (situação hipotética sem governo) para formar a <strong>sociedade civil<\/strong>.<\/p>\n<div class=\"tw\"><table><thead><tr><th><\/th><th><strong>Hobbes<\/strong> (<em>Leviatã<\/em>, 1651)<\/th><th><strong>Locke<\/strong> (<em>Segundo Tratado<\/em>, 1689)<\/th><th><strong>Rousseau<\/strong> (<em>Do Contrato Social<\/em>, 1762)<\/th><\/tr><\/thead><tbody><tr><td>Estado de natureza<\/td><td><strong>Guerra de todos contra todos<\/strong>; medo, insegurança; vida \"solitária, pobre, sórdida, brutal e curta\"; \"o homem é o lobo do homem\" (expressão que ele usa em <em>Do cidadão<\/em>)<\/td><td>Relativa paz, com <strong>direitos naturais<\/strong> (vida, liberdade, <strong>propriedade<\/strong>), mas sem juiz imparcial para resolver conflitos<\/td><td>Homem natural livre, simples, com piedade (<strong>bom selvagem<\/strong>); a <strong>propriedade privada<\/strong> cria a desigualdade e corrompe<\/td><\/tr><tr><td>Por que o contrato<\/td><td><strong>Segurança<\/strong> e paz<\/td><td><strong>Proteger<\/strong> os direitos naturais<\/td><td>Criar uma associação legítima em que cada um obedeça só a si mesmo<\/td><\/tr><tr><td>Tipo de Estado<\/td><td><strong>Soberano absoluto<\/strong> (Leviatã), que concentra o poder<\/td><td><strong>Governo limitado<\/strong>, por consentimento; Legislativo como poder supremo<\/td><td><strong>Soberania popular<\/strong> inalienável; a lei expressa a <strong>vontade geral<\/strong><\/td><\/tr><tr><td>Direito de resistência<\/td><td>Não (salvo para preservar a própria vida)<\/td><td><strong>Sim<\/strong>, contra o governo que viola os direitos<\/td><td>O povo é o soberano; o governo é seu mero executor<\/td><\/tr><tr><td>Legado<\/td><td>Justificação racional (não divina) do absolutismo<\/td><td><strong>Liberalismo<\/strong>; Revolução Gloriosa e Independência dos EUA<\/td><td>Democracia radical; Revolução Francesa<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>Montesquieu<\/strong> (<em>O espírito das leis<\/em>, 1748): separação dos poderes (ver volume 1, H4).<\/li><\/ul>\n<h4>3. Hannah Arendt (1906–1975)<\/h4>\n<ul><li>Estudou os <strong>totalitarismos<\/strong> (nazismo e stalinismo): terror, ideologia, campos de concentração, destruição do espaço público e da pluralidade.<\/li><li><strong>Banalidade do mal:<\/strong> ao acompanhar o julgamento do nazista Adolf Eichmann, concluiu que grandes crimes podem ser cometidos por pessoas comuns, burocratas obedientes, movidas não por ódio profundo, mas pela <strong>incapacidade de pensar<\/strong> e de julgar por si mesmas.<\/li><li><strong>Poder × violência:<\/strong> poder é a capacidade humana de <strong>agir em conjunto<\/strong>; a violência é instrumental e surge quando o poder está se perdendo.<\/li><\/ul>\n<h4>4. Direito, justiça e desobediência civil<\/h4>\n<ul><li><strong>Direito positivo:<\/strong> o conjunto de leis escritas de um Estado. <strong>Justiça:<\/strong> o valor que o direito deveria realizar, mas nem sempre realiza.<\/li><li><strong>Desobediência civil:<\/strong> descumprimento <strong>público, consciente e não violento<\/strong> de uma lei considerada injusta, em nome de um <strong>princípio de justiça<\/strong>, aceitando as consequências legais.<ul><li><strong>Henry David Thoreau<\/strong> (<em>A desobediência civil<\/em>, 1849) recusou-se a pagar imposto a um governo que mantinha a escravidão e fazia guerra contra o México.<\/li><li>Exemplos históricos: <strong>Gandhi<\/strong> (Marcha do Sal), <strong>Martin Luther King<\/strong> e <strong>Rosa Parks<\/strong> (recusa a ceder o lugar no ônibus segregado, 1955).<\/li><li><strong>Não é<\/strong> desobediência civil: crime comum, violência armada, greve legal (que é um direito previsto em lei), manifestação autorizada.<\/li><\/ul><\/li><li><strong>Derrida:<\/strong> o <strong>direito<\/strong> é da ordem do cálculo (regras aplicáveis); a <strong>justiça<\/strong> é \"incalculável\": nenhuma regra garante, de antemão, que uma decisão será justa. Por isso pode haver ações <strong>justas fora do ordenamento jurídico<\/strong>. <em>Este é o conteúdo da sua questão 50.<\/em><\/li><li><strong>John Rawls<\/strong> (<em>Uma teoria da justiça<\/em>, 1971): os princípios justos seriam os escolhidos sob um <strong>véu da ignorância<\/strong> (sem saber que lugar ocuparíamos na sociedade). <strong>Princípio da diferença:<\/strong> desigualdades só são justas se beneficiarem os <strong>menos favorecidos<\/strong>.<\/li><\/ul>\n<h4>5. Direitos humanos como construção histórica (Bobbio)<\/h4>\n<ul><li><strong>Norberto Bobbio<\/strong> (<em>A era dos direitos<\/em>): os direitos humanos <strong>não são naturais nem eternos<\/strong>; são <strong>históricos<\/strong>, nascidos em certas circunstâncias, de <strong>lutas<\/strong> por novas liberdades contra velhos poderes, e mudam com as condições sociais, os interesses e as transformações técnicas. São, portanto, <strong>variáveis<\/strong> e resultam de <strong>acordos coletivos<\/strong> de cada época. <em>Este é o conteúdo da sua questão 76.<\/em><\/li><li>Para Bobbio, o grande problema de hoje não é mais <strong>justificar<\/strong> os direitos, e sim <strong>protegê-los<\/strong> (efetivá-los).<\/li><li><strong>Gerações (ou dimensões) de direitos<\/strong>, classificação muito usada:<\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>Geração<\/th><th>Direitos<\/th><th>Contexto<\/th><\/tr><\/thead><tbody><tr><td>1ª<\/td><td><strong>Civis e políticos<\/strong> (liberdade, propriedade, voto, expressão)<\/td><td>Revoluções liberais, séculos XVII–XVIII<\/td><\/tr><tr><td>2ª<\/td><td><strong>Sociais<\/strong> (trabalho, educação, saúde, previdência)<\/td><td>Lutas operárias, séculos XIX–XX<\/td><\/tr><tr><td>3ª<\/td><td><strong>Difusos e coletivos<\/strong> (meio ambiente, paz, desenvolvimento, direitos dos povos)<\/td><td>Pós-1945<\/td><\/tr><tr><td>4ª<\/td><td>Ligados à <strong>bioética<\/strong> e à engenharia genética (na classificação de Bobbio)<\/td><td>Fim do século XX<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>Declaração Universal dos Direitos Humanos<\/strong> (ONU, 1948), após os horrores da Segunda Guerra.<\/li><\/ul>", "resumo": [["Maquiavel", "Realismo; política separada da moral; virtù e fortuna"], ["Hobbes", "Guerra de todos contra todos → soberano absoluto"], ["Locke", "Direitos naturais → governo limitado e direito de resistência"], ["Rousseau", "Bom selvagem; propriedade gera desigualdade; vontade geral"], ["Arendt", "Banalidade do mal; poder × violência"], ["Desobediência civil", "Pública, não violenta, contra lei injusta (Thoreau)"], ["Derrida", "Direito é cálculo; justiça é incalculável"], ["Rawls", "Véu da ignorância; princípio da diferença"], ["Bobbio", "Direitos são históricos e variáveis; o desafio é protegê-los"]], "qs": ["FS-13", "FS-14", "FS-15", "F5.4", "F5.5"]}, {"id": "F6", "vol": "FS", "line": "F", "title": "Ética", "habs": "H12, H23, H24, H25", "faixa": "A", "note": "\"Ética e justiça\" é o tema número 1 de Filosofia no levantamento histórico, e o seu erro na questão 79 (Bentham) está aqui.", "html": "<h4>1. Moral e ética<\/h4>\n<ul><li><strong>Moral:<\/strong> conjunto de normas e valores de um grupo, em uma época. <strong>Ética:<\/strong> reflexão filosófica sobre esses valores (por que algo é certo ou errado?). No uso comum, as palavras se misturam.<\/li><\/ul>\n<h4>2. Kant: a ética do dever (deontologia)<\/h4>\n<ul><li>O que tem valor moral é a <strong>boa vontade<\/strong>: agir <strong>por dever<\/strong>, e não apenas <strong>conforme<\/strong> o dever. O comerciante que não engana o cliente só para não perder a freguesia age conforme o dever, mas por interesse; não tem mérito moral.<\/li><li><strong>Imperativo hipotético:<\/strong> \"se queres X, faz Y\" (vale para quem quer o fim). <strong>Imperativo categórico:<\/strong> ordem <strong>incondicional<\/strong>, válida para todo ser racional.<ul><li><strong>Fórmula da lei universal:<\/strong> age só segundo a regra (máxima) que você possa querer que se torne <strong>lei universal<\/strong>. Se todos mentissem quando lhes conviesse, ninguém mais acreditaria em promessas: logo, mentir não pode ser universalizado.<\/li><li><strong>Fórmula da humanidade:<\/strong> trata a humanidade, em ti e nos outros, sempre <strong>como fim<\/strong> e nunca <strong>apenas como meio<\/strong>. Por isso as pessoas têm <strong>dignidade<\/strong>, e não preço.<\/li><\/ul><\/li><li><strong>Autonomia:<\/strong> a razão dá a si mesma a lei moral. <strong>Heteronomia:<\/strong> obedecer por medo, interesse ou imposição externa.<\/li><li>O valor da ação está na <strong>intenção<\/strong> e no <strong>princípio<\/strong>, não nas consequências.<\/li><\/ul>\n<h4>3. Utilitarismo: a ética das consequências<\/h4>\n<ul><li><strong>Jeremy Bentham<\/strong> (1748–1832): a natureza colocou o ser humano sob dois senhores, a <strong>dor<\/strong> e o <strong>prazer<\/strong>. <strong>Princípio da utilidade:<\/strong> é boa a ação que produz <strong>a maior felicidade para o maior número<\/strong>. A felicidade é medida por um <strong>cálculo<\/strong> de prazeres e dores (intensidade, duração, certeza, extensão...).<ul><li>Aplicado ao direito: <strong>punir<\/strong> só se justifica como <strong>meio<\/strong> para produzir mais felicidade (prevenir danos maiores à sociedade); a pena deve ser <strong>proporcional<\/strong> ao dano. <em>Este é o conteúdo da sua questão 79: a punição é um meio para um fim, a felicidade.<\/em><\/li><\/ul><\/li><li><strong>John Stuart Mill<\/strong> (1806–1873): há prazeres <strong>superiores<\/strong> (intelectuais, morais) e inferiores: \"é melhor ser um Sócrates insatisfeito do que um tolo satisfeito\". Em <em>Sobre a liberdade<\/em>, a sociedade só pode limitar a liberdade de alguém para <strong>evitar dano a outros<\/strong>.<\/li><li><strong>Crítica clássica:<\/strong> o cálculo pode justificar sacrificar uma minoria em nome da maioria; Kant responderia que ninguém pode ser usado <strong>apenas como meio<\/strong>.<\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th><\/th><th><strong>Kant (deontologia)<\/strong><\/th><th><strong>Utilitarismo<\/strong><\/th><\/tr><\/thead><tbody><tr><td>O que torna a ação boa<\/td><td>Agir <strong>por dever<\/strong>, segundo princípio universalizável<\/td><td>As <strong>consequências<\/strong>: mais felicidade, menos dor<\/td><\/tr><tr><td>Mentir para salvar alguém<\/td><td>Errado: o dever não depende do resultado<\/td><td>Pode ser certo, se produzir mais bem-estar<\/td><\/tr><tr><td>Palavras-chave no texto<\/td><td>dever, máxima, universal, dignidade, fim em si, autonomia<\/td><td>utilidade, prazer, dor, felicidade, maior número, cálculo, meios e fins<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>4. Adam Smith: moral e mercado<\/h4>\n<ul><li>Mais conhecido pela <em>Riqueza das nações<\/em> (1776): o interesse próprio dos indivíduos, numa economia de mercado, produz benefícios coletivos (a \"<strong>mão invisível<\/strong>\").<\/li><li>Mas na <em>Teoria dos sentimentos morais<\/em> (1759) ele afirma que somos guiados também pela <strong>simpatia<\/strong> (capacidade de se colocar no lugar do outro) e pelo julgamento de um <strong>espectador imparcial<\/strong> interior. O mercado não funciona sem esse senso moral. O ENEM 2025 explorou essa ligação entre <strong>lucro e responsabilidade ética<\/strong>.<\/li><\/ul>\n<h4>5. Nietzsche (1844–1900)<\/h4>\n<ul><li><strong>Genealogia da moral:<\/strong> os valores não caíram do céu; têm uma história. A moral cristã seria uma \"<strong>moral de escravos<\/strong>\" (ou de rebanho), nascida do <strong>ressentimento<\/strong> dos fracos, que chamaram de \"bem\" a humildade e a obediência, contra a moral dos \"senhores\", afirmativa da vida.<\/li><li>\"<strong>Deus está morto<\/strong>\": a crença que sustentava os valores ocidentais perdeu a força, o que traz o risco do <strong>niilismo<\/strong> (nada vale nada).<\/li><li><strong>Vontade de potência<\/strong>, <strong>além-do-homem<\/strong> (quem cria os próprios valores), <strong>transvaloração<\/strong> dos valores, <strong>perspectivismo<\/strong> (não há fatos, só interpretações).<\/li><\/ul>\n<h4>6. Existencialismo<\/h4>\n<ul><li><strong>Jean-Paul Sartre<\/strong> (1905–1980): \"a <strong>existência precede a essência<\/strong>\". O ser humano não tem natureza predefinida: primeiro existe, depois se define pelas próprias escolhas. Estamos \"<strong>condenados a ser livres<\/strong>\" e somos <strong>responsáveis<\/strong> pelo que fazemos de nós. <strong>Angústia<\/strong> diante da liberdade; <strong>má-fé<\/strong> é fingir que não temos escolha.<\/li><li><strong>Simone de Beauvoir<\/strong> (<em>O segundo sexo<\/em>, 1949): a frase \"<strong>ninguém nasce mulher: torna-se mulher<\/strong>\" sintetiza a ideia de que o \"ser mulher\" é uma <strong>construção social e histórica<\/strong>, não um destino biológico. A mulher foi definida como \"o Outro\" em relação ao homem.<\/li><\/ul>\n<h4>7. Bioética e responsabilidade<\/h4>\n<ul><li><strong>Hans Jonas<\/strong> (<em>O princípio responsabilidade<\/em>, 1979): o poder da técnica moderna exige uma ética voltada para as <strong>gerações futuras<\/strong> e para a preservação da vida no planeta (ligação com sustentabilidade).<\/li><li>Temas da bioética: eutanásia, aborto, transgênicos, edição genética, experimentação em animais, inteligência artificial. O ENEM pede que você reconheça os <strong>argumentos<\/strong> em jogo, não que escolha um lado.<\/li><\/ul>", "resumo": [["Kant", "Dever, imperativo categórico, universalidade, pessoa como fim, autonomia"], ["Bentham", "Utilidade: maior felicidade do maior número; punição como meio"], ["Mill", "Qualidade dos prazeres; liberdade e princípio do dano"], ["Adam Smith", "Mão invisível + simpatia e espectador imparcial"], ["Nietzsche", "Genealogia; moral de rebanho; \"Deus está morto\"; vontade de potência"], ["Sartre", "Existência precede a essência; condenados a ser livres"], ["Beauvoir", "Ninguém nasce mulher, torna-se"], ["Hans Jonas", "Responsabilidade com as gerações futuras"]], "qs": ["FS-16", "FS-17", "FS-18", "F6.4", "F6.5"]}, {"id": "F7", "vol": "FS", "line": "F", "title": "Filosofia contemporânea e teoria crítica", "habs": "H16, H20, H21, H23", "faixa": "B", "note": "Escola de Frankfurt e Foucault caíram em 2025 (Marcuse, o seu erro na questão 66; Foucault, que você acertou).", "html": "<h4>1. Escola de Frankfurt (teoria crítica)<\/h4>\n<p>Grupo de pensadores alemães ligados ao Instituto de Pesquisa Social, fundado nos anos 1920, que combinaram Marx, Freud e filosofia para criticar a sociedade capitalista industrial.<\/p>\n<ul><li><strong>Adorno e Horkheimer<\/strong> (<em>Dialética do esclarecimento<\/em>, 1947):<ul><li><strong>Razão instrumental:<\/strong> a razão iluminista, que prometia emancipar, transformou-se num instrumento para <strong>calcular meios<\/strong> de dominar a natureza e as pessoas, sem perguntar pelos fins.<\/li><li><strong>Indústria cultural:<\/strong> a cultura passa a ser produzida como <strong>mercadoria<\/strong>, em série, com <strong>fórmulas padronizadas<\/strong> (o mesmo enredo, o mesmo refrão), para o consumo rápido. Diferenças superficiais dão a ilusão de escolha (pseudoindividualidade). O entretenimento ocupa o tempo livre, <strong>reproduz a lógica do trabalho<\/strong> e torna o público <strong>passivo e conformado<\/strong>.<\/li><\/ul><\/li><li><strong>Walter Benjamin<\/strong> (<em>A obra de arte na era de sua reprodutibilidade técnica<\/em>, 1936): a fotografia e o cinema permitem reproduzir a obra em massa. A obra perde a <strong>aura<\/strong> (sua presença única, ligada ao original e ao ritual), mas o acesso à arte se <strong>democratiza<\/strong> e ganha potencial político. Benjamin é menos pessimista que Adorno.<\/li><li><strong>Herbert Marcuse<\/strong> (<em>O homem unidimensional<\/em>, 1964; no Brasil, também <em>Ideologia da sociedade industrial<\/em>):<ul><li>A sociedade industrial avançada <strong>satisfaz necessidades<\/strong> materiais (e cria <strong>falsas necessidades<\/strong>, pelo consumo e pela publicidade) e, com isso, <strong>absorve a crítica<\/strong>: a oposição parece \"inútil\" quando o padrão de vida cresce.<\/li><li>O pensamento perde a dimensão <strong>crítica<\/strong> (capaz de imaginar outra sociedade) e fica reduzido a uma só dimensão, a da <strong>adaptação<\/strong> ao que existe: é a <strong>sociedade unidimensional<\/strong>. <em>Este é o conteúdo da sua questão 66.<\/em><\/li><\/ul><\/li><li><strong>Jürgen Habermas:<\/strong> contra a razão instrumental, propõe a <strong>razão comunicativa<\/strong>: normas legítimas nascem do <strong>diálogo<\/strong> livre de coerção, em que vence o melhor argumento, na <strong>esfera pública<\/strong> democrática.<\/li><\/ul>\n<h4>2. Michel Foucault (1926–1984)<\/h4>\n<ul><li>O <strong>poder<\/strong>
