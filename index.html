ude do litoral em relação ao planalto.", "presença de rios caudalosos no planalto.", "influência do El Niño apenas sobre o litoral."], "mod": "G3", "ans": "B", "ex": {"B": "o ar úmido do oceano sobe a encosta, esfria, condensa e chove (chuva orográfica); do outro lado da serra o ar chega mais seco.", "A": "a massa tropical continental é quente e seca, e atua no interior.", "C": "litoral e planalto estão praticamente na mesma latitude.", "D": "rios não explicam o regime de chuvas.", "E": "o El Niño atua sobre grandes regiões e em certos anos, não explica uma diferença permanente entre encosta e planalto."}, "hab": "H27", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-40", "vol": "HG", "n": 40, "tag": "Inédita, estilo ENEM", "base": ["Pesquisadores estimam que parte importante das chuvas que abastecem as lavouras do Centro-Oeste e os reservatórios do Sudeste tem origem na umidade liberada pela Floresta Amazônica e transportada pelos ventos ao longo do continente."], "src": "Texto elaborado para esta apostila.", "cmd": "Considerando o texto, o avanço do desmatamento na Amazônia pode", "alts": ["aumentar as chuvas no Sudeste, pela maior evaporação do solo exposto.", "afetar apenas a biodiversidade local, sem efeitos em outras regiões.", "reduzir a umidade transportada para outras regiões, afetando a agricultura e o abastecimento.", "diminuir as temperaturas médias da região Norte.", "eliminar o risco de secas no Nordeste."], "mod": "G4", "ans": "C", "ex": {"C": "se a umidade amazônica (rios voadores) abastece chuvas do Centro-Oeste e do Sudeste, desmatar reduz essa umidade e afeta a agricultura e o abastecimento dessas regiões.", "A": "solo exposto <strong>perde<\/strong> umidade; não há mais evaporação do que numa floresta transpirando.", "B": "o próprio texto mostra o efeito em outras regiões.", "D": "desmatar tende a <strong>aumentar<\/strong> a temperatura local.", "E": "nada no texto sustenta essa conclusão; o desmatamento tende a agravar a irregularidade das chuvas."}, "hab": "H28, H30", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-41", "vol": "HG", "n": 41, "tag": "Inédita, estilo ENEM", "base": ["Após o rompimento de uma barragem de rejeitos de mineração, uma onda de lama percorreu centenas de quilômetros de um rio até o oceano. Peixes morreram em massa, cidades ribeirinhas tiveram o abastecimento de água interrompido, e pescadores e comunidades indígenas perderam sua principal fonte de alimento e renda."], "src": "Texto elaborado para esta apostila.", "cmd": "O evento descrito evidencia que", "alts": ["atividades econômicas sem controle adequado podem gerar impactos socioambientais em escala regional.", "os desastres ambientais afetam apenas o local exato onde ocorrem.", "a mineração não altera a dinâmica dos rios.", "os impactos ambientais atingem igualmente todos os grupos sociais.", "a lama de rejeitos é um material inerte e sem efeitos sobre a vida aquática."], "mod": "G4", "ans": "A", "ex": {"A": "o rompimento de uma barragem de rejeitos afetou centenas de quilômetros de rio, várias cidades e comunidades: impacto socioambiental regional causado por atividade econômica sem controle adequado.", "B": "o texto descreve danos por centenas de quilômetros.", "C": "a lama mudou o rio completamente.", "D": "pescadores e indígenas, que dependiam do rio, foram mais afetados.", "E": "a morte em massa dos peixes desmente a ideia de material inerte."}, "hab": "H28, H29", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-42", "vol": "HG", "n": 42, "tag": "Inédita, estilo ENEM", "base": ["Em um acordo climático internacional, cada país passou a definir as próprias metas de redução de emissões, revisadas periodicamente, com o objetivo comum de limitar o aquecimento global a bem menos de 2 °C em relação aos níveis pré-industriais. No acordo anterior, apenas os países desenvolvidos tinham metas obrigatórias."], "src": "Texto elaborado para esta apostila.", "cmd": "O acordo descrito e o anterior são, respectivamente,", "alts": ["Agenda 21 e Rio-92.", "Protocolo de Montreal e Acordo de Paris.", "Relatório Brundtland e Protocolo de Kyoto.", "Acordo de Paris e Protocolo de Kyoto.", "Protocolo de Kyoto e Acordo de Paris."], "mod": "G4", "ans": "D", "ex": {"D": "metas definidas por cada país (NDCs) com limite de bem menos de 2 °C é o Acordo de Paris (2015); o anterior, com metas só para os desenvolvidos, é o Protocolo de Kyoto (1997).", "A": "a Agenda 21 foi um documento da Rio-92, e nenhum dos dois fixou metas de emissão por país.", "B": "o Protocolo de Montreal (1987) trata da camada de ozônio.", "C": "o Relatório Brundtland (1987) definiu desenvolvimento sustentável; não é acordo climático.", "E": "é a ordem invertida."}, "hab": "H28, H30", "dif": "média", "traps": {"E": "oposto"}, "kind": "fixacao"}, {"id": "HG-43", "vol": "HG", "n": 43, "tag": "Inédita, estilo ENEM", "base": ["Entre as décadas de 1960 e 1980, o crédito rural subsidiado financiou tratores, colheitadeiras, fertilizantes e agrotóxicos, sobretudo para médios e grandes proprietários. A produtividade das lavouras de exportação cresceu, mas o número de pequenos agricultores e de trabalhadores fixos nas fazendas caiu, e milhões de pessoas migraram para as cidades."], "src": "Texto elaborado para esta apostila.", "cmd": "O processo descrito ficou conhecido como modernização conservadora porque", "alts": ["distribuiu terras aos trabalhadores expulsos do campo.", "transformou as técnicas de produção sem alterar a concentração da propriedade da terra.", "preservou os métodos tradicionais de cultivo das pequenas propriedades.", "reduziu a produção agrícola destinada à exportação.", "eliminou a dependência dos agricultores em relação às indústrias."], "mod": "G5", "ans": "B", "ex": {"B": "\"modernização\" (máquinas e insumos) \"conservadora\" (a concentração da terra foi mantida e até ampliada, beneficiando médios e grandes).", "A": "os trabalhadores foram <strong>expulsos<\/strong> para as cidades; não houve distribuição de terra.", "C": "os métodos tradicionais foram substituídos.", "D": "a produção de exportação <strong>cresceu<\/strong>.", "E": "os agricultores passaram a depender <strong>mais<\/strong> da indústria (máquinas, adubos, agrotóxicos)."}, "hab": "H18, H19", "dif": "média", "traps": {}, "kind": "fixacao"}, {"id": "HG-44", "vol": "HG", "n": 44, "tag": "Inédita, estilo ENEM", "base": ["Em um município do interior, a prefeitura passou a comprar hortaliças, frutas, ovos e leite de agricultores familiares da região para a merenda escolar. Os estudantes passaram a consumir alimentos frescos e menos ultraprocessados, e os agricultores ganharam uma fonte de renda estável, o que reduziu a saída de jovens do campo."], "src": "Texto elaborado para esta apostila.", "cmd": "A política pública descrita contribui para", "alts": ["concentrar a produção de alimentos em grandes empresas.", "substituir a produção local por alimentos importados.", "ampliar a monocultura de exportação no município.", "reduzir a participação da agricultura familiar no mercado interno.", "fortalecer circuitos curtos de comercialização e a permanência no campo."], "mod": "G5", "ans": "E", "ex": {"E": "a prefeitura compra direto de agricultores da região (circuito curto), gerando renda estável e reduzindo a saída de jovens do campo.", "A": "a compra é de agricultores familiares, não de grandes empresas.", "B": "a política valoriza a produção <strong>local<\/strong>.", "C": "os produtos são diversificados (hortaliças, frutas, ovos, leite), o oposto da monocultura.", "D": "a política <strong>aumenta<\/strong> a participação da agricultura familiar."}, "hab": "H18, H25", "dif": "fácil", "traps": {"C": "oposto"}, "kind": "fixacao"}, {"id": "HG-45", "vol": "HG", "n": 45, "tag": "Inédita, estilo ENEM", "base": ["Apicultores de uma região produtora de soja registraram a morte de milhões de abelhas após pulverizações aéreas de inseticidas em lavouras vizinhas. Pesquisadores alertam que culturas como café, maçã, melão e a própria soja dependem, em diferentes graus, da polinização feita por abelhas."], "src": "Texto elaborado para esta apostila.", "cmd": "A situação descrita revela um conflito entre", "alts": ["o extrativismo vegetal e a pecuária extensiva.", "a agricultura familiar e a reforma agrária.", "o modelo de produção baseado em agrotóxicos e a manutenção de serviços ecossistêmicos.", "o crescimento urbano e a preservação de mananciais.", "a mineração e o abastecimento de água."], "mod": "G5", "ans": "C", "ex": {"C": "os inseticidas do modelo químico matam abelhas, que fazem a polinização (um serviço ecossistêmico) de que dependem até as lavouras.", "A": "não há extrativismo nem pecuária no texto.", "B": "reforma agrária não aparece.", "D": "não há cidade nem mananciais no texto.", "E": "não há mineração."}, "hab": "H28, H30", "dif": "média", "traps": {}, "kind": "fixacao"}, {"id": "HG-46", "vol": "HG", "n": 46, "tag": "Inédita, estilo ENEM", "base": ["Depois que a prefeitura reformou a antiga zona portuária de uma capital, com museus, bares e novos prédios comerciais, o valor dos aluguéis no bairro mais que dobrou em cinco anos. Muitas famílias que moravam ali havia gerações mudaram-se para bairros distantes, e pequenos comércios tradicionais fecharam as portas."], "src": "Texto elaborado para esta apostila.", "cmd": "O processo descrito é denominado", "alts": ["gentrificação.", "conurbação.", "favelização.", "metropolização.", "desmetropolização."], "mod": "G6", "ans": "A", "ex": {"A": "revitalização seguida de alta dos aluguéis e saída dos moradores antigos é gentrificação.", "B": "conurbação é o encontro físico de cidades vizinhas.", "C": "favelização é o crescimento de moradias precárias, o contrário do que ocorreu no bairro.", "D": "metropolização é a formação de metrópoles, em outra escala.", "E": "desmetropolização é o crescimento relativo de cidades médias."}, "hab": "H8, H24", "dif": "fácil", "traps": {"C": "oposto"}, "kind": "fixacao"}, {"id": "HG-47", "vol": "HG", "n": 47, "tag": "Inédita, estilo ENEM", "base": ["Uma prefeitura identificou dezenas de terrenos e prédios abandonados em áreas centrais, bem servidas de transporte, enquanto milhares de famílias aguardavam moradia na fila de programas habitacionais. A administração notificou os proprietários e passou a cobrar um imposto com alíquota crescente a cada ano de manutenção dos imóveis vazios."], "src": "Texto elaborado para esta apostila.", "cmd": "A medida adotada pela prefeitura baseia-se no princípio da", "alts": ["livre iniciativa, que garante ao proprietário o direito de não usar o imóvel.", "desmetropolização, que transfere moradores para cidades médias.", "autossegregação, que estimula condomínios fechados.", "função social da propriedade urbana, prevista na Constituição e no Estatuto da Cidade.", "verticalização, que obriga a construção de prédios altos."], "mod": "G6", "ans": "D", "ex": {"D": "imposto progressivo sobre imóveis vazios (IPTU progressivo no tempo) é instrumento do Estatuto da Cidade para fazer cumprir a função social da propriedade urbana.", "A": "a medida limita, e não garante, o direito de manter o imóvel sem uso.", "B": "a medida busca moradia no <strong>centro<\/strong>, não a saída para cidades médias.", "C": "autossegregação são condomínios fechados de alta renda.", "E": "a medida não obriga a construir prédios altos."}, "hab": "H22, H24", "dif": "média", "traps": {}, "kind": "fixacao"}, {"id": "HG-48", "vol": "HG", "n": 48, "tag": "Inédita, estilo ENEM", "base": ["Após uma chuva intensa, deslizamentos de terra atingiram dezenas de casas construídas em encostas íngremes de uma cidade serrana. Nos bairros planos e valorizados da mesma cidade, os danos foram pequenos. Um urbanista afirmou: \"A chuva caiu sobre todos, mas o desastre teve endereço\"."], "src": "Texto elaborado para esta apostila.", "cmd": "A afirmação do urbanista indica que", "alts": ["desastres naturais ocorrem ao acaso, sem relação com a ocupação do espaço.", "a exposição ao risco está relacionada à segregação socioespacial.", "a chuva concentrou-se exclusivamente nas encostas.", "as áreas de risco são ocupadas por escolha voluntária de quem tem renda alta.", "o relevo plano aumenta a vulnerabilidade a deslizamentos."], "mod": "G6", "ans": "B", "ex": {"B": "\"o desastre teve endereço\": o risco se concentra onde a população pobre foi empurrada a morar (encostas), ou seja, está ligado à segregação socioespacial.", "A": "o urbanista diz o contrário: o desastre tem relação com quem ocupa cada área.", "C": "\"a chuva caiu sobre todos\".", "D": "as encostas são ocupadas por quem <strong>não tem<\/strong> opção, não por quem tem renda alta.", "E": "o texto diz que os bairros planos tiveram poucos danos."}, "hab": "H8, H29", "dif": "fácil", "traps": {"A": "oposto"}, "kind": "fixacao"}, {"id": "HG-49", "vol": "HG", "n": 49, "tag": "Inédita, estilo ENEM", "base": ["Em um ano de chuvas muito abaixo da média, os reservatórios das usinas do Sudeste e do Centro-Oeste chegaram a níveis críticos. O operador do sistema elétrico acionou usinas termelétricas, e as contas de luz ficaram mais caras para os consumidores."], "src": "Texto elaborado para esta apostila.", "cmd": "A situação descrita está relacionada à", "alts": ["dependência brasileira de usinas nucleares.", "predominância de usinas eólicas no Sudeste.", "ausência de termelétricas no sistema elétrico.", "baixa participação de fontes renováveis na matriz elétrica.", "forte dependência da geração hidrelétrica, condicionada ao regime de chuvas."], "mod": "G7", "ans": "E", "ex": {"E": "reservatórios baixos por falta de chuva, termelétricas acionadas e conta mais cara mostram a dependência da hidreletricidade em relação ao regime de chuvas.", "A": "as nucleares têm pequena participação na matriz elétrica brasileira.", "B": "a eólica é mais forte no Nordeste e no Sul, e não depende de reservatórios.", "C": "o texto diz que as termelétricas foram <strong>acionadas<\/strong>.", "D": "a matriz elétrica brasileira é <strong>predominantemente renovável<\/strong>; o problema é a dependência de uma fonte."}, "hab": "H19, H29", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-50", "vol": "HG", "n": 50, "tag": "Inédita, estilo ENEM", "base": ["Uma trading que exporta soja do Mato Grosso comparou o custo de levar a carga até o porto. Por caminhão, até um porto do Sudeste, o frete por tonelada era quase o dobro do custo da rota que combina um trecho rodoviário curto com o transporte por barcaças em rios da Amazônia até um porto do Arco Norte."], "src": "Texto elaborado para esta apostila.", "cmd": "A diferença de custo é explicada pelo fato de", "alts": ["a rodovia ser o modal mais barato para longas distâncias.", "os rios amazônicos não terem nenhuma limitação de navegação.", "o transporte hidroviário ter menor custo por tonelada em grandes volumes e longas distâncias.", "o Brasil ter uma matriz de transportes baseada em ferrovias.", "os portos do Sudeste não exportarem soja."], "mod": "G7", "ans": "C", "ex": {"C": "barcaças transportam grandes volumes com pouco combustível por tonelada, o que barateia o frete em longas distâncias.", "A": "o texto mostra que a rodovia foi a opção <strong>mais cara<\/strong>.", "B": "os rios têm limitações (secas, profundidade), e o texto não afirma o contrário.", "D": "a matriz de transportes brasileira é rodoviária.", "E": "o texto compara custos, e os portos do Sudeste exportam soja."}, "hab": "H17, H18", "dif": "fácil", "traps": {"B": "oposto"}, "kind": "fixacao"}, {"id": "HG-51", "vol": "HG", "n": 51, "tag": "Inédita, estilo ENEM", "base": ["A partir da década de 1990, várias montadoras de automóveis instalaram novas fábricas fora da Região Metropolitana de São Paulo, em estados como Paraná, Minas Gerais, Bahia e Goiás. Os governos estaduais ofereceram terrenos, isenção de impostos por longos períodos e obras de infraestrutura."], "src": "Texto elaborado para esta apostila.", "cmd": "O processo descrito, conhecido como desconcentração industrial, foi estimulado por", "alts": ["proibição legal de novas indústrias em São Paulo.", "incentivos fiscais e menores custos de produção em outras regiões.", "esgotamento do mercado consumidor no Nordeste.", "estatização das montadoras pelo governo federal.", "aumento dos salários nas regiões que receberam as fábricas."], "mod": "G7", "ans": "B", "ex": {"B": "terrenos, isenções e infraestrutura oferecidos pelos estados (\"guerra fiscal\"), somados a salários mais baixos e menos sindicalização, atraíram as montadoras.", "A": "não houve proibição legal.", "C": "o mercado consumidor não se esgotou; e o texto fala de incentivos.", "D": "as montadoras são empresas privadas, em geral multinacionais.", "E": "os salários <strong>mais baixos<\/strong> atraíram as fábricas."}, "hab": "H17, H18", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-52", "vol": "HG", "n": 52, "tag": "Inédita, estilo ENEM", "base": ["Projeções demográficas indicam que, nas próximas décadas, a proporção de brasileiros com 60 anos ou mais continuará crescendo, enquanto a de crianças e jovens diminuirá. Em algumas cidades, escolas vêm sendo transformadas em centros de convivência para idosos."], "src": "Texto elaborado para esta apostila.", "cmd": "Uma consequência socioeconômica esperada da tendência descrita é o(a)", "alts": ["aumento da taxa de natalidade.", "alargamento da base da pirâmide etária.", "redução da demanda por serviços de saúde.", "maior pressão sobre os sistemas de previdência e de saúde.", "crescimento do bônus demográfico."], "mod": "G8", "ans": "D", "ex": {"D": "mais idosos e menos jovens em idade de contribuir pressionam a previdência e aumentam a demanda por saúde.", "A": "a tendência descrita resulta justamente da <strong>queda<\/strong> da natalidade.", "B": "a base da pirâmide (jovens) <strong>estreita<\/strong>.", "C": "idosos demandam <strong>mais<\/strong> serviços de saúde.", "E": "o bônus demográfico <strong>termina<\/strong> com o envelhecimento."}, "hab": "H15, H25", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-53", "vol": "HG", "n": 53, "tag": "Inédita, estilo ENEM", "base": ["Todos os dias, cerca de 300 mil pessoas saem de municípios vizinhos em direção à capital para trabalhar ou estudar e voltam para casa à noite. Os trens e ônibus intermunicipais lotam nos horários de pico."], "src": "Texto elaborado para esta apostila.", "cmd": "O fluxo populacional descrito é denominado", "alts": ["êxodo rural.", "migração de retorno.", "transumância.", "migração internacional.", "migração pendular."], "mod": "G8", "ans": "E", "ex": {"E": "ida e volta diária entre municípios para trabalhar ou estudar é migração pendular.", "A": "êxodo rural é a mudança definitiva do campo para a cidade.", "B": "migração de retorno é voltar a viver na região de origem.", "C": "transumância é o deslocamento sazonal (por estações), como o de pastores com rebanhos.", "D": "os municípios estão no mesmo país."}, "hab": "H9", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-54", "vol": "HG", "n": 54, "tag": "Inédita, estilo ENEM", "base": ["Uma família venezuelana atravessou a fronteira em Roraima, foi acolhida em um abrigo, recebeu documentos e, meses depois, mudou-se para uma cidade do Sul do país com uma oferta de emprego. Os filhos foram matriculados na escola pública, e todos passaram a ser atendidos pelo SUS."], "src": "Texto elaborado para esta apostila.", "cmd": "O tratamento recebido pela família está de acordo com a legislação brasileira atual, que", "alts": ["reconhece o migrante como sujeito de direitos, com acesso a serviços públicos.", "trata o migrante principalmente como uma ameaça à segurança nacional.", "proíbe a entrada de estrangeiros sem contrato de trabalho prévio.", "restringe o acesso de estrangeiros à educação pública.", "exige a naturalização para o atendimento no sistema de saúde."], "mod": "G8", "ans": "A", "ex": {"A": "documentação, escola e SUS para a família migrante expressam a Lei de Migração de 2017, que trata o migrante como sujeito de direitos.", "B": "essa era a lógica do Estatuto do Estrangeiro, da ditadura, substituído em 2017.", "C": "a família entrou sem contrato prévio e foi acolhida.", "D": "os filhos foram matriculados na escola pública.", "E": "a família foi atendida no SUS sem naturalização."}, "hab": "H9, H25", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-55", "vol": "HG", "n": 55, "tag": "Inédita, estilo ENEM", "base": ["Um país dos Bálcãs candidato à União Europeia aprovou, em poucos anos, reformas no sistema judicial, leis de proteção a minorias étnicas e medidas de combate à corrupção. O governo afirmou que as reformas eram necessárias para avançar nas negociações com Bruxelas."], "src": "Texto elaborado para esta apostila.", "cmd": "As reformas descritas indicam que a adesão à União Europeia", "alts": ["depende apenas da adoção prévia do euro.", "é automática para os países do continente europeu.", "exige o cumprimento de critérios políticos e institucionais pelos candidatos.", "impõe a renúncia à soberania sobre o próprio território.", "restringe-se a países que integravam a antiga União Soviética."], "mod": "G9", "ans": "C", "ex": {"C": "reformas no Judiciário, proteção de minorias e combate à corrupção são exigências políticas e institucionais para a adesão à UE.", "A": "o euro não é condição prévia para entrar na UE (e nem todos os membros o usam).", "B": "a adesão exige negociação e aprovação de todos os membros.", "D": "os membros mantêm a soberania sobre o próprio território, embora compartilhem algumas competências.", "E": "vários países que nunca integraram a URSS são membros."}, "hab": "H7, H9", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-56", "vol": "HG", "n": 56, "tag": "Inédita, estilo ENEM", "base": ["Em uma fazenda do Centro-Oeste, tratores guiados por satélite aplicam fertilizantes na quantidade exata indicada por mapas digitais do solo. Os dados da safra seguem em tempo real para a sede de uma empresa em outro continente, que define preços e rotas de exportação."], "src": "Texto elaborado para esta apostila.", "cmd": "A situação ilustra o conceito de Milton Santos de", "alts": ["espaço natural intocado.", "meio técnico-científico-informacional.", "modernização conservadora.", "economia de subsistência.", "desmetropolização."], "mod": "G9", "ans": "B", "ex": {"B": "tratores guiados por satélite, mapas digitais e dados enviados em tempo real a outro continente: ciência, técnica e informação incorporadas ao território, o meio técnico-científico-informacional.", "A": "a fazenda está totalmente transformada pela técnica.", "C": "modernização conservadora é um processo histórico do campo brasileiro (1960–1980) ligado à estrutura fundiária, que o texto não menciona.", "D": "a produção é de exportação, não de subsistência.", "E": "desmetropolização é um conceito urbano."}, "hab": "H17, H18", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "HG-57", "vol": "HG", "n": 57, "tag": "Inédita, estilo ENEM", "base": ["Uma proposta de resolução que pedia cessar-fogo em um conflito armado recebeu o apoio de 13 dos 15 membros do Conselho de Segurança da ONU, mas não foi aprovada."], "src": "Texto elaborado para esta apostila.", "cmd": "A não aprovação da resolução pode ser explicada pelo(a) # Fechamento", "alts": ["exigência de unanimidade entre todos os países da Assembleia Geral.", "ausência de membros permanentes na votação.", "proibição de o Conselho tratar de conflitos armados.", "necessidade de aprovação prévia da Otan.", "voto contrário de ao menos um membro permanente, que tem poder de veto."], "mod": "G9", "ans": "E", "ex": {"E": "com 13 votos favoráveis (mais que os 9 necessários), a resolução só cai se um membro permanente vetar.", "A": "a Assembleia Geral não vota resoluções do Conselho de Segurança, e não se exige unanimidade.", "B": "os 5 permanentes sempre fazem parte do Conselho.", "C": "tratar de conflitos armados é a função principal do Conselho.", "D": "a Otan não tem poder sobre as decisões da ONU."}, "hab": "H7, H11", "dif": "média", "traps": {}, "kind": "fixacao"}, {"id": "HG-58", "vol": "HG", "n": 58, "tag": "Inédita, estilo ENEM · reforço da questão 46", "base": ["Para concluir sua entrada como membro pleno de um bloco sul-americano, um país teve de substituir boa parte de suas tarifas de importação pela tarifa externa comum adotada pelos demais membros. Empresários locais protestaram, pois alguns produtos estrangeiros ficariam mais baratos que os nacionais. O governo manteve a decisão, alegando que o acesso ao mercado ampliado compensaria as perdas."], "src": "Texto elaborado para esta apostila.", "cmd": "Para o governo desse país, a adoção da tarifa externa comum foi uma estratégia para", "alts": ["proteger a indústria nacional da concorrência estrangeira.", "criar uma moeda única com os países vizinhos.", "reduzir o comércio com os países do bloco.", "inserir a economia nacional em um processo de integração regional.", "eliminar todas as tarifas de importação do mundo."], "ans": "D", "ex": {"D": "o governo aceitou perdas para alguns setores em troca do acesso ao mercado ampliado: inserção na integração regional. É o mesmo raciocínio da questão 46 de 2025.", "A": "é o <strong>detalhe verdadeiro<\/strong> invertido: os empresários reclamaram porque a medida <strong>reduziu<\/strong> a proteção da indústria nacional.", "B": "tarifa externa comum não cria moeda única.", "C": "a entrada no bloco <strong>aumenta<\/strong> o comércio com os vizinhos.", "E": "a TEC é uma tarifa cobrada de países de fora do bloco; não elimina tarifas mundiais."}, "hab": "H7, H9", "dif": "média", "traps": {"A": "detalhe"}, "kind": "reforco"}, {"id": "HG-59", "vol": "HG", "n": 59, "tag": "Inédita, estilo ENEM · reforço da questão 67", "base": ["Em 2014, uma emenda constitucional determinou que propriedades rurais e urbanas onde for localizada a exploração de trabalho escravo serão expropriadas sem qualquer indenização ao proprietário e destinadas à reforma agrária e a programas de habitação popular."], "src": "Texto elaborado para esta apostila, com base no art. 243 da Constituição Federal.", "cmd": "A medida descrita representa um mecanismo de", "alts": ["redistribuição da terra associada à punição de violações de direitos humanos.", "reforço da concentração fundiária no país.", "garantia absoluta do direito de propriedade.", "indenização dos proprietários que exploram trabalho escravo.", "fim definitivo das desigualdades na distribuição de terras."], "ans": "A", "ex": {"A": "a terra é tirada de quem explora trabalho escravo e destinada à reforma agrária e à moradia popular: redistribuição associada à punição de violação de direitos.", "B": "termo oposto: a medida <strong>desconcentra<\/strong>.", "C": "termo oposto: a medida <strong>limita<\/strong> a propriedade.", "D": "o texto diz \"sem qualquer indenização\".", "E": "exagero: uma medida pontual não acaba com toda a desigualdade fundiária."}, "hab": "H22, H25", "dif": "média", "traps": {"B": "oposto", "C": "oposto", "E": "exagero"}, "kind": "reforco"}, {"id": "HG-60", "vol": "HG", "n": 60, "tag": "Inédita, estilo ENEM · reforço da questão 69", "base": ["Entre os séculos XI e XIII, milhares de camponeses, artesãos e nobres percorriam a pé, por meses, os caminhos que levavam ao túmulo do apóstolo Tiago, na Galícia. Ao chegar, recebiam a promessa do perdão de parte das penas de seus pecados. Muitos faziam a viagem para cumprir um voto feito em momento de doença ou perigo."], "src": "Texto elaborado para esta apostila.", "cmd": "No imaginário religioso descrito, o perdão dos pecados estava associado à", "alts": ["leitura individual da Bíblia traduzida para as línguas locais.", "participação exclusiva dos clérigos nos ritos sagrados.", "realização de um esforço pessoal, assumido por escolha do fiel.", "recusa a qualquer forma de deslocamento.", "compra de títulos de nobreza."], "ans": "C", "ex": {"C": "a peregrinação, longa e cansativa, assumida por voto pessoal, é um esforço voluntário do fiel ligado ao perdão; o mesmo raciocínio da questão 69 de 2025.", "A": "a leitura individual da Bíblia em línguas locais é associada à Reforma (século XVI).", "B": "os peregrinos eram camponeses, artesãos e nobres, ou seja, leigos.", "D": "a peregrinação <strong>é<\/strong> um deslocamento.", "E": "o texto não fala de títulos de nobreza."}, "hab": "H1, H3", "dif": "média", "traps": {}, "kind": "reforco"}, {"id": "HG-61", "vol": "HG", "n": 61, "tag": "Inédita, estilo ENEM · reforço da questão 83", "base": ["Em 1815, o Brasil foi elevado à condição de Reino Unido a Portugal e Algarves. Na mesma década, a Corte instalada no Rio de Janeiro criou um banco oficial, uma academia militar e uma biblioteca, e passou a despachar, a partir do Rio de Janeiro, as ordens e nomeações para os governos das capitanias, que antes respondiam a Lisboa."], "src": "Texto elaborado para esta apostila.", "cmd": "As medidas descritas tinham como função política", "alts": ["consolidar o Rio de Janeiro como centro de poder da monarquia portuguesa.", "preparar deliberadamente a independência do Brasil.", "devolver a Lisboa o controle sobre as capitanias.", "reduzir o número de instituições na América portuguesa.", "transferir o comércio colonial para a Espanha."], "ans": "A", "ex": {"A": "elevação a Reino Unido, instituições no Rio e ordens despachadas dali para as capitanias consolidaram o Rio como centro de poder da monarquia. Mesmo raciocínio da questão 83 de 2025.", "B": "teleologia: a Corte não planejava a independência; ela veio depois, em outro contexto.", "C": "o controle passou de Lisboa <strong>para o Rio<\/strong>.", "D": "o texto descreve a <strong>criação<\/strong> de instituições.", "E": "a Espanha não aparece no texto."}, "hab": "H7, H11", "dif": "média", "traps": {"B": "anacronismo"}, "kind": "reforco"}, {"id": "HG-62", "vol": "HG", "n": 62, "tag": "Inédita, estilo ENEM · reforço da questão 90", "base": ["Em várias exposições universais realizadas em capitais europeias no fim do século XIX, organizadores montaram \"aldeias\" com pessoas trazidas da África e da Ásia, que eram exibidas ao público em trajes considerados \"típicos\". Os catálogos apresentavam essas pessoas como exemplos de povos que ainda estariam em estágios \"primitivos\" de desenvolvimento."], "src": "Texto elaborado para esta apostila.", "cmd": "Essas exibições estavam vinculadas à", "alts": ["valorização das culturas africanas e asiáticas como equivalentes às europeias.", "defesa da independência imediata das colônias.", "promoção do turismo europeu na África e na Ásia.", "difusão de ideias raciais que justificavam a dominação colonial.", "crítica ao darwinismo social pelos cientistas da época."], "ans": "D", "ex": {"D": "exibir pessoas colonizadas como \"primitivas\" difundia o racismo científico e a ideia de hierarquia entre povos, que justificava a \"missão civilizadora\" e o domínio colonial. Mesmo raciocínio da questão 90 de 2025.", "A": "chamar os povos de \"primitivos\" é o oposto de considerá-los equivalentes.", "B": "as exposições celebravam os impérios coloniais.", "C": "o público visitava as exposições na Europa; não há turismo para a África e a Ásia no texto.", "E": "o darwinismo social era usado <strong>para justificar<\/strong> essas exibições."}, "hab": "H5, H7", "dif": "média", "traps": {"A": "oposto"}, "kind": "reforco"}, {"id": "HG-63", "vol": "HG", "n": 63, "tag": "Inédita, estilo ENEM", "base": ["Pela Lei Saraiva, de 1881, os analfabetos foram excluídos do direito de votar no Brasil. Um século depois, em 1985, uma emenda constitucional devolveu-lhes esse direito, confirmado pela Constituição de 1988, que tornou o voto facultativo para eles."], "src": "Texto elaborado para esta apostila.", "cmd": "A comparação entre os dois momentos evidencia que", "alts": ["o direito de voto no Brasil permaneceu inalterado desde o Império.", "a cidadania política foi ampliada ao longo do tempo, por meio de mudanças na legislação.", "os analfabetos sempre tiveram direito ao voto no período republicano.", "a Constituição de 1988 restringiu o número de eleitores.", "a Lei Saraiva ampliou a participação popular nas eleições."], "ans": "B", "ex": {"B": "excluídos em 1881 e reincluídos em 1985 e 1988, os analfabetos mostram que a cidadania política se ampliou por mudanças legais.", "A": "o texto mostra duas mudanças importantes.", "C": "de 1881 a 1985 eles ficaram <strong>sem<\/strong> voto, o que inclui quase toda a República.", "D": "ao incluir analfabetos e jovens de 16 anos, a Constituição de 1988 ampliou o eleitorado.", "E": "a Lei Saraiva reduziu drasticamente o eleitorado."}, "hab": "H11, H22", "dif": "fácil", "traps": {}, "kind": "simulado"}, {"id": "HG-64", "vol": "HG", "n": 64, "tag": "Inédita, estilo ENEM", "base": ["Um relatório internacional mostrou que os 50% mais pobres da população mundial respondem por uma parcela pequena das emissões de gases de efeito estufa, mas vivem majoritariamente nas regiões mais expostas a secas, enchentes e ondas de calor e têm menos recursos para se proteger delas."], "src": "Texto elaborado para esta apostila.", "cmd": "A situação descrita está na base da reivindicação por", "alts": ["suspensão de todos os acordos climáticos internacionais.", "aumento das emissões nos países mais pobres.", "transferência das populações pobres para os países ricos.", "responsabilidade igual de todos os países pelas emissões históricas.", "justiça climática, com financiamento dos países mais emissores para a adaptação dos mais vulneráveis."], "ans": "E", "ex": {"E": "quem menos emite mais sofre os impactos e tem menos recursos: a resposta reivindicada é a justiça climática, com financiamento dos maiores emissores para a adaptação dos vulneráveis.", "A": "o problema exige mais cooperação, não o fim dos acordos.", "B": "aumentar as emissões agravaria o aquecimento.", "C": "transferir populações não é a reivindicação do texto.", "D": "o texto mostra responsabilidades <strong>desiguais<\/strong>; o princípio defendido é o das responsabilidades comuns, porém diferenciadas."}, "hab": "H28, H30", "dif": "média", "traps": {}, "kind": "simulado"}, {"id": "HG-65", "vol": "HG", "n": 65, "tag": "Inédita, estilo ENEM", "base": ["Escavações em uma cidade romana soterrada por uma erupção vulcânica no ano 79 revelaram padarias com pães carbonizados, inscrições de campanhas eleitorais pintadas nas paredes e desenhos feitos por crianças. Os achados permitiram estudar o cotidiano de pessoas comuns, pouco citadas nos textos dos autores antigos."], "src": "Texto elaborado para esta apostila.", "cmd": "O texto evidencia a importância das fontes", "alts": ["materiais, que ampliam o conhecimento sobre grupos ausentes da documentação escrita oficial.", "orais, que preservam a memória por meio de depoimentos.", "escritas, que são as únicas capazes de comprovar fatos históricos.", "iconográficas modernas, como a fotografia.", "audiovisuais, produzidas pelos próprios romanos."], "ans": "A", "ex": {"A": "pães, inscrições e desenhos infantis são fontes materiais que revelam o cotidiano de pessoas comuns, pouco presentes nos textos dos autores antigos (Pompeia).", "B": "não há depoimentos; os romanos de Pompeia não podem ser entrevistados.", "C": "o texto mostra que fontes <strong>não escritas<\/strong> ampliam o conhecimento.", "D": "fotografia é do século XIX.", "E": "não existiam fontes audiovisuais na Antiguidade."}, "hab": "H1, H2", "dif": "fácil", "traps": {}, "kind": "simulado"}, {"id": "HG-66", "vol": "HG", "n": 66, "tag": "Inédita, estilo ENEM", "base": ["Em um mapa-múndi, o tamanho de cada país foi desenhado proporcionalmente ao número de habitantes, e não à sua área. Índia e China aparecem enormes, enquanto Rússia, Canadá e Austrália ficam muito menores do que nos mapas convencionais."], "src": "Texto elaborado para esta apostila.", "cmd": "Esse tipo de representação cartográfica é denominado", "alts": ["projeção de Mercator.", "carta topográfica.", "anamorfose.", "planta cadastral.", "mapa de isolinhas."], "ans": "C", "ex": {"C": "tamanho dos países proporcional a uma variável (população) é anamorfose.", "A": "Mercator representa a área (com distorções), não a população.", "B": "carta topográfica representa o relevo de áreas pequenas.", "D": "planta cadastral mostra lotes urbanos, em escala grande.", "E": "isolinhas ligam pontos de igual valor (altitude, temperatura)."}, "hab": "H6", "dif": "fácil", "traps": {}, "kind": "simulado"}, {"id": "HG-67", "vol": "HG", "n": 67, "tag": "Inédita, estilo ENEM", "base": ["Construído em 1961, o muro que dividia uma capital europeia separava famílias e bairros e era vigiado por soldados com ordem de atirar em quem tentasse atravessá-lo. Sua derrubada, em novembro de 1989, foi transmitida para todo o mundo e precedeu a reunificação do país, no ano seguinte."], "src": "Texto elaborado para esta apostila.", "cmd": "A construção e a queda do muro estão associadas, respectivamente, à", "alts": ["Primeira Guerra Mundial e ao Tratado de Versalhes.", "ascensão do nazismo e ao fim da Segunda Guerra Mundial.", "descolonização da África e ao fim do apartheid.", "divisão do mundo bipolar da Guerra Fria e à crise do bloco socialista.", "criação da União Europeia e ao Brexit."], "ans": "D", "ex": {"D": "o Muro de Berlim (1961) simbolizou a divisão bipolar da Guerra Fria; sua queda (1989) marcou a crise do bloco socialista, seguida da reunificação alemã (1990) e do fim da URSS (1991).", "A": "a Primeira Guerra é de 1914–1918.", "B": "o nazismo e a Segunda Guerra acabaram em 1945, antes do muro.", "C": "o fim do apartheid foi na África do Sul, nos anos 1990.", "E": "a UE foi criada em 1992 e o Brexit ocorreu em 2020."}, "hab": "H7, H11", "dif": "fácil", "traps": {}, "kind": "simulado"}, {"id": "HG-68", "vol": "HG", "n": 68, "tag": "Inédita, estilo ENEM", "base": ["\"Pregam doutrina humana os que dizem que, tão logo a moeda tilinta na caixa, a alma sai voando do purgatório.\""], "src": "LUTERO, M. Noventa e cinco teses, 1517, tese 27. Obra em domínio público; tradução livre feita para esta apostila.", "cmd": "Na tese, Lutero critica", "alts": ["a tradução da Bíblia para o alemão.", "o poder dos príncipes alemães sobre a Igreja.", "a cobrança de impostos pelo Sacro Império.", "a leitura individual das Escrituras pelos fiéis.", "a venda de indulgências como meio de alcançar o perdão dos pecados."], "ans": "E", "ex": {"E": "a \"moeda que tilinta na caixa\" é o pagamento pela indulgência; Lutero critica a venda do perdão.", "A": "Lutero <strong>defendia<\/strong> e fez a tradução da Bíblia para o alemão.", "B": "os príncipes alemães apoiaram Lutero, e a tese não trata deles.", "C": "a tese fala de pagamento à Igreja, não de impostos do Império.", "D": "Lutero <strong>defendia<\/strong> a leitura individual."}, "hab": "H1, H3", "dif": "fácil", "traps": {}, "kind": "simulado"}, {"id": "HG-69", "vol": "HG", "n": 69, "tag": "Inédita, estilo ENEM", "base": ["Entre 1950 e 1980, a população urbana brasileira cresceu muito mais depressa do que a oferta de moradias, saneamento e transporte. Nas grandes cidades, multiplicaram-se loteamentos irregulares nas periferias e ocupações em morros e margens de rios."], "src": "Texto elaborado para esta apostila.", "cmd": "Um fator que explica o crescimento urbano acelerado do período foi o(a)", "alts": ["programa de reforma agrária que fixou os camponeses no campo.", "êxodo rural, associado à concentração fundiária e à modernização do campo.", "imigração em massa de europeus para as capitais.", "queda da industrialização no Sudeste.", "redução da natalidade nas cidades."], "ans": "B", "ex": {"B": "a concentração da terra e a mecanização expulsaram milhões do campo para as cidades, que cresceram mais rápido do que a infraestrutura.", "A": "não houve reforma agrária ampla, e ela teria <strong>reduzido<\/strong> o êxodo.", "C": "a grande imigração europeia foi no fim do século XIX e início do XX.", "D": "a industrialização do Sudeste <strong>cresceu<\/strong> no período e atraiu migrantes.", "E": "a natalidade ainda era alta no período, e sua queda não aceleraria o crescimento urbano."}, "hab": "H8, H18", "dif": "fácil", "traps": {}, "kind": "simulado"}, {"id": "HG-70", "vol": "HG", "n": 70, "tag": "Inédita, estilo ENEM", "base": ["Em janeiro de 1835, em Salvador, centenas de africanos escravizados e libertos, muitos deles muçulmanos e alfabetizados em árabe, organizaram um levante. Derrotados, foram punidos com prisões, açoites, deportações para a África e execuções; nos anos seguintes, aumentou a vigilância sobre a população africana da cidade."], "src": "Texto elaborado para esta apostila.", "cmd": "O levante descrito, ocorrido no Período Regencial, expressa a", "alts": ["defesa da volta de D. Pedro I ao trono brasileiro.", "aliança entre senhores de engenho e escravizados contra as Regências.", "resistência de africanos à escravidão, com elementos de identidade religiosa e cultural.", "luta pela independência do Brasil em relação a Portugal.", "reivindicação de voto para os libertos nas eleições municipais."], "ans": "C", "ex": {"C": "a Revolta dos Malês (1835) foi uma rebelião de africanos escravizados e libertos, muitos muçulmanos, que uniu resistência à escravidão e identidade religiosa e cultural.", "A": "os revoltosos não defendiam D. Pedro I.", "B": "os senhores reprimiram a revolta.", "D": "a independência já tinha ocorrido em 1822.", "E": "a revolta não reivindicava voto."}, "hab": "H1, H24", "dif": "média", "traps": {}, "kind": "simulado"}, {"id": "HG-71", "vol": "HG", "n": 71, "tag": "Inédita, estilo ENEM", "base": ["Um estudo comparou as emissões de carros elétricos e a combustão em diferentes países, considerando a fabricação, o uso e o descarte. Nos países em que a eletricidade vem principalmente de usinas a carvão, a vantagem ambiental dos elétricos foi bem menor do que em países com matriz elétrica predominantemente renovável."], "src": "Texto elaborado para esta apostila.", "cmd": "O resultado do estudo indica que o impacto ambiental dos carros elétricos", "alts": ["depende da fonte de energia usada para gerar a eletricidade que os abastece.", "é nulo em qualquer país, pois não há escapamento.", "é sempre maior que o dos carros a combustão.", "não tem relação com a fabricação das baterias.", "independe da matriz elétrica do país."], "ans": "A", "ex": {"A": "a vantagem dos elétricos muda conforme a fonte da eletricidade: menor onde ela vem do carvão, maior onde a matriz é renovável.", "B": "sem escapamento não significa impacto nulo; há a geração de eletricidade e a fabricação.", "C": "o estudo mostra vantagem menor, não desvantagem em todos os casos.", "D": "o estudo considerou a fabricação, incluindo as baterias.", "E": "é o oposto do resultado."}, "hab": "H28, H29", "dif": "fácil", "traps": {"E": "oposto"}, "kind": "simulado"}, {"id": "HG-72", "vol": "HG", "n": 72, "tag": "Inédita, estilo ENEM", "base": ["Na colônia francesa de São Domingos, onde a maior parte da população era escravizada, uma revolta iniciada em 1791 terminou, em 1804, com a proclamação de um país independente, governado por ex-escravizados. Nas décadas seguintes, senhores de escravos de outras regiões da América temeram que o exemplo se repetisse."], "src": "Texto elaborado para esta apostila.", "cmd": "O processo descrito é singular entre as independências americanas porque", "alts": ["foi liderado pelas elites brancas proprietárias de terras.", "manteve a escravidão no novo país.", "contou com o apoio do exército de Napoleão.", "combinou independência e abolição da escravidão por iniciativa dos próprios escravizados.", "resultou na anexação da ilha pelos Estados Unidos."], "ans": "D", "ex": {"D": "no Haiti, foram os próprios escravizados que fizeram a revolução, abolindo a escravidão e fundando um país independente: caso único nas Américas.", "A": "as elites brancas lideraram outras independências (EUA, América espanhola), não a do Haiti.", "B": "a escravidão foi abolida.", "C": "Napoleão enviou tropas <strong>contra<\/strong> os revolucionários e foi derrotado.", "E": "o Haiti tornou-se independente; os EUA só ocuparam o país muito depois (1915–1934), sem anexá-lo."}, "hab": "H11, H24", "dif": "média", "traps": {}, "kind": "simulado"}, {"id": "FS-1", "vol": "FS", "n": 1, "tag": "Inédita, estilo ENEM", "base": ["Para muitos gregos, o trovão era o sinal da cólera de Zeus, que lançava raios sobre os mortais. Um pensador jônico do século VI a.C., no entanto, explicou os raios como resultado do choque entre nuvens comprimidas pelo vento, sem atribuí-los à vontade de um deus."], "src": "Texto elaborado para esta apostila.", "cmd": "A explicação do pensador jônico exemplifica a", "alts": ["substituição da religião pela ciência experimental moderna.", "defesa da autoridade dos poetas como fonte de verdade.", "busca de explicações racionais para os fenômenos a partir de causas naturais.", "recusa de qualquer forma de investigação sobre a natureza.", "confirmação dos relatos míticos por meio da observação."], "mod": "F1", "ans": "C", "ex": {"C": "o pensador troca a vontade de Zeus por uma causa natural (choque de nuvens e vento): é a passagem do mito ao logos.", "A": "a ciência experimental moderna é do século XVII; aplicá-la ao século VI a.C. é anacronismo.", "B": "os poetas (Homero, Hesíodo) eram a fonte da explicação mítica que o pensador abandona.", "D": "o pensador <strong>investiga<\/strong> a natureza.", "E": "a explicação natural <strong>substitui<\/strong> o relato mítico, não o confirma."}, "hab": "H1, H3", "dif": "fácil", "traps": {"A": "anacronismo"}, "kind": "fixacao"}, {"id": "FS-2", "vol": "FS", "n": 2, "tag": "Inédita, estilo ENEM", "base": ["\"Não é possível entrar duas vezes no mesmo rio.\"", "\"Para os que entram nos mesmos rios, correm outras e outras águas.\""], "src": "HERÁCLITO. Fragmentos B91 e B12. Obra em domínio público; tradução livre feita para esta apostila.", "cmd": "Os fragmentos expressam a concepção de que a realidade é marcada pelo(a)", "alts": ["devir, isto é, pela mudança permanente.", "imobilidade do ser, percebida apenas pela razão.", "composição de átomos indivisíveis e vazio.", "estrutura numérica e harmônica do cosmo.", "ilusão produzida pelos deuses sobre os sentidos."], "mod": "F1", "ans": "A", "ex": {"A": "as águas sempre outras do rio exprimem o devir, a mudança constante, ideia central de Heráclito.", "B": "imobilidade do ser é a tese de <strong>Parmênides<\/strong>, oposta (autor errado).", "C": "átomos e vazio são de Demócrito.", "D": "a estrutura numérica do cosmo é de Pitágoras.", "E": "os fragmentos não falam de deuses nem de engano dos sentidos."}, "hab": "H1", "dif": "fácil", "traps": {"B": "autor"}, "kind": "fixacao"}, {"id": "FS-3", "vol": "FS", "n": 3, "tag": "Inédita, estilo ENEM", "base": ["Em um diálogo, um general afirma saber o que é a coragem: \"é permanecer no seu posto diante do inimigo\". O filósofo pergunta se também não é corajoso quem recua para atacar depois, ou quem enfrenta uma doença com firmeza. Depois de várias respostas refutadas, o general admite que não sabe definir aquilo que julgava conhecer. O filósofo propõe, então, que investiguem juntos."], "src": "Texto elaborado para esta apostila, inspirado nos diálogos de Platão.", "cmd": "O procedimento do filósofo no diálogo tem como objetivo", "alts": ["ensinar técnicas de persuasão para vencer debates na Assembleia.", "demonstrar que a coragem não pode ser praticada por militares.", "provar que todas as opiniões sobre a coragem são igualmente verdadeiras.", "substituir a investigação racional pela tradição religiosa.", "refutar certezas aparentes e levar o interlocutor a reconhecer a própria ignorância como ponto de partida da investigação."], "mod": "F1", "ans": "E", "ex": {"E": "perguntas que derrubam as definições do general até ele admitir que não sabe, seguidas do convite a investigar juntos: ironia e maiêutica socráticas.", "A": "ensinar a vencer debates é o que Platão atribui aos <strong>sofistas<\/strong>.", "B": "o diálogo busca definir a coragem, não excluir os militares.", "C": "Sócrates busca uma definição <strong>universal<\/strong>; não diz que todas as opiniões valem o mesmo (isso seria relativismo).", "D": "o diálogo é investigação racional, não apelo à tradição religiosa."}, "hab": "H1, H4", "dif": "média", "traps": {}, "kind": "fixacao"}, {"id": "FS-4", "vol": "FS", "n": 4, "tag": "Inédita, estilo ENEM", "base": ["Imagine pessoas que, desde a infância, vivem acorrentadas no fundo de uma caverna, vendo apenas as sombras de objetos projetadas na parede pela luz de uma fogueira. Se uma delas fosse libertada e obrigada a subir até a saída, primeiro sofreria com a luz; depois, aos poucos, veria as coisas reais e o próprio Sol, e compreenderia que antes só conhecia aparências."], "src": "Texto elaborado para esta apostila, com base na alegoria da caverna, de Platão.", "cmd": "Na filosofia platônica, a libertação descrita representa a", "alts": ["valorização dos sentidos como fonte segura de conhecimento.", "recusa de qualquer forma de educação.", "defesa de que todas as opiniões são igualmente verdadeiras.", "passagem da opinião, baseada nos sentidos, ao conhecimento verdadeiro, por meio da educação filosófica.", "aceitação das tradições da cidade como critério de verdade."], "mod": "F2", "ans": "D", "ex": {"D": "sair da caverna é passar das sombras (opinião, sentidos) ao conhecimento das Ideias, pela educação filosófica.", "A": "as sombras vistas pelos sentidos são justamente a ilusão.", "B": "a alegoria é uma imagem da <strong>educação<\/strong>.", "C": "Platão opõe opinião e conhecimento; não iguala as opiniões.", "E": "os prisioneiros aceitam as tradições da caverna; é isso que precisam superar."}, "hab": "H1, H3", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "FS-5", "vol": "FS", "n": 5, "tag": "Inédita, estilo ENEM", "base": ["\"A virtude moral é fruto do hábito. Nenhuma das virtudes morais surge em nós por natureza. Tornamo-nos justos praticando atos justos, moderados praticando atos moderados e corajosos praticando atos de coragem.\""], "src": "ARISTÓTELES. Ética a Nicômaco, livro II. Obra em domínio público; tradução livre feita para esta apostila.", "cmd": "Considerando o trecho e a ética aristotélica, a virtude é entendida como", "alts": ["dom inato, concedido apenas aos que nascem nobres.", "disposição adquirida pela prática, que busca o meio-termo entre o excesso e a falta.", "obediência a um dever universal, independentemente das consequências.", "cálculo da maior quantidade de prazer para o maior número de pessoas.", "recusa de toda emoção para atingir a imperturbabilidade."], "mod": "F2", "ans": "B", "ex": {"B": "a virtude se adquire pela prática (hábito) e consiste no meio-termo entre excesso e falta.", "A": "o texto diz que nenhuma virtude moral surge por natureza.", "C": "dever universal independentemente das consequências é Kant (autor errado).", "D": "maior felicidade do maior número é o utilitarismo (autor errado).", "E": "recusar as emoções para atingir a imperturbabilidade lembra os estoicos, não Aristóteles."}, "hab": "H23", "dif": "fácil", "traps": {"C": "autor", "D": "autor"}, "kind": "fixacao"}, {"id": "FS-6", "vol": "FS", "n": 6, "tag": "Inédita, estilo ENEM", "base": ["\"É evidente que a cidade faz parte das coisas da natureza e que o homem é, por natureza, um animal político. Aquele que, por natureza e não por acaso, vive fora da cidade é ou um ser degradado ou um ser acima da humanidade.\""], "src": "ARISTÓTELES. Política, livro I. Obra em domínio público; tradução livre feita para esta apostila.", "cmd": "Para Aristóteles, a vida na pólis é", "alts": ["condição para a realização plena da natureza humana.", "resultado de um contrato firmado para sair do estado de natureza.", "obstáculo à felicidade, que só existe no isolamento.", "criação artificial imposta pela força dos governantes.", "forma de organização exclusiva dos povos não gregos."], "mod": "F2", "ans": "A", "ex": {"A": "se o homem é por natureza animal político, só na pólis realiza plenamente sua natureza.", "B": "contrato para sair do estado de natureza é a teoria dos <strong>contratualistas<\/strong> modernos (autor errado).", "C": "o trecho diz o contrário: viver fora da cidade é sinal de degradação ou de algo além do humano.", "D": "para Aristóteles, a cidade faz parte da <strong>natureza<\/strong>, não é artifício imposto.", "E": "Aristóteles pensa a pólis grega."}, "hab": "H11, H24", "dif": "fácil", "traps": {"B": "autor", "C": "oposto"}, "kind": "fixacao"}, {"id": "FS-7", "vol": "FS", "n": 7, "tag": "Inédita, estilo ENEM", "base": ["\"Das coisas existentes, algumas dependem de nós; outras, não. Dependem de nós o juízo, o impulso, o desejo, a aversão: em suma, tudo o que é obra nossa. Não dependem de nós o corpo, os bens, a reputação, os cargos: tudo o que não é obra nossa.\""], "src": "EPICTETO. Manual, 1. Obra em domínio público; tradução livre feita para esta apostila.", "cmd": "Com base no trecho, a atitude que conduz a uma vida feliz consiste em", "alts": ["acumular bens para se proteger dos imprevistos.", "buscar cargos públicos para garantir reconhecimento.", "entregar-se aos desejos para evitar frustrações.", "controlar o corpo dos outros para assegurar a própria segurança.", "concentrar-se no que depende da própria vontade e aceitar com serenidade o que não depende."], "mod": "F3", "ans": "E", "ex": {"E": "se só dependem de nós os juízos e desejos, a felicidade está em cuidar deles e aceitar com serenidade o resto (estoicismo).", "A": "bens não dependem de nós; acumulá-los não traz tranquilidade.", "B": "cargos e reputação estão entre o que <strong>não<\/strong> depende de nós.", "C": "entregar-se aos desejos é o oposto do domínio de si estoico.", "D": "o corpo dos outros também não depende de nós."}, "hab": "H23", "dif": "fácil", "traps": {"C": "oposto"}, "kind": "fixacao"}, {"id": "FS-8", "vol": "FS", "n": 8, "tag": "Inédita, estilo ENEM", "base": ["\"Acostuma-te a pensar que a morte nada é para nós, pois todo bem e todo mal residem nas sensações, e a morte é a privação das sensações. [...] Quando nós existimos, a morte não está presente; e, quando a morte está presente, nós já não existimos.\""], "src": "EPICURO. Carta a Meneceu. Obra em domínio público; tradução livre feita para esta apostila.", "cmd": "O argumento de Epicuro tem como finalidade", "alts": ["incentivar a busca de prazeres intensos antes da morte.", "demonstrar a imortalidade da alma.", "eliminar o medo da morte para alcançar a tranquilidade da alma.", "justificar o sacrifício da vida em nome da pátria.", "provar que as sensações são enganosas."], "mod": "F3", "ans": "C", "ex": {"C": "se a morte é ausência de sensação, não há por que temê-la; livre desse medo, a alma alcança a ataraxia.", "A": "Epicuro defende prazeres moderados e a ausência de dor, não prazeres intensos.", "B": "para Epicuro, com a morte cessa a sensação; não há imortalidade da alma no argumento.", "D": "o argumento não fala de pátria.", "E": "o argumento se apoia nas sensações como critério de bem e mal."}, "hab": "H23", "dif": "média", "traps": {}, "kind": "fixacao"}, {"id": "FS-9", "vol": "FS", "n": 9, "tag": "Inédita, estilo ENEM", "base": ["Para um teólogo do século XIII, as verdades conhecidas pela razão natural e as verdades reveladas pela fé não podem se contradizer, porque ambas procedem de Deus. Por isso, ele estudou com afinco as obras de um filósofo grego pagão e procurou mostrar que a razão pode demonstrar, por exemplo, a existência de um primeiro motor de todas as coisas."], "src": "Texto elaborado para esta apostila.", "cmd": "O texto refere-se ao pensamento de", "alts": ["Santo Agostinho, que rejeitava toda a filosofia grega.", "São Tomás de Aquino, que buscou conciliar a filosofia de Aristóteles com a doutrina cristã.", "Epicuro, que negava a intervenção dos deuses no mundo.", "Descartes, que fundou o conhecimento na dúvida metódica.", "Nietzsche, que anunciou a \"morte de Deus\"."], "mod": "F3", "ans": "B", "ex": {"B": "século XIII, harmonia entre fé e razão, estudo de um filósofo grego e prova de um primeiro motor: Tomás de Aquino e Aristóteles.", "A": "Agostinho viveu nos séculos IV–V e usou a filosofia grega (Platão).", "C": "Epicuro é grego antigo e não pensa a fé cristã.", "D": "Descartes é do século XVII.", "E": "Nietzsche é do século XIX e crítico do cristianismo."}, "hab": "H1, H3", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "FS-10", "vol": "FS", "n": 10, "tag": "Inédita, estilo ENEM", "base": ["\"Tudo o que recebi até agora como o mais verdadeiro e seguro, aprendi-o dos sentidos ou pelos sentidos. Ora, experimentei algumas vezes que esses sentidos eram enganadores, e é prudente nunca confiar inteiramente naqueles que já nos enganaram uma vez.\""], "src": "DESCARTES, R. Meditações, I. Obra em domínio público; tradução livre feita para esta apostila.", "cmd": "A desconfiança em relação aos sentidos, expressa no trecho, é um passo do método cartesiano que consiste em", "alts": ["duvidar de tudo o que pode ser posto em dúvida, em busca de um fundamento seguro para o conhecimento.", "aceitar como verdadeiro apenas o que foi aprendido pela tradição.", "fundar todo conhecimento na observação repetida dos fenômenos.", "negar a possibilidade de qualquer conhecimento verdadeiro.", "substituir a razão pela fé como critério de verdade."], "mod": "F4", "ans": "A", "ex": {"A": "desconfiar dos sentidos é o primeiro passo da dúvida metódica, que busca um fundamento indubitável (o cogito).", "B": "Descartes recusa aceitar o que aprendeu por tradição sem exame.", "C": "fundar o conhecimento na observação é empirismo (autor errado).", "D": "a dúvida é metódica: Descartes duvida <strong>para<\/strong> encontrar a certeza, não para negar todo conhecimento.", "E": "o critério é a razão (clareza e distinção)."}, "hab": "H1", "dif": "fácil", "traps": {"C": "autor"}, "kind": "fixacao"}, {"id": "FS-11", "vol": "FS", "n": 11, "tag": "Inédita, estilo ENEM", "base": ["Quando vemos uma bola de bilhar se mover em direção a outra e esta começar a se mover após o choque, não percebemos nenhuma força ou conexão necessária entre os dois movimentos; percebemos apenas que um fato se segue ao outro. Depois de observar muitas vezes essa sequência, a mente passa a esperar o segundo movimento sempre que vê o primeiro."], "src": "Texto elaborado para esta apostila, com base em David Hume.", "cmd": "Segundo essa análise, a ideia de causalidade tem origem no(a)", "alts": ["ideia inata colocada por Deus na mente humana.", "demonstração matemática das leis da natureza.", "revelação religiosa sobre a ordem do mundo.", "hábito, formado pela repetição da experiência.", "intuição intelectual das essências eternas."], "mod": "F4", "ans": "D", "ex": {"D": "só vemos um fato seguir o outro; a expectativa nasce da repetição, isto é, do hábito.", "A": "Hume é empirista e nega ideias inatas.", "B": "a causalidade não é demonstrada; é inferida da experiência.", "C": "o texto não menciona revelação.", "E": "intuição de essências eternas lembra Platão (autor errado)."}, "hab": "H1", "dif": "média", "traps": {"E": "autor"}, "kind": "fixacao"}, {"id": "FS-12", "vol": "FS", "n": 12, "tag": "Inédita, estilo ENEM", "base": ["Um filósofo da ciência criticou certas teorias por serem capazes de explicar qualquer comportamento humano: se uma pessoa age de um jeito, a teoria explica; se age de modo oposto, a teoria também explica. Para ele, essa aparente força era, na verdade, uma fraqueza."], "src": "Texto elaborado para esta apostila.", "cmd": "Para esse filósofo, uma teoria só pode ser considerada científica se apresentar", "alts": ["aceitação unânime pela comunidade científica.", "confirmação por um grande número de casos.", "origem em ideias inatas da razão.", "capacidade de explicar todos os fenômenos possíveis.", "possibilidade de ser refutada por testes empíricos."], "mod": "F4", "ans": "E", "ex": {"E": "para Popper, uma teoria que nada poderia contrariar não é científica; o critério é a falseabilidade.", "A": "consenso não define cientificidade para Popper.", "B": "confirmações, por mais numerosas, não bastam (esse é o problema da indução).", "C": "ideias inatas são do racionalismo, não do critério de Popper.", "D": "explicar \"tudo\" é justamente a fraqueza apontada."}, "hab": "H1, H20", "dif": "média", "traps": {}, "kind": "fixacao"}, {"id": "FS-13", "vol": "FS", "n": 13, "tag": "Inédita, estilo ENEM", "base": ["\"Durante o tempo em que os homens vivem sem um poder comum capaz de mantê-los todos em respeito, eles se encontram naquela condição a que se chama guerra; e uma guerra que é de todos os homens contra todos os homens.\""], "src": "HOBBES, T. Leviatã, cap. XIII. Obra em domínio público; tradução livre feita para esta apostila.", "cmd": "Para o autor, a saída da condição descrita exige a", "alts": ["volta a uma vida simples, sem propriedade privada.", "transferência de direitos a um soberano com poder suficiente para garantir a paz.", "divisão do poder entre Legislativo, Executivo e Judiciário.", "desobediência às leis consideradas injustas.", "organização dos indivíduos em comunidades sem governo."], "mod": "F5", "ans": "B", "ex": {"B": "sem um poder comum há guerra; a saída é transferir direitos a um soberano forte (Leviatã).", "A": "vida simples sem propriedade lembra Rousseau.", "C": "separação dos poderes é Montesquieu.", "D": "Hobbes não admite desobediência ao soberano, salvo para preservar a vida.", "E": "comunidades sem governo são o próprio estado de natureza que Hobbes quer evitar."}, "hab": "H11, H14", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "FS-14", "vol": "FS", "n": 14, "tag": "Inédita, estilo ENEM", "base": ["\"O primeiro que, tendo cercado um terreno, lembrou-se de dizer 'isto é meu' e encontrou pessoas bastante simples para acreditar nele foi o verdadeiro fundador da sociedade civil.\""], "src": "ROUSSEAU, J.-J. Discurso sobre a origem e os fundamentos da desigualdade entre os homens, 1755. Obra em domínio público; tradução livre feita para esta apostila.", "cmd": "No trecho, o filósofo associa o surgimento da desigualdade entre os seres humanos à", "alts": ["natureza violenta do ser humano no estado natural.", "vontade divina que distribui talentos desiguais.", "instituição da propriedade privada.", "falta de um soberano absoluto.", "divisão dos poderes do Estado."], "mod": "F5", "ans": "C", "ex": {"C": "cercar o terreno e dizer \"isto é meu\" é a origem da sociedade civil e da desigualdade: a propriedade privada.", "A": "para Rousseau, o homem natural é pacífico (é Hobbes quem fala em guerra).", "B": "o trecho não fala de vontade divina.", "D": "soberano absoluto é a solução de Hobbes.", "E": "a divisão dos poderes não aparece."}, "hab": "H11, H15", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "FS-15", "vol": "FS", "n": 15, "tag": "Inédita, estilo ENEM", "base": ["\"Se a injustiça é de tal natureza que exige que você seja o agente de uma injustiça contra outra pessoa, então, digo, viole a lei.\""], "src": "THOREAU, H. D. A desobediência civil, 1849. Obra em domínio público; tradução livre feita para esta apostila.", "cmd": "O autor defende uma forma de ação política que consiste em", "alts": ["tomar o poder pela luta armada.", "obedecer a todas as leis, mesmo às injustas, para preservar a ordem.", "participar exclusivamente das eleições para mudar as leis.", "descumprir de forma consciente e pública uma lei considerada injusta, em nome de um princípio de justiça.", "fugir do país para evitar o cumprimento das leis."], "mod": "F5", "ans": "D", "ex": {"D": "violar conscientemente a lei que obriga a cometer injustiça: desobediência civil (Thoreau).", "A": "Thoreau defendia a resistência pacífica.", "B": "é o contrário do trecho.", "C": "o trecho propõe agir para além das vias eleitorais.", "E": "Thoreau ficou e foi preso; a fuga não é a proposta."}, "hab": "H12, H22", "dif": "fácil", "traps": {"B": "oposto"}, "kind": "fixacao"}, {"id": "FS-16", "vol": "FS", "n": 16, "tag": "Inédita, estilo ENEM", "base": ["Um filósofo examinou o seguinte caso: um assassino bate à porta e pergunta onde está escondido um amigo seu. Para esse filósofo, mesmo nessa situação não se deve mentir, pois a veracidade é um dever que não depende dos resultados que dela possam advir, e uma regra que permitisse mentir sempre que conviesse não poderia valer para todos."], "src": "Texto elaborado para esta apostila.", "cmd": "A posição descrita expressa uma ética segundo a qual", "alts": ["o dever moral vale de forma incondicional, independentemente das consequências da ação.", "a ação correta é a que produz a maior felicidade para o maior número.", "a virtude é o meio-termo entre o excesso e a falta.", "os valores morais são criações dos fracos contra os fortes.", "cada cultura define livremente o que é a verdade."], "mod": "F6", "ans": "A", "ex": {"A": "a veracidade como dever que não depende dos resultados e que precisa valer para todos: ética kantiana.", "B": "maior felicidade é o utilitarismo, que poderia justificar a mentira.", "C": "o justo meio é aristotélico.", "D": "valores criados pelos fracos é tese de Nietzsche.", "E": "o texto defende um dever universal, não o relativismo."}, "hab": "H23", "dif": "média", "traps": {}, "kind": "fixacao"}, {"id": "FS-17", "vol": "FS", "n": 17, "tag": "Inédita, estilo ENEM", "base": ["Com um orçamento limitado, uma secretaria de saúde precisava escolher entre dois programas. O primeiro oferecia um tratamento caro para uma doença rara, beneficiando 50 pessoas. O segundo ampliava a vacinação infantil e evitaria, segundo as estimativas, a morte de cerca de 2 mil crianças. A secretaria escolheu o segundo, argumentando que essa decisão produziria o maior benefício total para a população."], "src": "Texto elaborado para esta apostila.", "cmd": "O argumento da secretaria fundamenta-se em uma ética", "alts": ["do dever, que avalia a ação pela intenção do agente, independentemente dos resultados.", "das virtudes, que busca o justo meio por meio do hábito.", "existencialista, que nega qualquer critério objetivo de escolha.", "religiosa, que atribui à vontade divina o destino dos doentes.", "utilitarista, que avalia as ações por suas consequências para o bem-estar do maior número."], "mod": "F6", "ans": "E", "ex": {"E": "escolher o programa que salva mais vidas, pelo maior benefício total: critério utilitarista, pelas consequências.", "A": "a secretaria avaliou resultados, não a intenção.", "B": "não há referência a virtudes ou hábito.", "C": "a secretaria usou um critério objetivo (número de vidas).", "D": "não há fundamento religioso."}, "hab": "H23, H25", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "FS-18", "vol": "FS", "n": 18, "tag": "Inédita, estilo ENEM", "base": ["Para um filósofo francês do século XX, um cortador de papel é fabricado a partir de uma ideia prévia que define sua função. Com o ser humano ocorre o contrário: ele primeiro existe, surge no mundo, e só depois se define pelo que faz. Por isso, não pode desculpar seus atos culpando a natureza humana, o destino ou as circunstâncias."], "src": "Texto elaborado para esta apostila, com base em Jean-Paul Sartre.", "cmd": "A ideia central do texto é a de que o ser humano", "alts": ["tem uma essência fixa, definida antes do nascimento.", "é determinado inteiramente pelo meio social em que vive.", "não possui uma natureza predefinida e é responsável por aquilo que faz de si mesmo.", "deve obedecer às leis do Estado para ser livre.", "só alcança a felicidade pelo controle dos prazeres."], "mod": "F6", "ans": "C", "ex": {"C": "o ser humano não tem essência prévia; define-se pelo que faz e responde por isso (Sartre).", "A": "é o contrário: essência fixa vale para o objeto fabricado.", "B": "Sartre recusa desculpas pelas circunstâncias.", "D": "o texto não trata de obediência ao Estado.", "E": "controle dos prazeres é tema helenístico."}, "hab": "H23", "dif": "fácil", "traps": {"A": "oposto"}, "kind": "fixacao"}, {"id": "FS-19", "vol": "FS", "n": 19, "tag": "Inédita, estilo ENEM", "base": ["Executivos de uma plataforma de streaming explicaram que suas séries de maior sucesso são produzidas a partir de dados de audiência: algoritmos indicam a duração ideal dos episódios, o momento certo do primeiro suspense e até os tipos de personagens que mantêm o espectador assistindo. Os lançamentos seguem o mesmo modelo, com pequenas variações de cenário."], "src": "Texto elaborado para esta apostila.", "cmd": "Na perspectiva dos filósofos da Escola de Frankfurt, a situação descrita exemplifica a", "alts": ["democratização plena da criação artística.", "autonomia do artista diante do mercado.", "recusa da tecnologia na produção cultural.", "padronização da cultura como mercadoria, que favorece o conformismo do público.", "valorização da obra de arte única e original."], "mod": "F7", "ans": "D", "ex": {"D": "séries feitas por fórmula, a partir de dados de audiência, repetindo o mesmo modelo: cultura padronizada como mercadoria (indústria cultural).", "A": "quem decide é o algoritmo da empresa; não há democratização da criação.", "B": "o mercado define a obra.", "C": "a tecnologia é usada intensamente.", "E": "os produtos são seriados, não únicos."}, "hab": "H21", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "FS-20", "vol": "FS", "n": 20, "tag": "Inédita, estilo ENEM", "base": ["Em uma central de atendimento, cada funcionário sabe que suas chamadas podem ser gravadas e que um supervisor, numa sala envidraçada, pode acompanhar a tela de qualquer computador a qualquer momento. Como ninguém sabe quando está sendo observado, todos seguem o roteiro à risca o tempo inteiro, mesmo quando a sala do supervisor está vazia."], "src": "Texto elaborado para esta apostila.", "cmd": "A situação ilustra o conceito foucaultiano de poder disciplinar, caracterizado pela", "alts": ["punição pública e espetacular do corpo do infrator.", "internalização da vigilância, que produz comportamentos disciplinados.", "ausência de qualquer forma de controle sobre os trabalhadores.", "concentração do poder exclusivamente nas mãos do Estado.", "livre negociação entre iguais na esfera pública."], "mod": "F7", "ans": "B", "ex": {"B": "sem saber quando são observados, os funcionários se vigiam sozinhos: vigilância internalizada (panóptico).", "A": "suplício público é a punição <strong>anterior<\/strong> à disciplina.", "C": "há controle intenso.", "D": "o exemplo é numa empresa: para Foucault, o poder está espalhado, não só no Estado.", "E": "livre negociação na esfera pública é Habermas (autor errado)."}, "hab": "H16, H24", "dif": "fácil", "traps": {"E": "autor"}, "kind": "fixacao"}, {"id": "FS-21", "vol": "FS", "n": 21, "tag": "Inédita, estilo ENEM", "base": ["No início do século XX, um quadro famoso só podia ser visto por quem viajasse até o museu que o guardava. Décadas depois, reproduções em cartões-postais, livros, filmes e telas passaram a mostrá-lo a milhões de pessoas, em qualquer lugar, embora sem a experiência única de estar diante do original."], "src": "Texto elaborado para esta apostila.", "cmd": "A transformação descrita foi analisada por Walter Benjamin como # Parte II — Sociologia !&gt; <strong>Como o ENEM cobra Sociologia:<\/strong> com textos de sociólogos, notícias, dados e charges sobre trabalho, desigualdade, cultura e cidadania. A pergunta quase sempre pede que você reconheça um <strong>conceito<\/strong> (fato social, alienação, etnocentrismo, discriminação positiva) aplicado a uma situação concreta. Estude cada conceito com um <strong>exemplo de hoje<\/strong>.", "alts": ["perda da \"aura\" da obra de arte, acompanhada da ampliação do acesso a ela.", "fim definitivo da produção artística.", "fortalecimento do valor de culto da obra original.", "restrição da arte às elites econômicas.", "recusa das massas em consumir arte."], "mod": "F7", "ans": "A", "ex": {"A": "a reprodução técnica faz a obra perder a aura (a experiência única do original), mas amplia o acesso.", "B": "a arte continua sendo produzida.", "C": "o valor de culto (ligado ao original) <strong>diminui<\/strong>.", "D": "a reprodução <strong>amplia<\/strong> o acesso.", "E": "o texto fala de milhões de pessoas vendo a obra."}, "hab": "H3, H21", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "FS-22", "vol": "FS", "n": 22, "tag": "Inédita, estilo ENEM", "base": ["\"É fato social toda maneira de agir, fixa ou não, suscetível de exercer sobre o indivíduo uma coerção exterior; ou ainda, toda maneira de agir que é geral na extensão de uma sociedade dada, apresentando uma existência própria, independente de suas manifestações individuais.\""], "src": "DURKHEIM, É. As regras do método sociológico, 1895. Obra em domínio público; tradução livre feita para esta apostila.", "cmd": "Um exemplo que se enquadra no conceito apresentado é o(a)", "alts": ["preferência pessoal de um indivíduo por determinado sabor de sorvete.", "sonho que uma pessoa teve na noite anterior.", "uso obrigatório de uniforme em uma escola, cujo descumprimento gera advertência.", "decisão espontânea de um jovem de pintar o quarto de azul.", "reação física de um corpo ao frio intenso."], "mod": "S1", "ans": "C", "ex": {"C": "o uniforme obrigatório existe antes do aluno, vale para todos e gera sanção (advertência): exterior, geral e coercitivo.", "A": "preferência de sabor é individual e não coercitiva.", "B": "o sonho é fenômeno individual e psíquico.", "D": "decisão espontânea, sem coerção.", "E": "reação física é fenômeno biológico."}, "hab": "H11", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "FS-23", "vol": "FS", "n": 23, "tag": "Inédita, estilo ENEM", "base": ["Nas comunidades calvinistas dos séculos XVI e XVII, acreditava-se que Deus já havia escolhido os salvos. Como ninguém podia ter certeza da própria salvação, o sucesso obtido com trabalho disciplinado e metódico, a poupança e a recusa ao luxo passaram a ser vistos como sinais de que se estava entre os escolhidos."], "src": "Texto elaborado para esta apostila, com base em Max Weber.", "cmd": "Segundo a análise de Weber, essa conduta contribuiu para a formação do capitalismo moderno ao evidenciar a", "alts": ["determinação da religião pela infraestrutura econômica.", "ausência de relação entre crenças e comportamento econômico.", "predominância da ação tradicional na economia moderna.", "rejeição religiosa da acumulação de riquezas.", "influência de valores religiosos na formação de uma conduta econômica racional e metódica."], "mod": "S1", "ans": "E", "ex": {"E": "crenças calvinistas produziram trabalho metódico, poupança e recusa ao luxo, condutas que favoreceram o capitalismo: valores religiosos moldando a economia.", "A": "a religião determinada pela economia é a leitura de Marx (autor errado); Weber mostra o caminho inverso.", "B": "é o contrário da tese.", "C": "a conduta descrita é <strong>racional e metódica<\/strong>, não tradicional.", "D": "a riqueza era vista como sinal de eleição; o que se recusava era o luxo."}, "hab": "H11, H14", "dif": "média", "traps": {"A": "autor", "B": "oposto"}, "kind": "fixacao"}, {"id": "FS-24", "vol": "FS", "n": 24, "tag": "Inédita, estilo ENEM", "base": ["\"O trabalhador só se sente junto a si fora do trabalho e, no trabalho, sente-se fora de si. Está em casa quando não trabalha e, quando trabalha, não está em casa. O seu trabalho não é, portanto, voluntário, mas forçado.\""], "src": "MARX, K. Manuscritos econômico-filosóficos, 1844. Obra em domínio público; tradução livre feita para esta apostila.", "cmd": "O trecho descreve o fenômeno denominado", "alts": ["solidariedade orgânica, baseada na divisão do trabalho.", "alienação, em que o trabalho se torna estranho ao trabalhador.", "anomia, causada pela ausência de normas.", "dominação carismática, exercida por um líder.", "ação racional com relação a valores."], "mod": "S1", "ans": "B", "ex": {"B": "sentir-se fora de si no trabalho, que é forçado e não voluntário: alienação.", "A": "solidariedade orgânica é conceito de Durkheim (autor errado).", "C": "anomia é ausência de normas (Durkheim).", "D": "dominação carismática é Weber.", "E": "ação racional com relação a valores é Weber."}, "hab": "H16", "dif": "fácil", "traps": {"A": "autor"}, "kind": "fixacao"}, {"id": "FS-25", "vol": "FS", "n": 25, "tag": "Inédita, estilo ENEM", "base": ["Uma montadora instalada no interior do país mantém estoque de peças para apenas algumas horas de produção. Os fornecedores, muitos deles empresas terceirizadas instaladas ao lado da fábrica, entregam os componentes à medida que os pedidos dos clientes chegam. Nas linhas, cada trabalhador opera diferentes máquinas e participa de reuniões semanais para sugerir melhorias no processo."], "src": "Texto elaborado para esta apostila.", "cmd": "O modelo de organização da produção descrito corresponde ao", "alts": ["taylorismo, baseado na cronometragem de tarefas individuais.", "fordismo clássico, com grandes estoques e produção padronizada em massa.", "artesanato, em que um único trabalhador faz o produto inteiro.", "toyotismo, caracterizado pela produção flexível, sob demanda e com trabalhador polivalente.", "sistema de corporações de ofício medievais."], "mod": "S2", "ans": "D", "ex": {"D": "estoque mínimo, entrega conforme os pedidos, fornecedores terceirizados, trabalhador polivalente e melhoria contínua: toyotismo.", "A": "o taylorismo cronometra tarefas simples e separa quem pensa de quem executa.", "B": "o fordismo clássico tem grandes estoques.", "C": "não há produção artesanal.", "E": "corporações de ofício são medievais."}, "hab": "H16, H17", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "FS-26", "vol": "FS", "n": 26, "tag": "Inédita, estilo ENEM", "base": ["Um entregador por aplicativo relatou que trabalha de 10 a 12 horas por dia, paga a manutenção da moto e o plano de dados do celular, não tem férias nem auxílio em caso de acidente e já foi desligado da plataforma depois de receber avaliações negativas, sem conseguir falar com nenhum funcionário da empresa. Nos anúncios, a empresa o chama de \"parceiro\"."], "src": "Texto elaborado para esta apostila.", "cmd": "A situação descrita expressa uma tendência do mundo do trabalho contemporâneo marcada pela", "alts": ["transferência de riscos e custos ao trabalhador, sem vínculo empregatício e proteção social.", "ampliação dos direitos trabalhistas garantidos pela CLT.", "volta ao modelo fordista de emprego estável.", "redução da jornada de trabalho promovida pela tecnologia.", "fortalecimento dos sindicatos de entregadores como empregadores."], "mod": "S2", "ans": "A", "ex": {"A": "o entregador paga os custos, não tem proteção nem vínculo e é controlado pelo aplicativo: transferência de riscos ao trabalhador (uberização).", "B": "ele não tem os direitos da CLT.", "C": "o fordismo oferecia emprego estável e com vínculo.", "D": "a jornada relatada é de 10 a 12 horas.", "E": "sindicatos não são empregadores; o texto nem os menciona."}, "hab": "H16, H20", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "FS-27", "vol": "FS", "n": 27, "tag": "Inédita, estilo ENEM", "base": ["Em uma fábrica de automóveis do início do século XX, cada operário passava o dia inteiro apertando os mesmos parafusos nas peças que chegavam por uma esteira, num ritmo definido pela velocidade da linha. Os engenheiros, em outro prédio, planejavam o produto e calculavam o tempo de cada movimento."], "src": "Texto elaborado para esta apostila.", "cmd": "O sistema descrito caracteriza-se pelo(a)", "alts": ["produção flexível conforme a demanda do mercado.", "controle do processo produtivo pelos próprios operários.", "parcelamento e repetição de tarefas na linha de montagem, com separação entre concepção e execução.", "trabalho artesanal, em que cada operário produz um carro inteiro."
