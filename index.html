, "polivalência dos trabalhadores, que circulam entre diferentes funções."], "mod": "S2", "ans": "C", "ex": {"C": "a mesma tarefa repetida na esteira, no ritmo da linha, com engenheiros planejando à parte: fordismo, com separação entre concepção e execução.", "A": "produção flexível sob demanda é o toyotismo.", "B": "o ritmo é imposto pela linha e pelos engenheiros.", "D": "cada operário faz uma única tarefa.", "E": "polivalência é toyotista."}, "hab": "H16", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "FS-28", "vol": "FS", "n": 28, "tag": "Inédita, estilo ENEM", "base": ["\"Creio que não há nada de bárbaro e de selvagem nesse povo, pelo que me contaram, a não ser porque cada um chama de barbárie aquilo que não é de seu costume.\""], "src": "MONTAIGNE, M. Dos canibais, 1580. Obra em domínio público; tradução livre feita para esta apostila.", "cmd": "Ao comentar os povos indígenas do Brasil, o autor", "alts": ["defende a superioridade dos costumes europeus.", "justifica a escravização dos indígenas.", "nega a existência de diferenças culturais entre os povos.", "propõe a conversão religiosa como forma de civilização.", "relativiza a noção de barbárie, criticando o julgamento de outros povos a partir dos próprios costumes."], "mod": "S3", "ans": "E", "ex": {"E": "\"cada um chama de barbárie aquilo que não é de seu costume\": crítica ao etnocentrismo.", "A": "Montaigne relativiza a superioridade europeia.", "B": "o trecho não justifica a escravização.", "C": "ele reconhece as diferenças, mas recusa hierarquizá-las.", "D": "não há proposta de conversão."}, "hab": "H1, H4", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "FS-29", "vol": "FS", "n": 29, "tag": "Inédita, estilo ENEM", "base": ["Uma pesquisa acompanhou dois grupos de usuários de uma rede social com posições políticas opostas. Depois de alguns meses, os conteúdos exibidos a cada grupo eram quase totalmente diferentes, e os participantes passaram a considerar as posições do outro grupo cada vez mais absurdas e a duvidar de fatos noticiados por veículos que não seguiam."], "src": "Texto elaborado para esta apostila.", "cmd": "O fenômeno descrito está relacionado ao(à)", "alts": ["democratização do acesso a informações diversificadas.", "funcionamento de algoritmos que reforçam opiniões prévias e fragmentam o debate público.", "neutralidade das plataformas digitais na seleção de conteúdos.", "fim da influência dos meios de comunicação sobre a opinião pública.", "ampliação do diálogo entre grupos com posições opostas."], "mod": "S3", "ans": "B", "ex": {"B": "conteúdos diferentes para cada grupo e aumento da desconfiança mútua: algoritmos que criam bolhas e fragmentam o debate.", "A": "cada grupo recebeu informações <strong>menos<\/strong> diversificadas.", "C": "a seleção de conteúdos não foi neutra.", "D": "a influência da mídia digital foi justamente o que a pesquisa mostrou.", "E": "o diálogo diminuiu."}, "hab": "H21", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "FS-30", "vol": "FS", "n": 30, "tag": "Inédita, estilo ENEM", "base": ["Um relatório de uma organização da sociedade civil registrou dezenas de ataques a terreiros de candomblé e umbanda em um único ano, com depredação de imagens sagradas e agressões verbais que associavam as religiões a práticas \"do mal\". Lideranças religiosas afirmaram que o preconceito contra a fé se mistura ao preconceito contra a população negra."], "src": "Texto elaborado para esta apostila.", "cmd": "A situação descrita representa", "alts": ["um exercício legítimo da liberdade de expressão.", "a consolidação do Estado laico.", "um conflito exclusivamente religioso, sem relação com a questão racial.", "uma violação da liberdade de crença associada ao racismo contra as matrizes culturais africanas.", "o resultado do sincretismo entre religiões."], "mod": "S3", "ans": "D", "ex": {"D": "ataques a terreiros violam a liberdade de crença, e o preconceito se mistura ao racismo (racismo religioso).", "A": "depredação e agressão não são liberdade de expressão.", "B": "é uma violação do princípio laico, que garante a liberdade de todas as crenças.", "C": "as lideranças apontam justamente a dimensão racial.", "E": "sincretismo é mistura de religiões, não violência."}, "hab": "H1, H24", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "FS-31", "vol": "FS", "n": 31, "tag": "Inédita, estilo ENEM", "base": ["\"A regra da igualdade não consiste senão em quinhoar desigualmente aos desiguais, na medida em que se desigualam.\""], "src": "BARBOSA, R. Oração aos moços, 1921. Obra em domínio público.", "cmd": "O princípio enunciado no texto fundamenta políticas públicas que buscam a", "alts": ["igualdade material, por meio de tratamento diferenciado a grupos em desvantagem.", "igualdade formal absoluta, que proíbe qualquer distinção entre cidadãos.", "manutenção das hierarquias sociais herdadas.", "eliminação dos direitos sociais.", "distribuição idêntica de recursos a todas as pessoas."], "mod": "S4", "ans": "A", "ex": {"A": "tratar desigualmente os desiguais para alcançar a igualdade real: igualdade material, base das ações afirmativas.", "B": "a igualdade formal absoluta proibiria o tratamento diferenciado que Rui Barbosa defende.", "C": "o princípio busca corrigir, não manter, hierarquias.", "D": "não há relação com eliminar direitos sociais.", "E": "distribuição idêntica é o oposto de \"quinhoar desigualmente\"."}, "hab": "H24, H25", "dif": "fácil", "traps": {"E": "oposto"}, "kind": "fixacao"}, {"id": "FS-32", "vol": "FS", "n": 32, "tag": "Inédita, estilo ENEM", "base": ["Na Inglaterra, segundo um sociólogo britânico, os direitos civis vieram primeiro, depois os políticos e, por fim, os sociais. Um historiador brasileiro observou que, no Brasil, os direitos sociais, como a legislação trabalhista e a previdência, foram ampliados sobretudo durante a Era Vargas, num período em que os direitos políticos estavam restringidos."], "src": "Texto elaborado para esta apostila.", "cmd": "A comparação permite concluir que, no Brasil, a construção da cidadania", "alts": ["seguiu a mesma ordem observada na Inglaterra.", "começou pela conquista plena dos direitos civis.", "teve uma sequência diferente, com direitos sociais ampliados antes da consolidação dos direitos políticos e civis.", "dispensou a atuação do Estado.", "concluiu-se com a independência, em 1822."], "mod": "S4", "ans": "C", "ex": {"C": "no Brasil, os direitos sociais avançaram com Vargas antes da consolidação dos políticos e civis: ordem diferente da inglesa (José Murilo de Carvalho).", "A": "a comparação mostra ordens diferentes.", "B": "os direitos civis seguem frágeis.", "D": "o Estado (Vargas) teve papel central.", "E": "a cidadania se construiu ao longo dos séculos XIX e XX e continua em construção."}, "hab": "H11, H24", "dif": "média", "traps": {}, "kind": "fixacao"}, {"id": "FS-33", "vol": "FS", "n": 33, "tag": "Inédita, estilo ENEM", "base": ["Em uma pesquisa, currículos idênticos, com a mesma formação e a mesma experiência, foram enviados a centenas de empresas. Mudou apenas a foto e o nome do candidato. Os currículos com fotos de pessoas negras receberam significativamente menos convites para entrevista. Nenhuma das empresas tinha regra escrita que discriminasse candidatos."], "src": "Texto elaborado para esta apostila.", "cmd": "O resultado da pesquisa evidencia o(a)", "alts": ["ausência de desigualdade racial no mercado de trabalho.", "preferência dos candidatos negros por outras vagas.", "diferença de qualificação entre os candidatos.", "existência de leis que autorizam a discriminação racial.", "racismo estrutural, presente no funcionamento das instituições e não apenas em atos explícitos."], "mod": "S4", "ans": "E", "ex": {"E": "sem regra escrita, mas com resultado sistemático contra candidatos negros com a mesma qualificação: racismo estrutural.", "A": "a pesquisa mostra desigualdade.", "B": "os candidatos enviaram os currículos às mesmas vagas.", "C": "os currículos eram idênticos.", "D": "não há lei autorizando discriminação (racismo é crime)."}, "hab": "H24, H25", "dif": "fácil", "traps": {}, "kind": "fixacao"}, {"id": "FS-34", "vol": "FS", "n": 34, "tag": "Inédita, estilo ENEM", "base": ["Dois estudantes de uma mesma escola obtiveram resultados muito diferentes no vestibular. Um deles cresceu em uma casa com muitos livros, visitava museus com os pais, que eram professores universitários, e conversava sobre política no jantar. O outro, filho de pais que não concluíram o ensino fundamental, trabalhava à tarde e estudava à noite. A escola atribuiu o resultado ao \"esforço e talento\" de cada um."], "src": "Texto elaborado para esta apostila.", "cmd": "Segundo a perspectiva de Pierre Bourdieu, a explicação da escola", "alts": ["está correta, pois o desempenho escolar depende apenas do mérito individual.", "oculta o papel do capital cultural herdado da família na produção das desigualdades escolares.", "demonstra que a escola elimina as diferenças de origem social.", "prova que o capital econômico não tem relação com o desempenho escolar.", "indica que a escola é uma instituição total."], "mod": "S5", "ans": "B", "ex": {"B": "livros, museus e conversas em casa formam um capital cultural que a escola premia; atribuir o resultado só ao talento esconde essa herança.", "A": "é a explicação que Bourdieu critica.", "C": "para Bourdieu, a escola <strong>reproduz<\/strong> as diferenças de origem.", "D": "o texto mostra diferenças de origem social e cultural, que costumam acompanhar as econômicas.", "E": "instituição total é conceito de Goffman (autor errado)."}, "hab": "H11, H24", "dif": "média", "traps": {"E": "autor"}, "kind": "fixacao"}, {"id": "FS-35", "vol": "FS", "n": 35, "tag": "Inédita, estilo ENEM", "base": ["\"Talvez não haja nenhum fenômeno psíquico que seja tão incondicionalmente reservado à cidade grande quanto a atitude blasé. [...] Ela resulta da rápida mudança e da compressão de estímulos nervosos contrastantes.\""], "src": "SIMMEL, G. A metrópole e a vida mental, 1903. Obra em domínio público; tradução livre feita para esta apostila.", "cmd": "Para o autor, a atitude blasé consiste em um(a)", "alts": ["aumento da solidariedade entre vizinhos nas grandes cidades.", "forma de religiosidade típica da vida urbana.", "recusa dos habitantes da metrópole em usar dinheiro.", "embotamento da capacidade de reagir aos estímulos, como defesa diante da intensidade da vida urbana.", "preferência pela vida rural, mais estimulante."], "mod": "S5", "ans": "D", "ex": {"D": "a atitude blasé é a indiferença que protege o habitante da metrópole do excesso de estímulos.", "A": "Simmel destaca a <strong>reserva<\/strong> e a impessoalidade, não mais solidariedade.", "B": "não é forma de religiosidade.", "C": "o dinheiro é central na vida metropolitana para Simmel.", "E": "o texto fala da cidade grande como lugar de excesso de estímulos."}, "hab": "H11", "dif": "média", "traps": {}, "kind": "fixacao"}, {"id": "FS-36", "vol": "FS", "n": 36, "tag": "Inédita, estilo ENEM", "base": ["Ao ingressar em um hospital psiquiátrico de grande porte, em meados do século XX, o paciente tinha suas roupas e objetos pessoais recolhidos, recebia um uniforme e um número e passava a seguir horários rígidos para dormir, comer e tomar banho, sempre em grupo e sob a vigilância de funcionários. As visitas eram raras, e as saídas, proibidas."], "src": "Texto elaborado para esta apostila.", "cmd": "A situação descrita caracteriza o que o sociólogo Erving Goffman chamou de # Fechamento", "alts": ["instituição total, que controla todos os aspectos da vida e despoja o indivíduo de sua identidade anterior.", "solidariedade orgânica, baseada na divisão do trabalho.", "dominação carismática, exercida por um líder excepcional.", "relativismo cultural, que respeita os costumes de cada grupo.", "capital social, formado por redes de contatos."], "mod": "S5", "ans": "A", "ex": {"A": "isolamento, uniforme, número, horários rígidos e vigilância: instituição total.", "B": "solidariedade orgânica é Durkheim.", "C": "não há líder carismático.", "D": "o hospital apaga a identidade dos internos, o oposto de respeitar costumes.", "E": "capital social é Bourdieu e trata de redes de contatos."}, "hab": "H11, H24", "dif": "fácil", "traps": {"D": "oposto"}, "kind": "fixacao"}, {"id": "FS-37", "vol": "FS", "n": 37, "tag": "Inédita, estilo ENEM · reforço da questão 50", "base": ["Em 1955, numa cidade do sul dos Estados Unidos, uma costureira negra recusou-se a ceder seu assento a um passageiro branco, como exigia a lei municipal de segregação nos ônibus. Foi presa e multada. Sua atitude, pública e sem violência, desencadeou um boicote aos ônibus que durou mais de um ano e ajudou a derrubar a segregação no transporte."], "src": "Texto elaborado para esta apostila.", "cmd": "A atitude descrita constitui um caso de", "alts": ["greve, direito previsto na legislação trabalhista.", "desobediência civil, que contesta publicamente uma lei considerada injusta.", "crime comum, sem motivação política.", "luta armada para a tomada do poder.", "cumprimento do ordenamento jurídico vigente."], "ans": "B", "ex": {"B": "descumprir publicamente, sem violência, uma lei de segregação considerada injusta, aceitando a prisão: desobediência civil (Rosa Parks, Montgomery, 1955).", "A": "é o detalhe do seu erro na 50: greve é direito previsto em lei, e não é o caso.", "C": "a atitude tinha motivação política e moral explícita.", "D": "não houve violência.", "E": "ela descumpriu a lei municipal."}, "hab": "H12, H22", "dif": "fácil", "traps": {}, "kind": "reforco"}, {"id": "FS-38", "vol": "FS", "n": 38, "tag": "Inédita, estilo ENEM · reforço da questão 66", "base": ["Camisetas com frases contra o consumismo são vendidas em lojas de grandes redes; canções de protesto viram trilha sonora de anúncios publicitários; e um dia de \"liberdade\" é oferecido como pacote turístico. Um filósofo da Escola de Frankfurt diria que, nessa sociedade, até a recusa se transforma em mercadoria."], "src": "Texto elaborado para esta apostila.", "cmd": "Na perspectiva de Herbert Marcuse, a situação revela a característica da sociedade industrial avançada de", "alts": ["estimular a desobediência civil generalizada.", "eliminar o consumo como forma de integração social.", "absorver a crítica, reduzindo o pensamento à adaptação ao sistema existente.", "garantir a autonomia plena dos indivíduos pelo acesso à tecnologia.", "substituir a produção industrial pela produção artesanal."], "ans": "C", "ex": {"C": "até a recusa vira mercadoria: o sistema absorve a crítica, e o pensamento se reduz à adaptação (sociedade unidimensional).", "A": "a crítica é neutralizada, não ampliada.", "B": "o consumo é justamente a forma de integração.", "D": "detalhe verdadeiro: há tecnologia, mas Marcuse aponta perda de autonomia.", "E": "a produção continua industrial."}, "hab": "H21, H23", "dif": "média", "traps": {"D": "detalhe"}, "kind": "reforco"}, {"id": "FS-39", "vol": "FS", "n": 39, "tag": "Inédita, estilo ENEM · reforço da questão 76", "base": ["As declarações de direitos do século XVIII protegiam a liberdade, a propriedade e a segurança. Nenhuma delas mencionava o direito a um meio ambiente equilibrado, a proteção de dados pessoais ou o acesso à internet, hoje reconhecidos em constituições e tratados de vários países. Esses novos direitos surgiram de debates, pressões de movimentos sociais e mudanças tecnológicas."], "src": "Texto elaborado para esta apostila.", "cmd": "O texto apresenta os direitos humanos como", "alts": ["naturais e imutáveis, iguais em todas as épocas.", "concessões divinas, reveladas aos governantes.", "privilégios individuais de grupos dominantes.", "imposições de um único governo sobre os demais.", "construções históricas, que se ampliam com as lutas e as transformações sociais."], "ans": "E", "ex": {"E": "novos direitos surgiram de debates, pressões sociais e mudanças tecnológicas: são construções históricas (Bobbio).", "A": "termo oposto: o texto mostra que os direitos <strong>mudaram<\/strong>.", "B": "o texto não fala de origem divina.", "C": "os direitos citados (ambiente, dados) são de todos.", "D": "o texto fala de constituições e tratados de vários países."}, "hab": "H22, H24", "dif": "fácil", "traps": {"A": "oposto"}, "kind": "reforco"}, {"id": "FS-40", "vol": "FS", "n": 40, "tag": "Inédita, estilo ENEM · reforço da questão 79", "base": ["\"Toda punição é um dano; toda punição é, em si mesma, um mal. Pelo princípio da utilidade, se ela deve ser admitida, só deve sê-lo na medida em que promete afastar algum mal maior.\""], "src": "BENTHAM, J. Uma introdução aos princípios da moral e da legislação, 1789. Obra em domínio público; tradução livre feita para esta apostila.", "cmd": "A concepção de pena apresentada no trecho fundamenta-se na", "alts": ["vingança da vítima contra o agressor.", "obrigação incondicional de punir, independentemente dos efeitos.", "vontade divina expressa nas leis.", "avaliação das consequências da punição para o bem-estar geral.", "virtude pessoal do juiz que aplica a pena."], "ans": "D", "ex": {"D": "a pena é um mal que só se justifica se afastar um mal maior: avaliação pelas consequências (utilidade).", "A": "Bentham não fala em vingança.", "B": "é o autor errado de novo: obrigação incondicional é Kant.", "C": "o fundamento é o princípio da utilidade, não a religião.", "E": "o critério é social (bem-estar geral), não a virtude do juiz."}, "hab": "H12, H23", "dif": "média", "traps": {"B": "autor"}, "kind": "reforco"}, {"id": "FS-41", "vol": "FS", "n": 41, "tag": "Inédita, estilo ENEM · reforço da questão 81", "base": ["Ações afirmativas são políticas que tratam de forma diferenciada grupos historicamente prejudicados, com o objetivo de corrigir desigualdades que a simples igualdade perante a lei não foi capaz de eliminar."], "src": "Texto elaborado para esta apostila.", "cmd": "Qual das medidas a seguir é um exemplo do tipo de política descrito no texto?", "alts": ["Reserva de vagas para pessoas negras em concursos públicos.", "Voto obrigatório para todos os cidadãos alfabetizados de 18 a 70 anos.", "Atendimento gratuito e universal no sistema público de saúde.", "Redução de impostos sobre produtos para todos os consumidores.", "Proibição de qualquer critério diferenciado no acesso a universidades públicas."], "ans": "A", "ex": {"A": "reservar vagas para pessoas negras é tratar diferentemente um grupo historicamente prejudicado: ação afirmativa.", "B": "obrigação que vale para todos: medida universal.", "C": "o SUS é universal, não focalizado.", "D": "redução de impostos para todos não diferencia grupos.", "E": "proibir critérios diferenciados é o oposto da ação afirmativa."}, "hab": "H22, H25", "dif": "fácil", "traps": {"E": "oposto"}, "kind": "reforco"}, {"id": "FS-42", "vol": "FS", "n": 42, "tag": "Inédita, estilo ENEM", "base": ["Para um filósofo de Eleia, o ser é, e o não ser não é. O que é não pode ter nascido do nada nem se transformar em nada; é uno, contínuo e imóvel. Os sentidos nos mostram coisas que nascem, mudam e morrem, mas, para ele, isso é apenas opinião dos mortais; somente o pensamento alcança a verdade."], "src": "Texto elaborado para esta apostila, com base em Parmênides.", "cmd": "A concepção apresentada no texto defende a", "alts": ["mudança permanente de todas as coisas.", "origem de tudo na água.", "composição da realidade por átomos e vazio.", "confiabilidade dos sentidos para conhecer a verdade.", "permanência e a unidade do ser, sendo a mudança uma aparência percebida pelos sentidos."], "ans": "E", "ex": {"E": "o ser uno e imóvel, com a mudança como opinião dos sentidos: Parmênides.", "A": "mudança permanente é Heráclito (autor errado).", "B": "água como princípio é Tales.", "C": "átomos e vazio são de Demócrito.", "D": "para Parmênides, os sentidos enganam."}, "hab": "H1", "dif": "fácil", "traps": {"A": "autor"}, "kind": "simulado"}, {"id": "FS-43", "vol": "FS", "n": 43, "tag": "Inédita, estilo ENEM", "base": ["\"Surge daí uma questão: se é melhor ser amado do que temido, ou o contrário. Responde-se que seria desejável ser ambas as coisas; mas, como é difícil reuni-las, é muito mais seguro ser temido do que amado, quando se tem de abrir mão de uma das duas.\""], "src": "MAQUIAVEL, N. O Príncipe, cap. XVII. Obra em domínio público; tradução livre feita para esta apostila.", "cmd": "O trecho expressa a concepção de que", "alts": ["o governante deve seguir sempre os preceitos da moral cristã.", "o poder político tem origem na vontade divina.", "a política tem lógica própria, orientada pela conquista e pela conservação do poder.", "o governo deve se basear na vontade geral do povo.", "o medo é incompatível com a estabilidade do Estado."], "ans": "C", "ex": {"C": "escolher ser temido por ser mais seguro mostra a política guiada pela conservação do poder, não pela moral tradicional.", "A": "Maquiavel separa a política da moral cristã.", "B": "o trecho não trata de origem divina.", "D": "vontade geral é Rousseau.", "E": "o trecho afirma que o temor é mais seguro (desde que não vire ódio)."}, "hab": "H11, H23", "dif": "fácil", "traps": {}, "kind": "simulado"}, {"id": "FS-44", "vol": "FS", "n": 44, "tag": "Inédita, estilo ENEM", "base": ["Em uma metrópole contemporânea, o padeiro depende do agricultor que planta o trigo, do caminhoneiro que transporta a farinha, do técnico que conserta o forno e do bancário que administra suas contas. Nenhum deles é capaz de produzir sozinho tudo o que consome, e todos são diferentes entre si nas funções que desempenham."], "src": "Texto elaborado para esta apostila.", "cmd": "Segundo Émile Durkheim, a forma de coesão social descrita no texto é a", "alts": ["solidariedade orgânica, baseada na interdependência gerada pela divisão do trabalho.", "solidariedade mecânica, baseada na semelhança entre os indivíduos.", "anomia, caracterizada pela ausência de normas.", "dominação carismática, baseada nas qualidades de um líder.", "luta de classes, motor da história."], "ans": "A", "ex": {"A": "pessoas diferentes que dependem umas das outras pela divisão do trabalho: solidariedade orgânica.", "B": "a mecânica une pela <strong>semelhança<\/strong>; o texto destaca as diferenças.", "C": "há normas e cooperação.", "D": "não há líder.", "E": "o texto fala de cooperação, não de conflito de classes."}, "hab": "H11, H16", "dif": "fácil", "traps": {}, "kind": "simulado"}, {"id": "FS-45", "vol": "FS", "n": 45, "tag": "Inédita, estilo ENEM", "base": ["\"Esclarecimento é a saída do homem de sua menoridade, da qual ele próprio é culpado. Menoridade é a incapacidade de fazer uso de seu entendimento sem a direção de outro indivíduo.\""], "src": "KANT, I. Resposta à pergunta: o que é o Esclarecimento?, 1784. Obra em domínio público; tradução livre feita para esta apostila.", "cmd": "Para o autor, o Esclarecimento depende da", "alts": ["obediência às autoridades religiosas e políticas.", "volta às tradições dos antepassados.", "aceitação das opiniões da maioria.", "autonomia do pensamento, isto é, da coragem de usar a própria razão.", "renúncia ao conhecimento científico."], "ans": "D", "ex": {"D": "sair da menoridade é usar o próprio entendimento sem a direção de outro: autonomia (<em>sapere aude<\/em>).", "A": "obedecer às autoridades é permanecer na menoridade.", "B": "a tradição não é o critério.", "C": "seguir a maioria também é deixar-se dirigir.", "E": "o Esclarecimento valoriza o conhecimento."}, "hab": "H1, H23", "dif": "fácil", "traps": {}, "kind": "simulado"}, {"id": "FS-46", "vol": "FS", "n": 46, "tag": "Inédita, estilo ENEM", "base": ["Em um órgão público, os servidores ingressam por concurso, seguem um regulamento escrito, ocupam cargos com atribuições definidas e obedecem aos superiores não por quem eles são, mas pelo cargo que ocupam, de acordo com as normas. Quando o chefe é substituído, a autoridade passa ao novo ocupante do cargo."], "src": "Texto elaborado para esta apostila.", "cmd": "Segundo Max Weber, a situação descrita corresponde à dominação", "alts": ["tradicional, baseada no costume e na hereditariedade.", "racional-legal, baseada em regras impessoais e na burocracia.", "carismática, baseada nas qualidades extraordinárias de um líder.", "patriarcal, baseada na autoridade do chefe de família.", "religiosa, baseada na vontade divina."], "ans": "B", "ex": {"B": "concurso, regulamento escrito, obediência ao cargo e não à pessoa: dominação racional-legal (burocracia).", "A": "não há costume nem hereditariedade.", "C": "a autoridade passa ao novo ocupante do cargo; não depende de qualidades pessoais.", "D": "não há chefe de família.", "E": "não há fundamento religioso."}, "hab": "H11, H14", "dif": "fácil", "traps": {}, "kind": "simulado"}, {"id": "FS-47", "vol": "FS", "n": 47, "tag": "Inédita, estilo ENEM", "base": ["\"Sempre que os legisladores tentam tirar e destruir a propriedade do povo, ou reduzi-lo à escravidão sob um poder arbitrário, colocam-se em estado de guerra com o povo, que fica, a partir de então, desobrigado de qualquer obediência.\""], "src": "LOCKE, J. Segundo tratado sobre o governo civil, 1689, § 222. Obra em domínio público; tradução livre feita para esta apostila.", "cmd": "O trecho fundamenta a ideia de", "alts": ["poder absoluto e ilimitado do soberano.", "obediência incondicional dos súditos ao governante.", "direito de resistência do povo contra o governo que viola os direitos naturais.", "origem divina do poder dos reis.", "abolição da propriedade privada."], "ans": "C", "ex": {"C": "governo que destrói a propriedade e escraviza o povo entra em guerra com ele, e o povo fica livre para resistir: direito de resistência (Locke).", "A": "é Hobbes (autor errado).", "B": "o trecho desobriga o povo da obediência.", "D": "Locke fundamenta o poder no consentimento.", "E": "Locke <strong>defende<\/strong> a propriedade como direito natural."}, "hab": "H11, H14", "dif": "fácil", "traps": {"A": "autor"}, "kind": "simulado"}, {"id": "FS-48", "vol": "FS", "n": 48, "tag": "Inédita, estilo ENEM", "base": ["Uma pesquisa em lojas de brinquedos mostrou que os produtos voltados para meninas eram, em sua maioria, bonecas, panelinhas e kits de maquiagem, enquanto os destinados aos meninos eram carrinhos, ferramentas e jogos de construção e de aventura. Pesquisadores observaram que essas escolhas começam a moldar preferências e expectativas antes mesmo de as crianças aprenderem a ler."], "src": "Texto elaborado para esta apostila.", "cmd": "A situação descrita pode ser analisada à luz da ideia, desenvolvida por Simone de Beauvoir, de que", "alts": ["as diferenças entre homens e mulheres são determinadas apenas pela biologia.", "o mercado de brinquedos não influencia a socialização.", "a família é a única instituição responsável pela formação das crianças.", "os papéis de gênero são escolhas livres feitas pelas crianças.", "o \"ser mulher\" é uma construção social, e não um destino natural."], "ans": "E", "ex": {"E": "brinquedos diferentes moldam expectativas desde cedo: o \"ser mulher\" é construído socialmente (Beauvoir).", "A": "o texto mostra a influência social, não biológica.", "B": "o texto mostra justamente a influência dos brinquedos.", "C": "o mercado também participa da socialização.", "D": "as escolhas são <strong>moldadas<\/strong> antes de as crianças lerem."}, "hab": "H1, H24", "dif": "fácil", "traps": {}, "kind": "simulado"}, {"id": "FS-49", "vol": "FS", "n": 49, "tag": "Inédita, estilo ENEM", "base": ["\"Deus está morto! Deus continua morto! E fomos nós que o matamos! Como haveremos de nos consolar, nós, os assassinos entre os assassinos?\""], "src": "NIETZSCHE, F. A gaia ciência, 1882, § 125. Obra em domínio público; tradução livre feita para esta apostila.", "cmd": "No pensamento de Nietzsche, a afirmação expressa a", "alts": ["crise dos valores tradicionais da cultura ocidental, que perderam seu fundamento.", "comprovação científica da inexistência de Deus.", "defesa da volta à religiosidade medieval.", "celebração do triunfo da moral cristã.", "proposta de criação de uma nova Igreja."], "ans": "A", "ex": {"A": "a \"morte de Deus\" é a perda do fundamento dos valores ocidentais, com o risco do niilismo.", "B": "não é uma demonstração científica; é um diagnóstico cultural.", "C": "Nietzsche critica a religiosidade tradicional.", "D": "Nietzsche critica a moral cristã.", "E": "não há proposta de nova Igreja."}, "hab": "H3, H23", "dif": "média", "traps": {}, "kind": "simulado"}, {"id": "FS-50", "vol": "FS", "n": 50, "tag": "Inédita, estilo ENEM", "base": ["A partir das décadas de 1960 e 1970, ganharam força no Brasil e no mundo movimentos que não se organizavam principalmente em torno da classe social ou do salário, mas de causas como a igualdade entre homens e mulheres, o combate ao racismo, a preservação ambiental e o reconhecimento da diversidade sexual."], "src": "Texto elaborado para esta apostila.", "cmd": "Os movimentos descritos são classificados como", "alts": ["corporações de ofício.", "novos movimentos sociais, organizados em torno de identidades e direitos.", "movimentos operários tradicionais.", "partidos políticos de massa.", "sindicatos patronais."], "ans": "B", "ex": {"B": "movimentos organizados em torno de gênero, raça, meio ambiente e diversidade sexual são os novos movimentos sociais.", "A": "corporações de ofício são medievais.", "C": "o texto diz que não se organizavam em torno da classe e do salário.", "D": "não são partidos.", "E": "sindicatos patronais representam empresas."}, "hab": "H10, H22", "dif": "fácil", "traps": {}, "kind": "simulado"}, {"id": "FS-51", "vol": "FS", "n": 51, "tag": "Inédita, estilo ENEM", "base": ["Para um filósofo alemão contemporâneo, as normas de uma sociedade democrática só são legítimas quando resultam de um processo de discussão em que todos os afetados podem participar em igualdade de condições, sem coerção, e em que a única força admitida é a do melhor argumento."], "src": "Texto elaborado para esta apostila, com base em Jürgen Habermas.", "cmd": "O texto apresenta a concepção de", "alts": ["razão instrumental, voltada ao cálculo de meios para dominar a natureza.", "poder disciplinar, exercido pela vigilância permanente.", "soberania absoluta, concentrada em um único governante.", "razão comunicativa, que busca o consenso pelo diálogo livre de coerção.", "indústria cultural, que padroniza o gosto do público."], "ans": "D", "ex": {"D": "legitimidade pelo diálogo entre todos, sem coerção, com a força do melhor argumento: razão comunicativa (Habermas).", "A": "razão instrumental é o que Habermas critica.", "B": "poder disciplinar é Foucault.", "C": "soberania absoluta é Hobbes.", "E": "indústria cultural é Adorno e Horkheimer."}, "hab": "H14, H24", "dif": "média", "traps": {}, "kind": "simulado"}, {"id": "H1.4", "vol": "HG", "n": "H1.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Um projeto de pesquisa gravou entrevistas com trabalhadores nordestinos que migraram para São Paulo nos anos 1960 e 1970. Eles contaram como chegaram em caminhões pau de arara, onde moraram nos primeiros anos e como trabalharam na construção civil. Nenhum desses relatos aparece nos jornais da época."], "src": "Texto elaborado para esta apostila.", "cmd": "O uso desse tipo de fonte permite ao historiador", "alts": ["comprovar que os jornais da época eram documentos falsos.", "dispensar a análise crítica, pois os depoimentos são sempre verdadeiros.", "registrar experiências de grupos pouco presentes na documentação escrita oficial.", "substituir todas as outras fontes sobre o período.", "reconstituir o passado exatamente como ele aconteceu."], "ans": "C", "ex": {"A": "Os jornais não são falsos por omitirem algo; apenas registram outros pontos de vista.", "B": "Depoimentos também passam por crítica: a memória seleciona, esquece e reinterpreta.", "C": "A história oral dá voz a quem pouco aparece nos documentos oficiais, como trabalhadores migrantes.", "D": "Exagero: a fonte oral se soma às outras, não as substitui.", "E": "Exagero: nenhuma fonte reconstitui o passado 'exatamente'; toda fonte é uma versão."}, "hab": "H1, H2", "dif": "fácil", "mod": "H1", "kind": "extra", "traps": {"D": "exagero", "E": "exagero"}}, {"id": "H1.5", "vol": "HG", "n": "H1.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Após anos de mobilização de lideranças religiosas e de pesquisadores, um terreiro de candomblé de Salvador foi tombado como patrimônio cultural brasileiro. Foi a primeira vez que um templo de religião de matriz africana recebeu esse tipo de proteção do órgão federal de patrimônio."], "src": "Texto elaborado para esta apostila.", "cmd": "O tombamento descrito representou uma mudança na política de patrimônio ao", "alts": ["restringir a proteção a construções de estilo colonial português.", "reconhecer a contribuição de grupos afro-brasileiros na formação da memória nacional.", "proibir a prática religiosa no espaço tombado.", "transformar o terreiro em propriedade privada do Estado.", "valorizar apenas os monumentos ligados às elites do período imperial."], "ans": "B", "ex": {"A": "Termo oposto: a medida amplia a noção de patrimônio para além da arquitetura colonial.", "B": "Reconhecer um terreiro como patrimônio é admitir que a memória nacional inclui as culturas afro-brasileiras, antes excluídas.", "C": "O tombamento protege o bem; a comunidade continua praticando a religião.", "D": "Tombamento não transfere a propriedade ao Estado; restringe alterações para preservar o bem.", "E": "Termo oposto: a política tradicional privilegiava as elites; a medida vai na direção contrária."}, "hab": "H2, H5", "dif": "fácil", "mod": "H1", "kind": "extra", "traps": {"A": "oposto", "E": "oposto"}}, {"id": "H2.4", "vol": "HG", "n": "H2.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["No início da República romana, só os patrícios ocupavam as magistraturas e conheciam as leis, transmitidas oralmente pelos sacerdotes. Depois de várias retiradas da plebe para fora da cidade, que paralisavam o exército e a economia, foram criados os tribunos da plebe e as leis passaram a ser escritas e expostas em praça pública."], "src": "Texto elaborado para esta apostila.", "cmd": "As conquistas plebeias descritas no texto resultaram de", "alts": ["concessões espontâneas da aristocracia, sem conflito.", "decisões do imperador para enfraquecer o Senado.", "invasões estrangeiras que destruíram o poder patrício.", "pressão política de um grupo social que reivindicava direitos diante da desigualdade.", "difusão do cristianismo entre os plebeus."], "ans": "D", "ex": {"A": "Termo oposto: o texto descreve retiradas da plebe, isto é, conflito e pressão.", "B": "Anacronismo: no início da República não havia imperador (o Império começa em 27 a.C.).", "C": "O texto não menciona invasões.", "D": "As retiradas da plebe eram uma forma de pressão que forçou a criação dos tribunos e da lei escrita (Lei das Doze Tábuas).", "E": "Anacronismo: o cristianismo surge séculos depois."}, "hab": "H11, H13", "dif": "fácil", "mod": "H2", "kind": "extra", "traps": {"A": "oposto", "B": "anacronismo", "E": "anacronismo"}}, {"id": "H2.5", "vol": "HG", "n": "H2.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Com as conquistas dos séculos II e I a.C., grandes proprietários romanos formaram enormes propriedades cultivadas por prisioneiros de guerra escravizados. Pequenos camponeses, que passavam anos no exército, voltavam e encontravam suas terras endividadas ou vendidas, e muitos migraram para Roma. Os irmãos Graco, tribunos da plebe, propuseram limitar o tamanho das terras públicas ocupadas e redistribuí-las, e ambos foram assassinados."], "src": "Texto elaborado para esta apostila.", "cmd": "O texto relaciona a crise da República romana à", "alts": ["concentração de terras e ao uso de mão de obra escravizada, que empobreceram os pequenos camponeses.", "falta de escravizados nas grandes propriedades.", "distribuição igualitária das terras conquistadas.", "vitória política dos irmãos Graco sobre os grandes proprietários.", "decadência do exército por falta de soldados estrangeiros."], "ans": "A", "ex": {"A": "Latifúndios com mão de obra escravizada arruinaram os pequenos camponeses e geraram tensão social, que se expressou nas propostas e na morte dos Graco.", "B": "Termo oposto: o texto diz que havia muitos escravizados, vindos das conquistas.", "C": "Termo oposto: as terras se concentraram.", "D": "Termo oposto: os dois foram assassinados; a reforma foi derrotada.", "E": "O texto não fala em falta de soldados estrangeiros."}, "hab": "H15, H18", "dif": "média", "mod": "H2", "kind": "extra", "traps": {"B": "oposto", "C": "oposto", "D": "oposto"}}, {"id": "H3.4", "vol": "HG", "n": "H3.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Entre os séculos IX e XII, em cidades como Bagdá, Córdoba e Toledo, estudiosos traduziram para o árabe obras de Aristóteles, Euclides e Galeno, comentaram-nas e desenvolveram a álgebra, a astronomia e a medicina. Mais tarde, muitas dessas obras foram traduzidas do árabe para o latim e chegaram às universidades da Europa cristã."], "src": "Texto elaborado para esta apostila.", "cmd": "O texto evidencia que o mundo islâmico medieval", "alts": ["isolou-se do conhecimento produzido por outras culturas.", "destruiu os textos da Antiguidade grega.", "rejeitou a ciência por motivos religiosos.", "teve papel importante na preservação e na difusão do saber antigo para a Europa.", "impediu o surgimento das universidades europeias."], "ans": "D", "ex": {"A": "Termo oposto: o texto mostra intenso contato com o saber grego.", "B": "Termo oposto: as obras foram traduzidas e preservadas.", "C": "O texto mostra o desenvolvimento da álgebra, astronomia e medicina.", "D": "Traduções e comentários árabes preservaram e ampliaram o saber grego, que voltou à Europa pelo latim.", "E": "Termo oposto: as obras chegaram às universidades europeias."}, "hab": "H1, H3", "dif": "fácil", "mod": "H3", "kind": "extra", "traps": {"A": "oposto", "B": "oposto", "E": "oposto"}}, {"id": "H3.5", "vol": "HG", "n": "H3.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["A partir do século XI, em várias regiões da Europa, cresceram as feiras regionais e os burgos, núcleos urbanos onde viviam comerciantes e artesãos. Os artesãos de um mesmo ofício organizaram-se em corporações, que fixavam preços, controlavam a qualidade dos produtos e regulavam a formação de aprendizes."], "src": "Texto elaborado para esta apostila.", "cmd": "As transformações descritas estão associadas ao(à)", "alts": ["crise do século XIV, que esvaziou as cidades.", "fortalecimento do feudalismo na Alta Idade Média.", "Revolução Industrial do século XVIII.", "renascimento comercial e urbano da Baixa Idade Média.", "expansão marítima portuguesa no século XVI."], "ans": "D", "ex": {"A": "A crise do século XIV (fome, peste, guerras) é posterior e de sentido oposto.", "B": "Termo oposto: o crescimento do comércio e das cidades enfraqueceu a economia feudal fechada.", "C": "Anacronismo: a Revolução Industrial é sete séculos posterior.", "D": "Feiras, burgos e corporações de ofício marcam o renascimento comercial e urbano a partir do século XI.", "E": "A expansão marítima é posterior (séculos XV e XVI)."}, "hab": "H11, H17", "dif": "fácil", "mod": "H3", "kind": "extra", "traps": {"A": "oposto", "B": "oposto", "C": "anacronismo"}}, {"id": "H4.4", "vol": "HG", "n": "H4.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Num discurso de 1486, um humanista italiano imaginou Deus dizendo ao ser humano que não lhe dera um lugar fixo no mundo: ele mesmo poderia escolher a forma que desejasse, degenerando até as coisas inferiores ou elevando-se até as superiores, conforme sua vontade."], "src": "Texto elaborado para esta apostila, com base em Pico della Mirandola, Discurso sobre a dignidade do homem, 1486.", "cmd": "A ideia expressa no texto é característica do", "alts": ["teocentrismo medieval, que submetia o destino humano à hierarquia fixa das ordens.", "iluminismo do século XVIII, que defendia a separação dos poderes.", "mercantilismo, que defendia o acúmulo de metais preciosos.", "absolutismo, que concentrava o poder no rei.", "humanismo renascentista, que valorizava a liberdade e a capacidade criadora do ser humano."], "ans": "E", "ex": {"A": "Termo oposto: o texto rompe com a ideia de lugar fixo de cada um.", "B": "Anacronismo: o discurso é de 1486, três séculos antes do Iluminismo.", "C": "O texto não trata de economia.", "D": "O texto não trata de política.", "E": "A liberdade de o ser humano escolher o que ser é a marca do antropocentrismo humanista do Renascimento."}, "hab": "H1, H3", "dif": "média", "mod": "H4", "kind": "extra", "traps": {"A": "oposto", "B": "anacronismo"}}, {"id": "H4.5", "vol": "HG", "n": "H4.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Entre 1545 e 1563, um concílio reafirmou os sete sacramentos e a autoridade do papa, criou seminários para formar padres e manteve o latim na missa. Nas mesmas décadas, ampliou-se a ação dos tribunais da Inquisição, foi publicado um índice de livros proibidos e a Companhia de Jesus enviou missionários à Ásia e à América."], "src": "Texto elaborado para esta apostila.", "cmd": "As medidas descritas fazem parte da", "alts": ["Reforma Protestante, liderada por Lutero.", "Revolução Gloriosa inglesa.", "Reforma Católica (Contrarreforma), reação da Igreja à expansão protestante.", "separação entre Igreja e Estado nos países católicos.", "difusão das ideias iluministas na Europa."], "ans": "C", "ex": {"A": "Autor errado: Lutero rompeu com Roma; as medidas reafirmam a autoridade do papa.", "B": "A Revolução Gloriosa (1688) foi política, na Inglaterra.", "C": "O Concílio de Trento, a Inquisição, o índice de livros proibidos e os jesuítas formam a Reforma Católica.", "D": "Anacronismo: a separação entre Igreja e Estado é muito posterior.", "E": "Anacronismo: o Iluminismo é do século XVIII e crítico da Igreja."}, "hab": "H11, H15", "dif": "fácil", "mod": "H4", "kind": "extra", "traps": {"A": "autor", "D": "anacronismo", "E": "anacronismo"}}, {"id": "H5.4", "vol": "HG", "n": "H5.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["\"Os homens nascem e permanecem livres e iguais em direitos. As distinções sociais só podem fundamentar-se na utilidade comum.\""], "src": "Declaração dos Direitos do Homem e do Cidadão, 1789, art. 1º. Documento em domínio público; tradução livre feita para esta apostila.", "cmd": "No contexto da França de 1789, o artigo rompia com a", "alts": ["sociedade de ordens, baseada em privilégios de nascimento do clero e da nobreza.", "propriedade privada, abolida pela Revolução.", "participação política da burguesia.", "economia capitalista, substituída pelo socialismo.", "igualdade entre homens e mulheres, recusada pelo documento."], "ans": "A", "ex": {"A": "Ao dizer que todos nascem iguais em direitos e que distinções só se justificam pela utilidade comum, o artigo nega os privilégios de nascimento do Antigo Regime.", "B": "Termo oposto: a mesma Declaração define a propriedade como direito inviolável.", "C": "Termo oposto: a Revolução ampliou o poder político da burguesia.", "D": "Anacronismo: o socialismo como projeto surge no século XIX.", "E": "O artigo não rompia com uma igualdade que não existia; a exclusão das mulheres é tema da questão de Olympe de Gouges."}, "hab": "H11, H24", "dif": "fácil", "mod": "H5", "kind": "extra", "traps": {"B": "oposto", "C": "oposto", "D": "anacronismo"}}, {"id": "H5.5", "vol": "HG", "n": "H5.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Na Conferência de Berlim (1884–1885), representantes de potências europeias estabeleceram regras para a ocupação do continente africano. Nenhum governante africano foi convidado. Nas décadas seguintes, fronteiras traçadas em linha reta dividiram povos que viviam juntos e reuniram em um mesmo território grupos rivais."], "src": "Texto elaborado para esta apostila.", "cmd": "Uma consequência de longo prazo desse processo foi a", "alts": ["formação de Estados africanos etnicamente homogêneos.", "ausência de conflitos de fronteira após as independências.", "preservação das formas de organização política africanas.", "existência de fronteiras artificiais, associadas a conflitos internos e entre países após as independências.", "participação dos povos africanos nas decisões das potências europeias."], "ans": "D", "ex": {"A": "Termo oposto: as fronteiras reuniram grupos diferentes e rivais.", "B": "Termo oposto: houve muitos conflitos ligados às fronteiras coloniais.", "C": "As formas de organização africanas foram desmontadas ou submetidas pelo colonialismo.", "D": "Fronteiras traçadas sem considerar os povos geraram tensões que persistiram depois das independências.", "E": "Termo oposto: nenhum governante africano foi convidado."}, "hab": "H7, H15", "dif": "fácil", "mod": "H5", "kind": "extra", "traps": {"A": "oposto", "B": "oposto", "E": "oposto"}}, {"id": "H6.4", "vol": "HG", "n": "H6.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Depois da quebra da Bolsa de Nova York, em 1929, o desemprego nos Estados Unidos chegou a cerca de um quarto da força de trabalho. A partir de 1933, o governo lançou programas de obras públicas, criou um sistema de seguridade social, regulou os bancos e garantiu o direito de organização sindical."], "src": "Texto elaborado para esta apostila.", "cmd": "As medidas adotadas a partir de 1933 representaram", "alts": ["a aplicação rigorosa do liberalismo econômico, com Estado mínimo.", "a adoção do socialismo soviético nos Estados Unidos.", "a intervenção do Estado na economia para combater a crise e o desemprego.", "o fim da democracia liberal norte-americana.", "a redução dos gastos públicos para equilibrar o orçamento."], "ans": "C", "ex": {"A": "Termo oposto: o New Deal ampliou o papel do Estado.", "B": "Exagero: os EUA continuaram capitalistas; o Estado regulou, não estatizou tudo.", "C": "Obras públicas, seguridade e regulação são o New Deal, inspirado na ideia de que o Estado deve agir na crise.", "D": "As instituições democráticas foram mantidas.", "E": "Termo oposto: os gastos públicos aumentaram."}, "hab": "H15, H17", "dif": "fácil", "mod": "H6", "kind": "extra", "traps": {"A": "oposto", "B": "exagero", "E": "oposto"}}, {"id": "H6.5", "vol": "HG", "n": "H6.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Pelo tratado assinado em 1919, a Alemanha foi responsabilizada pela guerra, perdeu territórios e colônias, teve o exército limitado a 100 mil homens e foi obrigada a pagar indenizações elevadas. Nos anos seguintes, partidos nacionalistas exploraram o sentimento de humilhação para conquistar apoio."], "src": "Texto elaborado para esta apostila.", "cmd": "O texto aponta o Tratado de Versalhes como um dos fatores que contribuíram para a", "alts": ["consolidação da paz duradoura na Europa.", "ascensão de movimentos nacionalistas extremistas na Alemanha.", "criação imediata da União Europeia.", "vitória alemã na Primeira Guerra Mundial.", "independência das colônias africanas em 1919."], "ans": "B", "ex": {"A": "Termo oposto: o tratado gerou ressentimento, e a paz durou só duas décadas.", "B": "A humilhação e a crise econômica foram exploradas pelos nacionalistas, entre eles o nazismo.", "C": "Anacronismo: a UE só surge em 1992.", "D": "Termo oposto: a Alemanha foi derrotada.", "E": "As colônias alemãs foram repartidas entre os vencedores, não ficaram independentes."}, "hab": "H7, H15", "dif": "fácil", "mod": "H6", "kind": "extra", "traps": {"A": "oposto", "C": "anacronismo", "D": "oposto"}}, {"id": "H7.4", "vol": "HG", "n": "H7.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["No século XVI, a Coroa portuguesa proibiu a escravização de indígenas, mas abriu exceções: era permitido escravizar os capturados em \"guerra justa\", declarada contra povos considerados hostis ou que recusassem a fé cristã. Colonos frequentemente forjavam motivos para declarar essas guerras."], "src": "Texto elaborado para esta apostila.", "cmd": "A situação descrita revela que, na América portuguesa,", "alts": ["os indígenas estavam plenamente protegidos pelas leis da Coroa.", "a escravidão africana foi proibida pela mesma lei.", "a escravização indígena era desconhecida antes da chegada dos africanos.", "os jesuítas defendiam a guerra justa contra todos os povos indígenas.", "a legislação continha brechas que permitiram a continuidade da escravização indígena."], "ans": "E", "ex": {"A": "Exagero: a própria lei previa exceções.", "B": "A escravidão africana continuou até 1888.", "C": "Termo oposto: o texto mostra escravização indígena na colônia.", "D": "Os jesuítas, em geral, defendiam o aldeamento, não a escravização generalizada.", "E": "A guerra justa era uma brecha usada pelos colonos para continuar escravizando indígenas."}, "hab": "H11, H15", "dif": "média", "mod": "H7", "kind": "extra", "traps": {"A": "exagero", "C": "oposto", "D": "exagero"}}, {"id": "H7.5", "vol": "HG", "n": "H7.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["No século XVIII, a descoberta de ouro em Minas Gerais atraiu milhares de pessoas, estimulou a criação de gado no Sul e o comércio de mulas, e fez crescer o porto do Rio de Janeiro, por onde o ouro era escoado. Em 1763, a capital da colônia foi transferida de Salvador para o Rio."], "src": "Texto elaborado para esta apostila.", "cmd": "O texto indica que a mineração provocou", "alts": ["o deslocamento do eixo econômico e político da colônia para o Centro-Sul.", "a decadência imediata do comércio interno.", "o fim da escravidão nas regiões mineradoras.", "o isolamento das capitanias do Sul.", "a transferência da capital para o Nordeste."], "ans": "A", "ex": {"A": "O ouro articulou Minas, o Sul e o Rio e levou a capital para o Rio de Janeiro: o eixo se deslocou para o Centro-Sul.", "B": "Termo oposto: o texto mostra o crescimento do comércio de gado e mulas.", "C": "A mineração usou intensamente mão de obra escravizada.", "D": "Termo oposto: o Sul passou a abastecer as minas.", "E": "Termo oposto: a capital saiu do Nordeste (Salvador) para o Rio."}, "hab": "H17, H18", "dif": "fácil", "mod": "H7", "kind": "extra", "traps": {"B": "oposto", "D": "oposto", "E": "oposto"}}, {"id": "H8.4", "vol": "HG", "n": "H8.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Em 1850, a Lei Eusébio de Queirós proibiu o tráfico de africanos escravizados para o Brasil. Cinco anos antes, o Parlamento britânico havia aprovado uma lei que autorizava a Marinha britânica a apreender navios negreiros, inclusive em águas brasileiras."], "src": "Texto elaborado para esta apostila.", "cmd": "A aprovação da lei brasileira de 1850 está relacionada à", "alts": ["pressão britânica contra o tráfico, num contexto de expansão do capitalismo industrial.", "abolição imediata da escravidão no Brasil.", "falta de interesse dos fazendeiros de café por mão de obra.", "independência do Brasil em relação a Portugal.", "revolta dos senhores de engenho contra o Império."], "ans": "A", "ex": {"A": "A Inglaterra pressionava pelo fim do tráfico (Bill Aberdeen, 1845), e a lei de 1850 respondeu a essa pressão.", "B": "Exagero: a escravidão só foi abolida em 1888; a lei acabou com o tráfico.", "C": "O café em expansão demandava muita mão de obra; daí o tráfico interno depois de 1850.", "D": "A independência foi em 1822.", "E": "O texto não fala em revolta de senhores de engenho."}, "hab": "H7, H15", "dif": "média", "mod": "H8", "kind": "extra", "traps": {"B": "exagero"}}, {"id": "H8.5", "vol": "HG", "n": "H8.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Entre 1835 e 1840, no Grão-Pará, indígenas, negros, mestiços pobres e alguns proprietários rebelaram-se contra o governo provincial nomeado pela Regência. Os rebeldes chegaram a tomar Belém. A repressão foi violenta: estima-se que uma parcela muito grande da população da província tenha morrido."], "src": "Texto elaborado para esta apostila.", "cmd": "A revolta descrita, a Cabanagem, evidencia que o Período Regencial foi marcado por", "alts": ["estabilidade política e ausência de conflitos.", "conflitos provinciais com forte participação popular e repressão violenta do governo central.", "apoio unânime da população às decisões da Regência.", "defesa da volta de Portugal ao controle do Brasil.", "fim do poder das elites locais nas províncias."], "ans": "B", "ex": {"A": "Termo oposto: o período foi um dos mais instáveis do Império.", "B": "A Cabanagem é exemplo das revoltas regenciais, com participação popular e repressão sangrenta.", "C": "Termo oposto: o texto descreve rebelião.", "D": "A revolta era contra o governo provincial, não pela volta de Portugal.", "E": "Exagero: as elites mantiveram o poder após a repressão."}, "hab": "H13, H15", "dif": "fácil", "mod": "H8", "kind": "extra", "traps": {"A": "oposto", "C": "oposto", "E": "exagero"}}, {"id": "H9.4", "vol": "HG", "n": "H9.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["\"Lutei contra a espoliação do Brasil. Lutei contra a espoliação do povo. [...] Nada receio. Serenamente dou o primeiro passo no caminho da eternidade e saio da vida para entrar na História.\""], "src": "VARGAS, G. Carta-testamento, 1954. Texto em domínio público.", "cmd": "Ao deixar a carta, Getúlio Vargas buscou", "alts": ["reconhecer a vitória política de seus adversários.", "convocar eleições diretas para presidente.", "pedir a volta da monarquia.", "renunciar às políticas nacionalistas de seu governo.", "transformar a própria morte em ato político, apresentando-se como defensor do povo e da nação."], "ans": "E", "ex": {"A": "Termo oposto: a carta acusa adversários e transforma a derrota em denúncia.", "B": "A carta não trata de eleições.", "C": "Não há menção à monarquia.", "D": "Termo oposto: a carta reafirma o nacionalismo.", "E": "A carta identifica Vargas com o povo e com a nação contra a 'espoliação', convertendo o suicídio em gesto político; a comoção adiou o golpe que se preparava."}, "hab": "H11, H13", "dif": "média", "mod": "H9", "kind": "extra", "traps": {"A": "oposto", "D": "oposto"}}, {"id": "H9.5", "vol": "HG", "n": "H9.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["No sertão da Bahia, entre 1893 e 1897, milhares de sertanejos pobres reuniram-se em torno de um líder religioso no arraial de Belo Monte. A comunidade produzia coletivamente e recusava algumas medidas da República. Depois de derrotar três expedições militares, o arraial foi destruído pela quarta, e a maioria dos moradores foi morta."], "src": "Texto elaborado para esta apostila.", "cmd": "O conflito de Canudos expressa", "alts": ["a adesão dos sertanejos às oligarquias republicanas.", "uma guerra entre Brasil e Paraguai pelo controle do sertão.", "a resistência de populações pobres do sertão, num contexto de miséria, concentração de terras e religiosidade popular, reprimida violentamente pela República.", "a vitória dos sertanejos sobre o Exército.", "a defesa da industrialização no interior do país."], "ans": "C", "ex": {"A": "Termo oposto: a comunidade recusava medidas republicanas.", "B": "A Guerra do Paraguai terminou em 1870.", "C": "Miséria, concentração fundiária e religiosidade popular deram origem a Canudos, destruído pelo Exército em 1897.", "D": "Termo oposto: o arraial foi destruído.", "E": "Não há relação com industrialização."}, "hab": "H13, H15", "dif": "fácil", "mod": "H9", "kind": "extra", "traps": {"A": "oposto", "D": "oposto"}}, {"id": "H10.4", "vol": "HG", "n": "H10.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Em 1984, milhões de pessoas foram às ruas em comícios por eleições diretas para presidente. A emenda constitucional que restabelecia o voto direto não obteve os votos necessários no Congresso, e o primeiro presidente civil depois de 1964 foi escolhido por um Colégio Eleitoral."], "src": "Texto elaborado para esta apostila.", "cmd": "O texto mostra que a transição democrática brasileira", "alts": ["foi conduzida exclusivamente pelos militares, sem mobilização social.", "combinou forte mobilização popular com uma saída negociada e indireta.", "começou com eleições diretas para presidente em 1985.", "foi interrompida por um novo golpe militar em 1985.", "terminou com a volta da monarquia."], "ans": "B", "ex": {"A": "Termo oposto: o texto descreve milhões nas ruas (Diretas Já).", "B": "Houve grande mobilização, mas a emenda Dante de Oliveira foi derrotada, e Tancredo Neves foi eleito indiretamente.", "C": "Termo oposto: a eleição de 1985 foi indireta; a direta veio em 1989.", "D": "Não houve golpe em 1985.", "E": "Não há monarquia em questão."}, "hab": "H13, H24", "dif": "fácil", "mod": "H10", "kind": "extra", "traps": {"A": "oposto", "C": "oposto"}}, {"id": "H10.5", "vol": "HG", "n": "H10.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Criada por lei em 2011 e instalada em 2012, a Comissão Nacional da Verdade ouviu vítimas e agentes do Estado e, em 2014, entregou um relatório com nomes de mortos e desaparecidos políticos e de responsáveis por violações de direitos humanos durante a ditadura. A comissão não tinha poder de punir."], "src": "Texto elaborado para esta apostila.", "cmd": "A criação da comissão está ligada ao(à)", "alts": ["direito à memória e à verdade sobre violações cometidas pelo Estado.", "revogação da Constituição de 1988.", "julgamento e prisão dos agentes da ditadura pela própria comissão.", "defesa do esquecimento como forma de pacificação.", "reabertura do Congresso fechado pelo AI-5."], "ans": "A", "ex": {"A": "A comissão buscou esclarecer os fatos e registrar nomes: o direito à memória e à verdade.", "B": "A comissão atuou dentro da ordem constitucional de 1988.", "C": "O texto diz que ela não tinha poder de punir.", "D": "Termo oposto: a comissão foi criada para lembrar e registrar.", "E": "O Congresso já funcionava desde o fim dos anos 1960; a comissão é de 2012."}, "hab": "H2, H24", "dif": "fácil", "mod": "H10", "kind": "extra", "traps": {"D": "oposto"}}, {"id": "G1.4", "vol": "HG", "n": "G1.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Em um mapa-múndi muito usado em escolas e em sites, a Groenlândia aparece quase do tamanho da África. Na realidade, a área da África é cerca de 14 vezes maior que a da Groenlândia."], "src": "Texto elaborado para esta apostila.", "cmd": "A distorção descrita ocorre porque a projeção utilizada", "alts": ["preserva as áreas e deforma as formas dos continentes.", "representa o tamanho dos países pela população.", "é uma carta topográfica de escala grande.", "não utiliza coordenadas geográficas.", "preserva as formas e os ângulos, mas amplia as áreas nas altas latitudes."], "ans": "E", "ex": {"A": "Confusão de projeções: preservar áreas é a projeção de Peters; a de Mercator distorce justamente as áreas.", "B": "Representar pela população é uma anamorfose.", "C": "Carta topográfica em escala grande mostra áreas pequenas, não o mundo.", "D": "A projeção de Mercator usa coordenadas; a distorção vem da forma de projetar.", "E": "A projeção de Mercator é conforme: mantém formas e ângulos, úteis à navegação, e exagera as áreas perto dos polos."}, "hab": "H6", "dif": "fácil", "mod": "G1", "kind": "extra", "traps": {}}, {"id": "G1.5", "vol": "HG", "n": "G1.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Num mapa topográfico, as curvas de nível de uma encosta aparecem muito próximas umas das outras, enquanto, numa área vizinha, estão bem espaçadas. A equidistância entre as curvas é de 20 metros."], "src": "Texto elaborado para esta apostila.", "cmd": "A leitura do mapa permite concluir que a encosta com curvas próximas apresenta", "alts": ["relevo plano, ideal para a mecanização agrícola.", "solo necessariamente mais fértil.", "altitude menor que a da área vizinha.", "ausência de variação de altitude.", "declividade acentuada, com maior risco de erosão e deslizamentos se desmatada."], "ans": "E", "ex": {"A": "Termo oposto: curvas espaçadas indicam relevo suave.", "B": "Mapas de curvas de nível não informam a fertilidade do solo.", "C": "A proximidade das curvas indica inclinação, não altitude absoluta.", "D": "Termo oposto: cada curva marca 20 m de diferença.", "E": "Curvas próximas significam grande variação de altitude em pouca distância: declive forte."}, "hab": "H6, H27", "dif": "fácil", "mod": "G1", "kind": "extra", "traps": {"A": "oposto", "D": "oposto"}}, {"id": "G2.4", "vol": "HG", "n": "G2.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["As maiores reservas de petróleo e gás natural do Brasil estão em rochas sedimentares do fundo do oceano, em bacias como as de Santos e Campos, algumas abaixo de uma espessa camada de sal. Já o minério de ferro de Carajás e do Quadrilátero Ferrífero aparece em terrenos muito antigos."], "src": "Texto elaborado para esta apostila.", "cmd": "A diferença na localização desses recursos está relacionada às estruturas geológicas, pois", "alts": ["combustíveis fósseis se formam em bacias sedimentares, e minérios metálicos se associam aos escudos cristalinos.", "o petróleo se forma em escudos cristalinos, e o ferro em bacias sedimentares.", "os dois recursos dependem apenas do clima atual da região.", "o petróleo vem de atividade vulcânica recente no litoral brasileiro.", "todas as rochas do território brasileiro são sedimentares."], "ans": "A", "ex": {"A": "Petróleo e gás vêm de matéria orgânica soterrada em bacias sedimentares; minérios metálicos se concentram nos escudos antigos.", "B": "Termo oposto: a relação está invertida.", "C": "A formação é geológica, de milhões de anos, não climática atual.", "D": "Não há vulcanismo recente no litoral brasileiro.", "E": "Exagero: o Brasil tem escudos cristalinos e bacias sedimentares."}, "hab": "H27, H29", "dif": "média", "mod": "G2", "kind": "extra", "traps": {"B": "oposto", "E": "exagero"}}, {"id": "G2.5", "vol": "HG", "n": "G2.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["A Floresta Amazônica é exuberante, mas, quando derrubada e substituída por pastagem ou lavoura, o solo perde nutrientes em poucos anos e a produtividade cai."], "src": "Texto elaborado para esta apostila.", "cmd": "Essa aparente contradição é explicada pelo fato de", "alts": ["os solos amazônicos serem os mais férteis do mundo.", "a floresta ser formada apenas por plantas de raízes rasas.", "a fertilidade estar concentrada na biomassa e na ciclagem de nutrientes, e não em solos lixiviados pelas chuvas intensas.", "o clima da Amazônia ser frio e seco.", "o desmatamento aumentar a matéria orgânica do solo."], "ans": "C", "ex": {"A": "Termo oposto: em geral são solos ácidos e pobres.", "B": "A floresta tem estratos e raízes variados; isso não explica a perda de nutrientes.", "C": "Chuvas intensas lixiviam o solo; os nutrientes circulam na própria floresta (folhas, decomposição). Sem ela, o ciclo se rompe.", "D": "O clima é quente e úmido.", "E": "Termo oposto: o desmatamento reduz a matéria orgânica."}, "hab": "H27, H28", "dif": "média", "mod": "G2", "kind": "extra", "traps": {"A": "oposto", "E": "oposto"}}, {"id": "G3.4", "vol": "HG", "n": "G3.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Em anos em que as águas do Oceano Pacífico equatorial ficam anormalmente aquecidas, a Defesa Civil de estados do Nordeste reforça a distribuição de água por caminhões-pipa, enquanto municípios do Rio Grande do Sul se preparam para enchentes."], "src": "Texto elaborado para esta apostila.", "cmd": "As medidas descritas respondem aos efeitos típicos do fenômeno", "alts": ["La Niña, que aumenta as chuvas no Nordeste.", "da inversão térmica.", "da friagem amazônica.", "El Niño, associado a secas no Norte e no Nordeste e a chuvas excessivas no Sul.", "da ilha de calor urbana."], "ans": "D", "ex": {"A": "Termo oposto: La Niña é o resfriamento do Pacífico, com efeitos tendencialmente opostos.", "B": "A inversão térmica é um fenômeno local que retém poluentes.", "C": "Friagem é queda de temperatura na Amazônia causada por massa polar.", "D": "Aquecimento anormal do Pacífico equatorial é o El Niño: seca no Norte e Nordeste e chuva excessiva no Sul.", "E": "Ilha de calor é fenômeno urbano local."}, "hab": "H27, H29", "dif": "fácil", "mod": "G3", "kind": "extra", "traps": {"A": "oposto"}}, {"id": "G3.5", "vol": "HG", "n": "G3.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Uma estação meteorológica registrou, em média: temperaturas entre 25 °C e 29 °C o ano inteiro; chuva total de cerca de 550 mm por ano, concentrada em três ou quatro meses; e meses seguidos quase sem chuva. Em alguns anos, a estação chuvosa praticamente não ocorre."], "src": "Texto elaborado para esta apostila.", "cmd": "Os dados correspondem ao clima", "alts": ["equatorial, quente e chuvoso o ano todo.", "subtropical, com estações bem definidas e geadas.", "semiárido, com chuvas escassas, concentradas e irregulares.", "tropical de altitude, com temperaturas amenas.", "polar, com temperaturas negativas."], "ans": "C", "ex": {"A": "O equatorial tem chuvas abundantes e bem distribuídas, bem acima de 550 mm.", "B": "O subtropical tem amplitude térmica maior e invernos frios.", "C": "Temperatura alta e estável, pouca chuva concentrada em poucos meses e irregularidade entre os anos: semiárido.", "D": "O tropical de altitude é mais ameno e mais chuvoso.", "E": "Não há temperaturas negativas nos dados."}, "hab": "H6, H27", "dif": "fácil", "mod": "G3", "kind": "extra", "traps": {}}, {"id": "G4.4", "vol": "HG", "n": "G4.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Muitos dos rios que formam as bacias do São Francisco, do Tocantins-Araguaia e do Paraná nascem em áreas de Cerrado. As raízes profundas de sua vegetação favorecem a infiltração da água da chuva e a recarga dos aquíferos que alimentam essas nascentes."], "src": "Texto elaborado para esta apostila.", "cmd": "Considerando o texto, a substituição em larga escala do Cerrado por monoculturas pode", "alts": ["aumentar a recarga dos aquíferos.", "afetar o abastecimento de água em bacias que atendem várias regiões do país.", "impactar apenas a fauna local, sem efeito sobre os rios.", "eliminar as secas no Nordeste.", "transformar o Cerrado em floresta tropical."], "ans": "B", "ex": {"A": "Termo oposto: com menos infiltração, a recarga diminui.", "B": "Por isso o Cerrado é chamado de 'berço das águas': desmatá-lo afeta nascentes de grandes bacias.", "C": "O texto liga a vegetação às nascentes e aos rios.", "D": "Nada no texto sustenta isso.", "E": "Monoculturas não formam florestas."}, "hab": "H28, H30", "dif": "fácil", "mod": "G4", "kind": "extra", "traps": {"A": "oposto"}}, {"id": "G4.5", "vol": "HG", "n": "G4.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Em uma unidade de conservação no Acre, famílias de seringueiros e castanheiros vivem na floresta, extraem látex e castanha, pescam e plantam pequenas roças, seguindo um plano de manejo aprovado pelo órgão ambiental. A área não pode ser vendida nem desmatada para pastagem."], "src": "Texto elaborado para esta apostila.", "cmd": "A área descrita é uma unidade de conservação do tipo", "alts": ["proteção integral, que proíbe a presença humana.", "parque urbano, destinado ao lazer.", "área de preservação permanente às margens de um rio.", "propriedade privada destinada ao agronegócio.", "uso sustentável, como a reserva extrativista, que concilia conservação e populações tradicionais."], "ans": "E", "ex": {"A": "Termo oposto: na proteção integral não há moradores usando os recursos.", "B": "Não é área urbana de lazer.", "C": "APP é uma faixa protegida dentro de propriedades, definida pelo Código Florestal, não uma unidade com moradores e plano de manejo.", "D": "A área não pode ser vendida nem desmatada.", "E": "Reservas extrativistas (como as criadas após a luta de Chico Mendes) são unidades de uso sustentável."}, "hab": "H29, H30", "dif": "fácil", "mod": "G4", "kind": "extra", "traps": {"A": "oposto"}}, {"id": "G5.4", "vol": "HG", "n": "G5.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Nas últimas décadas, a soja avançou sobre o Cerrado do Maranhão, Tocantins, Piauí e Bahia. Comunidades tradicionais que usavam há gerações as chapadas para soltar o gado e coletar frutos denunciam o cercamento dessas áreas com títulos de propriedade de origem duvidosa e a contaminação dos rios por agrotóxicos."], "src": "Texto elaborado para esta apostila.", "cmd": "O texto descreve conflitos associados à", "alts": ["reforma agrária promovida nas áreas de fronteira.", "migração de agricultores do Cerrado para a Europa.", "industrialização das capitais nordestinas.", "redução da produção de grãos no Brasil.", "expansão da fronteira agrícola, com grilagem de terras e impactos sobre populações tradicionais."], "ans": "E", "ex": {"A": "Termo oposto: o texto descreve concentração, não distribuição de terras.", "B": "Nada no texto fala em migração internacional.", "C": "O texto trata do campo.", "D": "Termo oposto: a soja está se expandindo.", "E": "Avanço da soja no Matopiba, títulos duvidosos (grilagem) e impactos sobre comunidades: conflitos da fronteira agrícola."}, "hab": "H8, H18, H28", "dif": "fácil", "mod": "G5", "kind": "extra", "traps": {"A": "oposto", "D": "oposto"}}, {"id": "G5.5", "vol": "HG", "n": "G5.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Em um assentamento, famílias plantam, numa mesma área, bananeiras, café, feijão, mandioca e árvores nativas. Não usam adubos químicos nem agrotóxicos, vendem a produção em feiras da cidade e afirmam que o solo ficou mais úmido e fértil ao longo dos anos."], "src": "Texto elaborado para esta apostila.", "cmd": "A prática descrita corresponde a um", "alts": ["sistema agroflorestal de base agroecológica.", "monocultivo mecanizado de exportação.", "pacote da Revolução Verde.", "sistema de plantation colonial.", "modelo de pecuária extensiva."], "ans": "A", "ex": {"A": "Diversidade de cultivos com árvores, sem insumos químicos e com venda direta: sistema agroflorestal e agroecologia.", "B": "Termo oposto: há diversidade de cultivos e venda local.", "C": "Termo oposto: a Revolução Verde depende de adubos químicos e agrotóxicos.", "D": "Anacronismo e termo oposto: a plantation era monocultura escravista de exportação.", "E": "Não há criação de gado no texto."}, "hab": "H19, H28", "dif": "fácil", "mod": "G5", "kind": "extra", "traps": {"B": "oposto", "C": "oposto", "D": "oposto"}}, {"id": "G6.4", "vol": "HG", "n": "G6.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Ao longo das décadas, a mancha urbana de uma capital cresceu até se juntar à das cidades vizinhas. Hoje, quem atravessa a avenida que marca o limite entre dois municípios não percebe onde termina um e começa o outro, e milhares de pessoas vivem numa cidade e trabalham na outra."], "src": "Texto elaborado para esta apostila.", "cmd": "O processo de encontro das manchas urbanas descrito é a", "alts": ["gentrificação.", "desmetropolização.", "conurbação.", "favelização.", "verticalização."], "ans": "C", "ex": {"A": "Gentrificação é a expulsão de moradores por valorização.", "B": "Desmetropolização é o crescimento relativo das cidades médias.", "C": "Conurbação é a junção física das manchas urbanas de cidades vizinhas.", "D": "Favelização é o crescimento de moradias precárias.", "E": "Verticalização é a construção de prédios altos."}, "hab": "H6, H8", "dif": "fácil", "mod": "G6", "kind": "extra", "traps": {}}, {"id": "G6.5", "vol": "HG", "n": "G6.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Em uma metrópole, os automóveis ocupam cerca de 70% do espaço das vias, mas transportam uma parcela pequena das pessoas que circulam diariamente. Quem depende do ônibus gasta, em média, mais de duas horas por dia no trânsito, sobretudo os moradores das periferias."], "src": "Texto elaborado para esta apostila.", "cmd": "Uma medida coerente com a redução do problema descrito é", "alts": ["ampliar viadutos exclusivos para carros particulares.", "reduzir as linhas de ônibus que atendem as periferias.", "aumentar o preço das passagens para financiar novas avenidas.", "priorizar o transporte coletivo com corredores exclusivos e integração entre modais.", "proibir a construção de calçadas e ciclovias."], "ans": "D", "ex": {"A": "Mais espaço para carros tende a atrair mais carros e não reduz o tempo de quem usa ônibus.", "B": "Termo oposto: pioraria a situação das periferias.", "C": "Passagens mais caras afastam os usuários do transporte coletivo.", "D": "Dar prioridade ao transporte coletivo usa melhor o espaço e reduz o tempo de deslocamento da maioria.", "E": "Termo oposto: calçadas e ciclovias fazem parte da mobilidade sustentável."}, "hab": "H8, H24", "dif": "fácil", "mod": "G6", "kind": "extra", "traps": {"B": "oposto", "E": "oposto"}}, {"id": "G7.4", "vol": "HG", "n": "G7.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["A Islândia produz grande parte de sua eletricidade e quase todo o aquecimento das casas com energia geotérmica, aproveitando o vapor e a água quente do subsolo. O Brasil, apesar de ser um país grande, não tem usinas geotérmicas de grande porte."], "src": "Texto elaborado para esta apostila.", "cmd": "A diferença entre os dois países se explica principalmente pela", "alts": ["maior população do Brasil.", "localização da Islândia sobre uma dorsal oceânica, com intensa atividade vulcânica, enquanto o Brasil está no interior de uma placa tectônica.", "proibição legal da energia geotérmica no Brasil.", "falta de rios na Islândia.", "maior incidência de energia solar na Islândia."], "ans": "B", "ex": {"A": "Tamanho da população não determina o potencial geotérmico.", "B": "A Islândia está sobre a dorsal mesoatlântica, com vulcões e calor próximo à superfície; o Brasil, no interior da placa Sul-Americana, não tem essa condição.", "C": "Não há proibição; falta o recurso natural em condições viáveis.", "D": "A Islândia também usa hidreletricidade; os rios não explicam a geotérmica.", "E": "Termo oposto: a Islândia, em alta latitude, recebe menos energia solar."}, "hab": "H27, H29", "dif": "fácil", "mod": "G7", "kind": "extra", "traps": {"E": "oposto"}}, {"id": "G7.5", "vol": "HG", "n": "G7.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Parques eólicos se espalharam pelo litoral e pelo sertão nordestino. Ao mesmo tempo, moradores de algumas comunidades relatam ruído constante, rachaduras em casas, restrições de acesso a áreas de uso comum e contratos de arrendamento com pagamentos baixos e cláusulas de longa duração."], "src": "Texto elaborado para esta apostila.", "cmd": "O texto indica que a expansão da energia eólica", "alts": ["não produz nenhum tipo de impacto, por ser renovável.", "deve ser abandonada, pois emite mais gases de efeito estufa que as termelétricas.", "ocorre apenas em áreas desabitadas.", "eliminou a dependência brasileira das hidrelétricas.", "pode gerar conflitos socioambientais, mesmo sendo uma fonte renovável e de baixa emissão."], "ans": "E", "ex": {"A": "Termo oposto: o texto relata impactos.", "B": "Termo oposto: a eólica não emite gases na geração.", "C": "Termo oposto: há comunidades afetadas.", "D": "Exagero: as hidrelétricas seguem como principal fonte.", "E": "Renovável não significa livre de impactos: há conflitos por terra e efeitos sobre comunidades."}, "hab": "H28, H29", "dif": "fácil", "mod": "G7", "kind": "extra", "traps": {"A": "oposto", "B": "oposto", "C": "oposto", "D": "exagero"}}, {"id": "G8.4", "vol": "HG", "n": "G8.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Em um país, a taxa de mortalidade caiu rapidamente nas últimas décadas, graças a vacinas, saneamento e antibióticos, mas a taxa de natalidade continua alta. A população cresce depressa, e a pirâmide etária tem base muito larga."], "src": "Texto elaborado para esta apostila.", "cmd": "Esse país se encontra na fase da transição demográfica caracterizada por", "alts": ["natalidade e mortalidade altas, com crescimento lento.", "natalidade e mortalidade baixas, com envelhecimento.", "redução da população por saldo vegetativo negativo.", "queda da mortalidade com natalidade ainda alta, gerando crescimento acelerado.", "fim do bônus demográfico."], "ans": "D", "ex": {"A": "Essa é a primeira fase; o texto diz que a mortalidade já caiu.", "B": "É a fase final; a natalidade aqui ainda é alta.", "C": "Termo oposto: a população cresce depressa.", "D": "Mortalidade em queda e natalidade alta: fase de explosão demográfica.", "E": "O bônus demográfico ainda nem começou: a população jovem predomina."}, "hab": "H15, H25", "dif": "fácil", "mod": "G8", "kind": "extra", "traps": {"C": "oposto"}}, {"id": "G8.5", "vol": "HG", "n": "G8.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Entre as décadas de 1950 e 1980, milhões de nordestinos migraram para São Paulo e para o Rio de Janeiro. Trabalharam sobretudo na construção civil, na indústria e nos serviços, e muitos se instalaram em bairros periféricos sem infraestrutura."], "src": "Texto elaborado para esta apostila.", "cmd": "Entre os fatores que explicam esse fluxo estão", "alts": ["a industrialização concentrada no Sudeste e a concentração fundiária e as secas no Nordeste.", "a crise industrial em São Paulo e a reforma agrária no Nordeste.", "a política de imigração europeia, que atraiu nordestinos para o Sul.", "a transferência das indústrias para o Nordeste.", "a redução da população urbana no Sudeste."], "ans": "A", "ex": {"A": "Atração (empregos industriais no Sudeste) e repulsão (concentração de terras, secas e pobreza no Nordeste) explicam a migração.", "B": "Termo oposto: a indústria paulista crescia, e não houve reforma agrária.", "C": "A imigração europeia é anterior e não envolvia nordestinos.", "D": "A desconcentração industrial é posterior (anos 1970 a 1990).", "E": "Termo oposto: a população urbana do Sudeste cresceu."}, "hab": "H9, H18", "dif": "fácil", "mod": "G8", "kind": "extra", "traps": {"B": "oposto", "E": "oposto"}}, {"id": "G9.4", "vol": "HG", "n": "G9.4", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Entre os países do Mercosul, a maior parte do comércio circula sem tarifas de importação. Quando um produto vem de fora do bloco, como da China, cada país membro aplica, em regra, a mesma tarifa, com algumas listas de exceção."], "src": "Texto elaborado para esta apostila.", "cmd": "O texto descreve o Mercosul como uma", "alts": ["zona de livre comércio sem nenhuma política comum.", "união econômica e monetária, com moeda única.", "aliança militar entre países sul-americanos.", "união aduaneira, com tarifa externa comum, ainda incompleta.", "organização mundial do comércio."], "ans": "D", "ex": {"A": "Termo oposto: há uma política comum, a tarifa externa comum.", "B": "O Mercosul não tem moeda única.", "C": "O Mercosul é econômico, não militar.", "D": "Livre comércio interno com tarifa externa comum (e exceções) caracteriza uma união aduaneira imperfeita.", "E": "A OMC é global; o Mercosul é regional."}, "hab": "H9, H17", "dif": "fácil", "mod": "G9", "kind": "extra", "traps": {"A": "oposto"}}, {"id": "G9.5", "vol": "HG", "n": "G9.5", "tag": "Inédita, estilo ENEM · extra do app", "base": ["Em uma semana, bilhões de dólares saíram de um país emergente para outro em poucos cliques, sem qualquer controle de fronteira. Na mesma semana, centenas de migrantes que tentavam cruzar o mar em direção à Europa foram barrados, e alguns morreram na travessia."], "src": "Texto elaborado para esta apostila.", "cmd": "O contraste apresentado evidencia uma contradição da globalização, que consiste em", "alts": ["impedir a circulação de capitais e liberar a de pessoas.", "eliminar todas as fronteiras do planeta.", "facilitar a circulação de capitais e mercadorias enquanto restringe a circulação de pessoas, sobretudo as mais pobres.", "reduzir os fluxos financeiros internacionais.", "garantir os mesmos direitos de circu
